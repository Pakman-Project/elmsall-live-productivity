<script>
// ============================================================================
// Rearranging the panels on the Overall, Volume and Bonus pages.
//
// WHY BUTTONS AND NOT DRAG-AND-DROP
//
// Drag is the obvious answer on desktop and the wrong one here, because these
// pages already spend their touch budget. A finger on a .page can mean three
// things: swipe sideways to change page, scroll vertically, or pull down to
// refresh. Adding "press and hold to pick a chart up" makes a fourth, and the
// only way to tell it apart from the other three is a long-press — which is
// invisible to anyone who has not been told about it, and which fights
// scrolling for the whole duration of the press.
//
// Explicit move buttons behave identically on a phone and a desktop, need no
// gesture arbitration at all, work from the keyboard, and can be operated
// one-handed. The cost is that moving a chart several places takes several
// taps. For a layout someone sets once, that is the right trade.
//
// Order is stored per zone as a list of stable keys, so it survives a re-render
// and does not depend on DOM position at save time.
// ============================================================================

// Which containers can be rearranged. The Data Table is deliberately absent:
// it is a single table, with nothing to reorder against.
var REORDER_ZONES_ = [
  { zoneKey: 'overall', containerId: 'page1Charts' },
  { zoneKey: 'volume',  containerId: 'volumeChartsContainer' },
  // The Bonus page's panels are generated per work area and rebuilt on every
  // render, so unlike the other two zones its members come and go: an area with
  // no activity in the selected window produces no panel at all. applyChartOrder_
  // copes with that already — it only moves keys that are present, and appends
  // anything the saved order does not mention.
  { zoneKey: 'bonus',   containerId: 'bonusTablesContainer' }
];

// { overall: ['overviewVol','perf',...], volume: ['vol0','vol3',...] }
var chartOrderState = {};

var _reorderMode = false;

// ---- Identifying the movable panels ---------------------------------------

// Stable keys, assigned once. The Overall zone's keys are derived from the
// canvas each panel owns, so an order saved today still means the same thing
// after panels are added or the markup is reshuffled.
//
// The Volume zone is NOT like that, despite what this comment used to claim for
// both: its keys are 'vol0'..'vol18', the panel's INDEX into VOLUME_TYPES. That
// is stable against a re-render but not against the areas being reordered,
// which silently repoints a saved layout at different areas - so VOLUME_TYPES
// carries AREA_ORDER_VERSION, and loadUserPreferences drops this zone's saved
// order when it changes.
function reorderItemsInZone_(containerId) {
  var container = document.getElementById(containerId);
  if (!container) return [];
  var out = [];
  for (var i = 0; i < container.children.length; i++) {
    var el = container.children[i];
    if (el.hasAttribute && el.hasAttribute('data-reorder-key')) out.push(el);
  }
  return out;
}

function tagReorderItems_() {
  var overall = document.getElementById('page1Charts');
  if (overall) {
    for (var i = 0; i < overall.children.length; i++) {
      var el = overall.children[i];
      var key = null;
      // The two split-chart wrappers are deliberately absent here: their
      // charts are hoisted out and tagged individually by hoistSplitPanels_,
      // so each one moves on its own rather than as a locked block.
      if (el.querySelector && el.querySelector('#overviewVolChart')) key = 'overviewVol';
      else if (el.querySelector && el.querySelector('#perfChart')) key = 'perf';
      if (key) {
        el.setAttribute('data-reorder-key', key);
        el.setAttribute('data-reorder-label', reorderLabelFor_(el, key));
      }
    }
  }

  // Volume: only the chart panels. The controls row and the area chips above
  // them are not panels and must stay where they are.
  for (var v = 0; v < VOLUME_TYPES.length; v++) {
    var p = document.getElementById('volPanel' + v);
    if (!p) continue;
    p.setAttribute('data-reorder-key', 'vol' + v);
    p.setAttribute('data-reorder-label', VOLUME_TYPES[v].label);
    // The panel headings are written from VOLUME_TYPES too, rather than being
    // authored twenty-one times in the markup. Only panel 0's heading was ever
    // rewritten at render time, so the other eighteen kept whatever the HTML
    // said - a hand-maintained restatement of the area order that nothing
    // checked and that went stale the moment the areas were reordered.
    var h2 = p.querySelector('h2');
    if (h2) h2.textContent = VOLUME_TYPES[v].label;
    var tag = p.querySelector('.tag');
    if (tag) tag.textContent = VOLUME_TYPES[v].family;
  }
}

function reorderLabelFor_(el, key) {
  var h2 = el.querySelector('h2');
  return h2 ? h2.textContent.trim() : key;
}

// ---- Split charts as independent panels -----------------------------------
// "Productivity % by Work Area" and "Deployment Trend" can each be split into
// several charts, which the renderer builds inside a display:contents wrapper.
// That wrapper laid them out as if they were the grid's own children, but the
// reorder system only ever saw the wrapper - so a split section moved as one
// locked block and could never be interleaved with the other.
//
// The panels are lifted out of their wrapper and made real siblings, which is
// what makes an A-B-A-B arrangement expressible at all: interleaving is a
// statement about sibling order, and two panels in different wrappers are not
// siblings however the boxes are painted.
//
// The empty wrapper stays where it is. It is display:contents, so it occupies
// nothing, and it marks the position new panels are inserted at on the next
// render.
var SPLIT_WRAPPERS_ = [
  { id: 'areaGroupChartsWrap', owner: 'areaGroup', label: 'Productivity %' },
  { id: 'trendChartsWrap',     owner: 'trend',     label: 'Deployment Trend' }
];

var SPLIT_CHART_LETTERS_ = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];

function splitPanelLabel_(el, base, idx, total) {
  var h2 = el.querySelector('h2');
  var own = h2 ? h2.textContent.trim() : '';
  if (own) return own;
  if (total <= 1) return base;
  return base + ' — Chart ' + (SPLIT_CHART_LETTERS_[idx] || (idx + 1));
}

// Called by the renderer BEFORE it rebuilds, not by the hoist afterwards.
// The renderer empties the WRAPPER and builds fresh panels into it, which does
// nothing to panels already lifted out of it - so without this they would
// accumulate one full set per render. It has to happen before rather than
// after because a stale panel still holds a canvas carrying the same id the
// new one is about to use, and anything resolving that id in between would
// find the corpse.
function clearHoistedSplitPanels_() {
  var zone = document.getElementById('page1Charts');
  if (!zone) return;
  for (var i = zone.children.length - 1; i >= 0; i--) {
    var child = zone.children[i];
    if (child.hasAttribute && child.hasAttribute('data-split-owner')) {
      zone.removeChild(child);
    }
  }
}

function hoistSplitPanels_() {
  var zone = document.getElementById('page1Charts');
  if (!zone) return;

  // Belt and braces: the renderer calls clearHoistedSplitPanels_ before
  // building, but this is also reached from the tour's restore path.
  clearHoistedSplitPanels_();

  for (var w = 0; w < SPLIT_WRAPPERS_.length; w++) {
    var spec = SPLIT_WRAPPERS_[w];
    var wrap = document.getElementById(spec.id);
    if (!wrap || wrap.parentNode !== zone) continue;

    var panels = [];
    for (var c = 0; c < wrap.children.length; c++) {
      if (wrap.children[c].classList.contains('panel')) panels.push(wrap.children[c]);
    }

    for (var p = 0; p < panels.length; p++) {
      var el = panels[p];
      el.setAttribute('data-split-owner', spec.owner);
      el.setAttribute('data-reorder-key', spec.owner + p);
      el.setAttribute('data-reorder-label', splitPanelLabel_(el, spec.label, p, panels.length));
      // Inserted at the wrapper's own position, so an untouched layout looks
      // exactly as it did before any of this. A saved order then moves them.
      zone.insertBefore(el, wrap);
    }
  }
}

// The work-area keys of a zone, in the order the user has arranged its panels.
// Read from the SAVED order rather than the live DOM, because the chips are
// rendered before the panels they describe on the Bonus page — at that moment
// the container still holds the previous render's panels, and on a first load
// it holds nothing at all.
function areaKeyOrderForZone_(zoneKey) {
  var saved = chartOrderState[zoneKey];
  if (!Array.isArray(saved)) return null;
  var out = [];
  for (var i = 0; i < saved.length; i++) {
    var k = saved[i];
    if (zoneKey === 'volume' && k.indexOf('vol') === 0) {
      var idx = parseInt(k.slice(3), 10);
      if (VOLUME_TYPES[idx]) out.push(VOLUME_TYPES[idx].key);
    } else if (zoneKey === 'bonus' && k.indexOf('bonus-') === 0) {
      out.push(k.slice(6));
    }
  }
  return out;
}

// Reorders the chips already on screen to match, without a full re-render.
// Moving a panel in edit mode updates the saved order immediately, but the
// chips are only rebuilt on the next filter change — so without this they would
// disagree with the panels for as long as the user stayed in edit mode.
function reorderChipsToMatch_(containerId, zoneKey) {
  var host = document.getElementById(containerId);
  if (!host) return;
  var order = areaKeyOrderForZone_(zoneKey);
  if (!order || !order.length) return;
  for (var i = 0; i < order.length; i++) {
    var chip = host.querySelector('[data-area-key="' + order[i] + '"]');
    if (chip) host.appendChild(chip);
  }
}

// ---- Applying and saving an order -----------------------------------------

function defaultOrderFor_(zoneKey) {
  var zone = null;
  for (var i = 0; i < REORDER_ZONES_.length; i++) {
    if (REORDER_ZONES_[i].zoneKey === zoneKey) zone = REORDER_ZONES_[i];
  }
  if (!zone) return [];
  return reorderItemsInZone_(zone.containerId).map(function (el) {
    return el.getAttribute('data-reorder-key');
  });
}

// Moves elements with appendChild, which relocates rather than copies. Only
// tagged panels are touched, so anything else in the container (the Volume
// page's controls and chips) keeps its place at the top.
function applyChartOrder_() {
  for (var z = 0; z < REORDER_ZONES_.length; z++) {
    var zone = REORDER_ZONES_[z];
    var container = document.getElementById(zone.containerId);
    if (!container) continue;
    var wanted = chartOrderState[zone.zoneKey];
    if (!wanted || !wanted.length) continue;

    var byKey = {};
    var present = reorderItemsInZone_(zone.containerId);
    for (var i = 0; i < present.length; i++) {
      byKey[present[i].getAttribute('data-reorder-key')] = present[i];
    }
    for (var k = 0; k < wanted.length; k++) {
      var el = byKey[wanted[k]];
      if (el) container.appendChild(el);
    }
    // Anything saved order does not mention (a panel added in a later version)
    // keeps its relative position by falling to the end rather than vanishing.
    for (var m = 0; m < present.length; m++) {
      if (wanted.indexOf(present[m].getAttribute('data-reorder-key')) === -1) {
        container.appendChild(present[m]);
      }
    }
  }
  refreshOddCentering_();
}

function captureChartOrder_() {
  for (var z = 0; z < REORDER_ZONES_.length; z++) {
    var zone = REORDER_ZONES_[z];
    chartOrderState[zone.zoneKey] = reorderItemsInZone_(zone.containerId)
      .map(function (el) { return el.getAttribute('data-reorder-key'); });
  }
  saveUserPreferences();
}

// ---- Keeping the odd-panel centering honest -------------------------------
// The Overall grid centres a lone trailing panel when the count is odd. That
// was decided while building the trend charts, on the assumption they came
// last — which stops being true the moment anything is moved, so it is
// recomputed here from actual DOM order instead.
function overallPanelsInDomOrder_() {
  var zone = document.getElementById('page1Charts');
  if (!zone) return [];
  var out = [];
  for (var i = 0; i < zone.children.length; i++) {
    var ch = zone.children[i];
    // .trend-charts-wrap is display:contents, so its children are laid out as
    // if they were the grid's own — flatten it to match what is on screen.
    if (ch.id === 'trendChartsWrap' || ch.id === 'areaGroupChartsWrap') {
      for (var j = 0; j < ch.children.length; j++) {
        if (ch.children[j].classList.contains('panel')) out.push(ch.children[j]);
      }
    } else if (ch.classList.contains('panel')) {
      out.push(ch);
    }
  }
  return out;
}

function refreshOddCentering_() {
  var panels = overallPanelsInDomOrder_();
  for (var i = 0; i < panels.length; i++) panels[i].classList.remove('chart-center-odd');
  if (panels.length > 0 && panels.length % 2 === 1) {
    panels[panels.length - 1].classList.add('chart-center-odd');
  }
}

// Called after any render that rebuilds a zone's contents from scratch, which
// discards both the applied order and any edit-mode bars inside it.
function refreshDynamicReorderZone_() {
  applyChartOrder_();
  if (_reorderMode) refreshReorderBars_();
}

// Called by renderChartsPak once it has rebuilt the trend panels, since that
// replaces the elements the centering was computed against.
function refreshChartLayoutAfterRender_() {
  // Order matters: hoist first so the split charts exist as siblings with keys,
  // then apply the saved order over the whole zone, then centre what ends up
  // last. Previously the renderer's own output was the final word on order,
  // which is why a re-render put a moved trend chart back where it started.
  hoistSplitPanels_();
  applyChartOrder_();
  refreshOddCentering_();
  if (_reorderMode) refreshReorderBars_();
}

// ---- Edit mode ------------------------------------------------------------

// A panel the Volume page has switched off - an area the viewer hid, or one
// belonging to the other building. The renderer sets this inline display on the
// panel itself (see renderVolumeChartsPak), so this deliberately does NOT ask
// whether the element is on screen: a whole page that is not the current one is
// hidden too, and its panels are still real members of their zone.
function isReorderItemHidden_(el) {
  return !!(el && el.style && el.style.display === 'none');
}

function visibleReorderItems_(items) {
  var out = [];
  for (var i = 0; i < items.length; i++) {
    if (!isReorderItemHidden_(items[i])) out.push(items[i]);
  }
  return out;
}

function moveReorderItem_(key, delta) {
  for (var z = 0; z < REORDER_ZONES_.length; z++) {
    var zone = REORDER_ZONES_[z];
    var items = reorderItemsInZone_(zone.containerId);
    for (var i = 0; i < items.length; i++) {
      if (items[i].getAttribute('data-reorder-key') !== key) continue;
      // Step to the nearest VISIBLE neighbour, not to the next slot. Eleven of
      // the twenty-one volume panels can be switched off, and swapping with a
      // hidden one moved the panel in the saved order while changing nothing on
      // screen - the button looked broken.
      var target = -1;
      for (var t = i + delta; t >= 0 && t < items.length; t += delta) {
        if (!isReorderItemHidden_(items[t])) { target = t; break; }
      }
      if (target === -1) return;   // already at the last visible end
      var container = document.getElementById(zone.containerId);
      if (delta < 0) container.insertBefore(items[i], items[target]);
      else container.insertBefore(items[target], items[i]);
      captureChartOrder_();
      reorderChipsToMatch_('volumeAreaToggles', 'volume');
      reorderChipsToMatch_('bonusAreaToggles', 'bonus');
      // The Overall grid centres a lone trailing panel, and which panel is
      // trailing has just changed. Without this the class stayed on whichever
      // panel held it before the move, so a panel that was no longer last sat
      // centred on a row of its own until the next data refresh happened to
      // rebuild the charts and recompute it.
      refreshOddCentering_();
      refreshReorderBars_();
      // Keep the panel the user is working on in view — it has just jumped a
      // full panel's height, which on a phone is most of the screen.
      try { items[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
      return;
    }
  }
}

function removeReorderBars_() {
  var bars = document.querySelectorAll('.reorder-bar');
  for (var i = 0; i < bars.length; i++) {
    if (bars[i].parentNode) bars[i].parentNode.removeChild(bars[i]);
  }
}

function refreshReorderBars_() {
  removeReorderBars_();
  if (!_reorderMode) return;

  for (var z = 0; z < REORDER_ZONES_.length; z++) {
    var zone = REORDER_ZONES_[z];
    // Counted over the panels actually on screen. "4/19" on a Volume page
    // showing eight charts describes a list the viewer cannot see, and the
    // position it names is not the one they are looking at.
    var items = visibleReorderItems_(reorderItemsInZone_(zone.containerId));
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var key = el.getAttribute('data-reorder-key');
      var label = el.getAttribute('data-reorder-label') || key;

      var bar = document.createElement('div');
      bar.className = 'reorder-bar';
      bar.innerHTML =
        '<span class="reorder-pos">' + (i + 1) + '/' + items.length + '</span>' +
        '<span class="reorder-label">' + safeTextPak(label) + '</span>' +
        '<button type="button" class="reorder-btn" data-key="' + escapeAttrPak(key) + '" data-dir="-1"' +
          (i === 0 ? ' disabled' : '') +
          ' title="Move earlier" aria-label="Move ' + escapeAttrPak(label) + ' earlier">' +
          '<i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>' +
        '<button type="button" class="reorder-btn" data-key="' + escapeAttrPak(key) + '" data-dir="1"' +
          (i === items.length - 1 ? ' disabled' : '') +
          ' title="Move later" aria-label="Move ' + escapeAttrPak(label) + ' later">' +
          '<i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>';
      el.insertBefore(bar, el.firstChild);
    }
  }
}

function toggleReorderMode_() {
  setReorderMode_(!_reorderMode);
}

function setReorderMode_(on) {
  _reorderMode = !!on;
  document.body.classList.toggle('reorder-mode', _reorderMode);

  var btn = $('reorderBtn');
  if (btn) {
    btn.classList.toggle('active', _reorderMode);
    var label = _reorderMode ? 'Done rearranging' : 'Rearrange charts';
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
    btn.setAttribute('aria-pressed', _reorderMode ? 'true' : 'false');
    // Pen while off ("edit the layout"), tick while on ("done"). Both states
    // need an icon of their own — leaving the pen in place would give no sign
    // the mode had actually engaged.
    var icon = btn.querySelector('i');
    if (icon) icon.className = _reorderMode ? 'fa-solid fa-check' : 'fa-solid fa-pen-to-square';
  }

  refreshReorderBars_();

  if (_reorderMode) {
    showRearrangeToast_();
  } else {
    // Leaving by any route — Done, the close button, or the header button —
    // takes the mode's toast with it.
    dismissToast_();
    captureChartOrder_();
    // The grid reflows on leaving edit mode (the trend section collapses back
    // to display:contents), so the charts need to re-measure.
    resizeCharts();
  }
}

// The toast doubles as the mode's own control surface. On a phone the header
// button that turns the mode on is behind the burger menu, so leaving the mode
// would otherwise mean opening that menu again while the page is covered in
// edit bars — this puts Done within reach of where the user is already working.
//
// It persists for the same reason: it is not a notification about something
// that happened, it is the indicator that a mode is currently on.
function showRearrangeToast_(prefix) {
  showToastPak((prefix ? prefix + ' ' : '') +
    'Rearrange mode: use the arrows on each panel to move it. Changes save as you go.', {
    icon: 'fa-pen-to-square',
    persist: true,
    // Dismissing the mode's indicator means dismissing the mode.
    onClose: function () { setReorderMode_(false); },
    actions: [
      { label: 'Reset order', onClick: resetChartOrder_ },
      { label: 'Done', primary: true, onClick: function () { setReorderMode_(false); } }
    ]
  });
}

function resetChartOrder_() {
  chartOrderState = {};
  for (var z = 0; z < REORDER_ZONES_.length; z++) {
    var zone = REORDER_ZONES_[z];
    var container = document.getElementById(zone.containerId);
    if (!container) continue;
    var defaults = _reorderDefaults_[zone.zoneKey] || [];
    for (var k = 0; k < defaults.length; k++) {
      var key = defaults[k];

      // '@owner' is a split section: put its charts back in chart order, then
      // the (empty) wrapper after them, which is where the next render inserts.
      if (key.charAt(0) === '@') {
        var owner = key.slice(1);
        var panels = splitPanelsInChartOrder_(container, owner);
        for (var q = 0; q < panels.length; q++) container.appendChild(panels[q]);
        for (var w = 0; w < SPLIT_WRAPPERS_.length; w++) {
          if (SPLIT_WRAPPERS_[w].owner !== owner) continue;
          var wrapEl = document.getElementById(SPLIT_WRAPPERS_[w].id);
          if (wrapEl && wrapEl.parentNode === container) container.appendChild(wrapEl);
        }
        continue;
      }

      var el = container.querySelector('[data-reorder-key="' + key + '"]');
      if (el) container.appendChild(el);
    }
  }
  captureChartOrder_();
  refreshReorderBars_();
  refreshOddCentering_();
  // Re-raise the mode's toast rather than a transient one: a plain confirmation
  // would replace it and leave the user in rearrange mode with no indicator and
  // no way out but the header button.
  showRearrangeToast_('Order reset.');
}

// The as-authored order, captured before any saved order is applied, so Reset
// has something true to return to.
var _reorderDefaults_ = {};

// The Overall zone needs its own capture, because at startup the split
// sections are still just their wrappers - the charts inside them have not
// been rendered, so there is nothing tagged to record. Recording only what IS
// tagged gave a default order of ['overviewVol','perf'], and Reset therefore
// restored two panels and left the other two wherever the user had dragged
// them.
//
// Waiting until the charts exist is not an option either: by then a saved
// order has already been applied, so the "default" captured would be the
// user's own arrangement.
//
// So the WRAPPER's authored position is recorded as a placeholder, and
// expanded at reset time into however many charts the split happens to have
// produced by then.
function defaultOrderForOverall_() {
  var zone = document.getElementById('page1Charts');
  if (!zone) return [];
  var out = [];
  for (var i = 0; i < zone.children.length; i++) {
    var el = zone.children[i];
    var placeholder = null;
    for (var w = 0; w < SPLIT_WRAPPERS_.length; w++) {
      if (el.id === SPLIT_WRAPPERS_[w].id) { placeholder = '@' + SPLIT_WRAPPERS_[w].owner; break; }
    }
    if (placeholder) { out.push(placeholder); continue; }
    if (el.hasAttribute && el.hasAttribute('data-reorder-key')) {
      out.push(el.getAttribute('data-reorder-key'));
    }
  }
  return out;
}

// The hoisted panels of one split section, in chart order rather than in
// whatever order the user last left them in the DOM.
function splitPanelsInChartOrder_(container, owner) {
  var found = container.querySelectorAll('[data-split-owner="' + owner + '"]');
  var list = Array.prototype.slice.call(found);
  list.sort(function (a, b) {
    var ai = parseInt(String(a.getAttribute('data-reorder-key')).slice(owner.length), 10) || 0;
    var bi = parseInt(String(b.getAttribute('data-reorder-key')).slice(owner.length), 10) || 0;
    return ai - bi;
  });
  return list;
}

function initChartReorder_() {
  tagReorderItems_();
  for (var z = 0; z < REORDER_ZONES_.length; z++) {
    var zk = REORDER_ZONES_[z].zoneKey;
    _reorderDefaults_[zk] = (zk === 'overall')
      ? defaultOrderForOverall_()
      : defaultOrderFor_(zk);
  }
  applyChartOrder_();

  // Delegated: the bars are rebuilt after every move, so per-button listeners
  // would have to be rebound each time.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.reorder-btn') : null;
    if (!btn || btn.disabled) return;
    e.preventDefault();
    e.stopPropagation();
    moveReorderItem_(btn.getAttribute('data-key'), parseInt(btn.getAttribute('data-dir'), 10));
  });
}
</script>
