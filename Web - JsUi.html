<script>
  function updateClearBtnVisibility() {
    var btn = $('clearFilterBtn');
    var wrap = $('searchInputWrap');
    if (selectedBonuses.length > 0) {
      btn.style.display = 'flex';
      wrap.classList.add('with-clear');
    } else {
      btn.style.display = 'none';
      wrap.classList.remove('with-clear');
    }
  }

  // Clearing throws away a selection that may have taken a while to build, from
  // a small X in the header or a "Clear all" in the banner — both easy to hit
  // by accident. There is no confirm here on purpose: a prompt on every clear
  // would be tiresome for the common case where the user meant it. An undo
  // costs nothing when it is not wanted.
  function clearAllBonuses() {
    if (selectedBonuses.length === 0) return;
    var previous = selectedBonuses.slice();
    selectedBonuses = [];
    renderBonusChips();
    updateClearBtnVisibility();
    applyLocalFiltersPak();

    showToastPak(
      'Cleared ' + previous.length + ' bonus filter' + (previous.length === 1 ? '' : 's') + '.',
      {
        icon: 'fa-filter-circle-xmark',
        action: {
          label: 'Undo',
          onClick: function () {
            selectedBonuses = previous;
            renderBonusChips();
            updateClearBtnVisibility();
            applyLocalFiltersPak();
          }
        }
      }
    );
  }

  // ── Bonus search ───────────────────────────────────────────────────────────
  // The suggestion list is a real combobox: arrow keys move through it, Enter
  // picks, Escape closes. Previously it was mouse-only — the keyboard could put
  // a caret in the box but never reach a suggestion — and an unmatched query
  // just made the list vanish, which reads as the search having broken rather
  // than as "nothing matches that".

  // Long lists are capped so a one- or two-character query doesn't build (and
  // the browser doesn't lay out) hundreds of rows on every keystroke.
  var SEARCH_MAX_VISIBLE = 50;

  var _searchMatches = [];   // the bonus numbers currently listed, in order
  var _searchActiveIdx = -1; // highlighted row, or -1 for none

  function renderSearchDropdown_(matches, total, query) {
    var dropdown = $('searchDropdown');
    var html = '';

    if (matches.length === 0) {
      // Say so, rather than silently closing.
      html = '<div class="search-empty">No bonus numbers match &ldquo;' +
             safeTextPak(query) + '&rdquo;</div>';
    } else {
      for (var i = 0; i < matches.length; i++) {
        var b = matches[i];
        var picked = selectedBonuses.indexOf(b) !== -1;
        html += '<div class="search-item' + (picked ? ' picked' : '') + '"' +
                ' id="searchItem' + i + '"' +
                ' role="option" aria-selected="' + (picked ? 'true' : 'false') + '"' +
                ' data-idx="' + i + '"' +
                ' title="' + (picked ? 'Already filtering by this — select to remove' : 'Add to the filter') + '">' +
                '<span class="search-item-name">' + safeTextPak(b) + '</span>' +
                (picked ? '<i class="fa-solid fa-check search-item-check"></i>' : '') +
                '</div>';
      }
      if (total > matches.length) {
        html += '<div class="search-more">' + (total - matches.length) +
                ' more match — keep typing to narrow the list</div>';
      }
    }

    dropdown.innerHTML = html;
    dropdown.classList.add('active');
    $('bonusSearch').setAttribute('aria-expanded', 'true');
  }

  function closeSearchDropdown_() {
    var dropdown = $('searchDropdown');
    if (dropdown) dropdown.classList.remove('active');
    _searchMatches = [];
    _searchActiveIdx = -1;
    var input = $('bonusSearch');
    if (input) {
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
    }
  }

  function setSearchActive_(idx) {
    var dropdown = $('searchDropdown');
    var items = dropdown.querySelectorAll('.search-item');
    if (items.length === 0) return;

    // Wrap around: from the last row, Down returns to the first.
    if (idx < 0) idx = items.length - 1;
    if (idx >= items.length) idx = 0;
    _searchActiveIdx = idx;

    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', i === idx);
    }
    // The highlighted row is often below the fold of the 250px-tall list.
    if (items[idx].scrollIntoView) {
      items[idx].scrollIntoView({ block: 'nearest' });
    }
    $('bonusSearch').setAttribute('aria-activedescendant', items[idx].id);
  }

  function runSearchQuery_() {
    var input = $('bonusSearch');
    var q = input.value.toLowerCase().trim();
    if (!q) { closeSearchDropdown_(); return; }

    var all = allBonusList.filter(function(b) {
      return String(b).toLowerCase().indexOf(q) !== -1;
    });
    _searchMatches = all.slice(0, SEARCH_MAX_VISIBLE);
    _searchActiveIdx = -1;
    renderSearchDropdown_(_searchMatches, all.length, input.value.trim());
  }

  function initBonusSearch() {
    var input = $('bonusSearch');
    var dropdown = $('searchDropdown');

    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-controls', 'searchDropdown');
    dropdown.setAttribute('role', 'listbox');

    input.addEventListener('input', runSearchQuery_);

    input.addEventListener('focus', function() {
      if (input.value.trim()) runSearchQuery_();
    });

    input.addEventListener('keydown', function(e) {
      var open = dropdown.classList.contains('active');

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        // Reopen on Down if the list was dismissed but the query is still there.
        if (!open) {
          if (input.value.trim()) { runSearchQuery_(); open = true; }
          else return;
        }
        if (_searchMatches.length === 0) return;
        e.preventDefault();
        setSearchActive_(_searchActiveIdx + (e.key === 'ArrowDown' ? 1 : -1));
        return;
      }

      if (!open) return;

      if (e.key === 'Enter') {
        // With nothing highlighted, take the first match — the common case is
        // "type enough to be unique, press Enter".
        var idx = _searchActiveIdx >= 0 ? _searchActiveIdx : 0;
        if (_searchMatches.length > idx) {
          e.preventDefault();
          chooseSearchResult_(_searchMatches[idx]);
        }
      } else if (e.key === 'Escape') {
        // Swallowed so it closes only the list; a second press can then reach
        // anything else listening for Escape.
        e.preventDefault();
        e.stopPropagation();
        closeSearchDropdown_();
      } else if (e.key === 'Tab') {
        closeSearchDropdown_();
      }
    });

    // Delegated rather than an inline onclick carrying the bonus number through
    // an HTML attribute and a JS string literal — a name containing a quote or
    // backslash used to break that round trip.
    dropdown.addEventListener('mousedown', function(e) {
      var item = e.target.closest('.search-item');
      if (!item) return;
      // mousedown, not click: the input would otherwise blur first and the
      // document listener below would close the list out from under the click.
      e.preventDefault();
      var idx = parseInt(item.dataset.idx, 10);
      if (!isNaN(idx) && _searchMatches[idx] !== undefined) {
        chooseSearchResult_(_searchMatches[idx]);
      }
    });

    dropdown.addEventListener('mousemove', function(e) {
      var item = e.target.closest('.search-item');
      if (!item) return;
      var idx = parseInt(item.dataset.idx, 10);
      if (!isNaN(idx) && idx !== _searchActiveIdx) setSearchActive_(idx);
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.bonus-search-container')) closeSearchDropdown_();
    });
  }

  // Picking a row toggles it: an entry already in the filter is shown with a
  // tick and choosing it again removes it, so the list doubles as a view of
  // what is currently applied.
  function chooseSearchResult_(bonus) {
    var input = $('bonusSearch');
    if (selectedBonuses.indexOf(bonus) !== -1) {
      removeBonus(bonus);
      // Keep the list up so the tick visibly clears, and so several can be
      // toggled in a row without retyping.
      runSearchQuery_();
      input.focus();
      return;
    }
    selectBonus(bonus);
    input.focus();
  }

  function selectBonus(bonus) {
    if (selectedBonuses.indexOf(bonus) === -1) {
      selectedBonuses.push(bonus);
      renderBonusChips();
      updateClearBtnVisibility();
      applyLocalFiltersPak();
    }
    $('bonusSearch').value = '';
    closeSearchDropdown_();
  }

  function removeBonus(bonus) {
    selectedBonuses = selectedBonuses.filter(function(b) { return b !== bonus; });
    renderBonusChips();
    updateClearBtnVisibility();
    applyLocalFiltersPak();
  }

  function toggleBonusFilter(bonus) {
    if (selectedBonuses.indexOf(bonus) !== -1) { 
      removeBonus(bonus); 
    } else { 
      selectedBonuses.push(bonus); 
      renderBonusChips(); 
      updateClearBtnVisibility(); 
      applyLocalFiltersPak(); 
    }
  }

  function renderBonusChips() {
    var banner = $('activeFilterBanner');
    var chipsEl = $('activeFilterChips');
    if (selectedBonuses.length === 0) {
      banner.classList.remove('active');
      chipsEl.innerHTML = '';
      return;
    }
    $('activeFilterCount').textContent = selectedBonuses.length;
    chipsEl.innerHTML = selectedBonuses.map(function(b) {
      return '<span class="chip">' + b + ' <span class="remove-chip" onclick="removeBonus(\'' + b.replace(/'/g, "\\'") + '\')">&times;</span></span>';
    }).join('');
    banner.classList.add('active');
  }

  function getSwipeWidth() { 
    var container = $('swipeContainer'); 
    return container ? container.clientWidth : window.innerWidth; 
  }
  
  function setSliderPosition() { 
    var wrapper = $('swipeWrapper'); 
    wrapper.style.transform = 'translateX(' + currentTranslate + 'px)'; 
  }

  // ── Mobile: collapse chrome once the page is scrolled ─────────────────────
  // Phones have little vertical room, so the rail ICONS and the status /
  // last-update line hide as soon as the user scrolls away from the top, and
  // come back when they return. The page NAMES stay visible and tappable, so
  // navigation is never lost. Each .page is its own scroll container, so the
  // listener is bound per page and reads whichever one is currently showing.
  var PAGE_SCROLL_CHROME_THRESHOLD = 4;  // a few px of slack for iOS overscroll

  // Back-to-top appears much later than the chrome collapse. Anything near the
  // 4px mark would put a button on screen for a scroll the user can undo with
  // one flick; roughly a screen's worth of travel is where scrolling back
  // starts to be a chore.
  var PAGE_SCROLL_TOP_BTN_THRESHOLD = 400;

  function updatePageScrollChrome_() {
    // Never collapse during the tour: several steps ring the rail or scroll an
    // element into view, and a hidden target measures 0x0 and gets no ring.
    // The back-to-top button is hidden for the same reason — it would float
    // over the tour's spotlight.
    if (typeof tourActive !== 'undefined' && tourActive) {
      document.body.classList.remove('page-scrolled');
      document.body.classList.remove('page-scrolled-far');
      return;
    }
    var pages = document.querySelectorAll('.page');
    var el = pages[currentPage];
    var top = el ? el.scrollTop : 0;
    document.body.classList.toggle('page-scrolled', top > PAGE_SCROLL_CHROME_THRESHOLD);
    document.body.classList.toggle('page-scrolled-far', top > PAGE_SCROLL_TOP_BTN_THRESHOLD);
  }

  // Each .page is its own scroll container, so this scrolls the page currently
  // showing rather than the window — which never scrolls at all.
  function scrollCurrentPageToTop_() {
    var pages = document.querySelectorAll('.page');
    var el = pages[currentPage];
    if (!el) return;

    var reduceMotion = false;
    try {
      reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {}

    if (el.scrollTo && !reduceMotion) {
      el.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      el.scrollTop = 0;
    }

    // The button fades out once the page reaches the top, and focus on a
    // visibility:hidden element is dropped to <body> — which would send the
    // next Tab back to the very start of the document. Hand focus to the
    // current page's rail item instead, which is where the view now is.
    var railItem = document.querySelectorAll('.next-rail .rail-item')[currentPage];
    if (railItem) { try { railItem.focus(); } catch (e) {} }
  }

  // ── Horizontal scroll cue on tables ────────────────────────────────────────
  // Marks a .table-wrap with whether it can scroll sideways at all and whether
  // it has reached the right-hand end, which is what the edge shadow keys off.
  // A couple of pixels of slack absorbs fractional scroll positions from
  // display scaling, which otherwise leave "at the end" permanently false.
  var SCROLL_EDGE_SLACK = 2;

  function updateScrollEdges_(el) {
    if (!el || !el.classList || !el.classList.contains('table-wrap')) return;
    var max = el.scrollWidth - el.clientWidth;
    el.classList.toggle('has-scroll-x', max > SCROLL_EDGE_SLACK);
    el.classList.toggle('at-scroll-end', el.scrollLeft >= max - SCROLL_EDGE_SLACK);
  }

  function refreshScrollEdgesAll_() {
    var wraps = document.querySelectorAll('.table-wrap');
    for (var i = 0; i < wraps.length; i++) { updateScrollEdges_(wraps[i]); }
  }

  function initScrollEdges_() {
    // Capture phase: scroll events do not bubble, so a single delegated
    // listener only works on the way down. The alternative — binding to each
    // .table-wrap — would need rebinding after every table re-render, since
    // most of them are rebuilt from HTML strings on each filter change.
    document.addEventListener('scroll', function (e) {
      updateScrollEdges_(e.target);
    }, true);
    window.addEventListener('resize', refreshScrollEdgesAll_);
  }

  // ── Mobile header menu ─────────────────────────────────────────────────────
  // Six action buttons fit a desktop header and overrun a phone's, pushing into
  // the "E3 Live Productivity" title. On mobile they collapse behind one
  // button; on desktop the CSS leaves them inline and this never runs.
  function toggleHeaderMenu_(force) {
    var open = (typeof force === 'boolean')
      ? force
      : !document.body.classList.contains('header-menu-open');
    document.body.classList.toggle('header-menu-open', open);

    var btn = $('headerMenuBtn');
    if (btn) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      var icon = btn.querySelector('i');
      if (icon) icon.className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
    }
  }

  function initHeaderMenu_() {
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('header-menu-open')) return;
      // The button's own inline onclick has already run by now; leaving it
      // alone here stops this from immediately undoing it.
      if (e.target.closest && e.target.closest('#headerMenuBtn')) return;
      // Anything else closes the menu — including a click on one of the
      // actions, whose own handler has already fired.
      toggleHeaderMenu_(false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!document.body.classList.contains('header-menu-open')) return;
      toggleHeaderMenu_(false);
      var btn = $('headerMenuBtn');
      if (btn) { try { btn.focus(); } catch (err) {} }
    });

    // Rotating to a width where the buttons are inline again would otherwise
    // leave `header-menu-open` set, with nothing on screen to clear it.
    window.addEventListener('resize', function () {
      if (!window.matchMedia('(max-width: 700px)').matches) toggleHeaderMenu_(false);
    });
  }

  function initPageScrollChrome_() {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) {
      pages[i].addEventListener('scroll', updatePageScrollChrome_, { passive: true });
    }
  }


  // ── Deferred page rendering ────────────────────────────────────────────────
  // applyLocalFiltersPak() stashes its computed inputs and marks every page
  // dirty; each page's own render runs the first time that page is shown.
  function markAllPagesDirty_() {
    for (var i = 0; i < pageDirty.length; i++) { pageDirty[i] = true; }
  }

  function renderPageIfNeeded_(index) {
    if (!pageRenderCtx) return;
    if (index < 0 || index >= pageDirty.length) return;
    if (!pageDirty[index]) return;

    var c = pageRenderCtx;
    if (index === 0) {
      renderChartsPak(c.baseRows, c.trendRowsList, c.trendTitles, c.trendAreaKeysList, c.filteredData, c.targetTimeList);
    } else if (index === 1) {
      renderVolumePagePak(c.baseRows);
    } else if (index === 2) {
      renderSideTablesPak(c.rowsLimit);
    } else if (index === 3) {
      renderMainTablePak(currentMainRows);
    }
    pageDirty[index] = false;
    // Tables are rebuilt from HTML strings, so their scroll geometry is only
    // knowable once the new markup is in the document.
    setTimeout(refreshScrollEdgesAll_, 0);
  }

  function goToPage(index) {
    if (index < 0 || index >= totalPages) return;
    currentPage = index;
    currentTranslate = currentPage * -getSwipeWidth();
    prevTranslate = currentTranslate;
    setSliderPosition();
    updateDots();
    // Build this page's content if it hasn't been rendered since the last
    // data/filter change, before sizing its charts.
    renderPageIfNeeded_(index);
    resizeCharts();
    updatePageScrollChrome_();
  }

  // Highlights the nav item for the current page. Targets .rail-item directly
  // rather than a generic .dot class: the old class was shared with the
  // pre-reskin nav pills, so any element that happened to carry it would have
  // been treated as a page and silently broken this index-based matching.
  function updateDots() {
    var items = document.querySelectorAll('.next-rail .rail-item');
    for (var i = 0; i < items.length; i++) {
      if (i === currentPage) {
        items[i].classList.add('active');
        items[i].setAttribute('aria-current', 'page');
      } else {
        items[i].classList.remove('active');
        items[i].removeAttribute('aria-current');
      }
    }
  }

  function resizeCharts() {
    setTimeout(function() {
      if (overviewVolChart) overviewVolChart.resize();
      for (var t = 0; t < trendCharts.length; t++) {
        if (trendCharts[t]) trendCharts[t].resize();
      }
      if (perfChart) perfChart.resize();
      for (var i = 0; i < volumeCharts.length; i++) {
        if (volumeCharts[i]) volumeCharts[i].resize();
      }
    }, 310);
  }

  function touchStart() {
    return function(event) {
      if (event.touches && event.touches.length > 1) return;
      var target = event.target;
      
      // 1. Exclude standard DOM legends
      if (target && (target.closest('.chartjs-legend') || target.classList.contains('chartjs-legend') || target.tagName === 'LI' && target.closest('[class*="chartjs"]'))) { 
        return; 
      }

      // 2. Exclude CANVAS legends (Chart.js draws them at the bottom 15% of the canvas)
      if (target && target.tagName === 'CANVAS') {
        var rect = target.getBoundingClientRect();
        var clientY = event.touches ? event.touches[0].clientY : event.pageY;
        // If the click is near the bottom of the canvas, ignore it so Chart.js can handle the legend click
        if (clientY - rect.top > rect.height * 0.85) {
          return;
        }
      }

      isDragging = true;
      startX = getPositionX(event);
      startY = event.touches ? event.touches[0].clientY : event.pageY;
      prevTranslate = -currentPage * getSwipeWidth();
      animationID = requestAnimationFrame(animation);
      $('swipeContainer').style.cursor = 'grabbing';
    };
  }

  function touchEnd() {
    if (!isDragging) return;
    isDragging = false;
    cancelAnimationFrame(animationID);
    var movedBy = currentTranslate - prevTranslate;
    
    // 3. Only trigger page change/resize if it was an actual swipe (moved more than 15px)
    // This prevents standard "clicks" from resetting the charts and blocking Chart.js click events
    if (Math.abs(movedBy) > 15) {
      if (movedBy < -75 && currentPage < totalPages - 1) currentPage += 1;
      if (movedBy > 75 && currentPage > 0) currentPage -= 1;
      goToPage(currentPage);
    } else {
      // It was just a click/tap, snap the view back without running goToPage/resizeCharts
      currentTranslate = prevTranslate;
      setSliderPosition();
    }
    
    $('swipeContainer').style.cursor = 'grab';
  }

  function touchMove(event) {
    if (event.touches && event.touches.length > 1) { isDragging = false; return; }
    if (!isDragging) return; 
    var currentX = getPositionX(event);
    var currentY = event.touches ? event.touches[0].clientY : event.pageY;
    var diffX = Math.abs(currentX - startX);
    var diffY = Math.abs(currentY - startY);
    
    // If vertical movement is greater, cancel horizontal swipe for browser scrolling
    if (diffY > diffX && diffY > 10) {
      isDragging = false;
      currentTranslate = prevTranslate;
      setSliderPosition();
      return;
    }
    currentTranslate = prevTranslate + currentX - startX;
  }

  function getPositionX(event) { 
    return event.type.indexOf('mouse') !== -1 ? event.pageX : event.touches[0].clientX; 
  }
  
  function animation() { 
    setSliderPosition(); 
    if (isDragging) requestAnimationFrame(animation); 
  }

  function setupSwipe() {
    var container = $('swipeContainer');

    // Touch only. Drag-to-page with a mouse is not a desktop idiom — a click
    // and drag inside a chart or across a table is a selection or a hover, not
    // a request to change page, and the 15px threshold could not reliably tell
    // the difference. Desktop navigates by the rail (and the arrow keys, which
    // are unaffected).
    //
    // Dropping the mouse bindings also removes a subtler problem: browsers
    // synthesise mousedown/mousemove/mouseup after a tap, so on a touchscreen
    // every swipe was being processed twice, once through each pathway.
    container.addEventListener('touchstart', touchStart(), { passive: true });
    container.addEventListener('touchend', touchEnd);
    container.addEventListener('touchmove', touchMove, { passive: true });

    // The grab cursor advertised a drag that no longer exists, so it is only
    // set where a coarse pointer is present — where it is invisible anyway,
    // but harmless — and left alone on desktop.
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    if (coarse) container.style.cursor = 'grab';
    document.addEventListener('keydown', function(e) {
      // Guarded (see isPageArrowNavAllowed_): the arrows used to slide the whole
      // dashboard sideways even while the user was moving the caret in the
      // search box or picking an option in a dropdown.
      if (!isPageArrowNavAllowed_(e)) return;
      if (e.key === 'ArrowRight') goToPage(currentPage + 1);
      if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    });
    window.addEventListener('resize', function() {
      currentTranslate = -currentPage * getSwipeWidth();
      prevTranslate = currentTranslate;
      setSliderPosition();
      resizeCharts();

      var nowCardMode = isCardModePak();
      if (nowCardMode !== lastMainTableCardMode) {
        lastMainTableCardMode = nowCardMode;
        renderMainTablePak(currentMainRows);
      }
    });
    lastMainTableCardMode = isCardModePak();
    goToPage(0);
  }

  function initKpiTooltipTaps_() {
    document.querySelectorAll('.kpi-tooltip').forEach(function(tip) {
      tip.addEventListener('click', function(e) {
        e.stopPropagation();
        var wasOpen = tip.classList.contains('open');
        document.querySelectorAll('.kpi-tooltip.open').forEach(function(t) { t.classList.remove('open'); });
        if (!wasOpen) tip.classList.add('open');
      });
    });
    document.addEventListener('click', function() {
      document.querySelectorAll('.kpi-tooltip.open').forEach(function(t) { t.classList.remove('open'); });
    });
  }

  function showHeadBreakdown() {
    if (!rawSideData || rawSideData.length === 0) return;
    document.getElementById('breakdownOverlay').classList.add('active');
    populateBreakdownSelects();
  }
    
  function closeBreakdown() { 
    $('breakdownOverlay').classList.remove('active'); 
  }

  function populateBreakdownSelects() {
    var fromSel = document.getElementById('breakdownFrom');
    var toSel = document.getElementById('breakdownTo');
    if (!fromSel || !toSel) return;

    var maxBlocks = 24 * 4; // 96 blocks = 24 hours
    var sliced = timeRanges.slice(-maxBlocks);

    function getStartLabel(tr) {
      var parts = String(tr || '').trim().split(' - ');
      return parts[0].trim();
    }

    fromSel.innerHTML = '';
    toSel.innerHTML = '';

    for (var i = 0; i < sliced.length; i++) {
      var startLabel = getStartLabel(sliced[i]);
      var optF = document.createElement('option');
      optF.value = sliced[i];
      optF.textContent = startLabel;
      fromSel.appendChild(optF);

      var optT = document.createElement('option');
      optT.value = sliced[i];
      optT.textContent = addMinutesToLabel(startLabel, 15);
      toSel.appendChild(optT);
    }

    var defaultFromIdx = Math.max(0, sliced.length - 4);
    fromSel.selectedIndex = defaultFromIdx;
    toSel.selectedIndex = sliced.length - 1;

    updateBreakdownRange();
  }

  function updateBreakdownRange() {
    var fromSel = document.getElementById('breakdownFrom');
    var toSel = document.getElementById('breakdownTo');
    var badge = document.getElementById('breakdownRangeBadge');
    if (!fromSel || !toSel) return;

    var fromIdx = fromSel.selectedIndex;
    var toIdx = toSel.selectedIndex;

    if (toIdx < fromIdx) {
      toSel.selectedIndex = fromIdx;
      toIdx = fromIdx;
    }

    var blockCount = toIdx - fromIdx + 1;
    var minutes = blockCount * 15;
    var hours = minutes / 60;
    var hoursLabel = hours >= 1
      ? (Number.isInteger(hours) ? hours + ' hr' + (hours !== 1 ? 's' : '') : hours.toFixed(1) + ' hrs')
      : minutes + ' min';
    if (badge) badge.textContent = blockCount + ' block' + (blockCount !== 1 ? 's' : '') + ' · ' + hoursLabel;

    renderBreakdownBody();
  }

  function renderBreakdownBody() {
    var fromSel = document.getElementById('breakdownFrom');
    var toSel = document.getElementById('breakdownTo');
    if (!fromSel || !toSel || !rawSideData || rawSideData.length === 0) return;

    var fromIdx = fromSel.selectedIndex;
    var toIdx = toSel.selectedIndex;
    if (toIdx < fromIdx) toIdx = fromIdx;

    var maxBlocks = 24 * 4;
    var sliced = timeRanges.slice(-maxBlocks);
    var selectedSlice = sliced.slice(fromIdx, toIdx + 1);
    var selectedSet = {};
    for (var i = 0; i < selectedSlice.length; i++) { selectedSet[selectedSlice[i]] = true; }

    var rangeData = rawSideData.filter(function(r) { return selectedSet[r.timeRange]; });

    var bonusBlockMap = {};
    for (var i = 0; i < rangeData.length; i++) {
      var r = rangeData[i];
      var bonus = r.bonus;
      var val = Number(r.value) || 0;
      if (!bonusBlockMap[bonus]) bonusBlockMap[bonus] = { totalStdHours: 0, activeBlocks: 0 };
      bonusBlockMap[bonus].totalStdHours += val;
      if (val > 0) bonusBlockMap[bonus].activeBlocks++;
    }
    
    var bonusProductivity = {};
    var bKeys = Object.keys(bonusBlockMap);
    for (var i = 0; i < bKeys.length; i++) {
      var b = bKeys[i];
      var info = bonusBlockMap[b];
      var deployed = info.activeBlocks * 0.25;
      bonusProductivity[b] = deployed > 0 ? (info.totalStdHours / deployed) * 100 : 0;
    }

    var bonusAreaCount = {};
    for (var a = 0; a < BREAKDOWN_AREAS.length; a++) {
      var areaKey = BREAKDOWN_AREAS[a].key;
      var seenInArea = {};
      for (var i = 0; i < rangeData.length; i++) {
        if (Number(rangeData[i][areaKey]) > 0) seenInArea[rangeData[i].bonus] = true;
      }
      var areaBonusKeys = Object.keys(seenInArea);
      for (var j = 0; j < areaBonusKeys.length; j++) {
        if (!bonusAreaCount[areaBonusKeys[j]]) bonusAreaCount[areaBonusKeys[j]] = 0;
        bonusAreaCount[areaBonusKeys[j]]++;
      }
    }

    var allBonuses = {};
    for (var i = 0; i < rangeData.length; i++) { allBonuses[rangeData[i].bonus] = true; }
    var totalUniqueHeads = Object.keys(allBonuses).length;

    var breakdown = [];
    var maxCount = 0;
    for (var a = 0; a < BREAKDOWN_AREAS.length; a++) {
      var area = BREAKDOWN_AREAS[a];
      var areaBonuses = {};
      for (var i = 0; i < rangeData.length; i++) {
        if (Number(rangeData[i][area.key]) > 0) areaBonuses[rangeData[i].bonus] = true;
      }
      var bonusList = Object.keys(areaBonuses);
      bonusList.sort(function(a, b) { return (bonusProductivity[b] || 0) - (bonusProductivity[a] || 0); });
      var count = bonusList.length;
      if (count > 0) {
        breakdown.push({ label: area.label, count: count, color: area.color, bonuses: bonusList });
        if (count > maxCount) maxCount = count;
      }
    }
    breakdown.sort(function(a, b) { return b.count - a.count; });

    var sumOfAreas = 0;
    for (var i = 0; i < breakdown.length; i++) { sumOfAreas += breakdown[i].count; }

    var body = document.getElementById('breakdownBody');
    var html = '<div class="breakdown-summary">';
    html += '<span class="breakdown-summary-num">' + totalUniqueHeads + '</span><span class="breakdown-summary-label">unique heads</span>';
    html += '<span class="breakdown-summary-sep">&middot;</span>';
    html += '<span class="breakdown-summary-num">' + breakdown.length + '</span><span class="breakdown-summary-label">areas active</span>';
    if (sumOfAreas > totalUniqueHeads) {
      html += '<span class="breakdown-summary-sep">&middot;</span><span class="breakdown-summary-num" style="font-size:16px;color:var(--accent);">' + sumOfAreas + '</span><span class="breakdown-summary-label">total assignments</span>';
    }
    html += '</div>';

    for (var i = 0; i < breakdown.length; i++) {
      var item = breakdown[i];
      var pct = maxCount > 0 ? (item.count / maxCount * 100) : 0;
      html += '<div class="breakdown-row clickable-row" onclick="toggleBreakdownDetail(this)">';
      html += '<div class="breakdown-label"><span class="breakdown-dot" style="background:' + item.color + ';"></span>' + safeTextPak(item.label) + '<i class="fa-solid fa-chevron-down breakdown-chevron"></i></div>';
      html += '<div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:0%;background:' + hexToRgbaPak(item.color, 0.55) + ';border:1px solid ' + hexToRgbaPak(item.color, 0.3) + ';" data-target="' + pct + '"></div></div>';
      html += '<div class="breakdown-count" style="color:' + item.color + ';">' + item.count + '</div></div>';
      html += '<div class="breakdown-detail">';
      html += '<div class="breakdown-detail-inner">';
      for (var b = 0; b < item.bonuses.length; b++) {
        var bonusName = item.bonuses[b];
        var bPerfRaw = bonusProductivity[bonusName] || 0;
        var bPerfDisplay = normalizePerfPak(bPerfRaw);
        var bClass = perfClassPak(bPerfRaw);
        var isMulti = (bonusAreaCount[bonusName] || 0) > 1;
        var multiClass = isMulti ? ' multi-area' : '';
        var multiIcon = isMulti ? '<i class="fa-solid fa-layer-group breakdown-multi-icon"></i>' : '';
        var escapedB = escapeAttrPak(bonusName);
        html += '<span class="breakdown-bonus-chip ' + bClass + multiClass + '" onclick="event.stopPropagation();toggleBonusFilter(\'' + escapedB + '\');"><span class="chip-left">' + multiIcon + safeTextPak(bonusName) + '</span><span class="chip-right"><span class="breakdown-chip-pct">' + Math.round(bPerfDisplay) + '%</span><i class="fa-solid fa-filter chip-filter-icon"></i></span></span>';
      }
      html += '</div>';
      html += '<div class="breakdown-detail-hint">Click a bonus number to filter the main view' + (sumOfAreas > totalUniqueHeads ? ' · <i class="fa-solid fa-layer-group" style="font-size:9px;margin:0 2px;"></i> = works across multiple areas' : '') + '</div>';
      html += '</div>';
    }

    if (breakdown.length === 0) {
      html += '<div class="breakdown-empty"><i class="fa-solid fa-ghost" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.3;"></i>No activity in the selected range</div>';
    }

    body.innerHTML = html;
    setTimeout(function() {
      var bars = body.querySelectorAll('.breakdown-bar');
      for (var i = 0; i < bars.length; i++) {
        bars[i].style.width = bars[i].dataset.target + '%';
      }
    }, 60);
  }

  function toggleBreakdownDetail(rowEl) {
    var detail = rowEl.nextElementSibling;
    var isExpanded = rowEl.classList.contains('expanded');
    var allRows = document.querySelectorAll('.breakdown-row.clickable-row.expanded');
    for (var i = 0; i < allRows.length; i++) {
      if (allRows[i] !== rowEl) {
        allRows[i].classList.remove('expanded');
        var otherDetail = allRows[i].nextElementSibling;
        if (otherDetail && otherDetail.classList.contains('breakdown-detail')) {
          otherDetail.classList.remove('open');
        }
      }
    }
    if (isExpanded) {
      rowEl.classList.remove('expanded');
      if (detail && detail.classList.contains('breakdown-detail')) {
        detail.classList.remove('open');
      }
    } else {
      rowEl.classList.add('expanded');
      if (detail && detail.classList.contains('breakdown-detail')) {
        detail.classList.add('open');
      }
    }
  }

  var _trendSplitDraft = null;

  function openTrendSplit() {
    _trendSplitDraft = (trendSplitState.charts && trendSplitState.charts.length > 0)
      ? trendSplitState.charts.map(function(c) { return c.slice(); })
      : [[], []];
    $('trendSplitOverlay').classList.add('active');
    renderTrendSplitEditor();
  }

  function closeTrendSplit() {
    $('trendSplitOverlay').classList.remove('active');
  }

  function renderTrendSplitEditor() {
    var html = '';
    for (var i = 0; i < _trendSplitDraft.length; i++) {
      var label = TREND_CHART_LABELS[i] || ('Chart ' + (i + 1));
      html += '<div class="area-group-block">';
      html += '<div class="area-group-head">';
      html += '<h3>' + label + '</h3>';
      if (_trendSplitDraft.length > 1) {
        html += '<button class="btn area-group-remove" onclick="removeTrendSplitChart(' + i + ')" title="Remove chart"><i class="fa-solid fa-trash"></i></button>';
      }
      html += '</div>';
      html += '<div class="area-group-areas">';
      for (var v = 0; v < VOLUME_TYPES.length; v++) {
        var t = VOLUME_TYPES[v];
        var checked = _trendSplitDraft[i].indexOf(t.key) !== -1 ? 'checked' : '';
        html += '<label class="trend-split-cb"><input type="checkbox" data-chart="' + i + '" data-key="' + t.key + '" ' + checked + ' onchange="onTrendSplitCbChange(this)"><span class="trend-split-dot" style="background:' + t.color + '"></span><span class="area-cb-text">' + t.label + '</span></label>';
      }
      html += '</div></div>';
    }
    $('trendSplitEditor').innerHTML = html;
    $('addTrendSplitBtn').style.display = _trendSplitDraft.length >= MAX_TREND_CHARTS ? 'none' : '';
  }

  function onTrendSplitCbChange(cb) {
    var i = parseInt(cb.dataset.chart, 10);
    var key = cb.dataset.key;
    var keys = _trendSplitDraft[i];
    var idx = keys.indexOf(key);
    if (cb.checked && idx === -1) { keys.push(key); }
    else if (!cb.checked && idx !== -1) { keys.splice(idx, 1); }
  }

  function addTrendSplitChart() {
    if (_trendSplitDraft.length >= MAX_TREND_CHARTS) return;
    _trendSplitDraft.push([]);
    renderTrendSplitEditor();
  }

  function removeTrendSplitChart(i) {
    _trendSplitDraft.splice(i, 1);
    renderTrendSplitEditor();
  }

  function applyTrendSplit() {
    var order = VOLUME_TYPES.map(function(t) { return t.key; });
    var cleaned = _trendSplitDraft.map(function(keys) {
      return order.filter(function(k) { return keys.indexOf(k) !== -1; });
    });
    var anySelected = cleaned.some(function(c) { return c.length > 0; });
    trendSplitState = anySelected ? { enabled: true, charts: cleaned } : { enabled: false, charts: [] };
    closeTrendSplit();
    applyLocalFiltersPak();
  }

  function resetTrendSplit() {
    // Collapsing back to a single chart discards every split the user configured.
    if (!confirm('Reset back to a single deployment trend chart?\n\nThe split charts you have set up will be lost.')) return;
    trendSplitState = { enabled: false, charts: [] };
    closeTrendSplit();
    applyLocalFiltersPak();
  }

  var _areaGroupDraft = null;

  function openAreaGroups() {
    _areaGroupDraft = areaGroupState.map(function(g) {
      return { keys: (g.keys || []).slice(), showLine: g.showLine !== false, showTrend: g.showTrend === true };
    });
    if (_areaGroupDraft.length === 0) {
      _areaGroupDraft = defaultAreaGroupState_();
    }
    $('areaGroupOverlay').classList.add('active');
    renderAreaGroupEditor();
  }

  function closeAreaGroups() {
    $('areaGroupOverlay').classList.remove('active');
  }

  function renderAreaGroupEditor() {
    var html = '';
    for (var i = 0; i < _areaGroupDraft.length; i++) {
      var g = _areaGroupDraft[i];
      html += '<div class="area-group-block">';
      html += '<div class="area-group-head">';
      html += '<h3>Group ' + (i + 1) + '</h3>';
      html += '<div class="area-group-modes">';
      html += '<label class="trend-split-cb"><input type="checkbox" data-group="' + i + '" data-mode="showLine" ' + (g.showLine ? 'checked' : '') + ' onchange="onAreaGroupModeChange(this)"><span class="area-cb-text">Line</span></label>';
      html += '<label class="trend-split-cb"><input type="checkbox" data-group="' + i + '" data-mode="showTrend" ' + (g.showTrend ? 'checked' : '') + ' onchange="onAreaGroupModeChange(this)"><span class="area-cb-text">Trend Line</span></label>';
      if (_areaGroupDraft.length > 1) {
        html += '<button class="btn area-group-remove" onclick="removeAreaGroup(' + i + ')" title="Remove group"><i class="fa-solid fa-trash"></i></button>';
      }
      html += '</div>';
      html += '</div>';
      html += '<div class="area-group-areas">';
      for (var v = 0; v < VOLUME_TYPES.length; v++) {
        var t = VOLUME_TYPES[v];
        var checked = g.keys.indexOf(t.key) !== -1 ? 'checked' : '';
        html += '<label class="trend-split-cb"><input type="checkbox" data-group="' + i + '" data-key="' + t.key + '" ' + checked + ' onchange="onAreaGroupCbChange(this)"><span class="trend-split-dot" style="background:' + t.color + '"></span><span class="area-cb-text">' + t.label + '</span></label>';
      }
      html += '</div></div>';
    }
    $('areaGroupEditor').innerHTML = html;
    $('addAreaGroupBtn').style.display = _areaGroupDraft.length >= MAX_AREA_GROUPS ? 'none' : '';
  }

  function onAreaGroupCbChange(cb) {
    var i = parseInt(cb.dataset.group, 10);
    var key = cb.dataset.key;
    var keys = _areaGroupDraft[i].keys;
    var idx = keys.indexOf(key);
    if (cb.checked && idx === -1) { keys.push(key); }
    else if (!cb.checked && idx !== -1) { keys.splice(idx, 1); }
  }

  function onAreaGroupModeChange(cb) {
    var i = parseInt(cb.dataset.group, 10);
    var mode = cb.dataset.mode;
    var g = _areaGroupDraft[i];
    g[mode] = cb.checked;
    // Exactly one of Line / Trend Line must always stay selected. Rather than
    // refusing the click and snapping the box back on (which just reads as
    // broken), hand the selection over: unchecking the last one turns the OTHER
    // on, so the pair behaves like a toggle you can flip from either side.
    if (!g.showLine && !g.showTrend) {
      var other = (mode === 'showLine') ? 'showTrend' : 'showLine';
      g[other] = true;
      var otherCb = document.querySelector(
        '#areaGroupEditor input[data-group="' + i + '"][data-mode="' + other + '"]');
      if (otherCb) otherCb.checked = true;
    }
  }

  function addAreaGroup() {
    if (_areaGroupDraft.length >= MAX_AREA_GROUPS) return;
    _areaGroupDraft.push({ keys: [], showLine: true, showTrend: false });
    renderAreaGroupEditor();
  }

  function removeAreaGroup(i) {
    _areaGroupDraft.splice(i, 1);
    renderAreaGroupEditor();
  }

  function applyAreaGroups() {
    var order = VOLUME_TYPES.map(function(t) { return t.key; });
    var cleaned = [];
    for (var i = 0; i < _areaGroupDraft.length && cleaned.length < MAX_AREA_GROUPS; i++) {
      var draft = _areaGroupDraft[i];
      var keys = order.filter(function(k) { return draft.keys.indexOf(k) !== -1; });
      if (keys.length === 0) continue;
      var showLine = draft.showLine !== false;
      var showTrend = draft.showTrend === true;
      if (!showLine && !showTrend) showLine = true;
      cleaned.push({ keys: keys, showLine: showLine, showTrend: showTrend });
    }
    if (cleaned.length === 0) {
      cleaned = defaultAreaGroupState_();
    }
    areaGroupState = cleaned;
    closeAreaGroups();
    applyLocalFiltersPak();
  }

  function resetAreaGroups() {
    // Destructive and not undoable — the user may have built up several groups.
    if (!confirm('Reset all area groups back to the default set?\n\nAny groups you have built here will be lost.')) return;
    areaGroupState = defaultAreaGroupState_();
    closeAreaGroups();
    applyLocalFiltersPak();
  }

</script>
