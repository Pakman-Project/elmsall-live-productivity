<script>
function comparePak(a, b, key) {
  var av = a[key],
      bv = b[key],
      result = 0;

  if (
    key === 'performance' ||
    key === 'hourDeployed' ||
    key === 'stdHours' ||
    key === 'pieVol' ||
    key === 'topUpVol'
  ) {
    var numA = Number(av),
        numB = Number(bv);

    if (typeof av === 'string' && av.indexOf('%') !== -1) {
      numA = Number(av.replace('%', ''));
    }
    if (typeof bv === 'string' && bv.indexOf('%') !== -1) {
      numB = Number(bv.replace('%', ''));
    }

    if (key === 'performance') {
      numA = normalizePerfPak(numA);
      numB = normalizePerfPak(numB);
    }
    
    result = numA - numB;
  } else if (typeof av === 'number' && typeof bv === 'number') {
    result = av - bv;
  } else {
    result = safeTextPak(av).localeCompare(safeTextPak(bv));
  }
  
  return sortState.dir === 'asc' ? result : -result;
}

function wireSortingPak() {
  var ths = document.querySelectorAll('#mainTable th');
  for (var i = 0; i < ths.length; i++) {
    (function (th) {
      th.addEventListener('click', function () {
        var key = th.dataset.key;
        sortState.dir = sortState.key === key
          ? (sortState.dir === 'asc' ? 'desc' : 'asc')
          : 'desc';
        sortState.key = key;
        renderMainTablePak(currentMainRows);
      });
    })(ths[i]);
  }

  var sortSelect = $('mainSortSelect');
  if (sortSelect) {
    sortSelect.innerHTML = sortableColumnsActive_().map(function (c) {
      return '<option value="' + c.key + '">' + c.label + '</option>';
    }).join('');
    sortSelect.value = sortState.key;
    sortSelect.addEventListener('change', function () {
      // Match the desktop header-click behaviour: switching to a different
      // column starts at descending, so the dropdown and the direction button
      // never disagree about what the table is actually sorted by.
      if (sortSelect.value !== sortState.key) sortState.dir = 'desc';
      sortState.key = sortSelect.value;
      renderMainTablePak(currentMainRows);
    });
  }

  var dirBtn = $('mainSortDirBtn');
  if (dirBtn) {
    dirBtn.classList.toggle('desc', sortState.dir === 'desc');
    dirBtn.addEventListener('click', function () {
      sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      dirBtn.classList.toggle('desc', sortState.dir === 'desc');
      renderMainTablePak(currentMainRows);
    });
  }
}

function renderMainTablePak(sourceRows) {
  // Column headers follow the building filter. The cells are built from the
  // same list (mainMetricColumnsActive_), so the two cannot fall out of step.
  var siteHeaders = document.querySelectorAll('#mainTable th[data-site]');
  for (var sh = 0; sh < siteHeaders.length; sh++) {
    siteHeaders[sh].style.display = areaInSite_(siteHeaders[sh].dataset.key) ? '' : 'none';
  }

  var headers = document.querySelectorAll('#mainTable th');
  for (var h = 0; h < headers.length; h++) {
    headers[h].classList.remove('active-sort', 'asc', 'desc');
    if (headers[h].dataset.key === sortState.key) {
      headers[h].classList.add('active-sort');
      headers[h].classList.add(sortState.dir);
    }
  }
  var sortSelect = $('mainSortSelect');
  if (sortSelect && sortSelect.value !== sortState.key) sortSelect.value = sortState.key;
  var dirBtn = $('mainSortDirBtn');
  if (dirBtn) dirBtn.classList.toggle('desc', sortState.dir === 'desc');

  var rows = sourceRows.sort(function (a, b) {
    return comparePak(a, b, sortState.key);
  });

  var tbody = $('mainTable').querySelector('tbody');
  var cardList = $('mainCardList');

  // Empty state: say WHY it's empty, since "no data at all" and "your filter
  // excluded everything" need very different reactions from the user.
  var emptyEl = $('mainTableEmpty');
  var tableWrap = $('mainTable').closest('.table-wrap');
  if (emptyEl) {
    if (rows.length === 0) {
      var why, icon;
      if (selectedBonuses.length > 0) {
        why = 'No rows for the bonus number(s) you are filtering by.';
        icon = 'fa-filter';
      } else {
        why = 'No data has arrived for this day yet.';
        icon = 'fa-ghost';
      }
      emptyEl.innerHTML = '<i class="fa-solid ' + icon + '"></i><span>' + why + '</span>';
      emptyEl.style.display = 'flex';
      if (tableWrap) tableWrap.style.display = 'none';
      cardList.style.display = 'none';
      tbody.innerHTML = '';
      cardList.innerHTML = '';
      $('status').textContent = '0 row(s) shown';
      return;
    }
    emptyEl.style.display = 'none';
    if (tableWrap) tableWrap.style.display = '';
    cardList.style.display = '';
  }

  if (isCardModePak()) {
    tbody.innerHTML = '';
    cardList.innerHTML = rows.map(buildMainCardHtml_).join('');
    wireMainCardEvents_(cardList, rows);
  } else {
    cardList.innerHTML = '';
    tbody.innerHTML = '';

    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var isExpanded = expandedRowKey !== null && r.dateTime === expandedRowKey;
      var tr = document.createElement('tr');
      tr.className = 'main-expandable-row' + (isExpanded ? ' expanded' : '');

      tr.innerHTML =
        '<td><span class="main-row-dt-cell">' + safeTextPak(r.dateTime) + '<i class="fa-solid fa-chevron-down main-row-chevron"></i></span></td>' +
        '<td>' + safeTextPak(r.bonusNumber) + '</td>' +
        numTdPak(r.hourDeployed, 2) +
        numTdPak(r.stdHours, 2) +
        // Built from the active column list rather than one call per area: the
        // building filter drops columns, and a hand-written run of calls had to
        // be edited in step with four other lists every time an area arrived.
        mainMetricColumnsActive_().map(function (m) { return numTdPak(r[m.key], 0); }).join('') +
        '<td><span class="pill ' + perfClassPak(r.performance) + '">' + pctPak(r.performance, 0) + '</span></td>';

      (function (rowEl, rowData) {
        rowEl.addEventListener('click', function () {
          toggleMainRowDetail(rowEl, rowData);
        });
      })(tr, r);

      tbody.appendChild(tr);

      var detailTr = document.createElement('tr');
      detailTr.className = 'main-detail-row' + (isExpanded ? ' open' : '');

      var detailTd = document.createElement('td');
      // Spans exactly the row it belongs to, counted from that row rather than
      // stated as a number. It was pinned at 14, and every column added since -
      // Sorter 6, then the three Online Picking areas - fell outside the span,
      // so the nested detail table was laid out across 14/18ths of the width
      // and its columns stopped sitting under the Main Table's.
      detailTd.colSpan = tr.cells.length;
      detailTd.className = 'main-detail-td';
      detailTd.innerHTML = '<div class="main-detail-content">' + (isExpanded ? buildMainRowDetail(r) : '') + '</div>';

      detailTr.appendChild(detailTd);
      tbody.appendChild(detailTr);
    }
  }

  $('status').textContent = rows.length + ' row(s) shown';
}

function buildMainCardHtml_(r) {
  var isExpanded = expandedRowKey !== null && r.dateTime === expandedRowKey;
  var metricsHtml = mainMetricColumnsActive_().map(function (m) {
    return '<div class="main-card-metric"><span class="main-card-metric-label">' + m.label + '</span>' +
           '<span class="main-card-metric-value' + (Number(r[m.key]) ? '' : ' zero') + '">' +
           numPak(r[m.key], 0) + '</span></div>';
  }).join('');

  return '<div class="main-card main-expandable-row' + (isExpanded ? ' expanded' : '') + '">' +
    '<div class="main-card-head">' +
      '<div class="main-card-dt">' + safeTextPak(r.dateTime) + '<i class="fa-solid fa-chevron-down main-row-chevron"></i></div>' +
      '<div class="main-card-bonus">' + safeTextPak(r.bonusNumber) + '</div>' +
      '<span class="pill ' + perfClassPak(r.performance) + '">' + pctPak(r.performance, 0) + '</span>' +
    '</div>' +
    '<div class="main-card-hours">' +
      '<span>Est. Hours <b>' + numPak(r.hourDeployed, 2) + '</b></span>' +
      '<span>Std. Hours <b>' + numPak(r.stdHours, 2) + '</b></span>' +
    '</div>' +
    '<div class="main-card-metrics">' + metricsHtml + '</div>' +
    '<div class="main-detail-row' + (isExpanded ? ' open' : '') + '">' +
      '<div class="main-detail-content">' + (isExpanded ? buildMainRowDetail(r) : '') + '</div>' +
    '</div>' +
  '</div>';
}

function wireMainCardEvents_(cardList, rows) {
  var cardEls = cardList.querySelectorAll('.main-card');
  for (var i = 0; i < cardEls.length; i++) {
    (function (cardEl, rowData) {
      cardEl.querySelector('.main-card-head').addEventListener('click', function () {
        toggleMainRowDetail(cardEl, rowData);
      });
    })(cardEls[i], rows[i]);
  }
}

function findMainDetailEl_(rowEl) {
  var nested = rowEl.querySelector('.main-detail-row');
  if (nested) return nested;
  var sib = rowEl.nextElementSibling;
  return (sib && sib.classList.contains('main-detail-row')) ? sib : null;
}

function toggleMainRowDetail(rowEl, rowData) {
  var detailEl = findMainDetailEl_(rowEl);
  if (!detailEl) return;

  var isOpen = rowEl.classList.contains('expanded');
  var allExpanded = document.querySelectorAll('#mainTableWrapper .main-expandable-row.expanded');

  for (var i = 0; i < allExpanded.length; i++) {
    if (allExpanded[i] !== rowEl) {
      allExpanded[i].classList.remove('expanded');
      var otherDetail = findMainDetailEl_(allExpanded[i]);
      if (otherDetail) otherDetail.classList.remove('open');
    }
  }

  if (isOpen) {
    rowEl.classList.remove('expanded');
    detailEl.classList.remove('open');
    expandedRowKey = null;
  } else {
    rowEl.classList.add('expanded');
    detailEl.querySelector('.main-detail-content').innerHTML = buildMainRowDetail(rowData);
    detailEl.classList.add('open');
    expandedRowKey = rowData.dateTime;
  }
}

function buildMainRowDetail(rowData) {
  var wm = parseInt($('timeWindow').value, 10) || 15;
  var p = extractRangePartsPak(rowData.dateTime);
  var startDate = parseDateTimePartPak(p.start);
  var matchSet = {};

  if (startDate) {
    var endDate = new Date(startDate.getTime() + wm * 60000);
    for (var i = 0; i < timeRanges.length; i++) {
      var tp = extractRangePartsPak(timeRanges[i]);
      var ts = parseDateTimePartPak(tp.start);
      if (ts && ts >= startDate && ts < endDate) {
        matchSet[timeRanges[i]] = true;
      }
    }
  } else {
    matchSet[rowData.dateTime] = true;
  }

  var slice = rawSideData.filter(function (r) {
    if (!matchSet[r.timeRange]) return false;
    if (selectedBonuses.length > 0 && selectedBonuses.indexOf(r.bonus) === -1) return false;
    return true;
  });

  if (slice.length === 0) {
    return '<div class="main-detail-empty">No individual data found for this period.</div>';
  }

  // Scoped to this row's window: within the 15-60 minutes the row covers, who
  // moved between areas.
  currentDetailAreaCount = bonusAreaCountMapPak(slice);
  currentDetailOsMap = bonusOsMapPak_(slice);
  currentDetailNplMap = bonusNplMapPak_(slice);

  var entryRows = buildIndividualEntryRows_(slice).sort(compareEntryDetailPak);
  return isCardModePak() ? buildMainDetailCardsHtml_(entryRows) : buildMainDetailTableHtml_(entryRows);
}

// Columns of the expanded-row detail table. Mirrors buildEntryDetailRowHtml_'s
// cell order — keep the two in step.
var DETAIL_TABLE_COLUMNS = [
  { key: 'timeRange',           label: 'Time Block',          type: 'time' },
  { key: 'bonus',               label: 'Bonus Number',        type: 'text' },
  { key: 'hourDeployed',        label: 'Est. Hours Deployed', type: 'num' },
  { key: 'stdHours',            label: 'Standard Hours',      type: 'num' },
  { key: 'rspsPickVol',            label: 'RSPS Pick',               type: 'num' },
  { key: 'ispsPickVol',            label: 'ISPS Pick',               type: 'num' },
  { key: 'pieVol',                 label: 'OSR PiE',                 type: 'num' },
  { key: 'onlinePickingDriveVol',  label: 'Drive - Online Picking',  type: 'num' },
  { key: 'onlinePickingWayVol',    label: 'Way - Online Picking',    type: 'num' },
  { key: 'onlinePickingE3Vol',     label: 'E3 - Online Picking',     type: 'num' },
  { key: 'rspsTopUpVol',           label: 'RSPS Top Up',             type: 'num' },
  { key: 'ispsTopUpVol',           label: 'ISPS Top Up',             type: 'num' },
  { key: 'topUpVol',               label: 'OSR Top Up',              type: 'num' },
  { key: 'forwardTpaVol',          label: 'Forward TPA',             type: 'num' },
  { key: 'e1e2BppVol',             label: 'E1/E2 BPP',               type: 'num' },
  { key: 'sorter6ItemInductVol',   label: 'Sorter 6 Item Induct',    type: 'num' },
  { key: 'sorter6ParcelInductVol', label: 'Sorter 6 Parcel Induct',  type: 'num' },
  { key: 'sorter6PackingVol',      label: 'Sorter 6 Packing',        type: 'num' },
  { key: 'e3BppVol',               label: 'E3 BPP',                  type: 'num' },
  { key: 'e3PackingVol',           label: 'E3 Packing',              type: 'num' },
  { key: 'parcelInductVol',        label: 'E3 Parcel Induct',           type: 'num' },
  { key: 'parcelSortationVol',     label: 'E3 Parcel Sortation',        type: 'num' },
  { key: 'e1e2InductingVol',       label: 'E3 EDW Induct',         type: 'num' },
  { key: 'bcrInductingVol',        label: 'BCR Inducting',           type: 'num' },
  { key: 'osrDecantingVol',        label: 'OSR Decanting',           type: 'num' },
  { key: 'inboundDecantingVol',    label: 'E3 Inbound Decanting',    type: 'num' },
  { key: 'tpRetailVol',            label: 'TP Retail',               type: 'num' },
  { key: 'rtfVol',                 label: 'RTF',                     type: 'num' },
  { key: 'performance',         label: 'Productivity %',      type: 'num' }
];

// Sorts the expanded row's per-entry table. With no column chosen it falls back
// to compareEntryRowsPak (chronological, then bonus), which is also what the CSV
// export uses — so the default order stays consistent between the two.
function compareEntryDetailPak(a, b) {
  var key = detailSortState.key;
  if (!key) return compareEntryRowsPak(a, b);

  var col = null;
  for (var i = 0; i < DETAIL_TABLE_COLUMNS.length; i++) {
    if (DETAIL_TABLE_COLUMNS[i].key === key) { col = DETAIL_TABLE_COLUMNS[i]; break; }
  }
  var type = col ? col.type : 'num';

  var result;
  if (type === 'time') {
    var da = parseDateTimePartPak(extractRangePartsPak(a.timeRange).start);
    var db = parseDateTimePartPak(extractRangePartsPak(b.timeRange).start);
    result = (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
  } else if (type === 'text') {
    result = safeTextPak(a[key]).localeCompare(safeTextPak(b[key]));
  } else {
    result = (Number(a[key]) || 0) - (Number(b[key]) || 0);
  }
  // Ties keep the natural chronological/bonus order rather than jumping around.
  if (result === 0) return compareEntryRowsPak(a, b);
  return detailSortState.dir === 'asc' ? result : -result;
}

function setDetailSort(key) {
  if (detailSortState.key === key) {
    detailSortState.dir = detailSortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    detailSortState.key = key;
    detailSortState.dir = 'desc';
  }
  // Re-render the table; the expanded row is rebuilt from expandedRowKey, so
  // the open row stays open with its detail re-sorted.
  renderMainTablePak(currentMainRows);
}

function buildEntryDetailCardHtml_(r) {
  var escapedBonus = escapeAttrPak(r.bonus);
  var isActive = selectedBonuses.indexOf(r.bonus) !== -1;
  var metricsHtml = mainMetricColumnsActive_().map(function (m) {
    return '<div class="entry-card-metric"><span>' + m.label + '</span><b>' + numPak(r[m.key], 0) + '</b></div>';
  }).join('');

  return '<div class="entry-card">' +
    '<div class="entry-card-head">' +
      '<span class="entry-card-time">' + safeTextPak(trimTimeLabelPak(r.timeRange)) + '</span>' +
      // The card mode is the touchscreen layout, where a title attribute never
      // renders at all — so this carries the real tooltip card, the one a tap
      // can open.
      '<span class="clickable-bonus bonus-tip-host' + (isActive ? ' active' : '') + '"' +
        ' onclick="event.stopPropagation();toggleBonusFilter(\'' + escapedBonus + '\')">' +
        multiAreaIconHtmlPak(currentDetailAreaCount[r.bonus]) +
        safeTextPak(r.bonus) +
        osTagHtmlPak_(currentDetailOsMap[r.bonus]) +
        nplTagHtmlPak_(currentDetailNplMap[r.bonus]) +
        ' <i class="fa-solid fa-filter filter-icon"></i>' +
        bonusTipHtmlPak_(r.bonus, isActive) +
      '</span>' +
      '<span class="pill ' + perfClassPak(r.performance) + '">' + pctPak(r.performance, 0) + '</span>' +
    '</div>' +
    '<div class="entry-card-hours"><span>Est ' + numPak(r.hourDeployed, 2) + '</span><span>Std ' + numPak(r.stdHours, 2) + '</span></div>' +
    '<div class="entry-card-metrics">' + metricsHtml + '</div>' +
  '</div>';
}

function buildMainDetailCardsHtml_(entryRows) {
  var html = '<div class="entry-card-list">';
  html += entryRows.map(buildEntryDetailCardHtml_).join('');
  html += '</div>';
  html += '<div class="main-detail-hint"><i class="fa-solid fa-filter" style="font-size:9px;margin-right:4px;opacity:0.6;"></i>Click any bonus number to filter the main view</div>';
  return html;
}

function buildEntryDetailRowHtml_(r) {
  var escapedBonus = escapeAttrPak(r.bonus);
  var isActive = selectedBonuses.indexOf(r.bonus) !== -1;
  return '<tr>' +
    '<td>' + safeTextPak(trimTimeLabelPak(r.timeRange)) + '</td>' +
    '<td><span class="clickable-bonus bonus-tip-host' + (isActive ? ' active' : '') + '" onclick="event.stopPropagation();toggleBonusFilter(\'' + escapedBonus + '\')">' +
    multiAreaIconHtmlPak(currentDetailAreaCount[r.bonus]) +
    safeTextPak(r.bonus) +
    osTagHtmlPak_(currentDetailOsMap[r.bonus]) +
    nplTagHtmlPak_(currentDetailNplMap[r.bonus]) +
    ' <i class="fa-solid fa-filter filter-icon"></i>' +
    bonusTipHtmlPak_(r.bonus, isActive) +
    '</span></td>' +
    numTdPak(r.hourDeployed, 2) +
    numTdPak(r.stdHours, 2) +
    mainMetricColumnsActive_().map(function (m) { return numTdPak(r[m.key], 0); }).join('') +
    '<td><span class="pill ' + perfClassPak(r.performance) + '">' + pctPak(r.performance, 0) + '</span></td>' +
    '</tr>';
}

function buildMainDetailTableHtml_(entryRows) {
  var html = '<div class="table-wrap main-detail-table-wrap">';
  html += '<table class="main-detail-table"><thead><tr>';
  var detailCols = filterAreaList_(DETAIL_TABLE_COLUMNS);
  for (var c = 0; c < detailCols.length; c++) {
    var col = detailCols[c];
    var cls = 'detail-sortable';
    if (detailSortState.key === col.key) cls += ' active-sort ' + detailSortState.dir;
    // stopPropagation: the header sits inside the expandable row, and without it
    // the click would bubble up and collapse the row being sorted.
    html += '<th class="' + cls + '" onclick="event.stopPropagation();setDetailSort(\'' + col.key + '\')">' +
            col.label + '</th>';
  }
  html += '</tr></thead><tbody>';
  html += entryRows.map(buildEntryDetailRowHtml_).join('');
  html += '</tbody></table></div>';
  html += '<div class="main-detail-hint"><i class="fa-solid fa-filter" style="font-size:9px;margin-right:4px;opacity:0.6;"></i>Click any bonus number to filter the main view</div>';
  return html;
}

function ensureBonusTimeSelects_() {
  var fromSel = $('bonusFrom');
  var toSel = $('bonusTo');
  if (!fromSel || !toSel) return;

  var sliced = timeRanges.slice(-96);
  var sig = sliced.length ? (sliced[0] + '||' + sliced[sliced.length - 1] + '||' + sliced.length) : '';
  if (fromSel.dataset.sig === sig) return;

  var prevFrom = fromSel.value;
  var prevTo = toSel.value;

  fromSel.innerHTML = '';
  toSel.innerHTML = '';

  for (var i = 0; i < sliced.length; i++) {
    var parts = extractRangePartsPak(sliced[i]);
    var optF = document.createElement('option');
    optF.value = sliced[i];
    optF.textContent = parts.start;
    fromSel.appendChild(optF);

    var optT = document.createElement('option');
    optT.value = sliced[i];
    optT.textContent = parts.end;
    toSel.appendChild(optT);
  }

  fromSel.dataset.sig = sig;

  var fromRestored = false;
  var toRestored = false;
  for (var i = 0; i < sliced.length; i++) {
    if (sliced[i] === prevFrom) { fromSel.selectedIndex = i; fromRestored = true; }
    if (sliced[i] === prevTo) { toSel.selectedIndex = i; toRestored = true; }
  }
  if (!fromRestored || !toRestored || toSel.selectedIndex < fromSel.selectedIndex) {
    fromSel.selectedIndex = Math.max(0, sliced.length - 4);
    toSel.selectedIndex = sliced.length - 1;
  }
}

function onBonusRangeChange() {
  var fromSel = $('bonusFrom');
  var toSel = $('bonusTo');
  if (toSel.selectedIndex < fromSel.selectedIndex) {
    toSel.selectedIndex = fromSel.selectedIndex;
  }
  refreshBonusTables();
}

function refreshBonusTables() {
  var rowsLimit = parseInt($('sharedRowsLimit').value, 10) || 10;
  renderSideTablesPak(rowsLimit);
  saveUserPreferences();
}

// The blocks in which this area was the ONLY thing the operator worked on.
//
// A block split between E3 Packing and OSR PiE cannot be divided honestly
// after the fact: the operator was deployed for one quarter-hour, and the area
// pill was charging that whole quarter to BOTH areas while counting only each
// area's own standard hours in the numerator. Every area that shares its
// people with another therefore read low, and the more the areas mixed the
// worse it got.
//
// So rather than apportion by guesswork, the area's figure is computed from
// the blocks that are unambiguously its own - both halves of the fraction
// describe the same time, and the percentage means what it says.
//
// "Only" means across every entry in VOLUME_TYPES, both buildings.
// scopeRowsToSite_ copies each area field across and only rewrites `value`,
// so a row still carries its out-of-building standard hours - and an hour
// spent in E3 dilutes an E1/E2 percentage exactly as much as an hour spent in
// the next aisle. Same rule, and the same reasoning, as the `pureOnly` pass in
// generatePerfSplitRows_ for the Overall page's work-area groups.
//
// The cost, which is real: an area whose people ALWAYS work it alongside
// something else has no pure blocks, so it has no figure at all rather than a
// misleading one. areaTotalPerformance_ returns null there and the pill is
// simply absent.
function pureAreaRows_(data, stdKey) {
  var others = [];
  for (var i = 0; i < VOLUME_TYPES.length; i++) {
    if (VOLUME_TYPES[i].stdKey !== stdKey) others.push(VOLUME_TYPES[i].stdKey);
  }
  return data.filter(function (r) {
    if ((Number(r[stdKey]) || 0) <= 0) return false;
    for (var o = 0; o < others.length; o++) {
      if ((Number(r[others[o]]) || 0) > 0) return false;
    }
    return true;
  });
}

function computeBonusRows_(data, stdKey) {
  var bonusBlockMap = {};
  data.forEach(function (r) {
    var val = stdKey ? (Number(r[stdKey]) || 0) : (Number(r.value) || 0);
    if (!bonusBlockMap[r.bonus]) bonusBlockMap[r.bonus] = {};
    bonusBlockMap[r.bonus][r.timeRange] = (bonusBlockMap[r.bonus][r.timeRange] || 0) + val;
  });

  var rows = [];
  Object.keys(bonusBlockMap).forEach(function (bonus) {
    var blocks = bonusBlockMap[bonus];
    var totalStandardHours = 0;
    var activeBlocks = 0;
    Object.keys(blocks).forEach(function (blockKey) {
      totalStandardHours += blocks[blockKey];
      if (blocks[blockKey] > 0) activeBlocks++;
    });
    if (stdKey && totalStandardHours <= 0) return;
    var deployedHours = activeBlocks * 0.25;
    rows.push({
      bonus: bonus,
      standardHour: totalStandardHours,
      // Carried so the panel can total the area properly. Recovering it from
      // standardHour and performance divides by zero for anyone at 0%, and
      // averaging the per-operator percentages is a different figure again -
      // it weights a two-block operator the same as a full shift.
      deployedHour: deployedHours,
      performance: deployedHours > 0 ? (totalStandardHours / deployedHours) * 100 : 0
    });
  });
  return rows;
}

function buildBonusRowHtml_(r) {
  var escapedBonus = escapeAttrPak(r.bonus);
  var isActive = selectedBonuses.indexOf(r.bonus) !== -1;
  return '<tr>' +
    '<td><span class="clickable-bonus bonus-tip-host' + (isActive ? ' active' : '') + '" onclick="toggleBonusFilter(\'' + escapedBonus + '\')">' +
    multiAreaIconHtmlPak(currentBonusAreaCount[r.bonus]) +
    safeTextPak(r.bonus) +
    osTagHtmlPak_(currentBonusOsMap[r.bonus]) +
    nplTagHtmlPak_(currentBonusNplMap[r.bonus]) +
    ' <i class="fa-solid fa-filter filter-icon"></i>' +
    bonusTipHtmlPak_(r.bonus, isActive) +
    '</span></td>' +
    '<td class="num">' + numPak(r.standardHour, 1) + '</td>' +
    buildPerfCellHtml_(r.performance) +
    '</tr>';
}

// The productivity cell, with the figure drawn as a bar behind it. These tables
// are a ranking — "who is at the top, who is at the bottom" — and a column of
// numbers makes that a reading exercise, where a bar makes the shape of the
// distribution visible at a glance: whether the top ten are close together or
// one person is far ahead, and how steep the drop-off is.
function buildPerfCellHtml_(performance) {
  var perf = normalizePerfPak(performance);
  // 100% fills the cell. Anything above that is genuinely exceptional and is
  // let run to the full width rather than rescaling every other bar down to
  // accommodate it — the number beside it still says how far above.
  var width = Math.max(0, Math.min(perf, 100));
  var cls = perfClassPak(performance);
  return '<td class="perf-cell">' +
    '<span class="perf-bar ' + cls + '" style="width:' + width.toFixed(1) + '%"></span>' +
    '<span class="pill ' + cls + '">' + Math.round(perf) + '%</span>' +
    '</td>';
}

function buildBonusMiniTable_(rows, metric) {
  var html = '<table class="side-table"><thead><tr>';
  html += '<th class="no-sort">Bonus Number</th>';
  // "Total", because these are the operator's figures across EVERY work area,
  // not this panel's area alone - a person who worked two areas shows the same
  // pair of numbers in both panels. Without the word, the obvious reading is
  // that the column sums to the area's throughput, and it does not.
  html += '<th class="' + (metric === 'standardHour' ? 'active-sort' : '') + '" onclick="setSideTableSort(\'standardHour\')">Total Std Hrs</th>';
  html += '<th class="' + (metric === 'performance' ? 'active-sort' : '') + '" onclick="setSideTableSort(\'performance\')">Total Prod %</th>';
  html += '</tr></thead><tbody>';
  html += rows.length
    ? rows.map(buildBonusRowHtml_).join('')
    : '<tr class="bonus-empty-row"><td colspan="3">None in selected range</td></tr>';
  html += '</tbody></table>';
  return html;
}

// The area's productivity over the selected window, as one figure: total
// standard hours earned divided by total hours deployed. Summing both sides
// before dividing is the whole point - the mean of the per-operator
// percentages would weight somebody who worked two blocks the same as somebody
// who worked the entire window, and read differently from the charts, which
// total first. Returns null when nobody was deployed, since 0% would claim
// the area ran badly rather than not at all.
function areaTotalPerformance_(rows) {
  var std = 0, dep = 0;
  for (var i = 0; i < rows.length; i++) {
    std += Number(rows[i].standardHour) || 0;
    dep += Number(rows[i].deployedHour) || 0;
  }
  return dep > 0 ? (std / dep) * 100 : null;
}

// The two tables split the panel's operators at one figure: above it
// Productive, at it or below it Unproductive. Every operator lands in exactly
// one, and none is left out of both.
//
// That was not true before. The old pair of rules tested the BADGE colour -
// red kept out of Productive, green kept out of Unproductive - and the badge
// has three bands where the tables have two, so the middle band belonged to
// neither rule and fell into both: every operator between 60% and 79% was
// listed twice on the same panel, in tables with opposite headings. Below 60%
// the reverse happened. The lower bound on Unproductive was the live threshold
// (0.15 std hrs per block, which is 60% expressed as a percentage), so anybody
// under it was dropped from Unproductive while the red-badge rule kept them
// out of Productive - they counted toward "N heads" and then appeared nowhere.
// The worst performers in the building were the ones missing.
//
// A single comparison replaces both rules and subsumes what they were for: no
// row above the split can carry a red badge (red ends at 60), and none at or
// below it can carry a green one (green starts at 80), so the tables still
// cannot contradict the colour beside them. It also retires the OS exception
// that used to be needed here - an operator who spent the period on indirect
// work sits at 0% and is now simply Unproductive, which is where the OS tag
// beside their name explains the figure.
var BONUS_TABLE_SPLIT_PCT = 60;

function buildBonusPanel_(title, allRows, rowsLimit, reorderKey, areaPerfOverride) {
  var metric = sideSortMetric;

  // Compared on the ROUNDED figure, the one actually printed in the cell.
  // Against the raw value, an operator on 60.2% would sit in Productive under
  // a badge reading "60%" - and the rule people have been given is about the
  // number they can see, not the fourteen decimal places behind it.
  var isProductive = function (r) {
    return Math.round(normalizePerfPak(r.performance)) > BONUS_TABLE_SPLIT_PCT;
  };

  var topRows = allRows
    .slice()
    .filter(isProductive)
    .sort(function (a, b) { return b[metric] - a[metric]; })
    .slice(0, rowsLimit);

  var underRows = allRows
    .filter(function (r) { return !isProductive(r); })
    .sort(function (a, b) { return a[metric] - b[metric]; })
    .slice(0, rowsLimit);

  // Tagged for the rearrange feature. Only in By Work Area mode: Overall mode
  // renders a single panel, and there is nothing to reorder against.
  var reorderAttrs = reorderKey
    ? ' data-reorder-key="bonus-' + escapeAttrPak(reorderKey) + '"' +
      ' data-reorder-label="' + escapeAttrPak(title) + '"'
    : '';
  var html = '<div class="card panel"' + reorderAttrs + '>';
  // The area's own productivity, beside its name: the two tables below rank
  // operators against each other, and neither says how the area did overall.
  // Handed in by the caller in By Work Area mode, where it is the AREA's own
  // figure and can no longer be recovered from allRows - those rows carry each
  // person's total across every area. Overall mode has no single area to
  // describe and falls back to totalling the rows, where the two agree.
  var areaPerf = (areaPerfOverride !== undefined)
    ? areaPerfOverride
    : areaTotalPerformance_(allRows);
  // Titled, because this figure now equals neither the column beneath it nor
  // what the pill used to read: it is the area's own productivity over the
  // blocks that were only ever the area's, while the rows are each person's
  // total across everywhere they worked. Two different questions, and without
  // a word of explanation the gap between them reads as an error.
  var areaPerfHtml = (areaPerf === null) ? '' :
    '<span class="pill ' + perfClassPak(areaPerf) + '"' +
    ' title="Standard hours over time deployed, counting only blocks worked' +
    ' solely in this area">' +
    Math.round(normalizePerfPak(areaPerf)) + '%</span>';
  html += '<div class="mini-table-title' + (areaPerfHtml ? ' has-area-perf' : '') +
          '"><h2>' + safeTextPak(title) + '</h2>' +
          areaPerfHtml +
          '<span class="tag">' + allRows.length + ' head' + (allRows.length !== 1 ? 's' : '') + '</span></div>';
  html += '<div class="bonus-two-tables">';
  html += '<div><div class="bonus-table-caption good"><i class="fa-solid fa-arrow-trend-up"></i> Productive</div>';
  html += '<div class="table-wrap">' + buildBonusMiniTable_(topRows, metric) + '</div></div>';
  html += '<div><div class="bonus-table-caption bad"><i class="fa-solid fa-arrow-trend-down"></i> Unproductive</div>';
  html += '<div class="table-wrap">' + buildBonusMiniTable_(underRows, metric) + '</div></div>';
  html += '</div></div>';
  return html;
}

// All / single-area only / multi-area only. Purely a display filter over rows
// that are already computed, so nothing is recalculated and no figure moves -
// the same person's total is the same number whether or not their neighbours
// are on screen. Not mirrored to the head breakdown's copy: see the comment on
// bonusAreaCountFilter in JsState.
function setBonusAreaCountFilter(mode) {
  bonusAreaCountFilter = mode;
  renderBonusAreaCountSelect_();
  refreshBonusTables();
}

// Writes the dropdown's options and selects the live one. Called on every
// bonus render as well as on change, because the tour sets
// bonusAreaCountFilter directly and a select left showing the old choice while
// the tables are filtered by the new one is the worst of both.
function renderBonusAreaCountSelect_() {
  var sel = $('bonusAreaCount');
  if (!sel) return;
  sel.innerHTML = areaCountFilterOptionsHtmlPak_(bonusAreaCountFilter);
  sel.value = bonusAreaCountFilter;
}

function toggleBonusArea(key) {
  toggleAreaKeyPak_(hiddenBonusAreas, key);

  if (syncAreaChips) {
    mirrorHiddenAreasPak_('bonus');
    // Volume has to change too, and it is not the page in front of the user.
    // applyLocalFiltersPak marks every page dirty, so Volume is rebuilt when
    // they get to it, and saves preferences on the way out.
    applyLocalFiltersPak();
    return;
  }

  refreshBonusTables();
}

// Same path as toggleBonusArea above, including the sync branch.
function setAllBonusAreas(show) {
  setAllAreaKeysPak_(hiddenBonusAreas, show);

  if (syncAreaChips) {
    mirrorHiddenAreasPak_('bonus');
    applyLocalFiltersPak();
    return;
  }

  refreshBonusTables();
}

function renderBonusAreaToggles_(mode) {
  renderAreaToggleChips_({
    containerId: 'bonusAreaToggles',
    // Shown in both modes now. Overall mode gets the multi-area filter on its
    // own - it applies to that table too, and hiding its only control would
    // leave a narrowed table with nothing on screen to explain it.
    visible: true,
    areaChips: mode === 'area',
    hiddenKeys: hiddenBonusAreas,
    orderKeys: (typeof areaKeyOrderForZone_ === 'function') ? areaKeyOrderForZone_('bonus') : null,
    onToggle: 'toggleBonusArea',
    onSetAll: 'setAllBonusAreas'
    // No countFilter here any more: it is a dropdown up in bonus-page-controls,
    // beside Display Mode and Rows. The breakdown still passes one, and still
    // gets the chip.
  });
  renderBonusAreaCountSelect_();
}

function renderSideTablesPak(rowsLimit) {
  var container = $('bonusTablesContainer');
  if (!container) return;

  ensureBonusTimeSelects_();

  var fromSel = $('bonusFrom');
  var toSel = $('bonusTo');
  var sliced = timeRanges.slice(-96);

  var fromIdx = fromSel.selectedIndex;
  var toIdx = toSel.selectedIndex;
  if (fromIdx < 0) fromIdx = Math.max(0, sliced.length - 4);
  if (toIdx < fromIdx) toIdx = fromIdx;

  var selectedSlice = sliced.slice(fromIdx, toIdx + 1);
  var selectedSet = {};
  for (var i = 0; i < selectedSlice.length; i++) { selectedSet[selectedSlice[i]] = true; }

  var badge = $('bonusRangeBadge');
  if (badge) {
    var blockCount = selectedSlice.length;
    var minutes = blockCount * 15;
    badge.textContent = blockCount + ' block' + (blockCount !== 1 ? 's' : '') + ' · ' + hoursLabelPak_(minutes);
  }

  var windowData = rawSideData.filter(function (r) { return selectedSet[r.timeRange]; });

  // Drives the multi-area marker in buildBonusRowHtml_. Computed once here over
  // the whole window rather than per panel: the panels are per work area, so a
  // panel's own rows can never tell you that someone also worked elsewhere.
  currentBonusAreaCount = bonusAreaCountMapPak(windowData);
  currentBonusOsMap = bonusOsMapPak_(windowData);
  currentBonusNplMap = bonusNplMapPak_(windowData);

  var modeSel = $('bonusViewMode');
  var mode = modeSel ? modeSel.value : 'overall';
  container.className = 'bonus-tables-grid' + (mode === 'overall' ? ' overall' : '');

  renderBonusAreaToggles_(mode);

  var html = '';
  if (mode === 'area') {
    // volumeTypesActive_(), not VOLUME_TYPES: these panels follow the building
    // filter, exactly as the chips above them do. Iterating the raw list put an
    // E3 panel on the E1/E2 page - scopeRowsToSite_ keeps an operator who
    // worked in THIS building but copies every area key across, so one person
    // who worked both buildings still carries their E3 standard hours, and an
    // area that has no chip and cannot be turned off rendered a panel from
    // them.
    var inScope = volumeTypesActive_();

    // Every person's figures, totalled across every area, computed ONCE.
    //
    // This is the whole of the fix. These panels used to call
    // computeBonusRows_(windowData, t.stdKey), which charges a full 0.25 h of
    // deployment for any block the area saw standard hours in - so somebody
    // who split one block between two areas was billed 0.5 h of deployment
    // for 0.25 h of real time, once in each panel, and both panels understated
    // them. There is no honest way to divide a block between areas after the
    // fact, so the figure stops being per-area: a person has one set of
    // standard hours and one productivity % for the period, and a panel says
    // who worked in that area rather than recomputing their number.
    var totalRows = computeBonusRows_(windowData, null);
    var totalsByBonus = {};
    for (var tr = 0; tr < totalRows.length; tr++) {
      totalsByBonus[totalRows[tr].bonus] = totalRows[tr];
    }

    for (var v = 0; v < inScope.length; v++) {
      var t = inScope[v];
      if (hiddenBonusAreas.indexOf(t.key) !== -1) continue;

      // Who worked here at all. Standard hours rather than volume, matching
      // what the panel's own pill measures, and ANY block qualifies - one
      // block in an area is still having worked in it.
      var members = {};
      for (var w = 0; w < windowData.length; w++) {
        if ((Number(windowData[w][t.stdKey]) || 0) > 0) members[windowData[w].bonus] = true;
      }

      var rows = [];
      var memberNames = Object.keys(members);
      for (var m = 0; m < memberNames.length; m++) {
        var totalRow = totalsByBonus[memberNames[m]];
        if (totalRow) rows.push(totalRow);
      }
      rows = filterByAreaCountPak_(rows, currentBonusAreaCount, bonusAreaCountFilter);
      if (rows.length === 0) continue;

      // The pill keeps the per-area calculation the rows just gave up, and
      // that is deliberate: it is the one number on the panel that genuinely
      // describes the AREA rather than the people in it. It will not equal the
      // sum of the column beneath it, which is why that column is headed
      // "Total Std Hrs".
      //
      // Computed over this area's PURE blocks only - see pureAreaRows_. The
      // rows beneath are still everybody who worked here, so the head count
      // and the pill answer two different questions on purpose: who was in
      // this area, and how the area performed in the time that was only ever
      // its own.
      var areaPerf = areaTotalPerformance_(
        computeBonusRows_(pureAreaRows_(windowData, t.stdKey), t.stdKey));
      html += buildBonusPanel_(t.label, rows, rowsLimit, t.key, areaPerf);
    }
    if (!html) {
      html = '<div class="card panel bonus-empty-panel"><i class="fa-solid ' +
             (selectedBonuses.length > 0 ? 'fa-filter"></i>No activity for the bonus number(s) you are filtering by'
                                         : 'fa-ghost"></i>No activity in the selected range') + '</div>';
    }
  } else {
    var overallRows = filterByAreaCountPak_(
      computeBonusRows_(windowData, null), currentBonusAreaCount, bonusAreaCountFilter);
    html = buildBonusPanel_('All Work Areas', overallRows, rowsLimit);
  }

  container.innerHTML = html;

  // These panels are rebuilt from an HTML string on every render, so a saved
  // order has to be re-applied each time rather than once at startup.
  if (typeof refreshDynamicReorderZone_ === 'function') refreshDynamicReorderZone_();
}

function setSideTableSort(metric) {
  sideSortMetric = metric;
  refreshBonusTables();
}
</script>
