<style>
:root {
  /* Tells the browser which way this document leans, so the parts it draws
     itself follow the theme: the popup list a <select> opens, the caret and
     focus ring inside form controls, the default canvas colour behind the page,
     and scrollbars anywhere our own rules do not reach. Without it those all
     stayed light while the dashboard around them went dark — most obvious on a
     phone, where every dropdown opens as a full-height native picker.

     Bound to the app's own toggle rather than to prefers-color-scheme, so it
     tracks the theme button rather than the operating system.

     Unlike <meta name="theme-color">, this works inside the Apps Script iframe:
     color-scheme applies per document, whereas theme-color is only honoured on
     the top-level one. */
  color-scheme: light;

  /* NEXT design system (Material 3 --mat-sys-* palette), light = default.
     Dark theme lives under .dark-theme on <html>. */
  --bg: #f5f5f5;                    /* --mat-sys-background */
  --panel: #ffffff;                 /* --mat-sys-surface */
  --border: #c3c7c7;                /* --mat-sys-outline-variant */
  --text: rgba(0, 0, 0, 0.87);      /* --mat-sys-on-surface */
  --muted: #434848;                 /* --mat-sys-on-surface-variant */
  --accent: #007a7a;                /* --mat-sys-primary (teal) */
  --accent-contrast: #ffffff;       /* text on accent */
  --color-good: #3c6939;            /* --mat-sys-success */
  --color-warn: #cc4b00;            /* --mat-sys-warning */
  --color-bad: #d32f2f;             /* --mat-sys-error */
  /* App bar, from the WHDS template (Theme.html appBar/appBarText). The bar was
     black in BOTH themes; the template's is the surface colour - white on light,
     #1d1d1d on dark - so it reads as part of the page rather than a band across
     the top of it. Every colour the bar needs is a token, so reverting to the
     black bar is one line here and one under .dark-theme. */
  --header-bg: #ffffff;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.10);
  --radius-card: 8px;

  /* Solid + soft status pairs, from the WHDS template's Theme.html. These are
     deliberately IDENTICAL in both themes - a status tint carries meaning, and
     the template holds it fixed so "good" reads the same shade on either
     surface. That is why they sit here and are not restated under .dark-theme.

     The soft variant is the solid one at 12% - enough to tint a chip's
     background without competing with the figure printed on it. Note
     --status-bad-solid is NOT --color-bad: the template pairs its chips with a
     deeper red (#b3261e) than the one it uses for text and icons. */
  --status-good-solid: #3c6939;
  --status-good-soft:  rgba(60, 105, 57, 0.12);
  --status-warn-solid: #cc4b00;
  --status-warn-soft:  rgba(204, 75, 0, 0.12);
  --status-bad-solid:  #b3261e;
  --status-bad-soft:   rgba(179, 38, 30, 0.12);

  --w2: rgba(0, 0, 0, 0.02);
  --w3: rgba(0, 0, 0, 0.03);
  --w4: rgba(0, 0, 0, 0.04);
  --w5: rgba(0, 0, 0, 0.05);
  --w6: rgba(0, 0, 0, 0.06);
  --w7: rgba(0, 0, 0, 0.06);
  --w8: rgba(0, 0, 0, 0.08);
  --w10: rgba(0, 0, 0, 0.09);
  --w12: rgba(0, 0, 0, 0.10);
  --w15: rgba(0, 0, 0, 0.12);
  --w25: rgba(0, 0, 0, 0.18);

  --surface-dropdown: #ffffff;
  --surface-dropdown-2: #f6f3f2;    /* --mat-sys-surface-container-low */
  --surface-solid: #ffffff;
  --surface-solid-0: rgba(255, 255, 255, 0);
  --surface-elevated: #ffffff;
  --surface-panel-strong: #f0edec;  /* --mat-sys-surface-container */
  --tour-tip-bg: #ffffff;

  --text-soft-95: rgba(0, 0, 0, 0.87);
  --text-soft-40: rgba(0, 0, 0, 0.40);

  --tour-mask: rgba(0, 0, 0, 0.45);
  --control-bg: #ffffff;

  /* Data Table frozen columns. A pinned cell has to be opaque, so the row-hover
     and expanded-row tints are pre-blended against --panel here rather than
     layered as alpha — otherwise a hovered row would look striped where the
     frozen columns meet the scrolling ones. */

  /* Edge cue for horizontally scrollable tables. */
  --scroll-shadow: rgba(0, 0, 0, 0.28);

  /* Sorted column header. The solid variant is the translucent one pre-blended
     over --surface-dropdown-2, for the two frozen headers, which have to stay
     opaque. */
  --table-sort-bg: rgba(0, 0, 0, 0.06);
  --table-sort-bg-solid: #e7e4e3;

  /* Expanded-row drawer on the Data Table. Light needs far less than dark: on
     white, 5% already separates the drawer from the row above it. */
  --detail-recess: rgba(0, 0, 0, 0.05);

  /* Productivity bars on the Bonus tables. Faint enough to sit behind the
     figure without competing with it — the bar is for the shape of the
     ranking, the number is still what you read. */
  --perf-bar-good: rgba(60, 105, 57, 0.16);
  --perf-bar-warn: rgba(204, 75, 0, 0.16);
  --perf-bar-bad: rgba(211, 47, 47, 0.14);

  /* Precomputed alpha tints. Defined per theme instead of using color-mix(),
     which html2canvas cannot parse — it made image export fail entirely. */
  /* Accent tints, one per alpha actually used in this file. These are the
     AUTHORED values; applyConfigToCSSPak overwrites them at runtime from
     APP_CONFIG.colors.accent so a tint can never disagree with the accent it is
     supposed to be a tint OF. They stay here as the pre-JS fallback. */
  --accent-4: rgba(0, 122, 122, 0.04);
  --accent-7: rgba(0, 122, 122, 0.07);
  --accent-8: rgba(0, 122, 122, 0.08);
  --accent-10: rgba(0, 122, 122, 0.10);
  --accent-14: rgba(0, 122, 122, 0.14);
  --accent-15: rgba(0, 122, 122, 0.15);
  --accent-18: rgba(0, 122, 122, 0.18);
  --accent-20: rgba(0, 122, 122, 0.20);
  --accent-22: rgba(0, 122, 122, 0.22);
  --accent-25: rgba(0, 122, 122, 0.25);
  --accent-28: rgba(0, 122, 122, 0.28);
  --accent-30: rgba(0, 122, 122, 0.30);
  --accent-35: rgba(0, 122, 122, 0.35);
  --accent-40: rgba(0, 122, 122, 0.40);
  --accent-45: rgba(0, 122, 122, 0.45);
  --accent-55: rgba(0, 122, 122, 0.55);
  --accent-65: rgba(0, 122, 122, 0.65);
  --accent-75: rgba(0, 122, 122, 0.75);
  --accent-95: rgba(0, 122, 122, 0.95);
  --good-14: rgba(60, 105, 57, 0.14);
  --bad-14: rgba(211, 47, 47, 0.14);
}

.dark-theme {
  color-scheme: dark;

  --bg: #121212;
  --panel: #1e1e1e;                 /* --mat-sys-surface */
  --border: rgba(255, 255, 255, 0.23);
  --text: rgba(255, 255, 255, 0.92);
  --muted: rgba(255, 255, 255, 0.70);
  --accent: #009393;
  --accent-contrast: #ffffff;
  --color-good: #a1d399;
  --color-warn: #ff9d5c;
  --color-bad: #f44336;
  --header-bg: #1d1d1d;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.45);
  --radius-card: 8px;

  --w2: rgba(255, 255, 255, 0.02);
  --w3: rgba(255, 255, 255, 0.03);
  --w4: rgba(255, 255, 255, 0.04);
  --w5: rgba(255, 255, 255, 0.05);
  --w6: rgba(255, 255, 255, 0.06);
  --w7: rgba(255, 255, 255, 0.07);
  --w8: rgba(255, 255, 255, 0.08);
  --w10: rgba(255, 255, 255, 0.10);
  --w12: rgba(255, 255, 255, 0.12);
  --w15: rgba(255, 255, 255, 0.15);
  --w25: rgba(255, 255, 255, 0.25);

  --surface-dropdown: #2c272d;      /* --mat-sys-surface-container */
  --surface-dropdown-2: #2c272d;
  --surface-solid: #1e1e1e;
  --surface-solid-0: rgba(30, 30, 30, 0);
  --surface-elevated: #2c272d;
  --surface-panel-strong: #1b211e;  /* --mat-sys-surface-container-high */
  --tour-tip-bg: #1e1e1e;

  --text-soft-95: rgba(255, 255, 255, 0.95);
  --text-soft-40: rgba(255, 255, 255, 0.40);

  --tour-mask: rgba(0, 0, 0, 0.62);
  --control-bg: #2c272d;


  --scroll-shadow: rgba(0, 0, 0, 0.6);

  --table-sort-bg: rgba(255, 255, 255, 0.10);
  --table-sort-bg-solid: #413d42;

  --detail-recess: rgba(0, 0, 0, 0.22);

  --perf-bar-good: rgba(161, 211, 153, 0.18);
  --perf-bar-warn: rgba(255, 157, 92, 0.18);
  --perf-bar-bad: rgba(244, 67, 54, 0.20);

  --accent-4: rgba(0, 147, 147, 0.04);
  --accent-7: rgba(0, 147, 147, 0.07);
  --accent-8: rgba(0, 147, 147, 0.08);
  --accent-10: rgba(0, 147, 147, 0.10);
  --accent-14: rgba(0, 147, 147, 0.14);
  --accent-15: rgba(0, 147, 147, 0.15);
  --accent-18: rgba(0, 147, 147, 0.18);
  --accent-20: rgba(0, 147, 147, 0.20);
  --accent-22: rgba(0, 147, 147, 0.22);
  --accent-25: rgba(0, 147, 147, 0.25);
  --accent-28: rgba(0, 147, 147, 0.28);
  --accent-30: rgba(0, 147, 147, 0.30);
  --accent-35: rgba(0, 147, 147, 0.35);
  --accent-40: rgba(0, 147, 147, 0.40);
  --accent-45: rgba(0, 147, 147, 0.45);
  --accent-55: rgba(0, 147, 147, 0.55);
  --accent-65: rgba(0, 147, 147, 0.65);
  --accent-75: rgba(0, 147, 147, 0.75);
  --accent-95: rgba(0, 147, 147, 0.95);
  --good-14: rgba(161, 211, 153, 0.14);
  --bad-14: rgba(244, 67, 54, 0.14);
}
/* === end theme tokens === */

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#loadingOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  color: var(--text);
}

#loadingOverlay.active {
  opacity: 1;
  pointer-events: all;
}

#loadingOverlay i {
  font-size: 48px;
  color: var(--accent);
}

.wrap {
  width: 100%;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ============================================================
   NEXT chrome — black top header, left icon rail, main column
   ============================================================ */
.next-header {
  flex: 0 0 auto;
  height: 64px;
  background: var(--header-bg);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 20px;
  box-shadow: rgba(0, 0, 0, 0.19) 0 1px 2px, rgba(0, 0, 0, 0.12) 0 1px 3px 1px;
  z-index: 1000;
  position: relative;
}
/* Desktop: collapse the left/right wrappers so brand, meta, controls and
   actions are all direct flex children of the header on one row. The brand's
   auto right-margin pushes everything after it (meta + controls + actions) to
   the right edge, so status/last-update sit on the right in web view. */
.next-header-left,
.next-header-right {
  display: contents;
}
.next-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  margin-right: auto;
}
.next-header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.72);
  white-space: nowrap;
}
/* Sits first in the row, ahead of the status. Empty most of the time, and the
   flex gap would otherwise still reserve space for it, leaving the status
   pushed off its natural position by a blank element. */
.next-header-meta .note-text { color: #ff9d5c; font-weight: 600; }
.next-header-meta .note-text:empty { display: none; }
/* Retry affordance shown next to a failed-load status message. */
.status-retry-btn {
  margin-left: 6px;
  padding: 2px 10px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 999px;
  cursor: pointer;
}
.status-retry-btn:hover { filter: brightness(1.1); }

/* Shared empty state (main table, and the look other empty panels follow). */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 42px 20px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.empty-state i {
  font-size: 26px;
  opacity: 0.35;
}

/* KPI change vs the previous hour. */
.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  white-space: nowrap;
  line-height: 1.4;
}
.kpi-trend.up { color: var(--color-good); background: var(--good-14); }
.kpi-trend.down { color: var(--color-bad); background: var(--bad-14); }
.kpi-trend.flat { color: var(--muted); background: var(--w6); }
.kpi-trend i { font-size: 9px; }

/* Auto-refresh countdown in the header meta row. */
.refresh-countdown {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
  white-space: nowrap;
}
.header-icon-btn.paused { color: var(--color-warn); }

/* ── Skeleton loading ──────────────────────────────────────────────────────
   Shown on a COLD first load only (a returning user is painted instantly from
   the localStorage cache instead). Placeholders mirror the real layout so the
   page doesn't visibly jump when the data lands. */
@keyframes skelShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
body.loading-skeleton .kpi .value,
body.loading-skeleton #thresholdDisplay {
  color: transparent !important;
  border-radius: 6px;
  background-image: linear-gradient(90deg, var(--w6) 25%, var(--w12) 37%, var(--w6) 63%);
  background-size: 200% 100%;
  animation: skelShimmer 1.4s ease-in-out infinite;
  min-width: 64px;
  display: inline-block;
}
body.loading-skeleton .kpi-trend { display: none !important; }
/* Cover each chart panel with a shimmering block while the canvas is empty. */
body.loading-skeleton .charts .card.panel { position: relative; min-height: 220px; }
body.loading-skeleton .charts .card.panel::after {
  content: '';
  position: absolute;
  left: 14px; right: 14px; top: 52px; bottom: 14px;
  border-radius: 8px;
  background-image: linear-gradient(90deg, var(--w4) 25%, var(--w10) 37%, var(--w4) 63%);
  background-size: 200% 100%;
  animation: skelShimmer 1.4s ease-in-out infinite;
}
body.loading-skeleton canvas { visibility: hidden; }

/* ── Skeletons on the other three pages ──────────────────────────────────────
   Only the Overall page had them, so switching to Volume, Bonus or the Data
   Table during a load — or landing on one via a deep link — showed a blank
   area with nothing to say whether it was still loading or simply empty.

   Volume gets the same panel treatment as the Overall charts. Its canvases are
   already hidden by the global rule above; this adds the shimmer over them. */
body.loading-skeleton .vol-chart-panel {
  position: relative;
  min-height: 220px;
}

body.loading-skeleton .vol-chart-panel::after {
  content: '';
  position: absolute;
  left: 14px;
  right: 14px;
  top: 52px;
  bottom: 14px;
  border-radius: 8px;
  background-image: linear-gradient(90deg, var(--w4) 25%, var(--w10) 37%, var(--w4) 63%);
  background-size: 200% 100%;
  animation: skelShimmer 1.4s ease-in-out infinite;
}

/* Bonus and Data Table build their contents from data, so on a FIRST load these
   containers are genuinely empty and have no height to overlay — hence the
   min-height. On a reload they already hold the previous render, which is why
   the children are hidden: the shimmer tint is translucent, and old rows
   showing through a loading state would read as current data. */
body.loading-skeleton #bonusTablesContainer,
body.loading-skeleton #mainTableWrapper {
  position: relative;
  min-height: 320px;
}

body.loading-skeleton #bonusTablesContainer > *,
body.loading-skeleton #mainTableWrapper > * {
  visibility: hidden;
}

/* Absolute, so it is taken out of flow and does not become an extra cell in
   the Bonus page's grid. */
body.loading-skeleton #bonusTablesContainer::after,
body.loading-skeleton #mainTableWrapper::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  border-radius: 12px;
  background-image: linear-gradient(90deg, var(--w4) 25%, var(--w10) 37%, var(--w4) 63%);
  background-size: 200% 100%;
  animation: skelShimmer 1.4s ease-in-out infinite;
}

/* The controls above each page stay live throughout — they are driven by the
   user, not by the payload, and greying them out would suggest otherwise. */

@media (prefers-reduced-motion: reduce) {
  body.loading-skeleton .kpi .value,
  body.loading-skeleton #thresholdDisplay,
  body.loading-skeleton .charts .card.panel::after,
  body.loading-skeleton .vol-chart-panel::after,
  body.loading-skeleton #bonusTablesContainer::after,
  body.loading-skeleton #mainTableWrapper::after {
    animation: none;
  }
}

/* Pipeline-stall warning in the header meta row. */
.stale-warning {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(204, 75, 0, 0.16);
  color: #ff9d5c;
  font-weight: 600;
  white-space: nowrap;
}
/* The NEXT wordmark, inlined as SVG. currentColor rather than the file's own
   white, so it follows the header's text colour instead of assuming the bar
   will always be black. */
.next-logo {
  display: inline-flex;
  align-items: center;
  color: #fff;
  text-decoration: none;
  line-height: 1;
  transition: filter 0.15s ease, transform 0.15s ease;
}

.next-logo svg {
  height: 19px;
  /* Width follows the 100:24 viewBox rather than being fixed, so the mark
     cannot be stretched if the height is ever changed. */
  width: auto;
  display: block;
}
.next-logo:hover {
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
  transform: scale(1.03);
}
.next-header-divider {
  width: 1px;
  height: 26px;
  background: rgba(255, 255, 255, 0.35);
  flex: 0 0 auto;
}
.next-header-title {
  margin: 0;
  font-size: 22px;
  font-weight: 200;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Building picker ────────────────────────────────────────────────────────
   The h1 is a plain wrapper; the button inside it carries the look the title
   used to have, so nothing about the header's measured layout changes. */
.next-header-h1 {
  margin: 0;
  min-width: 0;
  display: flex;
}
.site-picker-btn {
  display: inline-flex;
  align-items: center;
  /* Deliberately tight. Every pixel of padding, gap and caret comes straight
     out of the title, which is already the first thing to be squeezed as the
     header fills up - and "Elmsall Live Productivity" is the longest of the
     three names. At 4px/8px this clipped it to "Elmsall Live Productivit…" on
     a 1280 desktop. */
  gap: 5px;
  /* min-width, NOT max-width: 100%. The percentage resolved against the h1's
     content box while the button's own padding sat outside it, so the title was
     handed its natural width minus one padding and clipped by exactly 5px at
     every viewport - "Elmsall Live Productivit…" even with room to spare.
     min-width: 0 lets it shrink when space really is short, which is what the
     header's collapse logic is measuring for. */
  min-width: 0;
  padding: 3px 5px;
  margin-left: -5px;         /* keeps the title's text optically where it was */
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  transition: background 0.15s;
}
.site-picker-btn:hover,
.site-picker-btn:focus-visible { background: rgba(255, 255, 255, 0.12); }
.site-picker-caret {
  font-size: 10px;
  width: 10px;
  text-align: center;
  opacity: 0.65;
  flex: 0 0 auto;
  transition: transform 0.18s;
}
.site-picker-btn[aria-expanded="true"] .site-picker-caret { transform: rotate(180deg); }

/* A filtered view is not the default, so the title carries a marker rather
   than relying on the reader noticing which of three similar names it says. */
.site-picker-btn.filtered .next-header-title { font-weight: 400; }
/* A bonus filter has forced the whole site: the marker dot would otherwise
   say "filtered to a building" while the title says Elmsall. */
.site-picker-btn.site-overridden .site-picker-caret { opacity: 0.35; }
.site-picker-btn.site-overridden::after { display: none; }

.site-picker-btn.filtered::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent, #69a7ff);
  flex: 0 0 auto;
}

.site-menu {
  /* Anchored to the HEADER, not to the brand: the brand is a 36px row centred
     in a 64px bar, so hanging the menu off it left the menu overlapping the
     black bar by the difference. top:100% of the header is the bar's bottom
     edge, whatever height it is on the day. */
  position: absolute;
  top: 100%;
  left: 20px;              /* matches the header's own horizontal padding */
  margin-top: 6px;
  z-index: 120;
  display: none;
  min-width: 232px;
  padding: 6px;
  border: 1px solid var(--w12, rgba(255, 255, 255, 0.12));
  border-radius: 12px;
  background: var(--surface-dropdown, #1c1f26);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}
.site-menu.open { display: block; }
.site-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text, #e9edf5);
  font: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.site-menu-item:hover,
.site-menu-item:focus-visible { background: var(--w8, rgba(255, 255, 255, 0.08)); }
.site-menu-item .site-menu-check {
  width: 14px;
  flex: 0 0 auto;
  opacity: 0;
  font-size: 12px;
  color: var(--accent, #69a7ff);
}
.site-menu-item[aria-selected="true"] .site-menu-check { opacity: 1; }
.site-menu-item[aria-selected="true"] { font-weight: 600; }
.site-menu-sub {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted, rgba(233, 237, 245, 0.6));
}

/* On a phone the menu is full-width under the header rather than a small
   floating card - a 232px popover anchored to a title that itself spans most
   of the screen reads as detached from it. */
@media (max-width: 768px) {

.next-header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.next-header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
/* Inputs sitting on the black bar: translucent light fields. */
.next-header .input,
.next-header #datePickerBtn {
  background: rgba(255, 255, 255, 0.12) !important;
  color: #fff !important;
  border: 1px solid rgba(255, 255, 255, 0.22);
  height: 36px;
}
.next-header .input::placeholder { color: rgba(255, 255, 255, 0.7); }
.next-header #datePickerBtn { min-width: 150px; max-width: 200px; }
.next-header .input:focus { border-color: rgba(255, 255, 255, 0.55); }
.next-header .search-input-wrap .fa-search { color: rgba(255, 255, 255, 0.7); }

.header-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 9999px;
  border: none;
  background: transparent;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
  flex: 0 0 auto;
}
.header-icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
.header-icon-btn i { font-size: 19px; }

.app-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}
.next-rail {

.next-rail .rail-item {

.next-rail .rail-item .rail-icon {

.next-rail .rail-item .rail-label {

/* Keyboard users need to see where focus is — the rail items are real

.next-rail .rail-item:focus-visible {

.app-main {

}
@media (max-width: 700px) {
  /* Header reflows into 3 rows:
       [ brand            | actions (buttons) ]
       [ Live + Filter    (controls, one row) ]
       [ status .... last-update   (meta)     ]  */
  .next-header {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "brand    actions"
      "controls controls"
      "meta     meta";
    align-items: center;

    column-gap: 8px;

/* The native control the picker writes through to. Kept in the DOM (it is
   what every other module reads) but never shown. Not display:none - a hidden
   field that still needs a value is more robustly parked off-screen. */
.date-native {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.date-picker { position: relative; margin-right: 8px; }

#datePickerBtn {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 180px;
  max-width: 220px;
  padding: 6px 10px;
  border-radius: 8px;
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.date-picker-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.date-picker-icon { flex: 0 0 auto; font-size: 12px; opacity: 0.85; }
.date-picker-caret {
  flex: 0 0 auto;
  font-size: 10px;
  opacity: 0.7;
  transition: transform 0.15s ease;
}
#datePickerBtn[aria-expanded="true"] .date-picker-caret { transform: rotate(180deg); }
/* Viewing an archived day is a state worth seeing without reading the label -
   it is the difference between "these numbers are still moving" and "this day
   is finished". */
#datePickerBtn.is-history {
  background: rgba(255, 255, 255, 0.22) !important;
  border-color: rgba(255, 255, 255, 0.45);
}

.date-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 120;
  display: none;
  width: 264px;
  padding: 6px;
  border: 1px solid var(--w12, rgba(255, 255, 255, 0.12));
  border-radius: 12px;
  background: var(--surface-dropdown, #1b2230);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
}
.date-menu.open { display: block; }

.date-menu-search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  margin-bottom: 4px;
  border: 1px solid var(--w12, rgba(255, 255, 255, 0.12));
  border-radius: 8px;
  color: var(--muted, rgba(233, 237, 245, 0.6));
}
.date-menu-search:focus-within { border-color: var(--accent, #69a7ff); }
.date-menu-input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text, #e9edf5);
  font: inherit;
  font-size: 13px;
  outline: none;
}

/* A year of archives is a long list, so it scrolls inside the menu rather than
   running off the bottom of the page. */
.date-menu-list { max-height: 320px; overflow-y: auto; }

.date-menu-month {
  position: sticky;
  top: 0;
  padding: 8px 10px 4px;
  background: var(--surface-dropdown, #1b2230);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted, rgba(233, 237, 245, 0.6));
}

.date-menu-item {
  display: flex;
  align-items: center;

  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text, #e9edf5);

  font-size: 13px;

.date-menu-item:hover,

.date-menu-empty {

@media (max-width: 768px) {

.bonus-search-container {
  position: relative;
  width: 250px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.search-row {
  display: flex;
  align-items: stretch;
}

.clear-filter-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  min-width: 36px;
  border: 1px solid rgba(255, 122, 122, 0.25);
  border-right: none;
  background: rgba(255, 122, 122, 0.10);
  color: var(--color-bad);
  border-radius: 10px 0 0 10px;
  cursor: pointer;
  font-size: 12px;
}

.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-input-wrap .input {
  width: 100%;
  padding: 6px 30px 6px 10px;
  border-radius: 0 10px 10px 0;
  font-size: 13px;
}

.search-input-wrap.with-clear .input {
  border-radius: 0 10px 10px 0;
}

.search-input-wrap i.fa-search {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 12px;
}

.search-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--surface-panel-strong);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 2000;

}

.search-dropdown.active {
  display: block;
}

.search-item {

  align-items: center;
  justify-content: space-between;
  gap: 8px;

  cursor: pointer;
  font-size: 13px;

/* `.active` is the keyboard cursor and is kept identical to :hover, so moving
   between the mouse and the arrow keys doesn't change what "the row I am on"

.search-item:hover,
.search-item.active {

}

.search-item-name {

  text-overflow: ellipsis;
  white-space: nowrap;

/* Already part of the filter. Selecting it again removes it, so this is a

/* An unmatched query used to just close the list, which reads as the search

.search-more {

  font-size: 12px;
  color: var(--muted);

.active-filter-banner.active {

.active-filter-clear-btn {

.active-filter-clear-btn:hover {

}

.chip {
  display: inline-flex;
  align-items: center;
  background: var(--accent-15);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  overflow: visible;
}

.chip .remove-chip {
