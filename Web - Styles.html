  flex-direction: column;
  gap: 8px;
}
.tour-menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--w4);
  color: var(--text);
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.tour-menu-item:hover {
  background: var(--w8);
  border-color: var(--accent);
}
.tour-menu-item:active {
  transform: scale(0.99);
}
/* Every section of the Settings dialog is separated the same way, so the rules
   that used to be written three times - once per section - are one rule now.
   :first-child drops the leading divider, which otherwise sat immediately under
   the dialog's own header rule and read as a double line. */
.settings-group {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.settings-group:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.tour-menu-sub {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

/* Two columns rather than a table: the keys are short and fixed-width, the
   descriptions wrap. */
.shortcut-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 14px;
  margin: 0;
  align-items: baseline;
}

.shortcut-list dt {
  white-space: nowrap;
}

.shortcut-list dd {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

kbd {
  display: inline-block;
  min-width: 20px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--surface-dropdown-2);
  color: var(--text);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  line-height: 1.4;
}

/* Nothing here applies to a touchscreen, and listing keys nobody can press
   just pushes the reset button further off the bottom of a phone screen. */
@media (max-width: 700px) {
  .settings-group.settings-shortcuts {
    display: none;
  }
}

/* The checkbox sits on its own line against the label text rather than being
   vertically centred against the whole block: the hint below runs to several
   lines, and centring against all of it floats the box away from the label it
   belongs to. */
.setting-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
}

.setting-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  margin: 0;
  flex-shrink: 0;
  accent-color: var(--accent);
  cursor: pointer;
  /* Line the box up with the cap-height of the label beside it. */
  margin-top: 1px;
}

.setting-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.setting-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.setting-hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.tour-menu-reset-hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.tour-menu-item-num {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tour-menu-item-text {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
.tour-menu-item-title {
  font-size: 14px;
  font-weight: 600;
}
.tour-menu-item-sub {
  font-size: 11.5px;
  color: var(--muted);
}
.tour-menu-item > i {
  color: var(--muted);
  font-size: 12px;
}

/* ============================================================
   Mobile final overrides — intentionally LAST in the cascade.
   Earlier max-width:700px blocks re-impose min-width:130px and larger padding
   on the From/To selects, which (combined with flex-wrap:nowrap) pushed the
   pair off the right edge of the screen and clipped their text.
   ============================================================ */
@media (max-width: 700px) {
  /* From/To: both pairs on one row, fully on-screen, text never clipped.
     The font is deliberately small — showing the whole "dd/mm/yyyy hh:mm"
     value matters more here than type size. */
  .breakdown-time-bar {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 0;
    min-width: 0;
    width: auto;
  }
  .breakdown-time-label {
    font-size: 10px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .time-row .breakdown-time-select,
  .breakdown-time-select {
    flex: 1 1 0;
    width: 100%;
    min-width: 0;
    max-width: none;
    box-sizing: border-box;
    font-size: 10.5px;
    /* Right padding leaves room for the native dropdown arrow so the value
       is never rendered underneath it. */
    padding: 9px 18px 9px 6px;
  }
  .breakdown-range-badge,
  .breakdown-time-sep {
    display: none;
  }
}

@media (max-width: 380px) {
  .breakdown-time-label { font-size: 9px; }
  .time-row .breakdown-time-select,
  .breakdown-time-select {
    font-size: 9.5px;
    padding: 9px 16px 9px 4px;
  }
}

/* ============================================================
   Mobile: reclaim vertical space once the page is scrolled.
   Driven by the `page-scrolled` class that JsUi puts on <body> when the active
   .page is scrolled off the top. Deliberately mobile-only — desktop has room.
   ============================================================ */
@media (max-width: 700px) {
  /* The rail is icons now, so the icon is the ONLY thing left to show - hiding
     it here (which is what this rule used to do, back when the labels stayed
     visible) would empty the rail completely and lose navigation. It shrinks
     instead, which buys back most of the same height. */
  body.page-scrolled .next-rail .rail-item .rail-icon {
    width: 34px;
    height: 22px;
    font-size: 15px;
  }
  body.page-scrolled .next-rail .rail-item {
    gap: 0;
  }
  body.page-scrolled .next-rail {
    padding-top: 5px;
    padding-bottom: 5px;
  }

  /* The active page is marked on the icon, since that is what is on screen.
     It was marked on the label while the label was the visible half. */
  body.page-scrolled .next-rail .rail-item.active .rail-icon {
    background: var(--accent-10);
    color: var(--accent);
  }

  /* The status and last-update line hides too. The stale-data warning and the
     note stay visible — they are exception states worth keeping on screen even
     when space is tight. */
  body.page-scrolled #status,
  body.page-scrolled #lastUpdateText {
    display: none;
  }
}

/* ============================================================
   Mobile: one dropdown text size everywhere.
   The From/To selects were shrunk so a full "dd/mm/yyyy hh:mm" value fits;
   every other dropdown now matches them so the controls read as one set
   instead of two different sizes. Last in the cascade so it overrides the
   earlier 14px mobile rules. Touch targets (min-height) are left alone.
   ============================================================ */
@media (max-width: 700px) {
  .row-select,
  select.input,
  #mainSortSelect,
  #hoursRange,
  #timeWindow,
  #volumeChartMode,
  #bonusViewMode,
  #sharedRowsLimit,
  .breakdown-time-select {
    font-size: 10.5px;
  }
}

@media (max-width: 380px) {
  .row-select,
  select.input,
  #mainSortSelect,
  #hoursRange,
  #timeWindow,
  #volumeChartMode,
  #bonusViewMode,
  #sharedRowsLimit,
  .breakdown-time-select {
    font-size: 9.5px;
  }
}

/* ============================================================
   Mobile: one dropdown size across every page.
   The From/To selects on the Bonus page were already compact, but every other
   dropdown — Hours Range and Time Window on Overall, all three on Volume,
   Display Mode and Rows on Bonus, Sort on the Data Table — carried
   min-height: 44px and roomier padding, so two different control sizes sat on
   screen at once. They now match the From/To pair exactly.

   The header is untouched by construction rather than by exception: every page
   dropdown is .row-select, while the History picker in the black bar is
   .input.header-input and matches none of these selectors.

   #mainSortSelect is named explicitly because an id outranks a class no matter
   how late this block sits, and .bonus-controls .row-select likewise — its
   padding-right: 24px is a two-class selector that would otherwise survive.

   Trade-off worth being explicit about: this drops these controls from a 44px
   touch target to roughly 34px. That is the size the From/To selects have
   always been, which is the basis for matching them, but it is below the usual
   44px guideline.
   ============================================================ */
@media (max-width: 700px) {
  .row-select,
  .bonus-controls .row-select,
  #mainSortSelect {
    /* Identical to .breakdown-time-select below. The generous right padding
       leaves room for the native arrow so a long value is never drawn under it. */
    padding: 9px 18px 9px 6px;
    border-radius: 8px;
    min-height: 0;
    box-sizing: border-box;
  }

  /* The direction toggle shares a row with the sort dropdown, so it shrinks to
     match — a 44px button beside a 34px select reads as a mistake. */
  .main-sort-mobile .icon-btn {
    width: 36px;
    height: 36px;
    min-height: 0;
  }
}

@media (max-width: 380px) {
  .row-select,
  .bonus-controls .row-select,
  #mainSortSelect {
    padding: 9px 16px 9px 4px;
  }
}

/* ============================================================
   Mobile: Live/History dropdown, and the active-filter banner.
   ============================================================ */
@media (max-width: 700px) {
  /* The Live/History select sits beside "Filter by Bonus..." in the header and
     is the same kind of control, so it matches that input rather than the
     smaller size used by the in-page dropdowns. 16px also avoids iOS zooming
     the page when the control is focused. */
  .next-header #datePickerBtn,
  #datePickerBtn {
    font-size: 16px;
  }

  /* Active-filter banner: one row that never grows. Previously the chips
     wrapped, so selecting several bonus numbers pushed the banner taller and
     taller and shoved the page down. They now sit in a horizontally scrollable
     strip, with a fade at the right edge hinting there is more to scroll. */
  .active-filter-banner {
    flex-wrap: nowrap;
    gap: 6px;
    padding: 6px 10px;
    font-size: 11px;
  }
  .active-filter-banner > i {
    font-size: 11px;
  }
  /* Just the count on a phone — the sentence around it costs more room than it
     is worth once the chips themselves say what is filtered. */
  .afb-word {
    display: none;
  }
  .active-filter-banner-text {
    white-space: nowrap;
    flex: 0 0 auto;
    font-size: 12px;
  }
  .active-filter-chips {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1 1 0;
    min-width: 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent 100%);
  }
  .active-filter-chips::-webkit-scrollbar {
    display: none;
  }
  .active-filter-chips .chip {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 11px;
  }
  .active-filter-clear-btn {
    padding: 5px 10px;
    font-size: 11px;
    flex: 0 0 auto;
  }
}

/* ============================================================
   Bonus page + chip refinements
   ============================================================ */

/* The eye / eye-slash icons are different widths, so toggling a chip changed
   its width and reflowed the whole chip block into different rows. Reserving a
   fixed box keeps every chip the same size in both states. */
.bonus-area-chip i {
  width: 1.15em;
  text-align: center;
  flex: 0 0 auto;
}

/* Three equal columns — the bonus number no longer takes half the table.
   Overrides the earlier 50/25/25 rule. */
.side-table th:nth-child(1),
.side-table td:nth-child(1),
.side-table th:nth-child(2),
.side-table td:nth-child(2),
.side-table th:nth-child(3),
.side-table td:nth-child(3) {
  width: 33.33%;
}

/* Compact bonus tables: half the vertical padding of the global th/td rule. */
.side-table th,
.side-table td {
  padding-top: 4px;
  padding-bottom: 4px;
}

/* Desktop keeps label-beside-select; the Rows label is redundant there because
   each option already reads "10 Rows". */
.bonus-control-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bonus-rows-label {
  display: none;
}

@media (max-width: 700px) {
  /* Bonus page controls laid out like the Volume page: label above its
     dropdown, same label size, and the four dropdowns aligned 2 x 2. The two
     wrappers collapse with display:contents so their children become direct
     grid items. */
  .bonus-page-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
    align-items: end;
  }
  .bonus-controls,
  .bonus-page-controls .bonus-time-bar {
    display: contents;
  }
  /* The time bar's own panel styling would show through display:contents. */
  .bonus-page-controls .bonus-time-bar {
    background: none;
    border: 0;
    padding: 0;
  }
  .bonus-control-group,
  .bonus-page-controls .time-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    width: auto;
    min-width: 0;
    flex: initial;
  }
  .bonus-rows-label {
    display: block;
  }
  .bonus-control-group > label,
  .bonus-page-controls .time-row .breakdown-time-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin: 0;
    min-width: 0;
  }
  .bonus-control-group > .row-select,
  .bonus-page-controls .time-row .breakdown-time-select {
    width: 100%;
    min-width: 0;
    max-width: none;
    flex: initial;
  }
  /* Match the Volume page's gap between the controls and the chips. Volume sits
     in a 14px grid with the chips pulled up 4px, giving 10px; this grid's row
     gap is 8px, so 2px of margin closes the difference. Without it the Bonus
     chips sat visibly tighter to their dropdowns than the Volume ones. */
  #bonusAreaToggles {
    grid-column: 1 / -1;
    margin-top: 2px;
  }

  /* Scrolled: shrink the header search controls to claw back space. */
  /* #bonusSearch is targeted by id, not by class: the base mobile rule uses an
     id selector (and !important padding), which outranks any class-based
     override no matter how many classes it chains. */
  body.page-scrolled .next-header-controls #datePickerBtn,
  body.page-scrolled .next-header-controls #bonusSearch {
    height: 30px;
    min-height: 30px !important;
    font-size: 12px;
    padding-top: 4px !important;
    padding-bottom: 4px !important;
  }
  body.page-scrolled .next-header-controls #datePickerBtn {
    min-width: 90px;
    max-width: 120px;
  }
  /* iOS zooms the page when a field under 16px is focused. Restoring 16px on
     focus keeps the shrunken look without triggering that zoom. The date
     control is a button now and cannot zoom; its menu's search field carries
     its own 16px at this width. */
  body.page-scrolled .next-header-controls #bonusSearch:focus {
    font-size: 16px;
  }
}

/* ============================================================
   Desktop: Volume page control alignment.
   Matches the Bonus page, where the display control sits on the left and the
   time controls sit on the right. Scoped to desktop so the mobile 2-per-row
   stacking (where Display Mode already takes its own full-width row) is
   untouched — order:-1 there would jump it above Hours Range / Time Window.
   ============================================================ */
@media (min-width: 701px) {
  .volume-controls .vol-control-group-wide {
    order: -1;
    margin-right: auto;
  }
}

/* ============================================================
   Share dialog
   ============================================================ */
.share-modal { max-width: 560px; }

.share-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
}
.share-note {
  margin: 0 0 8px;
  font-size: 12px;
  color: var(--muted);
}
.share-url-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.share-url-input {
  flex: 1 1 auto;
  min-width: 0;
  font-family: 'Roboto Mono', ui-monospace, monospace;
  font-size: 12px;
}
.share-copy-btn { flex: 0 0 auto; }
.share-img-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.share-divider {
  height: 1px;
  background: var(--border);
  margin: 18px 0;
}
.share-hint {
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
  min-height: 16px;
}
.share-hint.ok { color: var(--color-good); font-weight: 600; }
.share-hint.warn { color: var(--color-warn); font-weight: 600; }

@media (max-width: 700px) {
  .share-url-row { flex-direction: column; align-items: stretch; }
  .share-copy-btn { width: 100%; }
  .share-img-row .btn { flex: 1 1 auto; }
}

/* ══ Keyboard focus ═════════════════════════════════════════════════════════
   Last in the file on purpose. Several component rules set `outline: none` —
   .input, .row-select, .breakdown-time-select, #mainSortSelect and others — to
   suppress the browser's default ring, but nothing was put back in its place.
   The result was that Tab moved an invisible cursor around the dashboard: a
   keyboard user could not tell which control they were on, and the two
   preceding rounds of keyboard work (Escape-to-close, the search combobox) made
   that gap matter a great deal more.

   These rules must come after the ones they correct, hence the position rather
   than a home next to each component.

   :focus-visible, not :focus, so the ring appears for keyboard and assistive
   navigation but not when a mouse click lands on a button — which is the
   behaviour people expect and the reason the outlines were removed in the first
   place. Where a genuinely tailored ring already exists (the rail, modals,
   toasts, back-to-top), that rule is more specific and still wins. */
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible,
.btn:focus-visible,
.input:focus-visible,
.row-select:focus-visible,
.breakdown-time-select:focus-visible,
.header-icon-btn:focus-visible,
.clickable-bonus:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  /* The ring is drawn outside the element, so anything clipped by an ancestor
     with overflow:hidden would lose it. A matching glow guarantees the focused
     control is identifiable even when the outline itself is cut off. */
  box-shadow: 0 0 0 4px var(--accent-14);
}

/* Inputs and selects sit flush inside their containers, where an offset ring
   collides with the neighbouring control. Drawn inside the border instead. */
.input:focus-visible,
.row-select:focus-visible,
.breakdown-time-select:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-offset: -1px;
}

/* The work-area chips are the one interactive control with no border of their
   own when active, so the ring alone can look detached from them. */
.bonus-area-chip:focus-visible {
  outline-offset: 1px;
}

/* ══ Print ══════════════════════════════════════════════════════════════════
   A dashboard on a wall or handed over at shift change is a real use, and the
   screen layout prints badly: the page is a fixed-height flex column with four
   horizontally-translated pages inside it, so a browser printing it produces
   one viewport-sized slice of whichever page happened to be showing.

   This unwinds the geometry rather than restyling anything: heights become
   auto, the swipe transform is dropped, and only the page currently on screen
   is printed — printing all four would be four pages of someone else's
   context. Everything that exists to be clicked is hidden, since none of it
   means anything on paper.
   ═══════════════════════════════════════════════════════════════════════════ */
@media print {
  /* Interactive chrome: nothing here can be used on paper. */
  .next-rail,
  .next-header-actions,
  .header-menu-btn,
  .next-header-controls,
  .back-to-top,
  .toast-host,
  .ptr-indicator,
  .tour-overlay,
  .breakdown-overlay,
  #loadingOverlay,
  .reorder-bar,
  .main-sort-mobile,
  .breakdown-btn,
  #downloadRawDataBtn {
    display: none !important;
  }

  /* The header keeps its identity and its timestamp, but a black bar costs a
     lot of toner for no information. */
  .next-header {
    background: #fff !important;
    color: #000 !important;
    border-bottom: 1px solid #000;
    height: auto;
    padding: 0 0 8px;
  }
  .next-logo,
  .next-header-title,
  .next-header-meta,
  .next-header-meta * {
    color: #000 !important;
  }

  /* Unwind the fixed-height, horizontally-translated page container so the
     content can flow onto as many sheets as it needs. */
  html, body, .wrap, .app-body, .app-main,
  .swipe-container, .swipe-wrapper, .page {
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    display: block !important;
    transform: none !important;
  }

  /* Only what is on screen. The other three are laid out off to the side and
     would otherwise print as blank or half-drawn sheets. */
  .page { display: none !important; }
  .page.print-active { display: block !important; }

  /* Keep a card and its chart on one sheet where the paper allows. */
  .card.panel,
  .kpi {
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: none !important;
    border: 1px solid #ccc !important;
  }

  .table-wrap {
    overflow: visible !important;
    max-height: none !important;
  }

  /* Frozen columns are a scrolling affordance; on paper they just overlap. */
  #mainTable > thead > tr > th:nth-child(1),
  #mainTable > thead > tr > th:nth-child(2),
  #mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(1),
  #mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(2) {
    position: static !important;
  }

  thead { display: table-header-group; }
}

/* ============================================================
   WHDS multi-split KPI card
   Three figures in one card, divided - the template's OverviewStats
   "multi-split" variant. Label and value sizes are the template's labelStyle
   (0.6875rem/700/0.06em/uppercase) and valueStyle (2rem/400), which are also
   what this stylesheet already uses for table headers, so the two agree.
   ============================================================ */
.kpi-multi {
  grid-column: 1 / -1;
  display: flex;
  align-items: stretch;
  padding: 18px 8px;
  gap: 0;
}

.kpi-cell {
  flex: 1 1 0;
  min-width: 0;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  text-align: center;
}

.kpi-divider {
  flex: 0 0 1px;
  align-self: stretch;
  background: var(--border);
}

.kpi-cell-label {
  color: var(--muted);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.3;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
}

.kpi-cell-value {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  justify-content: center;
}

.kpi-cell-value .value {
  font-size: 2rem;
  font-weight: 400;
  line-height: 1.2;
  color: var(--text);
  white-space: nowrap;
}

.kpi-cell-sub {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Out of flow, pinned to the right edge of the value row. left:100% puts it
   just past the trend badge; because it is absolute it contributes no width, so
   the row centres on the figure and its trend exactly as it did before the
   button was in there. */
.kpi-cell-action {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  margin-left: 10px;
  white-space: nowrap;
}
.kpi-cell-value { position: relative; }

/* On a phone there is no room to the side, so it goes back under the figure
   and back into flow. */
@media (max-width: 700px) {
  .kpi-cell-action {
    position: static;
    transform: none;
    margin-left: 0;
    margin-top: 6px;
  }
  .kpi-cell-value { flex-wrap: wrap; justify-content: center; }
}

/* The tooltip was a block-level div inside a flex column; inside the label it
   has to be inline, and its bubble positions against the label. */
.kpi-cell-label .kpi-tooltip { display: inline-flex; position: relative; }
.kpi-cell-label .kpi-tooltip-content { display: none; }
.kpi-cell-label .kpi-tooltip:hover .kpi-tooltip-content,
.kpi-cell-label .kpi-tooltip:focus-within .kpi-tooltip-content {
  display: block;
}
.kpi-cell-label .kpi-tooltip-content .tt-title { display: block; font-weight: 700; margin-bottom: 4px; }

/* Mobile: one column, horizontal rules between cells. A 1px vertical divider
   between stacked blocks divides nothing. */
@media (max-width: 700px) {
  .kpi-multi {
    grid-column: 1 / -1;
    flex-direction: column;
    padding: 14px 10px;
  }
  .kpi-cell { padding: 10px 4px; }
  .kpi-divider { flex: 0 0 1px; align-self: auto; width: 100%; height: 1px; }
  .kpi-cell-value .value { font-size: 1.75rem; }
}

/* ============================================================
   WHDS header card + rail actions
   The black app bar is gone: this dashboard is embedded in a Google Site that
   already provides one, so a second bar repeated the frame around it. What the
   bar carried moved to two places - a header CARD at the top of the main
   column, and the seven action icons to the foot of the left rail.
   ============================================================ */

/* Undo the bar. .next-header is still on the element so the control styling
   scoped to it keeps applying; everything that made it a full-width black
   strip is reset here. */
.app-headercard {
  display: block;
  flex: 0 0 auto;
  height: auto;
  min-height: 0;
  padding: 14px 16px;
  margin-bottom: 14px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: none;
  position: relative;
  z-index: 60;
  gap: 0;
}

.hc-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.hc-titlewrap { position: relative; min-width: 0; }

.hc-title { margin: 0; font-size: inherit; font-weight: inherit; }

.app-headercard .next-header-title {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text);
}

.hc-subtitle {
  margin-top: 2px;
  font-size: 0.75rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* The filter row. Labels sit above their control, as in the template's
   outlined fields, so a control reads as answering a named question. */
.hc-filters {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
}

.hc-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.hc-field-grow { flex: 1 1 220px; min-width: 180px; }

.hc-field-label {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.hc-field .row-select { min-width: 140px; }

.hc-threshold {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  min-width: 90px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  font-family: 'Roboto Mono', ui-monospace, monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

/* The card is a positioning context for the menus that used to hang off the
   bar, so they stay anchored to their buttons. */
.app-headercard .site-menu,
.app-headercard .date-menu,
.app-headercard .search-dropdown { z-index: 70; }

/* ---- rail: pages at the top, tools at the foot ---- */
.rail-spacer { flex: 1 1 auto; min-height: 8px; }

.rail-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
  padding-bottom: 10px;
}

.rail-actions .header-icon-btn {
  color: var(--muted);
  width: 44px;
  height: 40px;
  border-radius: var(--radius-card);
}

.rail-actions .header-icon-btn:hover {
  color: var(--text);
  background: var(--w6);
}

/* ---- mobile ----
   The rail is a horizontal strip on a phone, which has room for the four page
   tabs and nothing else. The actions collapse behind the card's burger, which
   is what header-compact already did when they lived in the bar - so the
   existing toggleHeaderMenu_ keeps working unchanged. */
@media (max-width: 700px) {
  .app-headercard {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: var(--radius-card);
  }
  .app-headercard .next-header-title { font-size: 1.05rem; }
  .hc-filters { gap: 8px; }
  .hc-field { flex: 1 1 calc(50% - 8px); }
  .hc-field .row-select { min-width: 0; width: 100%; }
  .hc-field-grow { flex: 1 1 100%; }
  .rail-spacer { display: none; }

  /* The actions are hidden and revealed by the EXISTING header-compact
     machinery (body.header-compact .next-header-actions), which already builds
     a proper labelled dropdown from data-menu-label - so it is reused rather
     than replaced, and toggleHeaderMenu_ needs no change.

     Only the anchoring is corrected. Those rules position the menu absolutely
     against the header it used to live in; the actions now sit inside
     .next-rail, which has overflow-y:auto and would clip an absolutely
     positioned child. Fixed takes it out of that box entirely. */
  body.header-compact .next-header-actions {
    position: fixed;
    top: auto;
    right: 10px;
    width: auto;
    padding: 6px;
  }
}

/* No rule for .header-menu-btn here on purpose: it is already hidden by default
   and revealed by body.header-compact, which JS sets on every phone and on any
   desktop narrow enough to clip the title. Restating it here only risked
   showing a burger next to a rail that already has room for every action. */

/* ============================================================
   WHDS control panel — six controls of one shape
   Date, Hours Range, Time Window, Warehouse, Filter by Bonus, Threshold.
   They were six different heights and three different backgrounds because each
   inherited from wherever it used to live (the black bar, a KPI card, a search
   row). .hc-control is the single shape they now share.

   !important is unfortunately load-bearing: several of the originals set
   background and colour with !important for the black bar, and this has to
   outrank them without deleting rules that still matter on other pages.
   ============================================================ */
.hc-control {
  box-sizing: border-box;
  height: 38px;
  min-height: 38px;
  width: 100%;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--panel) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-card) !important;
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1;
  box-shadow: none !important;
}

.hc-control:hover { border-color: var(--field-border-hover, var(--muted)) !important; }
.hc-control:focus,
.hc-control:focus-visible { outline: none; border-color: var(--accent) !important; }

/* Native selects need the chrome removed before they match the others, and a
   caret drawn back on. */
select.hc-control {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}

.hc-field .date-picker,
.hc-field .warehouse-picker,
.hc-field .bonus-search-container,
.hc-field .search-row,
.hc-field .search-input-wrap { width: 100%; position: relative; }

.hc-control.date-picker-btn { justify-content: flex-start; cursor: pointer; }
.hc-control.date-picker-btn .date-picker-label { flex: 1 1 auto; text-align: left; }
.hc-control.warehouse-btn { justify-content: space-between; cursor: pointer; }
.hc-threshold { justify-content: center; font-family: 'Roboto Mono', ui-monospace, monospace; font-weight: 600; }

/* The bonus field keeps its clear button and magnifier, so the input is the
   control and the icons sit inside it. */
.hc-field .search-input-wrap .fa-search {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.hc-field #bonusSearch { padding-right: 34px; }
.hc-field .clear-filter-btn { flex: 0 0 auto; }

/* ---- Warehouse menu ---- */
.warehouse-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 100%;
  z-index: 4200;
  padding: 6px;
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow);
}
.warehouse-menu.open { display: block; }

.warehouse-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.875rem;
  text-align: left;
  cursor: pointer;
  border-radius: 6px;
}
.warehouse-item:hover { background: var(--w6); }

.warehouse-check {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  color: var(--accent-contrast);
}
.warehouse-check.on { background: var(--accent); border-color: var(--accent); }

/* ============================================================
   Calendar date picker + control-panel layout
   ============================================================ */
.date-calendar {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 4200;
  width: 300px;
  max-width: calc(100vw - 24px);
  padding: 12px;
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.date-calendar.open { display: block; }

.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.cal-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
.cal-nav {
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--muted);
  border-radius: 50%; cursor: pointer;
}
.cal-nav:hover { background: var(--w6); color: var(--text); }

.cal-dow, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-dow {
  margin-bottom: 4px;
}
.cal-dow span {
  text-align: center;
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.cal-cell {
  aspect-ratio: 1 / 1;
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.875rem;
  border-radius: 50%;
  cursor: pointer;
}
.cal-cell:hover:not(.cal-disabled):not(.cal-blank) { background: var(--w8); }
.cal-blank { cursor: default; }

/* A day with no archive is shown, not hidden - the gap is information - but it
   is plainly not choosable. */
.cal-disabled { color: var(--muted); opacity: 0.35; cursor: default; }

.cal-today:not(.cal-selected) { box-shadow: inset 0 0 0 1px var(--border); }
.cal-selected { background: var(--accent); color: var(--accent-contrast); font-weight: 600; }
.cal-selected:hover { background: var(--accent); }

.cal-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.cal-action {
  border: none;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.cal-action:hover { background: var(--w6); }

/* ---- three controls per row ----
   Six fields, two rows of three, at every width above the phone breakpoint.
   The bonus field no longer grows: an even grid is what makes the panel read
   as one block rather than a row that happens to wrap. */
.hc-filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: end;
  gap: 12px;
}
.hc-field-grow { flex: none; min-width: 0; }

@media (max-width: 700px) {
  .hc-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}

/* ---- the title and status line are gone from the card ----
   The Google Site around this already names the page, and "Loaded" is noise
   once the data is on screen. Both elements STAY in the DOM: $('status') is
   written unguarded from ten places, and the error path puts a Retry button
   inside it, so removing it would break loading and hide failures.

   Hidden only while it is saying something routine. When it holds an error or a
   retry button it comes back - a status line you cannot see is fine right up
   until the moment it is the only thing telling you the page is broken. */
.app-headercard .hc-head { display: none; }

.app-headercard #status {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
.app-headercard:has(#status .bad) .hc-head,
.app-headercard:has(#status button) .hc-head { display: flex; }
.app-headercard:has(#status .bad) #status,
.app-headercard:has(#status button) #status {
  position: static;
  width: auto; height: auto;
  margin: 0; overflow: visible; clip: auto; white-space: normal;
}

/* ---- one shape, enforced ----
   The six controls disagreed because each still inherited from wherever it used
   to live. These are the properties that actually differed - background, height
   and the font size of the LABEL INSIDE the control, which is a separate
   element on the date and warehouse buttons and so did not inherit. */
.hc-field .date-picker-label,
.hc-field .warehouse-label,
.hc-field .hc-threshold,
.hc-field #bonusSearch,
.hc-field select.hc-control {
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1;
}

.hc-field .date-picker-icon,
.hc-field .date-picker-caret,
.hc-field .warehouse-caret { font-size: 0.75rem; color: var(--muted); }

/* Filter by Bonus keeps a filled ground: it is the one control you TYPE into,
   and the fill is what says so. Everything else is white. */
.hc-field #bonusSearch {
  background: var(--w4) !important;
}
.hc-field #bonusSearch:focus { background: var(--panel) !important; }

/* The date button is the other one that was grey - that was the black bar's
   fill, not a signal, so it goes white with the rest. */
.hc-control.date-picker-btn { background: var(--panel) !important; }

/* ---- mobile: shrunken sizes apply to the inner labels too ---- */
@media (max-width: 700px) {
  body.page-scrolled .hc-field .date-picker-label,
  body.page-scrolled .hc-field .warehouse-label,
  body.page-scrolled .hc-field .hc-threshold,
  body.page-scrolled .hc-field #bonusSearch,
  body.page-scrolled .hc-field #bonusSearch::placeholder,
  body.page-scrolled .hc-field select.hc-control {
    font-size: 0.64rem;
  }
  body.page-scrolled .hc-field .date-picker-icon,
  body.page-scrolled .hc-field .date-picker-caret,
  body.page-scrolled .hc-field .warehouse-caret { font-size: 0.55rem; }
}

/* ============================================================
   Control panel — final height/shrink rules
   ============================================================ */

/* Date and Bonus were taller than the rest because the phone rules give them
   a 44px touch target - `#datePickerBtn { min-height: 44px }` and a padded
   `#bonusSearch` with !important. min-height beats height, and an id beats a
   class, so .hc-control never stood a chance. Scoping by .hc-field puts a class
   AND an id on the left, which outranks both. */
.hc-field #datePickerBtn,
.hc-field #bonusSearch {
  height: 38px !important;
  min-height: 38px !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  min-width: 0 !important;
  max-width: none !important;
  width: 100% !important;
  font-size: 0.875rem !important;
  box-sizing: border-box !important;
}
.hc-field #bonusSearch { padding-left: 10px !important; padding-right: 34px !important; }

/* ---- shrink on scroll at EVERY width, not just on a phone ----
   The panel is always on screen now, so it costs height on a desktop exactly
   as it does on a phone. page-scrolled is set from scrollTop with no width
   test, so the same class drives both. */
body.page-scrolled .app-headercard { padding: 6px 8px; margin-bottom: 6px; }
body.page-scrolled .hc-field-label { display: none; }
body.page-scrolled .hc-filters { margin-top: 0; gap: 6px; }

body.page-scrolled .hc-control {
  height: 28px;
  min-height: 28px;
  font-size: 0.75rem;
  padding: 0 8px;
  border-radius: 6px !important;
}
body.page-scrolled .hc-field #datePickerBtn,
body.page-scrolled .hc-field #bonusSearch {
  height: 28px !important;
  min-height: 28px !important;
  font-size: 0.75rem !important;
  padding-right: 26px !important;
}
body.page-scrolled .hc-field .date-picker-label,
body.page-scrolled .hc-field .warehouse-label,
body.page-scrolled .hc-field .hc-threshold,
body.page-scrolled .hc-field #bonusSearch::placeholder,
body.page-scrolled .hc-field select.hc-control { font-size: 0.75rem; }
body.page-scrolled select.hc-control {
  padding-right: 22px;
  background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%;
  background-size: 4px 4px, 4px 4px;
}
body.page-scrolled .hc-field .search-input-wrap .fa-search { right: 8px; font-size: 0.7rem; }
body.page-scrolled .hc-field .date-picker-icon,
body.page-scrolled .hc-field .date-picker-caret,
body.page-scrolled .hc-field .warehouse-caret { font-size: 0.6rem; }

/* Nothing tightens further on a phone: the compact size IS the phone's default
   now (see the mobile block at the end of this file), and scrolling there takes
   the labels away and nothing else. */

/* ---- the rail: icon AND word normally, icon alone once shrunk ----
   The word is what makes the rail learnable, so it stays until the moment the
   user is reading rather than navigating. Hidden with clip rather than display,
   so the label text remains the accessible name for screen readers and the
   tour even while it is off-screen. */
@media (max-width: 700px) {
  body.page-scrolled .next-rail .rail-label {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
}

/* ---- the burger only when the actions are not on screen ----
   header-compact is precisely "the seven do not fit", so it is the right
   condition: if all seven are visible there is nothing behind the burger. */
/* .next-rail .rail-item sets display:flex at (0,2,0); a bare .rail-burger at
   (0,1,0) never beat it, so the burger showed even with all seven actions on
   screen. Matched specificity is the fix, not !important. */
.next-rail .rail-burger { display: none; }
body.header-compact .next-rail .rail-burger { display: flex; }
body.header-menu-open .next-rail .rail-burger { color: var(--accent); }

/* ============================================================
   Rail width, panel spacing, and the mobile default size
   ============================================================ */

/* 96px is what a word under an icon needs, so that is the width while the words
   are there. Once shrunk the words go and the rail hands back the 32px it was
   only holding for them - which is the horizontal space that looked out of
   proportion with the vertical gaps. */
@media (min-width: 701px) {
  .next-rail {
    gap: 8px;
    padding-top: 12px;
  }
}
/* The desktop rail does not move. It is a fixed column beside the content, not
   part of the scrolling area, so collapsing it bought width the page was not
   short of and animated a thing the user was not looking at. Only the phone's
   horizontal strip still gives space back, because there the rail is stacked
   ABOVE the content and its height is genuinely in the way. */

/* No head any more, so the filter row is the first thing in the card and the
   12px that used to separate it from the title was just a gap at the top. */
.hc-filters { margin-top: 0; }
.app-headercard { padding: 12px; }

/* The Volume page's control row sat in a full-width band of its own. It holds
   one select, so it takes the height of one select. */
.volume-controls { padding-bottom: 6px; }

/* ---- mobile: the compact size IS the size ----
   Requested: on a phone the panel is always the tight one, and scrolling only
   takes the labels away. So the control metrics move OUT of :page-scrolled and
   become the mobile default; page-scrolled now changes exactly one thing. */
@media (max-width: 700px) {
  .app-headercard { padding: 8px; margin-bottom: 8px; }
  .hc-filters { gap: 6px; }

  .hc-control,
  .hc-field #datePickerBtn,
  .hc-field #bonusSearch {
    height: 30px !important;
    min-height: 30px !important;
    font-size: 0.7rem !important;
    padding: 0 8px !important;
    border-radius: 6px !important;
  }
  .hc-field #bonusSearch { padding-right: 26px !important; }

  .hc-field .date-picker-label,
  .hc-field .warehouse-label,
  .hc-field .hc-threshold,
  .hc-field #bonusSearch::placeholder,
  .hc-field select.hc-control { font-size: 0.7rem; }

  .hc-field .date-picker-icon,
  .hc-field .date-picker-caret,
  .hc-field .warehouse-caret { font-size: 0.6rem; }

  select.hc-control {
    padding-right: 22px !important;
    background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%;
    background-size: 4px 4px, 4px 4px;
  }
  .hc-field .search-input-wrap .fa-search { right: 8px; font-size: 0.7rem; }

  /* The ONLY thing scrolling changes on a phone. */
  body.page-scrolled .hc-field-label { display: none; }
  body.page-scrolled .app-headercard { padding: 6px 8px; margin-bottom: 6px; }
}

/* ============================================================
   Overflow menu escape, and a tighter control panel
   ============================================================ */

/* The actions dropdown is absolutely positioned inside #headerActions, which
   now lives in the rail - and the rail scrolls (overflow-y: auto, for a rail
   too tall to fit). An absolutely positioned child of a scroll container is
   CLIPPED by it, which is why the menu stopped after four items instead of
   showing all seven. The rail is a single row on a phone and has nothing to
   scroll, so it can let the menu out. */
@media (max-width: 700px) {
  .next-rail { overflow: visible; position: relative; }
}

/* Halved-ish. Literally halving 38px leaves a native <select> at 19px, which
   no longer renders its own text properly on Windows, so this stops at the
   smallest size the controls still read at. */
.hc-control {
  height: 24px;
  min-height: 24px;
  font-size: 0.72rem;
  padding: 0 8px;
}
.hc-field #datePickerBtn,
.hc-field #bonusSearch {
  height: 24px !important;
  min-height: 24px !important;
  font-size: 0.72rem !important;
  padding-right: 26px !important;
}
