<script>
// ============================================================================
// Pull down to refresh (mobile only).
//
// Refreshing meant finding a 40px icon in a crowded header. On a phone the
// expected gesture is to pull the page down, and the slot is already free:
// .page sets overscroll-behavior: contain, so the browser's own pull-to-refresh
// never fires here.
//
// This has to share the touch stream with two other gestures — the horizontal
// page swipe and ordinary vertical scrolling — so it is deliberately narrow
// about when it takes over: only from a single finger, only while the page is
// already at the top, and only while the movement is more vertical than
// horizontal. Anything else and it stands down and lets the others have it.
// ============================================================================

var PTR_TRIGGER_PX = 70;   // pull needed to arm the refresh
var PTR_MAX_PX = 110;      // furthest the indicator travels
var PTR_RESISTANCE = 0.5;  // finger travel vs indicator travel, so it feels weighted
var PTR_SAFETY_MS = 15000; // give up waiting on the load rather than spin forever

var _ptrTracking = false;
var _ptrRefreshing = false;
var _ptrStartY = 0;
var _ptrStartX = 0;
var _ptrPull = 0;

function ptrIndicator_() {
  var el = document.getElementById('ptrIndicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ptrIndicator';
    el.className = 'ptr-indicator';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<i class="fa-solid fa-arrow-down"></i>';
    document.body.appendChild(el);
  }
  return el;
}

function ptrIsEligible_() {
  // Checked per gesture rather than once at startup, so rotating a tablet
  // across the breakpoint does the right thing without a reload.
  if (!window.matchMedia('(max-width: 700px)').matches) return false;
  if (typeof tourActive !== 'undefined' && tourActive) return false;
  if (typeof isAnyModalOpen_ === 'function' && isAnyModalOpen_()) return false;
  return !_ptrRefreshing;
}

function ptrRender_(pull) {
  var el = ptrIndicator_();
  var ready = pull >= PTR_TRIGGER_PX;
  el.classList.add('visible');
  el.classList.toggle('ready', ready);
  el.style.transform = 'translateY(' + (pull - 44) + 'px) rotate(' + (ready ? 180 : 0) + 'deg)';
}

function ptrHide_() {
  var el = ptrIndicator_();
  el.classList.remove('visible', 'ready', 'spinning');
  el.style.transform = '';
  _ptrPull = 0;
}

function ptrFinish_() {
  _ptrRefreshing = false;
  ptrHide_();
  var el = ptrIndicator_();
  el.innerHTML = '<i class="fa-solid fa-arrow-down"></i>';
}

// loadDataPak has no completion callback, and adding one would mean touching
// both its success and failure paths. Watching for the skeleton class it sets
// and later clears reports the same thing without that surgery — and covers the
// failure path too, which also clears it.
function ptrWaitForLoad_() {
  var done = false;
  function finishOnce() {
    if (done) return;
    done = true;
    if (obs) obs.disconnect();
    clearTimeout(safety);
    ptrFinish_();
  }
  var obs = new MutationObserver(function () {
    if (!document.body.classList.contains('loading-skeleton')) finishOnce();
  });
  obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  var safety = setTimeout(finishOnce, PTR_SAFETY_MS);
  // The load may have finished before the observer was attached.
  if (!document.body.classList.contains('loading-skeleton')) {
    setTimeout(finishOnce, 400);
  }
}

function ptrTrigger_() {
  _ptrRefreshing = true;
  var el = ptrIndicator_();
  el.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i>';
  el.classList.add('visible', 'spinning');
  el.classList.remove('ready');
  el.style.transform = 'translateY(' + (PTR_TRIGGER_PX - 44) + 'px)';
  loadDataPak(currentArchiveUrl);
  ptrWaitForLoad_();
}

function onPtrStart_(e) {
  _ptrTracking = false;
  if (!ptrIsEligible_()) return;
  if (!e.touches || e.touches.length !== 1) return;
  // Only from a page that is already scrolled to the very top; otherwise this
  // would hijack an ordinary upward scroll.
  if (e.currentTarget.scrollTop > 0) return;
  _ptrStartY = e.touches[0].clientY;
  _ptrStartX = e.touches[0].clientX;
  _ptrPull = 0;
  _ptrTracking = true;
}

function onPtrMove_(e) {
  if (!_ptrTracking || _ptrRefreshing) return;
  if (!e.touches || e.touches.length !== 1) { _ptrTracking = false; ptrHide_(); return; }

  var dy = e.touches[0].clientY - _ptrStartY;
  var dx = Math.abs(e.touches[0].clientX - _ptrStartX);

  // Upward means they want to scroll, not refresh.
  if (dy <= 0) { ptrHide_(); return; }
  // Mostly sideways means they are changing page. Hand the gesture over for
  // good — not just for this event — so a wobbly swipe cannot flicker between
  // the two behaviours.
  if (dx > dy) { _ptrTracking = false; ptrHide_(); return; }

  // Only now claim the gesture, and only if the listener was registered
  // non-passively (it is; see initPullToRefresh_).
  if (e.cancelable) e.preventDefault();

  _ptrPull = Math.min(dy * PTR_RESISTANCE, PTR_MAX_PX);
  ptrRender_(_ptrPull);
}

function onPtrEnd_() {
  if (!_ptrTracking) return;
  _ptrTracking = false;
  if (_ptrPull >= PTR_TRIGGER_PX) { ptrTrigger_(); }
  else { ptrHide_(); }
}

function initPullToRefresh_() {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) {
    // passive: false on touchmove specifically — preventDefault is what stops
    // the rubber-band scroll from fighting the indicator, and a passive
    // listener is not allowed to call it.
    pages[i].addEventListener('touchstart', onPtrStart_, { passive: true });
    pages[i].addEventListener('touchmove', onPtrMove_, { passive: false });
    pages[i].addEventListener('touchend', onPtrEnd_, { passive: true });
    pages[i].addEventListener('touchcancel', function () {
      _ptrTracking = false;
      ptrHide_();
    }, { passive: true });
  }
}

document.addEventListener('DOMContentLoaded', initPullToRefresh_);
</script>
