<script>
  // Fills the History dropdown. Deliberately does NOT kick off the data load:
  // the archive list and the dashboard data are independent, so they are fired
  // in parallel from DOMContentLoaded. Chaining them (load list -> then load
  // data) meant startup waited for TWO sequential server round-trips before any
  // data could appear.
  function populateArchiveDropdown() {
    google.script.run.withSuccessHandler(function(links) {
      var sel = $('archiveSelect');
      // The user could have changed the selection while the list was loading —
      // preserve it rather than silently snapping back to Live.
      var previous = sel.value;
      sel.innerHTML = '<option value="">Live</option>';
      for (var i = 0; i < links.length; i++) {
        var opt = document.createElement('option');
        opt.value = links[i].url;
        opt.textContent = links[i].name;
        sel.appendChild(opt);
      }
      if (previous) sel.value = previous;
      // The picker reads its options off this select, so it re-renders once
      // they exist - and again below if a deep link moved the selection.
      if (typeof syncDateUi_ === 'function') syncDateUi_();

      // ?date=YYYY-MM-DD — match it against the snapshot list and switch to it.
      // Has to happen here because the list is what maps a date to its URL.
      if (typeof DEEP_DATE !== 'undefined' && DEEP_DATE && !_deepDateApplied) {
        _deepDateApplied = true;
        var wanted = isoDateToArchiveName_(DEEP_DATE);
        for (var d = 0; d < links.length; d++) {
          if (links[d].name === wanted) {
            sel.value = links[d].url;
            currentArchiveUrl = links[d].url;
            if (typeof syncDateUi_ === 'function') syncDateUi_();
            loadDataPak(currentArchiveUrl);
            break;
          }
        }
      }
    }).withFailureHandler(function(err) {
      console.warn('Archive list failed to load:', err && err.message ? err.message : err);
    }).getArchiveLinks();
  }

  // ── Stale-while-revalidate cache ───────────────────────────────────────────
  // The last LIVE payload is kept in localStorage so a returning user sees the
  // dashboard populated immediately instead of staring at a spinner for a full
  // server round-trip. The cached view is always labelled "Updating..." while
  // fresh data is fetched in the background, and it still shows its own
  // "Last Update" timestamp — so it is never passed off as live data.
  // Deep-link one-shots: the target page and date are applied once, not on
  // every background refresh (which would yank the user back).
  var _deepPageApplied = false;
  var _deepDateApplied = false;

  // The area count is part of the key for the same reason the server's
  // yesterday-archive cache carries it: a payload cached before an area existed
  // has no field for it, and renderCachedPayload_ paints from this before the
  // fresh data lands - so that area shows zero on arrival with nothing to say
  // why. Adding an area changes the count and retires the old payload.
  var PAYLOAD_CACHE_KEY = 'e3_dashboard_payload_v2_' + VOLUME_TYPES.length;
  var PAYLOAD_CACHE_MAX_AGE_MS = 6 * 60 * 60 * 1000;  // 6h: older than a shift is not worth showing
  var PAYLOAD_CACHE_MAX_CHARS = 3000000;              // stay well clear of the ~5MB localStorage quota

  // Only LIVE data is cached. Archive snapshots are picked deliberately and are
  // never the default view on startup, so caching them would only burn quota.
  function savePayloadCache_(data, archiveUrl) {
    if (archiveUrl) return;
    try {
      var json = JSON.stringify({ savedAt: Date.now(), payload: data });
      if (json.length > PAYLOAD_CACHE_MAX_CHARS) return;
      localStorage.setItem(PAYLOAD_CACHE_KEY, json);
    } catch (e) {
      // Quota exceeded or storage unavailable — drop the stale copy and move on.
      try { localStorage.removeItem(PAYLOAD_CACHE_KEY); } catch (e2) {}
    }
  }

  // Returns true if a cached payload was rendered, so the caller can fetch
  // silently (no blocking overlay) instead of showing the full-screen spinner.
  function renderCachedPayload_() {
    try {
      var raw = localStorage.getItem(PAYLOAD_CACHE_KEY);
      if (!raw) return false;
      var wrapper = JSON.parse(raw);
      if (!wrapper || !wrapper.payload || !wrapper.savedAt) return false;
      if (Date.now() - wrapper.savedAt > PAYLOAD_CACHE_MAX_AGE_MS) return false;
      if (!wrapper.payload.timeRanges || !wrapper.payload.timeRanges.length) return false;

      // Instant paint is the whole point here — don't animate it in.
      setChartAnimationEnabled_(false);
      renderDashboardPayload_(wrapper.payload);
      setChartAnimationEnabled_(true);
      lastRealPayload = wrapper.payload;
      lastRealPayload.__archiveUrl = null;
      // Don't let the cached timestamp look like a completed live refresh; the
      // caller immediately overwrites status with "Updating...".
      return true;
    } catch (e) {
      return false;
    }
  }

  // Renders a KPI card's change vs the previous hour. `unit` is 'pp' for the
  // percentage KPI (a change in a percentage is percentage POINTS, not a
  // percentage of a percentage) and '' for plain counts.
  function setKpiTrend_(elId, current, previous, prevHasData, unit) {
    var el = $(elId);
    if (!el) return;
    if (!prevHasData) { el.style.display = 'none'; return; }

    var delta = current - previous;
    var rounded = (unit === 'pp') ? Math.round(delta) : delta;
    if (rounded === 0) {
      el.className = 'kpi-trend flat';
      el.innerHTML = '<i class="fa-solid fa-minus"></i> no change';
    } else {
      var up = rounded > 0;
      el.className = 'kpi-trend ' + (up ? 'up' : 'down');
      el.innerHTML = '<i class="fa-solid fa-arrow-' + (up ? 'up' : 'down') + '"></i> ' +
                     Math.abs(rounded) + (unit === 'pp' ? 'pp' : '');
    }
    el.title = 'vs previous hour (' + (unit === 'pp' ? Math.round(previous) + '%' : previous) + ')';
    el.style.display = 'inline-flex';
  }

  // Renders a full dashboard payload (real OR demo/tour data) into the UI: KPI
  // cards, notes, and all charts/tables via applyLocalFiltersPak(). Kept separate
  // from loadDataPak so the tour can re-apply the real payload when it finishes.
  // The three KPI cards, recomputed from whatever is currently in scope.
  //
  // Lifted out of renderDashboardPayload_ so it can run on a building change
  // too: the cards were computed once per payload, so switching to E1/E2
  // re-rendered every chart and table while Head Deployed, Head Above and
  // Productivity % kept the whole-site figures from the last load.
  function renderKpiCards_() {
    if (!timeRanges.length) return;
  // KPI figures for one hour-sized window (4 x 15-min blocks). Computing this
  // for the last hour AND the hour before it gives the trend indicators
  // something to compare against.
  function computeHourKpis_(blockSlice) {
    var times = {};
    for (var i = 0; i < blockSlice.length; i++) { times[blockSlice[i]] = true; }
    var rows = rawSideData.filter(function(r) { return times[r.timeRange]; });

    var headSet = {};
    for (var i = 0; i < rows.length; i++) { headSet[rows[i].bonus] = true; }

    var headHours = {};
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i].bonus;
      if (!headHours[b]) headHours[b] = 0;
      headHours[b] += (rows[i].value || 0);
    }
    var target = currentThreshold * 4;
    var above = 0;
    var hk = Object.keys(headHours);
    for (var i = 0; i < hk.length; i++) { if (headHours[hk[i]] >= target) above++; }

    // Productivity counts only rows that clear the threshold — i.e. an
    // operator whose total standard hours for a 15-min block is at or below
    // the threshold is treated as not really working that block, and is
    // excluded from BOTH the standard hours and the head count so the ratio
    // stays consistent. This matches generateMainRows_, which the Data
    // Table's Productivity % column uses; previously the KPI summed every row
    // and so disagreed with the table.
    var qualified = rows.filter(function(r) { return (r.value || 0) > currentThreshold; });

    var tS = 0;
    for (var i = 0; i < qualified.length; i++) { tS += (qualified[i].value || 0); }
    var blockGroup = {};
    for (var i = 0; i < qualified.length; i++) {
      var tr = qualified[i].timeRange;
      if (!blockGroup[tr]) blockGroup[tr] = {};
      blockGroup[tr][qualified[i].bonus] = true;
    }
    // A block with a single qualifying operator counts normally. Previously it
    // contributed 0 to the head count while that operator's hours still
    // counted in the numerator, which inflated the productivity figure.
    var totalDisplayCount = 0;
    var bgKeys = Object.keys(blockGroup);
    for (var i = 0; i < bgKeys.length; i++) {
      totalDisplayCount += Object.keys(blockGroup[bgKeys[i]]).length;
    }
    var tD = totalDisplayCount / 4;

    return {
      heads: Object.keys(headSet).length,
      above: above,
      perf: tD > 0 ? (tS / tD) * 100 : 0,
      hasData: rows.length > 0
    };
  }

  var thisHour = computeHourKpis_(timeRanges.slice(-4));
  // Blocks -8..-5: the hour immediately before the one being displayed.
  var prevHour = computeHourKpis_(timeRanges.slice(-8, -4));

  $('headDeployed').textContent = thisHour.heads;
  $('headAbove20').textContent = thisHour.above;
  $('avgPerf').textContent = thisHour.perf > 0 ? thisHour.perf.toFixed(0) + '%' : '0%';

  // Only show a trend when there is a real previous hour to compare with,
  // otherwise the first hour of the day would read as a huge "increase".
  setKpiTrend_('headDeployedTrend', thisHour.heads, prevHour.heads, prevHour.hasData, '');
  setKpiTrend_('headAbove20Trend', thisHour.above, prevHour.above, prevHour.hasData, '');
  setKpiTrend_('avgPerfTrend', thisHour.perf, prevHour.perf, prevHour.hasData, 'pp');
  }

  function renderDashboardPayload_(data) {
    timeRanges = data.timeRanges || [];
    // The payload is kept whole in allSideData; rawSideData is the view of it
    // narrowed to the chosen building. Everything downstream reads rawSideData,
    // so with no filter set the two are the same and nothing behaves
    // differently from before.
    allSideData = data.rawSideData || [];
    rawSideData = scopeRowsToSite_(allSideData);
    tmDirectory = data.tmDirectory || {};
    // The server's list is already every operator on site, which is what the
    // search wants regardless of the building in view.
    allBonusList = data.bonusList || [];
    if (typeof syncSiteUi_ === 'function') syncSiteUi_();
    currentThreshold = parseFloat(data.threshold) || 0;
    if (data.currentTimestamp) { lastRefreshTimestamp = data.currentTimestamp; }

    $('headAbove20Label').textContent = 'Head > ' + Math.round(currentThreshold * 4 * 100) + '% Prod. Last Hour';
    renderBonusChips();
    updateClearBtnVisibility();
    $('thresholdDisplay').textContent = currentThreshold || '-';
    lastUpdateAbsText = 'Last Update: ' + (data.lastRefresh || '-');
    renderLastUpdate_();

    applyLocalFiltersPak();

    $('status').textContent = 'Loaded';
    var noteEl = $('noteText');
    if (data.note && String(data.note).trim() !== '') { noteEl.textContent = String(data.note).trim(); }
    else { noteEl.textContent = ''; }
    updateStaleWarning_();

    // Switch to the linked page once there is something rendered to show.
    if (typeof DEEP_PAGE !== 'undefined' && DEEP_PAGE && !_deepPageApplied) {
      _deepPageApplied = true;
      var idx = ['overall', 'volume', 'bonus', 'data'].indexOf(DEEP_PAGE);
      if (idx !== -1) goToPage(idx);
    }
  }

  // Retry the last attempted load (shown alongside the error status).
  function retryLoadPak() {
    loadDataPak(currentArchiveUrl);
  }

  // ── Auto-refresh: countdown + pause ────────────────────────────────────────
  // Polls every 60s. There was a header button carrying a countdown in its
  // tooltip and a pause, on the reasoning that a figure changing under you
  // while you read it is unwelcome; both are gone, along with the manual
  // refresh beside them, so the polling is silent again and always on.
  var POLL_INTERVAL_MS = 60000;
  var nextPollAt = 0;

  function pollForUpdates_() {
    if (lastRefreshTimestamp === null) return;
    if (currentArchiveUrl) return;
    google.script.run.withSuccessHandler(function(remoteTimestamp) {
      if (remoteTimestamp !== null && remoteTimestamp !== lastRefreshTimestamp) {
        loadDataPak(currentArchiveUrl, true);
      }
    }).getLastRefreshTimestamp();
  }

  function refreshTick_() {
    // Archive snapshots are static — nothing to poll for.
    if (currentArchiveUrl) return;
    if (Date.now() < nextPollAt) return;
    nextPollAt = Date.now() + POLL_INTERVAL_MS;
    pollForUpdates_();
  }

  // ── Stale-data warning ─────────────────────────────────────────────────────
  // If the upstream pipeline stalls, the dashboard would otherwise keep showing
  // its last numbers with no indication they've stopped moving. lastRefreshTimestamp
  // is Front!B2 — the timestamp the pipeline writes on each successful run — so
  // an unchanging value means data has stopped arriving, not that the page broke.
  //
  // Threshold allows for the pipeline's own safety margin plus a missed run or
  // two, so a single late run doesn't cry wolf.
  // ── "How old is this?" ─────────────────────────────────────────────────────
  // The header showed a clock time — "Last Update: 14:30" — which answers the
  // wrong question. At a glance nobody knows whether 14:30 was two minutes ago
  // or two hours; they have to find the current time and subtract. The stale
  // warning only spoke up past 45 minutes, so everything short of a genuine
  // pipeline stall looked identical.
  var lastUpdateAbsText = 'Last Update: -';

  function relativeAgePak(ms) {
    var mins = Math.floor(ms / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.floor(mins / 60);
    var rem = mins % 60;
    if (hrs < 24) return hrs + 'h' + (rem ? ' ' + rem + 'm' : '') + ' ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  function renderLastUpdate_() {
    var el = $('lastUpdateText');
    if (!el) return;
    // The element itself is hidden until hovered, so the same text is mirrored
    // onto the container's title. Someone who never discovers the hover still
    // gets the answer from the native tooltip.
    var syncTitle = function () {
      var meta = document.querySelector('.next-header-meta');
      if (meta) meta.setAttribute('title', 'Data last updated: ' + el.textContent);
    };
    // Archive snapshots are historical by definition — "3h ago" against a date
    // the user deliberately chose would be noise.
    if (currentArchiveUrl || lastRefreshTimestamp === null) {
      el.textContent = lastUpdateAbsText;
      syncTitle();
      return;
    }
    el.textContent = lastUpdateAbsText + ' · ' + relativeAgePak(Date.now() - lastRefreshTimestamp);
    syncTitle();
  }

  var STALE_AFTER_MS = 45 * 60 * 1000;

  function updateStaleWarning_() {
    var el = $('staleWarning');
    if (!el) return;
    // Archive snapshots are historical by definition — "stale" is meaningless.
    if (currentArchiveUrl || lastRefreshTimestamp === null) {
      el.style.display = 'none';
      return;
    }
    var ageMs = Date.now() - lastRefreshTimestamp;
    if (ageMs < STALE_AFTER_MS) {
      el.style.display = 'none';
      return;
    }
    var mins = Math.floor(ageMs / 60000);
    var label = mins >= 120 ? (Math.floor(mins / 60) + 'h') : (mins + ' min');
    el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> No new data for ' + label;
    el.title = 'The dashboard is live, but the upstream pipeline has not published new data since the last update shown.';
    el.style.display = 'inline-flex';
  }

  function loadDataPak(archiveUrl, silent) {
    var overlay = $('loadingOverlay');

    if (!silent && !tourActive) {
      // Skeleton placeholders instead of a full-screen blocking spinner: the
      // user sees the real layout filling in rather than a blank wall.
      document.body.classList.add('loading-skeleton');
      if (overlay) overlay.classList.remove('active');
      $('status').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading...';
    } else if (!tourActive) {
      $('status').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating...';
    }

    var savedScroll = 0;
    var activePage = null;
    var focusedEl = null;
    var focusedId = null;
    var selStart = null;
    var selEnd = null;

    if (silent) {
      var pages = document.querySelectorAll('.page');
      if (pages[currentPage]) {
        activePage = pages[currentPage];
        savedScroll = activePage.scrollTop;
      }
      focusedEl = document.activeElement;
      if (focusedEl && focusedEl.id) {
        focusedId = focusedEl.id;
        if (typeof focusedEl.selectionStart === 'number' && typeof focusedEl.selectionEnd === 'number') {
          selStart = focusedEl.selectionStart;
          selEnd = focusedEl.selectionEnd;
        }
      }
    }

    var urlToFetch = archiveUrl !== undefined ? archiveUrl : currentArchiveUrl;

    google.script.run.withSuccessHandler(function(data) {
      // CRITICAL FIX: Wrap in try/catch so a rendering error doesn't trap the overlay.
      try {
        savePayloadCache_(data, urlToFetch);

        if (tourActive) {
          // Tour is showing demo data — stash the real payload and apply it when the tour ends.
          pendingRealData = data;
          pendingRealData.__archiveUrl = urlToFetch || null;
          $('status').textContent = 'Loaded';
        } else {
          // Background refreshes redraw without animation so the dashboard
          // doesn't visibly stutter every minute.
          setChartAnimationEnabled_(!silent);
          renderDashboardPayload_(data);
          setChartAnimationEnabled_(true);
          currentArchiveUrl = urlToFetch || null;
          lastRealPayload = data;
          lastRealPayload.__archiveUrl = urlToFetch || null;

          if (silent) {
            if (activePage) { activePage.scrollTop = savedScroll; }
            if (focusedId) {
              var elToRestore = document.getElementById(focusedId);
              if (elToRestore) {
                elToRestore.focus();
                if (selStart !== null && selEnd !== null) {
                  try { elToRestore.setSelectionRange(selStart, selEnd); } catch(e){}
                }
              }
            }
          }
        }
      } catch (e) {
        console.error("Dashboard Render Error:", e);
        $('status').innerHTML = '<span class="bad">Render Error: Check Console</span>';
      }

      // GUARANTEE overlay/skeleton removal outside the try/catch so they NEVER get stuck
      document.body.classList.remove('loading-skeleton');
      if (!silent && !tourActive && overlay) overlay.classList.remove('active');

    }).withFailureHandler(function(err) {
      if (!tourActive) {
        // Offer a way back: without this the only recovery was a page reload.
        var msg = (err && err.message) ? err.message : String(err);
        $('status').innerHTML = '<span class="bad">Error: ' + escapeAttrPak(msg) + '</span>' +
          ' <button type="button" class="status-retry-btn" onclick="retryLoadPak()">Retry</button>';
      }
      document.body.classList.remove('loading-skeleton');
      if (!silent && !tourActive && overlay) overlay.classList.remove('active');
    }).getDashboardData(urlToFetch);
  }

  document.addEventListener('DOMContentLoaded', function() {
    applyConfigToCSSPak();
    wireSortingPak();
    initBonusSearch();
    initKpiTooltipTaps_();
    initBonusTipTaps_();
    initBonusTipHover_();

    // Load UI preferences (Dropdowns, Split States) - BUT NOT THE ARCHIVE URL
    loadUserPreferences();

    setupSwipe();
    initPageScrollChrome_();
    initScrollEdges_();
    initHeaderMenu_();
    initSearchShortcut_();
    initPrintPage_();
    // After loadUserPreferences above, so a saved chart order is already in
    // chartOrderState and can be applied on this first pass.
    initChartReorder_();

    // ── Deep link: apply anything the URL specified ──────────────────────
    // Applied AFTER loadUserPreferences so an explicit link always wins over
    // this browser's saved settings, while anything the link omits keeps the
    // user's own preference.
    if (typeof DEEP_BONUS !== 'undefined' && DEEP_BONUS) {
      selectedBonuses = DEEP_BONUS.split(',').filter(function(b) { return b; });
      // A shared link can carry several bonus numbers — it may have been built
      // before the limit existed, or by someone who has lifted it. This
      // browser's setting wins: arriving in a state the UI itself refuses to
      // produce is worse than losing part of someone else's filter.
      if (!allowMultiBonusFilter && selectedBonuses.length > 1) {
        selectedBonuses = selectedBonuses.slice(0, 1);
      }
    }

    // The time controls are synced across pages by data-sync, so setting the
    // canonical control and mirroring it is what a real change does too.
    if (typeof DEEP_HOURS !== 'undefined' && DEEP_HOURS) {
      $('hoursRange').value = DEEP_HOURS;
      var dlHours = document.querySelectorAll('[data-sync="hoursRange"]');
      for (var dh = 0; dh < dlHours.length; dh++) { dlHours[dh].value = DEEP_HOURS; }
    }
    if (typeof DEEP_WINDOW !== 'undefined' && DEEP_WINDOW) {
      $('timeWindow').value = DEEP_WINDOW;
      var dlWins = document.querySelectorAll('[data-sync="timeWindow"]');
      for (var dw = 0; dw < dlWins.length; dw++) { dlWins[dw].value = DEEP_WINDOW; }
    }

    // A link naming a building beats the saved preference: the sender chose
    // what to show, and the recipient's own filter would otherwise silently
    // reframe it.
    if (typeof DEEP_SITE !== 'undefined' && DEEP_SITE) { siteFilter = DEEP_SITE; }
    if (typeof syncSiteUi_ === 'function') syncSiteUi_();

    // ALWAYS start on Live so a stale archive is never auto-loaded — unless the
    // link explicitly asked for a dated snapshot (handled once the archive list
    // arrives, since the date has to be matched against it).
    currentArchiveUrl = null;

    // Paint the last known LIVE view instantly from localStorage, then refresh
    // in the background. If there's nothing usable cached we fall back to the
    // normal blocking spinner. Skipped on a first visit (no cache) and while
    // the guided tour is running, since the tour renders its own demo data.
    var paintedFromCache = false;
    if (!tourActive) {
      paintedFromCache = renderCachedPayload_();
    }
    if (paintedFromCache) {
      var lo = $('loadingOverlay');
      if (lo) lo.classList.remove('active');
      document.body.classList.remove('loading-skeleton');
    }

    // Fire BOTH server round-trips in parallel — they don't depend on each
    // other, so waiting for the archive list before requesting data was
    // doubling time-to-first-data.
    if (typeof initDatePicker_ === 'function') initDatePicker_();
    populateArchiveDropdown();
    // silent=true when we already painted cached data: refresh in the
    // background rather than covering the populated dashboard with a spinner.
    loadDataPak(null, paintedFromCache);

    $('archiveSelect').addEventListener('change', function() {
      currentArchiveUrl = this.value;
      if (currentArchiveUrl) {
        var syncedHours = document.querySelectorAll('[data-sync="hoursRange"]');
        for (var i = 0; i < syncedHours.length; i++) { syncedHours[i].value = '24'; }
        var syncedWindows = document.querySelectorAll('[data-sync="timeWindow"]');
        for (var i = 0; i < syncedWindows.length; i++) { syncedWindows[i].value = '60'; }
      }
      loadDataPak(currentArchiveUrl);
    });

    // Drive the auto-refresh from a 1s ticker instead of a bare 60s interval, so
    // the countdown can be shown and the whole thing can be paused.
    nextPollAt = Date.now() + POLL_INTERVAL_MS;
    setInterval(refreshTick_, 1000);

    // Re-evaluate staleness locally (no server call) so the warning appears
    // while the page is left open, not only on the next successful load.
    setInterval(function () {
      updateStaleWarning_();
      renderLastUpdate_();
    }, 30000);

  });

  // Registered as its OWN DOMContentLoaded listener rather than as the last
  // line of the one above. Listeners run independently, so if anything in the
  // main init throws, a first-time visitor still gets the tour instead of it
  // silently never appearing.
  document.addEventListener('DOMContentLoaded', function() {
    // Setup first, tour second, and only ever one of them starts here: the
    // dialog's own commit hands over to the tour when it closes. Running both
    // would put the tour's spotlight behind a modal backdrop.
    //
    // Listeners run in registration order, so loadUserPreferences() in the main
    // init above has already restored the building and hidden-area state that
    // the dialog seeds itself from.
    if (typeof shouldShowOnboarding_ === 'function' && shouldShowOnboarding_()) {
      openOnboarding_({ chainTour: true });
      return;
    }
    // Shows demo data while the real data keeps loading in the background.
    maybeAutoStartTour_();
  });

  var _searchDebounce = null;
  $('search').addEventListener('input', function() {
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(function() { renderMainTablePak(currentMainRows); }, 200);
  });
</script>
