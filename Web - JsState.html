// ── Work-area colour ──────────────────────────────────────────────────
// Colour carries two things at once: hue says which FAMILY of work an area
// belongs to, lightness says which area within it. So the six Pickings are
// six blues, the four Returns four oranges, and the four Packings four
// greens - the grouping reads off a chart without anyone consulting a legend.
//
// Both columns are generated in OKLCH from the eight fixed hues below and
// measured, not eyeballed: every colour sits inside its mode's lightness
// band, clears the chroma floor under which a hue starts reading as grey, and
// every family ramp is monotone with a real lightness step between
// neighbours. The dark column is its own set of steps chosen for the dark
// surface, not the light column lightened.
//
// Within a family, LATER IN THIS LIST IS LIGHTER. That is a rule, not an
// accident, and tools/test_palette.js asserts it: the ramps used to be
// monotone only by luck, and reordering the areas silently broke the oranges
// into mid-light-dark, which no check would have caught.
//
// What colour cannot do: twenty-four shades are not all tellable apart at once,
// and no palette fixes that - it is a limit of the eye, not of the hexes. Six
// blues in one family is close to that limit, and the tightest pairs on the
// whole dashboard now sit INSIDE Picking rather than between families. On the
// charts that put every area on one plot, the legend and the hover tooltip
// are what identify a series; colour groups them and narrows the search, but
// it is not asked to carry the identification alone.

  { key: 'rspsPickVol', stdKey: 'rspsPickStd', label: 'RSPS Pick', family: 'Picking', color: '#014ea0', colorDark: '#0155a8' },

// Bumped whenever VOLUME_TYPES is REORDERED (not when an area is added, renamed
// or recoloured). The saved volume-panel arrangement is stored as positions -

// 1 = the original order, 2 = grouped by family Picking first, 3 = the two

// 5 = Forward TPA inserted after OSR Top Up, which shifts every position
// below it - inserting mid-list is a reorder even though nothing moved by

// The eight family hues every work-area shade is derived from. Their ORDER is
// a safety property, not a taste one - it is what keeps neighbouring hues
// apart under red-green colour blindness - so it does not get re-ordered to
// look nicer. A family hue is never handed to an individual area; the areas
// wear lightness steps of it.
//

// BPP and Automation Pick from this list left Packing next to Parcel, a pair
// that measures ΔE 2.0 under deuteranopia on the dark surface - a hard fail.
// Moving Inducting between them puts the worst adjacent pair back at ΔE 11.6.
//
// TP Retail leads for the same kind of reason. Its gold was measured at every
// position in this list, and first is the only one that introduces no new
// worst pair at all - the worst stays the Packing/Returns pair that was
// already here, ΔE 9.2 light and 9.4 dark. Being first says nothing about the

/**
 * The colour to draw `t` in right now, for anything carrying a color /
 * colorDark pair - a work area or a family. Resolving here rather than at
 * each call site is what makes the theme toggle one rebuild instead of a
 * conditional at every place a colour is used.
 */
function areaColor_(t) {
  if (!t) return '#888888';
  return (currentTheme === 'dark' && t.colorDark) ? t.colorDark : t.color;
}


// ── The site filter ────────────────────────────────────────────────────────
// Elmsall is three buildings, and most people only run one of them. The header
// title doubles as the picker, so what the dashboard says it is showing and
// what it IS showing cannot drift apart.
//
// E3 EDW Induct is filed under E3 because that is where the hours are earned:
// the operator stands in E3 inducting totes that arrived from the E1/E2
// warehouse. It was called "E1/E2 Inducting", which read as an E1/E2 area and
// made this mapping look like a mistake; the name now says the building and
// the source, so it no longer needs defending. The key is still
// e1e2Inducting, because renaming that would break every saved layout and
// every archive's column map.
var AREA_SITE = {
  pie: 'e3', topUp: 'e3', e3Packing: 'e3', parcelInduct: 'e3',
  parcelSortation: 'e3', inboundDecanting: 'e3', osrDecanting: 'e3',
  bcrInducting: 'e3', e1e2Inducting: 'e3', onlinePickingE3: 'e3', e3Bpp: 'e3',
  sorter6Packing: 'e1e2', onlinePickingDrive: 'e1e2', onlinePickingWay: 'e1e2',
  e1e2Bpp: 'e1e2',
  // Returns processing, all four in E1/E2.
  rspsTopUp: 'e1e2', rspsPick: 'e1e2', ispsTopUp: 'e1e2', ispsPick: 'e1e2',
  // Sorter 6, so E1/E2 with the packing area of the same name.
  sorter6ItemInduct: 'e1e2', sorter6ParcelInduct: 'e1e2',

  // buildings, so the area stays visible whichever one is picked. Forward

  // building to file it under, and filing it under either would hide real

  // Despatch, packing retail boxsets in E1/E2.
  tpRetail: 'e1e2',
  // Returns-to-fulfilment putaway, E1/E2.
  rtf: 'e1e2'
};

var SITES = [
  { key: 'all',  title: 'Elmsall Live Productivity', short: 'Elmsall' },
  { key: 'e3',   title: 'E3 Live Productivity',      short: 'E3' },
  { key: 'e1e2', title: 'E1/E2 Live Productivity',   short: 'E1/E2' }
];

// siteFilterPreferred is what the user chose; siteFilter is what is actually
// in force. They differ while a bonus filter is active - see
// effectiveSiteFilter_ below - and only the preference is ever saved.
var siteFilterPreferred = 'all';
var siteFilter = 'all';

/**
 * The building actually in force.
 *
 * Filtering to a bonus number is a question about a PERSON, and a person is not
 * confined to one building: an operator can pick in Drive before lunch and pack
 * in E3 after it. Answering "how did they do" with only one building's half of
 * their shift is worse than not answering - so a bonus filter overrides the
 * building filter and shows the whole site. Clearing it hands the building
 * back.
 */
function effectiveSiteFilter_() {
  var filtering = (typeof selectedBonuses !== 'undefined') && selectedBonuses.length > 0;
  return filtering ? 'all' : siteFilterPreferred;
}

/** True when a bonus filter is currently overriding a chosen building. */
function siteFilterOverridden_() {
  return siteFilterPreferred !== 'all' && effectiveSiteFilter_() === 'all';
}

// ── Per-building chart settings ─────────────────────────────────────────────
// Anything configured as a list of AREA KEYS belongs to one building, because
// the areas do. A single shared copy meant a group built in E1/E2 - "RSPS Pick"
// - was still listed in the Groups & Charts dialog while viewing E3, offering a
// chart of areas that building does not have.
//
// So each building keeps its own. An absent entry means "never configured
// here", which falls back to the default rule (the first three visible areas,
// collected by family) rather than to whatever the last building was doing.
//
// Deliberately NOT covering hiddenVolumeAreas: every area belongs to exactly
// one building, so one list is already partitioned by building - hiding E3's
// areas cannot affect what E1/E2 shows. Nor the panel ORDER, which is a
// statement about the page rather than about any area.
var siteSettings_ = {};

var SITE_SETTING_KEYS_ = ['areaGroups', 'areaGroupSplit', 'trendSplit', 'overviewVolAreas'];

function cloneJson_(v) {
  try { return JSON.parse(JSON.stringify(v)); } catch (e) { return null; }
}

// Which buildings the user has actually configured. Recorded when a dialog is
// applied rather than inferred by comparing the live values against the
// default, because those two things are not the same: hiding a work area moves
// the default, which instantly makes an untouched building's live state look
// like a deliberate edit. Inferring froze that stale copy and the building
// stopped following its own visible areas - the exact fallback this is for.
// site -> { <field>: true }. Per FIELD, not per building: resetting the work
// area groups must not also throw away that building's Deployment Trend split,
// which is a different dialog answering a different question.
var siteSettingsTouched_ = {};

/** Records that one setting has been configured by hand for this building. */
function markSiteSettingsTouched_(site, field) {
  var s = site || siteFilter;
  if (!siteSettingsTouched_[s]) siteSettingsTouched_[s] = {};
  siteSettingsTouched_[s][field] = true;
}

/** Puts one setting back on the default rule for this building. */
function forgetSiteSetting_(site, field) {
  if (!site) return;
  if (siteSettingsTouched_[site]) delete siteSettingsTouched_[site][field];
  if (siteSettings_[site]) delete siteSettings_[site][field];
}

/**
 * Remembers the live settings under `site`, so switching away keeps them.
 *
 * A building nobody has configured stays absent from siteSettings_, which is
 * what "no save for this building" means - it keeps deriving from the rule, so
 * hiding an area later still moves its groups onto the areas it can show.
 *
 * Must be called while `site` is the building in view: these are the live
 * values, and they describe whatever is currently in scope.
 */
function captureSiteSettings_(site) {
  if (!site) return;
  var touched = siteSettingsTouched_[site] || {};
  var entry = {};
  // The groups and their split are one dialog and one Apply, so they are held
  // and released together - a split is meaningless without the groups it indexes.
  if (touched.areaGroups) {
    entry.areaGroups = cloneJson_(areaGroupState);
    entry.areaGroupSplit = cloneJson_(areaGroupSplitState);
  }
  if (touched.trendSplit) entry.trendSplit = cloneJson_(trendSplitState);
  if (touched.overviewVolAreas) entry.overviewVolAreas = overviewVolAreas.slice();

  if (Object.keys(entry).length > 0) siteSettings_[site] = entry;
  else delete siteSettings_[site];
}

/**
 * Makes `site`'s settings the live ones.
 *
 * Must run AFTER siteFilter has moved: the defaults are derived from the areas
 * in view, so computing them against the outgoing building would seed the new
 * one with the old one's areas - the bug this whole mechanism exists to fix.
 */
function applySiteSettings_(site) {
  var s = siteSettings_[site] || {};
  areaGroupState = s.areaGroups ? cloneJson_(s.areaGroups) : defaultAreaGroupState_();
  areaGroupSplitState = s.areaGroupSplit ? cloneJson_(s.areaGroupSplit) : defaultAreaGroupSplitState_();
  trendSplitState = s.trendSplit ? cloneJson_(s.trendSplit) : { enabled: false, charts: [] };
  overviewVolAreas = s.overviewVolAreas ? s.overviewVolAreas.slice() : [];
}

/** Drops a building's saved settings, so it falls back to the default rule. */
function forgetSiteSettings_(site) {
  if (!site) return;
  delete siteSettings_[site];
  delete siteSettingsTouched_[site];
}

/**
 * Brings siteFilter into line with the preference and the bonus filter, and
 * re-scopes the payload if it moved. Called at the top of applyLocalFiltersPak,
 * which every path that touches the bonus selection already ends in - so the
 * eight places that add, remove, replace or clear a bonus need no changes.
 */
function syncSiteScope_() {
  var want = effectiveSiteFilter_();
  if (want === siteFilter) return false;
  // Capture before the move and apply after it, so each building keeps whatever
  // was last set up while looking at it - however it was set up. Hanging this
  // off the switch rather than off each dialog's Apply means a change made by
  // any route is remembered, including a legend click.
  captureSiteSettings_(siteFilter);
  siteFilter = want;
  applySiteSettings_(siteFilter);
  rawSideData = scopeRowsToSite_(allSideData);
  if (typeof syncSiteUi_ === 'function') syncSiteUi_();
  return true;
}

// The unscoped payload. rawSideData holds the SCOPED view, so every existing
// reader of it - KPIs, charts, tables, export, breakdown - narrows to the
// chosen building without knowing the filter exists.
var allSideData = [];

// 'pieVol' and 'pieStd' both describe the area 'pie'.
function areaBaseKey_(key) {
  return String(key || '').replace(/(Vol|Std)$/, '');
}

// True for anything that is not a work area at all (Date Time, Productivity %,
// and so on), so a column list can be filtered without losing its scaffolding.
function areaInSite_(key) {
  var base = areaBaseKey_(key);
  if (!AREA_SITE.hasOwnProperty(base)) return true;
  // An area declared 'all' is worked in every building, so it survives
  // every filter - the same answer this already gives for a column that is
  // not a work area, but reached deliberately rather than by omission.
  if (AREA_SITE[base] === 'all') return true;
  return siteFilter === 'all' || AREA_SITE[base] === siteFilter;
}

function filterAreaList_(list) {
  if (siteFilter === 'all') return list;
  return list.filter(function (x) { return areaInSite_(x.key); });
}

// Rendering reads these; validation deliberately does NOT. A saved area group
// or hidden-area choice naming the other building stays valid and comes back
// intact when the filter is cleared, rather than being pruned on sight.
function volumeTypesActive_()      { return filterAreaList_(VOLUME_TYPES); }
function breakdownAreasActive_()   { return filterAreaList_(BREAKDOWN_AREAS); }
function mainMetricColumnsActive_(){ return filterAreaList_(MAIN_TABLE_METRIC_COLUMNS); }
function sortableColumnsActive_()  { return filterAreaList_(mainTableSortableColumns); }

/**
 * Joins work-area labels for a chart title, folding a shared suffix.
 *
 * "Drive - Online Picking, Way - Online Picking, E3 - Online Picking" says
 * "Online Picking" three times and pushes the useful part off the end of the
 * panel. Areas named "<where> - <what>" that share the same <what> collapse to
 * "Drive, Way & E3 - Online Picking".
 *
 * `sep` joins the pieces that remain: ", " by default, " & " where the
 * caller wants the two-item reading ("OSR PiE & OSR Top Up").
 *
 * Folding is per family and order-preserving, so a mixed group still reads
 * correctly: Drive, Way and Sorter 6 Packing gives
 * "Drive & Way - Online Picking, Sorter 6 Packing" rather than all-or-nothing.
 */
function joinAreaLabels_(labels, sep) {
  var order = [], bySuffix = {};
  for (var i = 0; i < labels.length; i++) {
    var label = String(labels[i]);
    var cut = label.indexOf(' - ');
    var suffix = cut === -1 ? null : label.slice(cut + 3);
    var prefix = cut === -1 ? label : label.slice(0, cut);
    // A label with no " - " is its own family, keyed on itself so two
    // different plain labels never merge.
    var key = suffix === null ? '\u0000' + label + i : suffix;
    if (!bySuffix[key]) { bySuffix[key] = { suffix: suffix, parts: [] }; order.push(key); }
    bySuffix[key].parts.push(prefix);
  }

  var out = [];
  for (var o = 0; o < order.length; o++) {
    var fam = bySuffix[order[o]];
    if (fam.suffix === null || fam.parts.length === 1) {
      out.push(fam.suffix === null ? fam.parts[0] : fam.parts[0] + ' - ' + fam.suffix);
      continue;
    }
    var head = fam.parts.slice(0, -1).join(', ');
    out.push(head + ' & ' + fam.parts[fam.parts.length - 1] + ' - ' + fam.suffix);
  }
  return out.join(sep || ', ');
}

function siteConfig_(key) {
  for (var i = 0; i < SITES.length; i++) { if (SITES[i].key === key) return SITES[i]; }
  return SITES[0];
}

/**
 * The payload, narrowed to the chosen building.
 *
 * `value` is the row's total standard hours across every area, and the whole
 * dashboard is built on it - KPIs, the productivity ratio, the threshold test.
 * Rewriting it to the chosen building's hours is what turns this from "hide
 * some charts" into an actual E3 or E1/E2 dashboard, and it means none of
 * those consumers need to know about the filter.
 *
 * A row with no hours AND no volume in this building is dropped rather than
 * kept at zero, so head counts describe who worked in the building rather than
 * who was on site. An operator who worked in both is counted in both, which is
 * the honest answer when their hours genuinely split across two buildings.
 */
function scopeRowsToSite_(rows) {
  if (siteFilter === 'all') return rows.slice();

  var stdKeys = [], volKeys = [];
  for (var i = 0; i < VOLUME_TYPES.length; i++) {
    if (!areaInSite_(VOLUME_TYPES[i].key)) continue;
    stdKeys.push(VOLUME_TYPES[i].stdKey);
    volKeys.push(areaBaseKey_(VOLUME_TYPES[i].key));
  }

  var out = [];
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r], std = 0, vol = 0;
    for (var s = 0; s < stdKeys.length; s++) { std += Number(row[stdKeys[s]]) || 0; }
    for (var v = 0; v < volKeys.length; v++) { vol += Number(row[volKeys[v]]) || 0; }
    // An OS block is zero in every area by definition, so this test alone
    // drops it from every building - and with it the operator, who then
    // cannot be found in the bonus search at all unless the view happens to
    // be on Elmsall. OS belongs to no building because the log records no
    // area, so rather than guess one, keep it in both: the alternative is a
    // person who was demonstrably on site being invisible. Their `value`
    // still resolves to 0 below, so they stay inert in every figure.
    if (std <= 0 && vol <= 0 && !row.os) continue;

    var copy = {};
    for (var k in row) { if (row.hasOwnProperty(k)) copy[k] = row[k]; }
    copy.value = std;
    out.push(copy);
  }
  return out;
}

// Parcel Induct used to sit after Parcel Sortation here and before it

var MAIN_TABLE_METRIC_COLUMNS = [

var mainTableSortableColumns = [

// Caches the last-known table/card mode so the resize handler only re-renders on an actual flip.
var lastMainTableCardMode = null;

// Colours for user-composed area GROUPS. A group is any set of areas someone
// chose to combine, so it has no family - it just takes the next of the eight
// hues in their fixed order, which is the case those hues were selected and
// checked for.
//
// Written out rather than derived from AREA_FAMILIES, which is where they used
// to come from. There are six families now and MAX_AREA_GROUPS is seven, so
// deriving would wrap groupColor_ round to the start and hand two groups in
// the same dialog the same hue. Eight is a property of this list - the number
// of mutually distinguishable hues - and has nothing to do with how many
// families happen to exist.
var AREA_GROUP_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
var AREA_GROUP_COLORS_DARK = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];

/** The nth group's colour in the current theme, wrapping past the eighth. */
function groupColor_(i) {
  var list = (currentTheme === 'dark') ? AREA_GROUP_COLORS_DARK : AREA_GROUP_COLORS;
  return list[((i % list.length) + list.length) % list.length];
}
/**
 * The areas the Overall page's volume chart draws.
 *
 * Two hard-coded picking areas used to be the answer, which meant the first
 * chart on the dashboard showed the same thing whatever the viewer had said
 * they cared about. It now follows their own selection, and the default falls
 * out of that rather than being a second list to keep in step: the areas they
 * kept visible, in VOLUME_TYPES order, first two.
 *
 * Never returns empty. A chart with no series is a bare axis, which reads as
 * broken rather than as "nothing selected" - and the selection UI already
 * refuses to remove the last area, so an empty result here means the building
 * changed underneath a saved choice, not that the user asked for nothing.
 */
function overviewVolTypes_() {
  var inSite = filterAreaList_(VOLUME_TYPES);
  if (inSite.length === 0) inSite = VOLUME_TYPES;

  // An EXPLICIT choice is honoured whatever the chips are hiding. The chips
  // filter the Volume page's panels; this chart is its own question, and
  // intersecting the two meant a deliberately chosen area silently vanished
  // from here because it had been hidden somewhere else.
  //
  // Still filtered by BUILDING: a saved choice naming the other building is
  // kept rather than pruned, so it has to be excluded at read time.
  if (overviewVolAreas.length) {
    var kept = inSite.filter(function (t) {
      return overviewVolAreas.indexOf(t.key) !== -1;
    });
    if (kept.length) return kept;
  }

  // With no choice made, the DEFAULT still follows what is visible - "the
  // first two you can see" is what the onboarding answer meant.
  var visible = inSite.filter(function (t) {
    return hiddenVolumeAreas.indexOf(t.key) === -1;
  });
  if (visible.length === 0) visible = inSite;
  return visible.slice(0, 2);
}

/**
 * The default work-area groups: the first three areas in view, with areas of
 * the same family collected into one group.
 *
 * Grouping by family is what makes the default say something. Three areas as
 * three separate groups is just three lines with a legend; RSPS Pick and ISPS
 * Pick drawn as one "Picking" group against a Returns group is a comparison -
 * and it is the comparison the family structure already claims is meaningful.
 *
 * Reads the same visible set the volume chart does, so the two charts on the
 * Overall page lead on the same work rather than disagreeing about what the
 * viewer came to see.
 */
function defaultAreaGroupsForSite_() {
  // hiddenVolumeAreas is declared further down this file, and areaGroupState is
  // initialised from here at parse time - so on that first call the var is
  // hoisted but still undefined. Nothing is hidden that early anyway.
  var hidden = (typeof hiddenVolumeAreas !== 'undefined' && hiddenVolumeAreas) ? hiddenVolumeAreas : [];
  var visible = volumeTypesActive_().filter(function (t) {
    return hidden.indexOf(t.key) === -1;
  });
  if (visible.length === 0) visible = filterAreaList_(VOLUME_TYPES);
  if (visible.length === 0) visible = VOLUME_TYPES;

  var groups = [], byFamily = {};
  var lead = visible.slice(0, 3);
  for (var i = 0; i < lead.length; i++) {
    var fam = lead[i].family;
    if (byFamily.hasOwnProperty(fam)) {
      groups[byFamily[fam]].push(lead[i].key);
    } else {
      byFamily[fam] = groups.length;
      groups.push([lead[i].key]);
    }
  }
  return groups;
}

var MAX_AREA_GROUPS = 7;

function defaultAreaGroupState_() {
  return defaultAreaGroupsForSite_().map(function(g) {
    return { keys: g.slice(), showLine: true, showTrend: true };

}

var areaGroupState = defaultAreaGroupState_();

// One chart by default, carrying every group. The dialog still OFFERS a second,
// empty chart as an affordance (see openAreaGroups) — but an empty chart is
// dropped on Apply, so the default that actually renders stays a single chart.
function defaultAreaGroupSplitState_() {
  return { enabled: false, charts: [] };
}

// The Bonus page's breakdown bars, over the same twenty-one areas as
// VOLUME_TYPES - so they are DERIVED from it rather than restated. The hand
// written copy that used to live here had to be edited in lockstep every time
// an area was added or a colour changed, which is the same second-source-of-
// truth that has caused trouble elsewhere in this pipeline.
//
// The keys differ by one suffix and that is the only reason this list exists:
// breakdown reads the raw side data, whose volume field is the bare area name
// ('pie'), while VOLUME_TYPES is keyed for the shaped rows ('pieVol').
var BREAKDOWN_AREAS = VOLUME_TYPES.map(function(t) {
  return { key: areaBaseKey_(t.key), label: t.label, family: t.family,
           color: t.color, colorDark: t.colorDark };
});

// APP_CONFIG.colors is the CHART palette — saturated colours chosen to read as
// distinct series against a plot background. It used to be pushed into
// --color-good/warn/bad as inline styles on <html>, which beat both the :root
// and the .dark-theme token blocks and so applied one palette to both themes.
//
// That is why warn text was unreadable in light mode: #ffcc66 is a mid-yellow
// picked to glow on a dark plot, and on white it has a contrast ratio of about
// 1.5:1. The stylesheet already carries proper per-theme values (#cc4b00 light,
// #ff9d5c dark) which had simply never been allowed to take effect.
//
// The charts are unaffected — they read APP_CONFIG.colors directly rather than
// through CSS, so the two palettes can now differ, which is the point: a
// colour that works as a bar fill is not automatically a colour that works as
// 11px text.
// Every alpha of the accent used anywhere in the stylesheet. Derived here
// rather than written out per theme so a tint cannot drift from the accent it
// is a tint of — which is exactly what had happened: --accent was being set to
// APP_CONFIG's blue at runtime while --accent-10/14/15/22 stayed the authored
// teal, so accent borders and accent fills were two different colours.
var ACCENT_ALPHAS = [4, 7, 8, 10, 14, 15, 18, 20, 22, 25, 28, 30, 35, 40, 45, 55, 65, 75, 95];

function applyConfigToCSSPak() {
  var root = document.documentElement;
  var accent = APP_CONFIG.colors.accent;
  root.style.setProperty('--accent', accent);
  for (var i = 0; i < ACCENT_ALPHAS.length; i++) {
    var a = ACCENT_ALPHAS[i];
    root.style.setProperty('--accent-' + a, hexToRgbaPak(accent, a / 100));
  }

  // Every area-picking dialog lays its checkboxes out in equal columns, and
  // they were fixed at nine across - which is narrower than the longest area
  // name, so the names were being truncated to "E3 - Onlin...". Sizing the
  // column to the longest label instead means the count per row falls out of
  // however wide the dialog is, the columns stay equal so the ticks line up
  // vertically, and nothing needs revisiting when an area is added or renamed.
  //
  // Measured in ch off the longest label rather than by reading offsetWidth:
  // these dialogs are display:none until opened, so a real measurement reads
  // zero at the moment this runs. ch is the width of a '0', which for a
  // proportional font over-estimates slightly - which is the safe direction.
  var longest = 0;
  for (var v = 0; v < VOLUME_TYPES.length; v++) {
    longest = Math.max(longest, String(VOLUME_TYPES[v].label || '').length);
  }
  // The checkbox, the colour dot and the two gaps beside them.
  root.style.setProperty('--area-chip-w', 'calc(' + longest + 'ch + 46px)');
}
