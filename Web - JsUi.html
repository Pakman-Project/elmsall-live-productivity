<script>
  function updateClearBtnVisibility() {
    var btn = $('clearFilterBtn');
    if (selectedBonuses.length > 0) {
      btn.style.display = 'flex';
    } else {
      btn.style.display = 'none';
    }
  }

  // Clearing throws away a selection that may have taken a while to build, from
  // a small X in the header or a "Clear all" in the banner — both easy to hit
  // by accident. There is no confirm here on purpose: a prompt on every clear
  // would be tiresome for the common case where the user meant it. An undo
  // costs nothing when it is not wanted.
  function clearAllBonuses() {
    if (selectedBonuses.length === 0) return;
    var previous = selectedBonuses.slice();
    selectedBonuses = [];
    renderBonusChips();
    updateClearBtnVisibility();
    applyLocalFiltersPak();

    showToastPak(
      'Cleared ' + previous.length + ' bonus filter' + (previous.length === 1 ? '' : 's') + '.',
      {
        icon: 'fa-filter-circle-xmark',
        action: {
          label: 'Undo',
          onClick: function () {
            selectedBonuses = previous;
            renderBonusChips();
            updateClearBtnVisibility();
            applyLocalFiltersPak();
          }
        }
      }
    );
  }

  // ── Bonus search ───────────────────────────────────────────────────────────
  // The suggestion list is a real combobox: arrow keys move through it, Enter
  // picks, Escape closes. Previously it was mouse-only — the keyboard could put
  // a caret in the box but never reach a suggestion — and an unmatched query
  // just made the list vanish, which reads as the search having broken rather
  // than as "nothing matches that".

  // Long lists are capped so a one- or two-character query doesn't build (and
  // the browser doesn't lay out) hundreds of rows on every keystroke.
  var SEARCH_MAX_VISIBLE = 50;

  var _searchMatches = [];   // the bonus numbers currently listed, in order
  var _searchActiveIdx = -1; // highlighted row, or -1 for none

  function renderSearchDropdown_(matches, total, query) {
    var dropdown = $('searchDropdown');
    var html = '';

    if (matches.length === 0) {
      // Say so, rather than silently closing.
      html = '<div class="search-empty">No bonus numbers match &ldquo;' +
             safeTextPak(query) + '&rdquo;</div>';
    } else {
      for (var i = 0; i < matches.length; i++) {
        var b = matches[i];
        var picked = selectedBonuses.indexOf(b) !== -1;
        html += '<div class="search-item' + (picked ? ' picked' : '') + '"' +
                ' id="searchItem' + i + '"' +
                ' role="option" aria-selected="' + (picked ? 'true' : 'false') + '"' +
                ' data-idx="' + i + '"' +
                ' title="' + (picked ? 'Already filtering by this — select to remove' : 'Add to the filter') + '">' +
                '<span class="search-item-name">' + safeTextPak(b) + '</span>' +
                (picked ? '<i class="fa-solid fa-check search-item-check"></i>' : '') +
                '</div>';
      }
      if (total > matches.length) {
        html += '<div class="search-more">' + (total - matches.length) +
                ' more match — keep typing to narrow the list</div>';
      }
    }

    dropdown.innerHTML = html;
    dropdown.classList.add('active');
    $('bonusSearch').setAttribute('aria-expanded', 'true');
  }

  function closeSearchDropdown_() {
    var dropdown = $('searchDropdown');
    if (dropdown) dropdown.classList.remove('active');
    _searchMatches = [];
    _searchActiveIdx = -1;
    var input = $('bonusSearch');
    if (input) {
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
    }
  }

  function setSearchActive_(idx) {
    var dropdown = $('searchDropdown');
    var items = dropdown.querySelectorAll('.search-item');
    if (items.length === 0) return;

    // Wrap around: from the last row, Down returns to the first.
    if (idx < 0) idx = items.length - 1;
    if (idx >= items.length) idx = 0;
    _searchActiveIdx = idx;

    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', i === idx);
    }
    // The highlighted row is often below the fold of the 250px-tall list.
    scrollIntoViewPak_(items[idx], 'nearest');
    $('bonusSearch').setAttribute('aria-activedescendant', items[idx].id);
  }

  function runSearchQuery_() {
    var input = $('bonusSearch');
    var q = input.value.toLowerCase().trim();
    if (!q) { closeSearchDropdown_(); return; }

    var all = allBonusList.filter(function(b) {
      return String(b).toLowerCase().indexOf(q) !== -1;
    });
    _searchMatches = all.slice(0, SEARCH_MAX_VISIBLE);
    _searchActiveIdx = -1;
    renderSearchDropdown_(_searchMatches, all.length, input.value.trim());
  }

  function initBonusSearch() {
    var input = $('bonusSearch');
    var dropdown = $('searchDropdown');

    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-controls', 'searchDropdown');
    dropdown.setAttribute('role', 'listbox');

    input.addEventListener('input', runSearchQuery_);

    input.addEventListener('focus', function() {
      if (input.value.trim()) runSearchQuery_();
    });

    input.addEventListener('keydown', function(e) {
      var open = dropdown.classList.contains('active');

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        // Reopen on Down if the list was dismissed but the query is still there.
        if (!open) {
          if (input.value.trim()) { runSearchQuery_(); open = true; }
          else return;
        }
        if (_searchMatches.length === 0) return;
        e.preventDefault();
        setSearchActive_(_searchActiveIdx + (e.key === 'ArrowDown' ? 1 : -1));
        return;
      }

      if (!open) return;

      if (e.key === 'Enter') {
        // With nothing highlighted, take the first match — the common case is
        // "type enough to be unique, press Enter".
        var idx = _searchActiveIdx >= 0 ? _searchActiveIdx : 0;
        if (_searchMatches.length > idx) {
          e.preventDefault();
          chooseSearchResult_(_searchMatches[idx]);
        }
      } else if (e.key === 'Escape') {
        // Swallowed so it closes only the list; a second press can then reach
        // anything else listening for Escape.
        e.preventDefault();
        e.stopPropagation();
        closeSearchDropdown_();
      } else if (e.key === 'Tab') {
        closeSearchDropdown_();
      }
    });

    // Delegated rather than an inline onclick carrying the bonus number through
    // an HTML attribute and a JS string literal — a name containing a quote or
    // backslash used to break that round trip.
    dropdown.addEventListener('mousedown', function(e) {
      var item = e.target.closest('.search-item');
      if (!item) return;
      // mousedown, not click: the input would otherwise blur first and the
      // document listener below would close the list out from under the click.
      e.preventDefault();
      var idx = parseInt(item.dataset.idx, 10);
      if (!isNaN(idx) && _searchMatches[idx] !== undefined) {
        chooseSearchResult_(_searchMatches[idx]);
      }
    });

    dropdown.addEventListener('mousemove', function(e) {
      var item = e.target.closest('.search-item');
      if (!item) return;
      var idx = parseInt(item.dataset.idx, 10);
      if (!isNaN(idx) && idx !== _searchActiveIdx) setSearchActive_(idx);
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.bonus-search-container')) closeSearchDropdown_();
    });
  }

  // Picking a row toggles it: an entry already in the filter is shown with a
  // tick and choosing it again removes it, so the list doubles as a view of
  // what is currently applied.
  function chooseSearchResult_(bonus) {
    var input = $('bonusSearch');
    if (selectedBonuses.indexOf(bonus) !== -1) {
      removeBonus(bonus);
      // Keep the list up so the tick visibly clears, and so several can be
      // toggled in a row without retyping.
      runSearchQuery_();
      input.focus();
      return;
    }
    selectBonus(bonus);
    input.focus();
  }

  function selectBonus(bonus) {
    if (selectedBonuses.indexOf(bonus) === -1) {
      applyBonusPick_(bonus);
    }
    $('bonusSearch').value = '';
    closeSearchDropdown_();
  }

  function removeBonus(bonus) {
    selectedBonuses = selectedBonuses.filter(function(b) { return b !== bonus; });
    renderBonusChips();
    updateClearBtnVisibility();
    applyLocalFiltersPak();
  }

  // ── One bonus number at a time ─────────────────────────────────────────────
  // By default a pick REPLACES the filter rather than adding to it, and the
  // view jumps to the top of Overall. The two go together: a bonus number can
  // be picked from the Bonus page, from an expanded Data Table row or from the
  // breakdown dialog, and in every one of those places the filter's real effect
  // — the KPIs and charts on Overall — is somewhere the user cannot see. A
  // filter that silently changes four pages you are not looking at is a filter
  // people forget they applied.
  //
  // Both halves are lifted by the single setting in the "?" dialog, because
  // they are two halves of one decision: someone comparing several people at
  // once also wants to stay where they are while building the set.
  function applyBonusPick_(bonus) {
    if (allowMultiBonusFilter) {
      selectedBonuses.push(bonus);
    } else {
      selectedBonuses = [bonus];
    }
    renderBonusChips();
    updateClearBtnVisibility();
    applyLocalFiltersPak();
    focusOverallAfterFilter_();
  }

  function focusOverallAfterFilter_() {
    // Someone building a multi-bonus set is deliberately staying put.
    if (allowMultiBonusFilter) return;
    // The tour drives these same controls. Yanking the page out from under a
    // step would leave the spotlight ringing an element that is no longer on
    // screen — the exact failure the slideshow rewrite was meant to end.
    if (typeof tourActive !== 'undefined' && tourActive) return;

    // The breakdown dialog is one of the places a bonus number is picked, and
    // it covers the page being jumped to. Scrolling underneath it would look
    // like nothing had happened.
    var overlay = $('breakdownOverlay');
    if (overlay && overlay.classList.contains('active') &&
        typeof closeBreakdown === 'function') {
      closeBreakdown();
    }

    if (currentPage !== 0) goToPage(0);
    // keepFocus: the pick often comes from the header search box, and moving
    // focus to the page rail mid-search would strand the user's typing.
    scrollCurrentPageToTop_(true);
  }

  // Lifting the limit is a plain preference change. Re-imposing it has to
  // reconcile a selection the new rule forbids, which it does by keeping the
  // most recent pick — the one the user is most likely to still care about.
  function setMultiBonusFilter_(allowed) {
    allowMultiBonusFilter = !!allowed;

    var cb = $('multiBonusToggle');
    if (cb) cb.checked = allowMultiBonusFilter;

    if (!allowMultiBonusFilter && selectedBonuses.length > 1) {
      selectedBonuses = selectedBonuses.slice(-1);
      renderBonusChips();
      updateClearBtnVisibility();
      applyLocalFiltersPak();
    }

    saveUserPreferences();
  }

  function onMultiBonusToggle_(el) {
    setMultiBonusFilter_(el.checked);
  }

  // ── Settings dialog ────────────────────────────────────────────────────────
  // Everything here used to live at the bottom of the "?" dialog, behind a
  // question-mark icon that promises help rather than configuration. Nobody
  // looks for "reset my settings" under a help button.
  function openSettings() {
    var multiCb = $('multiBonusToggle');
    if (multiCb) multiCb.checked = allowMultiBonusFilter;
    var syncCb = $('syncAreaChipsToggle');
    if (syncCb) syncCb.checked = syncAreaChips;

    var ov = $('settingsOverlay');
    if (ov) ov.classList.add('active');
  }

  function closeSettings() {
    var ov = $('settingsOverlay');
    if (ov) ov.classList.remove('active');
  }

  // Turning sync ON has to reconcile two selections that may already differ.
  // Volume's wins: it is the first page with chips and the one whose hidden
  // areas also drive the combined-chart legend, so adopting the other
  // direction could silently re-show a series someone had switched off there.
  function onSyncAreaChipsToggle_(el) {
    syncAreaChips = !!el.checked;

    if (syncAreaChips) {
      mirrorHiddenAreasPak_('volume');
      if (typeof applyLocalFiltersPak === 'function') applyLocalFiltersPak();
    } else {
      saveUserPreferences();
    }
  }

  function toggleBonusFilter(bonus) {
    if (selectedBonuses.indexOf(bonus) !== -1) {
      removeBonus(bonus);
    } else {
      applyBonusPick_(bonus);
    }
  }

  function renderBonusChips() {
    var banner = $('activeFilterBanner');
    var chipsEl = $('activeFilterChips');
    if (selectedBonuses.length === 0) {
      banner.classList.remove('active');
      chipsEl.innerHTML = '';
      return;
    }
    $('activeFilterCount').textContent = selectedBonuses.length;
    chipsEl.innerHTML = selectedBonuses.map(function(b) {
      // bonus-tip-host, not a title attribute: this chip is the one place a
      // bonus number is guaranteed to be on screen, so it is where somebody
      // reaches for the manager's email - and a title attribute cannot be
      // copied from, nor does it render at all on a touchscreen.
      return '<span class="chip bonus-tip-host">' + safeTextPak(b) +
        ' <span class="remove-chip" onclick="removeBonus(\'' + b.replace(/'/g, "\\'") + '\')">&times;</span>' +
        bonusTipHtmlPak_(b, true) + '</span>';
    }).join('');
    banner.classList.add('active');
  }

  function getSwipeWidth() { 
    var container = $('swipeContainer'); 
    return container ? container.clientWidth : window.innerWidth; 
  }
  
  function setSliderPosition() { 
    var wrapper = $('swipeWrapper'); 
    wrapper.style.transform = 'translateX(' + currentTranslate + 'px)'; 
  }

  // ── Mobile: collapse chrome once the page is scrolled ─────────────────────
  // Phones have little vertical room, so the rail ICONS and the status /
  // last-update line hide as soon as the user scrolls away from the top, and
  // come back when they return. The page NAMES stay visible and tappable, so
  // navigation is never lost. Each .page is its own scroll container, so the
  // listener is bound per page and reads whichever one is currently showing.
  var PAGE_SCROLL_CHROME_THRESHOLD = 4;  // a few px of slack for iOS overscroll

  // Back-to-top appears much later than the chrome collapse. Anything near the
  // 4px mark would put a button on screen for a scroll the user can undo with
  // one flick; roughly a screen's worth of travel is where scrolling back
  // starts to be a chore.
  var PAGE_SCROLL_TOP_BTN_THRESHOLD = 400;

  function updatePageScrollChrome_() {
    // Never collapse during the tour: several steps ring the rail or scroll an
    // element into view, and a hidden target measures 0x0 and gets no ring.
    // The back-to-top button is hidden for the same reason — it would float
    // over the tour's spotlight.
    if (typeof tourActive !== 'undefined' && tourActive) {
      document.body.classList.remove('page-scrolled');
      document.body.classList.remove('page-scrolled-far');
      return;
    }
    var pages = document.querySelectorAll('.page');
    var el = pages[currentPage];
    var top = el ? el.scrollTop : 0;
    document.body.classList.toggle('page-scrolled', top > PAGE_SCROLL_CHROME_THRESHOLD);
    document.body.classList.toggle('page-scrolled-far', top > PAGE_SCROLL_TOP_BTN_THRESHOLD);
  }

  // Each .page is its own scroll container, so this scrolls the page currently
  // showing rather than the window — which never scrolls at all.
  // keepFocus leaves focus where it is. The back-to-top button needs the focus
  // move below; a jump triggered by applying a filter does not, and would
  // otherwise pull focus out of whatever control the user was using.
  function scrollCurrentPageToTop_(keepFocus) {
    var pages = document.querySelectorAll('.page');
    var el = pages[currentPage];
    if (!el) return;

    var reduceMotion = false;
    try {
      reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {}

    if (el.scrollTo && !reduceMotion) {
      el.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      el.scrollTop = 0;
    }

    if (keepFocus) return;

    // The button fades out once the page reaches the top, and focus on a
    // visibility:hidden element is dropped to <body> — which would send the
    // next Tab back to the very start of the document. Hand focus to the
    // current page's rail item instead, which is where the view now is.
    var railItem = document.querySelectorAll('.next-rail .rail-item')[currentPage];
    if (railItem) { try { railItem.focus(); } catch (e) {} }
  }

  // ── Horizontal scroll cue on tables ────────────────────────────────────────
  // Marks a .table-wrap with whether it can scroll sideways at all and whether
  // it has reached the right-hand end, which is what the edge shadow keys off.
  // A couple of pixels of slack absorbs fractional scroll positions from
  // display scaling, which otherwise leave "at the end" permanently false.
  var SCROLL_EDGE_SLACK = 2;

  function updateScrollEdges_(el) {
    if (!el || !el.classList || !el.classList.contains('table-wrap')) return;
    var max = el.scrollWidth - el.clientWidth;
    el.classList.toggle('has-scroll-x', max > SCROLL_EDGE_SLACK);
    el.classList.toggle('at-scroll-end', el.scrollLeft >= max - SCROLL_EDGE_SLACK);
  }

  function refreshScrollEdgesAll_() {
    var wraps = document.querySelectorAll('.table-wrap');
    for (var i = 0; i < wraps.length; i++) { updateScrollEdges_(wraps[i]); }
  }

  function initScrollEdges_() {
    // Capture phase: scroll events do not bubble, so a single delegated
    // listener only works on the way down. The alternative — binding to each
    // .table-wrap — would need rebinding after every table re-render, since
    // most of them are rebuilt from HTML strings on each filter change.
    document.addEventListener('scroll', function (e) {
      updateScrollEdges_(e.target);
    }, true);
    window.addEventListener('resize', refreshScrollEdgesAll_);
  }

  // ── Collapsing the header when the title stops fitting ────────────────────
  // The action buttons used to collapse behind a burger at a fixed 700px. A
  // breakpoint can only be right for one combination of font, zoom and title
  // length, and the widths where the header title was actually being clipped
  // sat well above that line — so a half-width laptop window showed a truncated
  // title with a full row of icons beside it.
  //
  // This measures instead, and collapses the action buttons behind the burger
  // when the title no longer fits. There is no second stage any more: the
  // "21 min ago" stamp used to be dropped here as a last resort, and it is now
  // hidden until hovered or tapped regardless of width, so it is never
  // occupying the space this would have been reclaiming.
  var HEADER_FIT_SLACK = 1;   // sub-pixel rounding on fractional zoom levels

  function titleIsClipped_() {
    var title = document.querySelector('.next-header-title');
    if (!title) return false;
    return title.scrollWidth > title.clientWidth + HEADER_FIT_SLACK;
  }

  function updateHeaderFit_() {
    var body = document.body;

    // Every pass decides from the same starting point rather than from
    // whatever the last pass left behind. Measuring against the CURRENT state
    // is the classic way to build an oscillation: collapsing the icons frees
    // the room that made the title fit, which says "uncollapse", which takes
    // the room away again. Reading from a known baseline cannot loop.
    //
    // Both classes are removed and re-added inside this one synchronous block,
    // so the browser never paints an intermediate state and nothing flickers.
    var wasCompact = body.classList.contains('header-compact');
    body.classList.remove('header-compact');

    // Phones collapse unconditionally: the title is on its own grid row there,
    // so it may well "fit" while the icons have nowhere to go.
    var mobile = window.matchMedia('(max-width: 700px)').matches;
    var compact = mobile || titleIsClipped_();

    if (compact) body.classList.add('header-compact');

    // An open dropdown belongs to a header that is collapsed. If this pass has
    // just widened out of that, close it — otherwise the menu stays flagged
    // open with nothing on screen to close it.
    if (wasCompact && !compact) toggleHeaderMenu_(false);
  }

  // Coalesced to one measurement per frame: a drag-resize fires continuously,
  // and each pass costs two forced layouts.
  var _headerFitPending = false;
  function scheduleHeaderFit_() {
    if (_headerFitPending) return;
    _headerFitPending = true;
    requestAnimationFrame(function () {
      _headerFitPending = false;
      updateHeaderFit_();
    });
  }

  // ── Header menu ────────────────────────────────────────────────────────────
  function toggleHeaderMenu_(force) {
    var open = (typeof force === 'boolean')
      ? force
      : !document.body.classList.contains('header-menu-open');
    document.body.classList.toggle('header-menu-open', open);

    var btn = $('headerMenuBtn');
    if (btn) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      // Swap ONLY the glyph. Assigning className wholesale used to wipe every
      // other class on the icon - which was fine while the button lived in the
      // header, and stopped being fine the moment it became a rail item and
      // carried `rail-icon`: the first click dropped the sizing and the icon
      // changed size on screen.
      var icon = btn.querySelector('i');
      if (icon) {
        icon.classList.toggle('fa-bars', !open);
        icon.classList.toggle('fa-xmark', open);
      }
    }
  }

  // ── Building picker ──────────────────────────────────────────────────────
  // The header title opens this. Choosing a building re-scopes the payload and
  // re-renders everything; see scopeRowsToSite_ in JsState for what "scope"
  // means to the numbers.

  function siteAreaCount_(key) {
    if (key === 'all') return VOLUME_TYPES.length;
    var n = 0;
    for (var i = 0; i < VOLUME_TYPES.length; i++) {
      // An 'all' area is worked in both buildings and shows under either, so
      // it counts towards both. This subtitle promises how many areas the
      // choice SHOWS, and an exact match would undercount it by one.
      var at = AREA_SITE[areaBaseKey_(VOLUME_TYPES[i].key)];
      if (at === key || at === 'all') n++;
    }
    return n;
  }

  function renderSiteMenu_() {
    var menu = $('siteMenu');
    if (!menu) return;
    var overridden = siteFilterOverridden_();
    menu.innerHTML = SITES.map(function (s) {
      // Ticks the user's CHOICE, not what a bonus filter has temporarily
      // forced - otherwise picking E3, filtering to someone, and opening the
      // menu would show Elmsall ticked and look like the choice was lost.
      var on = s.key === siteFilterPreferred;
      var n = siteAreaCount_(s.key);
      return '<button type="button" class="site-menu-item" role="option" ' +
             'aria-selected="' + (on ? 'true' : 'false') + '" ' +
             'onclick="setSiteFilter_(\'' + s.key + '\')">' +
             '<i class="fa-solid fa-check site-menu-check" aria-hidden="true"></i>' +
             '<span>' + safeTextPak(s.title) +
             '<span class="site-menu-sub">' + n + ' work area' + (n === 1 ? '' : 's') + '</span>' +
             '</span></button>';
    }).join('');
  }

  function toggleSiteMenu_(force) {
    var menu = $('siteMenu');
    var btn = $('sitePickerBtn');
    if (!menu || !btn) return;
    var open = (typeof force === 'boolean') ? force : !menu.classList.contains('open');
    if (open) renderSiteMenu_();
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  // Reflects the current building in the title, the tab title and the marker
  // dot. Called on load and on every change, so there is one place that decides
  // what "you are looking at E3" looks like.
  function syncSiteUi_() {
    var cfg = siteConfig_(siteFilter);
    var title = $('siteTitle');
    if (title) title.textContent = cfg.title;
    // The Warehouse control reads siteFilter, so it has to be repainted from
    // the same place everything else that names the building is.
    if (typeof renderWarehouseMenu_ === 'function') renderWarehouseMenu_();
    var btn = $('sitePickerBtn');
    if (btn) {
      btn.classList.toggle('filtered', siteFilter !== 'all');
      // While a bonus filter has forced the whole site, say so rather than
      // letting the title look like the building choice was forgotten.
      var overridden = siteFilterOverridden_();
      btn.classList.toggle('site-overridden', overridden);
      btn.title = overridden
        ? 'Showing all buildings while a bonus filter is active. Clear the filter to return to '
          + siteConfig_(siteFilterPreferred).short + '.'
        : 'Show one building';
      btn.setAttribute('aria-label', overridden
        ? 'Building: all of Elmsall, because a bonus filter is active. Change building.'
        : 'Building: ' + cfg.short + '. Change building.');
    }
    // "All E3 Areas" was accurate when E3 was the whole dashboard. It names
    // the building in view now.
    var scopeTag = $('perfChartScopeTag');
    if (scopeTag) {
      scopeTag.textContent = (siteFilter === 'all') ? 'All Areas' : 'All ' + cfg.short + ' Areas';
    }
    // The heading names the building too, rather than leaving the tag beside it
    // to carry that on its own. cfg is the EFFECTIVE filter, so while a bonus
    // filter is holding the view at whole-site this says "Elmsall" - it has to
    // agree with the tag and with what is actually plotted, not with the
    // preference that is being overridden.
    var perfTitle = $('perfChartTitle');
    if (perfTitle) {
      perfTitle.textContent = cfg.short + ' Overall Productivity %';
      // The rearrange bar captured this panel's label once, at init, from the
      // heading text - before any of this ran. Without updating it too, someone
      // on E3 rearranges panels against a label still reading "Elmsall".
      var perfPanel = perfTitle.closest('[data-reorder-key]');
      if (perfPanel) perfPanel.setAttribute('data-reorder-label', perfTitle.textContent);
    }

    try { document.title = cfg.title; } catch (e) {}
  }

  function setSiteFilter_(key, opts) {
    var known = false;

  // ── The date picker ────────────────────────────────────────────────────────
  // The header's Live/history control used to be a bare <select> of the last
  // fortnight. With that cap lifted the list runs to hundreds of days, which a
  // native select handles badly: no way to search it, and on a phone it becomes
  // a wheel you scroll blind looking for one day in nine months.
  //
  // The <select> is still there and is still the single source of truth - the
  // change listener that loads data, the share link, and the ?date= deep link
  // all read it. This draws a searchable menu over it and writes back through
  // it, so nothing downstream needed to know the control changed.

  var DATE_MONTHS_ = ['January', 'February', 'March', 'April', 'May', 'June',
                      'July', 'August', 'September', 'October', 'November', 'December'];
  var DATE_DAYS_ = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  // "12/08/2026" -> the pieces the list and the search both need, or null for
  // anything that is not a dd/MM/yyyy archive name. Null is how the Live option
  // stays out of the dated part of the list without being special-cased twice.
  function dateOptionParts_(name) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(name || '').trim());
    if (!m) return null;
    var day = Number(m[1]), mon = Number(m[2]) - 1, yr = Number(m[3]);
    var d = new Date(yr, mon, day);
    // Date rolls impossible values over rather than rejecting them - "99/99"
    // becomes a real date in 2029 - so the only way to reject one is to check
    // the pieces survived the trip.
    if (d.getDate() !== day || d.getMonth() !== mon || d.getFullYear() !== yr) return null;
    var month = DATE_MONTHS_[d.getMonth()];
    return {
      name: String(name).trim(),
      month: month + ' ' + d.getFullYear(),
      short: DATE_DAYS_[d.getDay()].slice(0, 3) + ' ' + m[1] + ' ' + month.slice(0, 3),
      long: DATE_DAYS_[d.getDay()] + ' ' + Number(m[1]) + ' ' + month + ' ' + d.getFullYear()
    };
  }

  // One entry per option on the hidden select, in its order (newest first).
  function dateMenuEntries_() {
    var sel = $('archiveSelect');
    if (!sel) return [];
    var out = [];
    for (var i = 0; i < sel.options.length; i++) {
      var o = sel.options[i];
      var parts = dateOptionParts_(o.textContent);
      out.push({
        value: o.value,
        label: parts ? parts.short : o.textContent,
        sub: parts ? parts.name : '',
        month: parts ? parts.month : '',
        // Long form and numeric form both go in the haystack, so "aug",
        // "tuesday", "12/08" and "2026" all find the same day.
        hay: (parts ? parts.long + ' ' + parts.name : 'live today now').toLowerCase()

  // options the list used, so "which days exist" has one source, not two.
  function calAvailable_() {
    var map = {};

    for (var i = 0; i < entries.length; i++) {
      var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(entries[i].sub || '');
      if (m) map[m[3] + '-' + m[2] + '-' + m[1]] = entries[i].value;
    }
    // Today is a day you can pick, and picking it means Live - the live sheet
    // IS today. It used to be left out because it has no ARCHIVE entry, which
    // greyed out the one date people open this calendar to get back to, put
    // the "today" ring on a dead cell, and left the grid with nothing
    // highlighted at all whenever the dashboard was live.
    //

    // absent from the list above. If a cut for today ever does exist it keeps
    // this cell: an explicit dated copy is the more specific answer, and
    // overwriting it here would make the day unreachable.
    var todayKey = calKey_(new Date());
    if (!Object.prototype.hasOwnProperty.call(map, todayKey)) map[todayKey] = '';

  function renderDateMenu_() {

    if (!grid) return;

    var avail = calAvailable_();
    var sel = $('archiveSelect');
    var current = sel ? sel.value : '';

    // one day is highlighted whatever the dashboard is showing. Only Live
    // carries the empty value, so the match stays unambiguous.
    var curKey = '';
    for (var k in avail) {
      if (Object.prototype.hasOwnProperty.call(avail, k) && avail[k] === current) { curKey = k; break; }
    }

      var base = curKey
        ? new Date(Number(curKey.slice(0, 4)), Number(curKey.slice(5, 7)) - 1, 1)
        : new Date();
      _calMonth = new Date(base.getFullYear(), base.getMonth(), 1);
    }

    var title = $('calTitle');
    if (title) title.textContent = DATE_MONTHS_[_calMonth.getMonth()] + ' ' + _calMonth.getFullYear();

    // Monday-first, which is how a UK shift rota reads.
    var firstDow = (new Date(_calMonth.getFullYear(), _calMonth.getMonth(), 1).getDay() + 6) % 7;
    var days = new Date(_calMonth.getFullYear(), _calMonth.getMonth() + 1, 0).getDate();
    var todayKey = calKey_(new Date());

    var html = '';
    for (var b = 0; b < firstDow; b++) html += '<span class="cal-cell cal-blank"></span>';
    for (var d = 1; d <= days; d++) {
      var key = calKey_(new Date(_calMonth.getFullYear(), _calMonth.getMonth(), d));

      var cls = 'cal-cell' +
                (has ? '' : ' cal-disabled') +
                (key === curKey ? ' cal-selected' : '') +
                (key === todayKey ? ' cal-today' : '');

      // handler to guard.
      html += has
        ? '<button type="button" class="' + cls + '" data-cal="' + key + '"' +

        : '<span class="' + cls + '" aria-hidden="true">' + d + '</span>';

  function toggleDateMenu_(force) {

  function syncDateUi_() {

    if (!sel || !btn || !label) return;
    var opt = sel.options[sel.selectedIndex];

  function initDatePicker_() {

          // request. "Clear" returned to Live. "Today" only moved the VIEW to
          // this month - and since the calendar already opens on the selected
          // day's month, pressing it on today's month did nothing whatsoever
          // and read as a broken button. Today's cell now means Live, so both
          // were asking to go back to the live day: this does that, and lands

          _calMonth = new Date();

      for (var i = 0; i < pages.length; i++) {

      }
    }

  function renderPageIfNeeded_(index) {

    if (index === 0) {
      renderChartsPak(c.baseRows, c.trendRowsList, c.trendTitles, c.trendAreaKeysList, c.filteredData, c.targetTimeList);
    } else if (index === 1) {
      renderVolumePagePak(c.baseRows);
    } else if (index === 2) {
      renderSideTablesPak(c.rowsLimit);
    } else if (index === 3) {

      // render context - but it still goes through here, so that it is rebuilt
      // on a refresh like every other page rather than holding yesterday.
      renderOsPagePak();
    } else if (index === 4) {
      renderMainTablePak(currentMainRows);

    // knowable once the new markup is in the document.

  // window size entirely.

  // live. A control you can change that then changes nothing reads as the page
  // being broken; one that is plainly not yours to change on this page reads as
  // the page having its own range, which is what the row below it is.

  // Disabled, not hidden: they keep their place in the row, so the panel does

      var el = document.getElementById(ids[i]);
      if (!el) continue;
      el.disabled = off;

      // whatever the field wrapper is called.
      var field = el.parentNode;

    prevTranslate = currentTranslate;
    setSliderPosition();
    updateDots();

  function updateDots() {
    var items = document.querySelectorAll('.next-rail .rail-item');

      // .chart-box of exactly its own size - Chart.js measures that box and
      // arrives at the height the stylesheet is already enforcing, instead of
      // measuring the whole panel and disagreeing with it.
      if (overviewVolChart) overviewVolChart.resize();
      if (perfChart) perfChart.resize();
      for (var t = 0; t < trendCharts.length; t++) { if (trendCharts[t]) trendCharts[t].resize(); }
      for (var a = 0; a < areaGroupCharts.length; a++) { if (areaGroupCharts[a]) areaGroupCharts[a].resize(); }

  function touchStart() {
    return function(event) {
      if (event.touches && event.touches.length > 1) return;
      var target = event.target;
      
      // 1. Exclude standard DOM legends
      if (target && (target.closest('.chartjs-legend') || target.classList.contains('chartjs-legend') || target.tagName === 'LI' && target.closest('[class*="chartjs"]'))) { 
        return; 
      }

      // 2. Exclude CANVAS legends (Chart.js draws them at the bottom 15% of the canvas)
      if (target && target.tagName === 'CANVAS') {
        var rect = target.getBoundingClientRect();
        var clientY = event.touches ? event.touches[0].clientY : event.pageY;
        // If the click is near the bottom of the canvas, ignore it so Chart.js can handle the legend click
        if (clientY - rect.top > rect.height * 0.85) {
          return;
        }
      }

      isDragging = true;
      startX = getPositionX(event);
      startY = event.touches ? event.touches[0].clientY : event.pageY;
      prevTranslate = -currentPage * getSwipeWidth();
      animationID = requestAnimationFrame(animation);
      $('swipeContainer').style.cursor = 'grabbing';
    };
  }

  function touchEnd() {
    if (!isDragging) return;
    isDragging = false;
    cancelAnimationFrame(animationID);
    var movedBy = currentTranslate - prevTranslate;
    
    // 3. Only trigger page change/resize if it was an actual swipe (moved more than 15px)
    // This prevents standard "clicks" from resetting the charts and blocking Chart.js click events
    if (Math.abs(movedBy) > 15) {
      if (movedBy < -75 && currentPage < totalPages - 1) currentPage += 1;
      if (movedBy > 75 && currentPage > 0) currentPage -= 1;
      goToPage(currentPage);
    } else {
      // It was just a click/tap, snap the view back without running goToPage/resizeCharts
      currentTranslate = prevTranslate;
      setSliderPosition();
    }
    
    $('swipeContainer').style.cursor = 'grab';
  }

  function touchMove(event) {
    if (event.touches && event.touches.length > 1) { isDragging = false; return; }
    if (!isDragging) return; 
    var currentX = getPositionX(event);
    var currentY = event.touches ? event.touches[0].clientY : event.pageY;
    var diffX = Math.abs(currentX - startX);
    var diffY = Math.abs(currentY - startY);

    if (diffY > diffX && diffY > 10) {
      isDragging = false;
      currentTranslate = prevTranslate;
      setSliderPosition();
      return;
    }
    currentTranslate = prevTranslate + currentX - startX;
  }

  function getPositionX(event) { 
    return event.type.indexOf('mouse') !== -1 ? event.pageX : event.touches[0].clientX; 
  }

    setSliderPosition(); 
    if (isDragging) requestAnimationFrame(animation); 
  }

  function setupSwipe() {

    // the difference. Desktop navigates by the rail (and the arrow keys, which
    // are unaffected).

    // synthesise mousedown/mousemove/mouseup after a tap, so on a touchscreen

    container.addEventListener('touchend', touchEnd);
    container.addEventListener('touchmove', touchMove, { passive: true });

    // set where a coarse pointer is present — where it is invisible anyway,
    // but harmless — and left alone on desktop.

    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    if (coarse) container.style.cursor = 'grab';
    document.addEventListener('keydown', function(e) {
      // Guarded (see isPageArrowNavAllowed_): the arrows used to slide the whole

      var nowCardMode = isCardModePak();

  // ---- Bonus number cards on a touchscreen ---------------------------------
  // The TM card opens on hover, which a touchscreen cannot do, so a tap on the
  // bonus number opens it there instead. The number's own job — filtering the
  // view — is not lost, it is deferred: the tap after the card is open is the
  // one that filters. Same two-step every mobile tooltip uses, and the card
  // says "Click to filter main view" on it, so the second tap is signposted.
  function bonusTipTapModePak_() {
    try { return window.matchMedia('(hover: none)').matches; } catch (e) { return false; }
  }

  function closestPak_(node, selector) {
    if (!node || !node.closest) return null;
    return node.closest(selector);
  }

  // An opened card is moved out of the number and appended to <body>, then
  // positioned against the number's screen rect.
  //
  // Two reasons it has to leave, and neither is optional. Several of the places
  // a bonus number appears sit inside a scroll container — the expanded row's
  // card list most of all — and a card positioned inside one of those is
  // clipped by it. And `position: fixed` is only relative to the viewport if no
  // ancestor is transformed; #swipeWrapper is translated sideways to move
  // between pages, so a fixed card left inside it is positioned against that
  // instead, landing a whole page-width off on any page but the first.
  var _openTipEl = null;    // the card currently lifted out
  var _openTipSpan = null;  // the number it belongs to
  var _openTipHome = null;  // where to put it back

  function closeBonusTipsPak_() {
    if (_openTipSpan) _openTipSpan.classList.remove('tip-open');

    if (_openTipEl) {
      _openTipEl.classList.remove('tip-floating');
      _openTipEl.style.cssText = '';
      // The table underneath may have re-rendered while the card was open, in
      // which case the place it came from is gone and putting it back there
      // would leave it detached in <body> for good.
      if (_openTipHome && _openTipHome.parent && document.body.contains(_openTipHome.parent)) {
        _openTipHome.parent.insertBefore(_openTipEl, _openTipHome.next);
      } else if (_openTipEl.parentNode) {
        _openTipEl.parentNode.removeChild(_openTipEl);
      }
    }

    _openTipEl = null;
    _openTipSpan = null;
    _openTipHome = null;
  }

  function openBonusTipPak_(span) {
    var tip = span.querySelector('.bonus-tip');
    if (!tip) return;

    _openTipEl = tip;
    _openTipSpan = span;
    _openTipHome = { parent: tip.parentNode, next: tip.nextSibling };

    span.classList.add('tip-open');
    tip.classList.add('tip-floating');
    document.body.appendChild(tip);

    tip.style.position = 'fixed';
    tip.style.left = '0px';
    tip.style.top = '0px';
    tip.style.transform = 'none';
    tip.style.maxWidth = Math.min(window.innerWidth - 16, 300) + 'px';

    var host = span.getBoundingClientRect();
    var box = tip.getBoundingClientRect();

    var left = host.left + (host.width / 2) - (box.width / 2);
    left = Math.max(8, Math.min(left, window.innerWidth - box.width - 8));

    // Below the number by default, above it when there is no room below.
    var top = host.bottom + 6;
    if (top + box.height > window.innerHeight - 8) {
      top = Math.max(8, host.top - box.height - 6);
    }

    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
  }

  function initBonusTipTaps_() {
    // Capture phase, so this runs before the inline onclick on the number and
    // can decide whether that click is a "show me" or a "filter by this".
    document.addEventListener('click', function (e) {
      if (!bonusTipTapModePak_()) return;

      // The tour clicks bonus numbers itself, through real event dispatch, so
      // it arrives here like any other tap. What it is demonstrating at those
      // steps is the filter, and swallowing the first click to show a card
      // instead would leave the step demonstrating nothing.
      if (typeof tourActive !== 'undefined' && tourActive) return;

      // A tap that landed inside an open card is aimed at one of its controls.
      // Checked before anything else: an open card has been moved to <body>, so
      // it is no longer inside the number and would otherwise read as a tap on
      // the page, closing the card out from under the button being pressed.
      if (closestPak_(e.target, '.bonus-tip')) return;

      var span = closestPak_(e.target, '.bonus-tip-host');

      // Anywhere else, or on a number whose card is already open: put the cards
      // away and let the click carry on to whatever it hit.
      if (!span || span.classList.contains('tip-open')) {
        closeBonusTipsPak_();
        return;
      }

      // Nothing to show for this number — behave as though this code is absent.
      if (!span.querySelector('.bonus-tip')) return;

      e.preventDefault();
      e.stopPropagation();
      closeBonusTipsPak_();
      openBonusTipPak_(span);
    }, true);

    // An open card is pinned to its number's screen rect, so anything that
    // moves that rect leaves it pointing at nothing. Capture phase catches
    // scrolling in any container, not just the page — the number may well be
    // inside a scrolling table or card list.
    document.addEventListener('scroll', closeBonusTipsPak_, true);
    window.addEventListener('resize', closeBonusTipsPak_);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeBonusTipsPak_();
    });
  }

  // ---- Bonus number cards on hover (desktop) --------------------------------
  // The card used to just show in place via a plain CSS :hover rule. That is
  // fine until the number sits near the left edge of a page: `.swipe-container`
  // clips anything crossing its own edge to make the paging swipe work, and a
  // card centred under a number close to that edge is wider than the gap to
  // it, so its left side was clipped away (and the rail behind showed through
  // where it had been). Routing hover through the same floating,
  // viewport-clamped positioning already built for the touchscreen tap fixes
  // it here too, since a `position: fixed` card on <body> is outside that
  // clipping box entirely.
  var _tipHoverTimer = null;

  function initBonusTipHover_() {
    document.addEventListener('mouseover', function (e) {
      if (bonusTipTapModePak_()) return;
      if (typeof tourActive !== 'undefined' && tourActive) return;

      var span = closestPak_(e.target, '.bonus-tip-host');
      var onOpenTip = _openTipEl && closestPak_(e.target, '.bonus-tip') === _openTipEl;

      // Already open, or the pointer is on the card that belongs to it —
      // just cancel any close that was scheduled while crossing the gap.
      if (span === _openTipSpan || onOpenTip) {
        if (_tipHoverTimer) { clearTimeout(_tipHoverTimer); _tipHoverTimer = null; }
        return;
      }
      if (!span || !span.querySelector('.bonus-tip')) return;

      if (_tipHoverTimer) { clearTimeout(_tipHoverTimer); _tipHoverTimer = null; }
      closeBonusTipsPak_();
      openBonusTipPak_(span);
    }, true);

    document.addEventListener('mouseout', function (e) {
      if (bonusTipTapModePak_()) return;
      if (!_openTipSpan) return;

      var leavingOwner = closestPak_(e.target, '.bonus-tip-host') === _openTipSpan ||
        (_openTipEl && closestPak_(e.target, '.bonus-tip') === _openTipEl);
      if (!leavingOwner) return;

      var to = e.relatedTarget;
      var stillInside = to && (closestPak_(to, '.bonus-tip-host') === _openTipSpan ||
        (_openTipEl && closestPak_(to, '.bonus-tip') === _openTipEl));
      if (stillInside) return;

      // Short grace period, not an instant close: the pointer crosses a real
      // gap between the number and its floating card to get from one to the
      // other, and a mouseout fires for that whole trip, not just a true exit.
      if (_tipHoverTimer) clearTimeout(_tipHoverTimer);
      _tipHoverTimer = setTimeout(closeBonusTipsPak_, 120);
    }, true);
  }

  function populateBreakdownSelects() {
    var fromSel = document.getElementById('breakdownFrom');
    var toSel = document.getElementById('breakdownTo');
    if (!fromSel || !toSel) return;

    var maxBlocks = 24 * 4; // 96 blocks = 24 hours
    var sliced = timeRanges.slice(-maxBlocks);

    function getStartLabel(tr) {
      var parts = String(tr || '').trim().split(' - ');
      return parts[0].trim();
    }

    fromSel.innerHTML = '';
    toSel.innerHTML = '';

    for (var i = 0; i < sliced.length; i++) {
      var startLabel = getStartLabel(sliced[i]);
      var optF = document.createElement('option');
      optF.value = sliced[i];
      optF.textContent = startLabel;
      fromSel.appendChild(optF);

      var optT = document.createElement('option');
      optT.value = sliced[i];
      optT.textContent = addMinutesToLabel(startLabel, 15);
      toSel.appendChild(optT);
    }

    var defaultFromIdx = Math.max(0, sliced.length - 4);
    fromSel.selectedIndex = defaultFromIdx;
    toSel.selectedIndex = sliced.length - 1;

    updateBreakdownRange();
  }

  function updateBreakdownRange() {
    var fromSel = document.getElementById('breakdownFrom');
    var toSel = document.getElementById('breakdownTo');
    var badge = document.getElementById('breakdownRangeBadge');
    if (!fromSel || !toSel) return;

    var fromIdx = fromSel.selectedIndex;
    var toIdx = toSel.selectedIndex;

    if (toIdx < fromIdx) {
      toSel.selectedIndex = fromIdx;
      toIdx = fromIdx;
    }

    var blockCount = toIdx - fromIdx + 1;
    var minutes = blockCount * 15;
    var hours = minutes / 60;
    var hoursLabel = hours >= 1
      ? (Number.isInteger(hours) ? hours + ' hr' + (hours !== 1 ? 's' : '') : hours.toFixed(1) + ' hrs')
      : minutes + ' min';
    if (badge) badge.textContent = blockCount + ' block' + (blockCount !== 1 ? 's' : '') + ' · ' + hoursLabel;

    renderBreakdownBody();
  }

  function renderBreakdownBody() {
    var fromSel = document.getElementById('breakdownFrom');
    var toSel = document.getElementById('breakdownTo');
    if (!fromSel || !toSel || !rawSideData || rawSideData.length === 0) return;

    var fromIdx = fromSel.selectedIndex;
    var toIdx = toSel.selectedIndex;
    if (toIdx < fromIdx) toIdx = fromIdx;

    var maxBlocks = 24 * 4;
    var sliced = timeRanges.slice(-maxBlocks);
    var selectedSlice = sliced.slice(fromIdx, toIdx + 1);
    var selectedSet = {};
    for (var i = 0; i < selectedSlice.length; i++) { selectedSet[selectedSlice[i]] = true; }

    var rangeData = rawSideData.filter(function(r) { return selectedSet[r.timeRange]; });

    var bonusBlockMap = {};
    for (var i = 0; i < rangeData.length; i++) {
      var r = rangeData[i];
      var bonus = r.bonus;
      var val = Number(r.value) || 0;
      if (!bonusBlockMap[bonus]) bonusBlockMap[bonus] = { totalStdHours: 0, activeBlocks: 0 };
      bonusBlockMap[bonus].totalStdHours += val;
      if (val > 0) bonusBlockMap[bonus].activeBlocks++;
    }
    
    var bonusProductivity = {};
    var bKeys = Object.keys(bonusBlockMap);
    for (var i = 0; i < bKeys.length; i++) {
      var b = bKeys[i];
      var info = bonusBlockMap[b];
      var deployed = info.activeBlocks * 0.25;
      bonusProductivity[b] = deployed > 0 ? (info.totalStdHours / deployed) * 100 : 0;
    }

    // The same calculation now drives the marker on the Bonus page and on Data
    // Table detail rows, so it lives in one place — two copies of "works across
    // several areas" would eventually come to mean two different things.
    var bonusAreaCount = bonusAreaCountMapPak(rangeData);
    var bonusOs = bonusOsMapPak_(rangeData);
    var bonusNpl = bonusNplMapPak_(rangeData);

    var allBonuses = {};
    for (var i = 0; i < rangeData.length; i++) { allBonuses[rangeData[i].bonus] = true; }
    var totalUniqueHeads = Object.keys(allBonuses).length;

    var breakdown = [];
    var maxCount = 0;
    // Only the chosen building's areas: on an E3 dashboard a row of E1/E2
    // areas sitting at zero is noise, not information.
    var breakdownAreas_ = breakdownAreasActive_();
    for (var a = 0; a < breakdownAreas_.length; a++) {
      var area = breakdownAreas_[a];
      var areaBonuses = {};
      for (var i = 0; i < rangeData.length; i++) {
        if (Number(rangeData[i][area.key]) > 0) areaBonuses[rangeData[i].bonus] = true;
      }
      var bonusList = Object.keys(areaBonuses);
      bonusList.sort(function(a, b) { return (bonusProductivity[b] || 0) - (bonusProductivity[a] || 0); });
      // Applied after the sort, and the count recomputed from what survives:
      // the bar length IS the head count, so a bar drawn from the unfiltered
      // list above a filtered set of chips would contradict the chips under it.
      // filterByAreaCountPak_ wants rows, and these are bare strings.
      bonusList = filterByAreaCountPak_(
        bonusList.map(function (b) { return { bonus: b }; }),
        bonusAreaCount, breakdownAreaCountFilter
      ).map(function (r) { return r.bonus; });
      var count = bonusList.length;
      if (count > 0) {
        breakdown.push({ label: area.label, count: count, color: areaColor_(area), bonuses: bonusList });
        if (count > maxCount) maxCount = count;
      }
    }
    breakdown.sort(function(a, b) { return b.count - a.count; });

    var sumOfAreas = 0;
    for (var i = 0; i < breakdown.length; i++) { sumOfAreas += breakdown[i].count; }

    var countEl = document.getElementById('breakdownCountFilter');
    if (countEl) {
      countEl.innerHTML = areaCountFilterChipHtmlPak_(
        breakdownAreaCountFilter, 'setBreakdownAreaCountFilter');
    }

    var body = document.getElementById('breakdownBody');
    var html = '<div class="breakdown-summary">';
    html += '<span class="breakdown-summary-num">' + totalUniqueHeads + '</span><span class="breakdown-summary-label">unique heads</span>';
    html += '<span class="breakdown-summary-sep">&middot;</span>';
    html += '<span class="breakdown-summary-num">' + breakdown.length + '</span><span class="breakdown-summary-label">areas active</span>';
    if (sumOfAreas > totalUniqueHeads) {
      html += '<span class="breakdown-summary-sep">&middot;</span><span class="breakdown-summary-num" style="font-size:16px;color:var(--accent);">' + sumOfAreas + '</span><span class="breakdown-summary-label">total assignments</span>';
    }
    html += '</div>';

    for (var i = 0; i < breakdown.length; i++) {
      var item = breakdown[i];
      var pct = maxCount > 0 ? (item.count / maxCount * 100) : 0;
      html += '<div class="breakdown-row clickable-row" onclick="toggleBreakdownDetail(this)">';
      html += '<div class="breakdown-label"><span class="breakdown-dot" style="background:' + item.color + ';"></span>' + safeTextPak(item.label) + '<i class="fa-solid fa-chevron-down breakdown-chevron"></i></div>';
      html += '<div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:0%;background:' + hexToRgbaPak(item.color, 0.55) + ';border:1px solid ' + hexToRgbaPak(item.color, 0.3) + ';" data-target="' + pct + '"></div></div>';
      html += '<div class="breakdown-count" style="color:' + item.color + ';">' + item.count + '</div></div>';
      html += '<div class="breakdown-detail">';
      html += '<div class="breakdown-detail-inner">';
      for (var b = 0; b < item.bonuses.length; b++) {
        var bonusName = item.bonuses[b];
        var bPerfRaw = bonusProductivity[bonusName] || 0;
        var bPerfDisplay = normalizePerfPak(bPerfRaw);
        var bClass = perfClassPak(bPerfRaw);
        var isMulti = (bonusAreaCount[bonusName] || 0) > 1;
        var multiClass = isMulti ? ' multi-area' : '';
        var multiIcon = isMulti ? '<i class="fa-solid fa-layer-group breakdown-multi-icon"></i>' : '';
        var escapedB = escapeAttrPak(bonusName);
        // bonus-tip-host + the real card, replacing the plain title attribute.
        // This modal is often the first place a manager sees a number they do
        // not recognise, and a title attribute gives them nothing to copy and
        // nothing at all on a phone.
        var osTag = osTagHtmlPak_(bonusOs[bonusName]) +
                    nplTagHtmlPak_(bonusNpl[bonusName]);
        // The name in its own element so it, and not the OS tag beside it, is
        // what truncates when the chip runs out of room. See .chip-name.
        var chipName = '<span class="chip-name">' + safeTextPak(bonusName) + '</span>';
        html += '<span class="breakdown-bonus-chip bonus-tip-host ' + bClass + multiClass + '"' + ' onclick="event.stopPropagation();toggleBonusFilter(\'' + escapedB + '\');"><span class="chip-left">' + multiIcon + chipName + osTag + '</span><span class="chip-right"><span class="breakdown-chip-pct">' + Math.round(bPerfDisplay) + '%</span><i class="fa-solid fa-filter chip-filter-icon"></i></span>' + bonusTipHtmlPak_(bonusName, selectedBonuses.indexOf(bonusName) !== -1) + '</span>';
      }
      html += '</div>';
      html += '<div class="breakdown-detail-hint">Click a bonus number to filter the main view' + (sumOfAreas > totalUniqueHeads ? ' · <i class="fa-solid fa-layer-group" style="font-size:9px;margin:0 2px;"></i> = works across multiple areas' : '') + '</div>';
      html += '</div>';
    }

    if (breakdown.length === 0) {
      html += '<div class="breakdown-empty"><i class="fa-solid fa-ghost" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.3;"></i>No activity in the selected range</div>';
    }

    body.innerHTML = html;
    setTimeout(function() {
      var bars = body.querySelectorAll('.breakdown-bar');
      for (var i = 0; i < bars.length; i++) {
        bars[i].style.width = bars[i].dataset.target + '%';
      }
    }, 60);
  }

  // ── Groups & Charts: one dialog, two steps ─────────────────────────────────
  // Groups decides what a group CONTAINS; charts decides where it is DRAWN.

  var _areaGroupSplitDraft = null;

  // Label and colour for a DRAFT group, matching what getPerfSplitGroups_ will
  // produce once applied. Read from the draft, not the committed state, so step
  // 2 describes the groups being edited rather than the ones still on screen.
  function draftGroupMeta_(i) {
    var g = _areaGroupDraft[i] || { keys: [] };
    var labels = [];
    for (var k = 0; k < (g.keys || []).length; k++) {
      for (var v = 0; v < VOLUME_TYPES.length; v++) {
        if (VOLUME_TYPES[v].key === g.keys[k]) { labels.push(VOLUME_TYPES[v].label); break; }
      }
    }
    return {
      label: labels.length ? labels.join(', ') : 'Group ' + (i + 1) + ' (empty)',
      color: groupColor_(i),
      empty: labels.length === 0
    };
  }

  function renderAreaGroupSplitEditor() {
    var host = $('areaGroupSplitEditor');
    if (!host) return;
    var html = '';
    for (var i = 0; i < _areaGroupSplitDraft.length; i++) {
      html += '<div class="area-group-block">';
      html += '<div class="area-group-head">';
      html += '<h3>' + safeTextPak(TREND_CHART_LABELS[i] || ('Chart ' + (i + 1))) + '</h3>';
      if (_areaGroupSplitDraft.length > 1) {
        html += '<button class="btn area-group-remove" onclick="removeAreaGroupSplitChart(' + i + ')" title="Remove chart"><i class="fa-solid fa-trash"></i></button>';
      }
      html += '</div>';
      html += '<div class="area-group-areas">';
      for (var g = 0; g < _areaGroupDraft.length; g++) {
        var meta = draftGroupMeta_(g);
        var checked = _areaGroupSplitDraft[i].indexOf(g) !== -1 ? 'checked' : '';
        html += '<label class="trend-split-cb"><input type="checkbox" data-chart="' + i + '" data-group="' + g + '" ' + checked + ' onchange="onAreaGroupSplitCbChange(this)">' +
                '<span class="trend-split-dot" data-split-dot="' + i + '-' + g + '" style="background:' + meta.color + '"></span>' +
                '<span class="area-cb-text" data-split-label="' + i + '-' + g + '">' + safeTextPak(meta.label) + '</span></label>';
      }
      html += '</div></div>';
    }
    host.innerHTML = html;
    $('addAreaGroupSplitBtn').style.display =
      _areaGroupSplitDraft.length >= MAX_AREA_GROUP_CHARTS ? 'none' : '';
  }

  // Ticking an AREA in step 1 changes a group's name, which step 2 shows. Only
  // the text is patched rather than re-rendering step 2, so focus is not pulled
  // out of the checkbox the user is still working through.
  function refreshSplitLabels_() {
    if (!_areaGroupSplitDraft) return;
    for (var i = 0; i < _areaGroupSplitDraft.length; i++) {
      for (var g = 0; g < _areaGroupDraft.length; g++) {
        var meta = draftGroupMeta_(g);
        var el = document.querySelector('[data-split-label="' + i + '-' + g + '"]');
        if (el) el.textContent = meta.label;
      }
    }
  }

  function onAreaGroupSplitCbChange(cb) {
    var i = parseInt(cb.dataset.chart, 10);
    var g = parseInt(cb.dataset.group, 10);
    var list = _areaGroupSplitDraft[i];
    var at = list.indexOf(g);
    if (cb.checked && at === -1) { list.push(g); }
    else if (!cb.checked && at !== -1) { list.splice(at, 1); }
  }

  function addAreaGroupSplitChart() {
    if (_areaGroupSplitDraft.length >= MAX_AREA_GROUP_CHARTS) return;
    _areaGroupSplitDraft.push([]);
    renderAreaGroupSplitEditor();
  }

  function removeAreaGroupSplitChart(i) {
    _areaGroupSplitDraft.splice(i, 1);
    renderAreaGroupSplitEditor();
  }

  var _areaGroupDraft = null;

  function openAreaGroups() {
    _areaGroupDraft = areaGroupState.map(function(g) {
      return { keys: (g.keys || []).slice(), showLine: g.showLine !== false, showTrend: g.showTrend === true };
    });
    if (_areaGroupDraft.length === 0) {
      _areaGroupDraft = defaultAreaGroupState_();
    }
    _areaGroupSplitDraft = (areaGroupSplitState.charts && areaGroupSplitState.charts.length > 0)
      ? areaGroupSplitState.charts.map(function (c) { return c.slice(); })
      // Not split yet: seed with the single chart that is actually on screen,
      // holding every group. Starting from an empty list would misrepresent the
      // current state as "nothing assigned anywhere".
      // Chart A holds every group — that IS the single chart currently on
      // screen. Chart B is offered empty so the split is visible as something
      // available rather than something to go looking for; it is dropped on
      // Apply if left alone, so offering it costs nothing.
      : [_areaGroupDraft.map(function (_, gi) { return gi; }), []];
    $('areaGroupOverlay').classList.add('active');
    renderAreaGroupEditor();
    renderAreaGroupSplitEditor();
  }

  function closeAreaGroups() {
    $('areaGroupOverlay').classList.remove('active');
  }

  function renderAreaGroupEditor() {
    var html = '';
    for (var i = 0; i < _areaGroupDraft.length; i++) {
      var g = _areaGroupDraft[i];
      html += '<div class="area-group-block">';
      html += '<div class="area-group-head">';
      html += '<h3>Group ' + (i + 1) + '</h3>';
      html += '<div class="area-group-modes">';
      html += '<label class="trend-split-cb"><input type="checkbox" data-group="' + i + '" data-mode="showLine" ' + (g.showLine ? 'checked' : '') + ' onchange="onAreaGroupModeChange(this)"><span class="area-cb-text">Line</span></label>';
      html += '<label class="trend-split-cb"><input type="checkbox" data-group="' + i + '" data-mode="showTrend" ' + (g.showTrend ? 'checked' : '') + ' onchange="onAreaGroupModeChange(this)"><span class="area-cb-text">Trend Line</span></label>';
      if (_areaGroupDraft.length > 1) {
        html += '<button class="btn area-group-remove" onclick="removeAreaGroup(' + i + ')" title="Remove group"><i class="fa-solid fa-trash"></i></button>';
      }
      html += '</div>';
      html += '</div>';
      html += '<div class="area-group-areas">';
      var _areaOpts = volumeTypesActive_();
      for (var v = 0; v < _areaOpts.length; v++) {
        var t = _areaOpts[v];
        var checked = g.keys.indexOf(t.key) !== -1 ? 'checked' : '';
        html += '<label class="trend-split-cb"><input type="checkbox" data-group="' + i + '" data-key="' + t.key + '" ' + checked + ' onchange="onAreaGroupCbChange(this)"><span class="trend-split-dot" style="background:' + areaColor_(t) + '"></span><span class="area-cb-text">' + t.label + '</span></label>';
      }
      html += '</div></div>';
    }
    $('areaGroupEditor').innerHTML = html;
    $('addAreaGroupBtn').style.display = _areaGroupDraft.length >= MAX_AREA_GROUPS ? 'none' : '';
  }

  function onAreaGroupCbChange(cb) {
    var i = parseInt(cb.dataset.group, 10);
    var key = cb.dataset.key;
    var keys = _areaGroupDraft[i].keys;
    var idx = keys.indexOf(key);
    if (cb.checked && idx === -1) { keys.push(key); }
    else if (!cb.checked && idx !== -1) { keys.splice(idx, 1); }
    refreshSplitLabels_();
  }

  function onAreaGroupModeChange(cb) {
    var i = parseInt(cb.dataset.group, 10);
    var mode = cb.dataset.mode;
    var g = _areaGroupDraft[i];
    g[mode] = cb.checked;
    // Exactly one of Line / Trend Line must always stay selected. Rather than
    // refusing the click and snapping the box back on (which just reads as
    // broken), hand the selection over: unchecking the last one turns the OTHER
    // on, so the pair behaves like a toggle you can flip from either side.
    if (!g.showLine && !g.showTrend) {
      var other = (mode === 'showLine') ? 'showTrend' : 'showLine';
      g[other] = true;
      var otherCb = document.querySelector(
        '#areaGroupEditor input[data-group="' + i + '"][data-mode="' + other + '"]');
      if (otherCb) otherCb.checked = true;
    }
  }

  function addAreaGroup() {
    if (_areaGroupDraft.length >= MAX_AREA_GROUPS) return;
    _areaGroupDraft.push({ keys: [], showLine: true, showTrend: false });
    renderAreaGroupEditor();
    renderAreaGroupSplitEditor();
  }

  function removeAreaGroup(i) {
    _areaGroupDraft.splice(i, 1);
    // Step 2 stores group INDICES, so deleting a group shifts everything after
    // it. Drop references to the deleted group and slide the later ones down,
    // or every chart would silently start showing the wrong group.
    if (_areaGroupSplitDraft) {
      for (var c = 0; c < _areaGroupSplitDraft.length; c++) {
        var remapped = [];
        for (var k = 0; k < _areaGroupSplitDraft[c].length; k++) {
          var g = _areaGroupSplitDraft[c][k];
          if (g === i) continue;
          remapped.push(g > i ? g - 1 : g);
        }
        _areaGroupSplitDraft[c] = remapped;
      }
    }
    renderAreaGroupEditor();
    renderAreaGroupSplitEditor();
  }

  function applyAreaGroups() {
    var order = VOLUME_TYPES.map(function(t) { return t.key; });
    var cleaned = [];
    for (var i = 0; i < _areaGroupDraft.length && cleaned.length < MAX_AREA_GROUPS; i++) {
      var draft = _areaGroupDraft[i];
      var keys = order.filter(function(k) { return draft.keys.indexOf(k) !== -1; });
      if (keys.length === 0) continue;
      var showLine = draft.showLine !== false;
      var showTrend = draft.showTrend === true;
      if (!showLine && !showTrend) showLine = true;
      cleaned.push({ keys: keys, showLine: showLine, showTrend: showTrend });
    }
    if (cleaned.length === 0) {
      cleaned = defaultAreaGroupState_();
    }
    areaGroupState = cleaned;

    // Chart assignments are committed in the same Apply. Indices are clamped to
    // the groups that actually survived the clean-up above — an empty group is
    // dropped there, and a chart pointing past the end would draw nothing.
    var charts = (_areaGroupSplitDraft || []).map(function (list) {
      var seen = {};
      return list.filter(function (g) {
        if (g >= cleaned.length || seen[g]) return false;
        seen[g] = true;
        return true;
      }).sort(function (a, b) { return a - b; });
    }).filter(function (list) { return list.length > 0; });

    // One chart holding everything IS the unsplit view, so it is stored as
    // "not split" rather than as a one-chart split — that keeps the bonus-filter
    // fallback and the panel heading behaving as they did before.
    var isSingleFull = charts.length === 1 && charts[0].length === cleaned.length;
    areaGroupSplitState = (charts.length > 0 && !isSingleFull)
      ? { enabled: true, charts: charts }
      : { enabled: false, charts: [] };

    // Configured by hand, for THIS building. Until a building is marked, it
    // keeps deriving its groups from whatever it currently shows.
    if (typeof markSiteSettingsTouched_ === 'function') markSiteSettingsTouched_(siteFilter, 'areaGroups');
    saveUserPreferences();
    closeAreaGroups();
    applyLocalFiltersPak();
  }

  function resetAreaGroups() {
    // Destructive and not undoable — the user may have built up several groups.
    if (!confirm('Reset the work area groups and charts back to the defaults?\n\nAny groups and charts you have built here will be lost.')) return;
    // Back to unconfigured, not to a frozen copy of today's default: this
    // building should follow the rule again, so hiding an area later moves its
    // groups with it. Only the groups - the trend split is a separate answer.
    if (typeof forgetSiteSetting_ === 'function') forgetSiteSetting_(siteFilter, 'areaGroups');
    areaGroupState = defaultAreaGroupState_();
    areaGroupSplitState = defaultAreaGroupSplitState_();
    saveUserPreferences();
    closeAreaGroups();
    applyLocalFiltersPak();
  }

// ── Warehouse picker ────────────────────────────────────────────────────────
// A multi-select over the two buildings, replacing the old three-way title
// picker. It is a different SHAPE on the same state, not new state: siteFilter
// still holds 'all' | 'e1e2' | 'e3', and those are exactly the three legal tick
// combinations. Nothing downstream of siteFilter changed.
//
// Both ticked means Elmsall. Unticking the last one is refused rather than
// silently reinterpreted - an empty warehouse selection describes nothing, and
// quietly turning it back into "all" would look like the click was ignored.
var WAREHOUSE_OPTIONS_ = [
  { key: 'e1e2', label: 'E1/E2' },
  { key: 'e3',   label: 'E3' }
];

function warehouseSelection_() {
  if (siteFilter === 'e1e2') return ['e1e2'];
  if (siteFilter === 'e3') return ['e3'];
  return ['e1e2', 'e3'];
}

function warehouseKeyFor_(sel) {
  return sel.length === WAREHOUSE_OPTIONS_.length ? 'all' : sel[0];
}

function renderWarehouseMenu_() {
  var menu = document.getElementById('warehouseMenu');
  var sel = warehouseSelection_();
  if (menu) {
    menu.innerHTML = WAREHOUSE_OPTIONS_.map(function (o) {
      var on = sel.indexOf(o.key) !== -1;
      return '<button type="button" class="warehouse-item" role="option" ' +
             'aria-selected="' + (on ? 'true' : 'false') + '" ' +
             'data-wh="' + o.key + '">' +
             '<span class="warehouse-check' + (on ? ' on' : '') + '" aria-hidden="true">' +
             (on ? '<i class="fa-solid fa-check"></i>' : '') + '</span>' +
             '<span>' + safeTextPak(o.label) + '</span></button>';
    }).join('');
  }
  var label = document.getElementById('warehouseLabel');
  if (label) {
    label.textContent = WAREHOUSE_OPTIONS_
      .filter(function (o) { return sel.indexOf(o.key) !== -1; })
      .map(function (o) { return o.label; })
      .join(', ');
  }
  var btn = document.getElementById('warehouseBtn');
  if (btn) btn.classList.toggle('filtered', siteFilter !== 'all');
}

function toggleWarehouse_(key) {
  var sel = warehouseSelection_();
  var i = sel.indexOf(key);
  if (i === -1) sel.push(key);
  else sel.splice(i, 1);

  if (sel.length === 0) {
    if (typeof showToastPak === 'function') showToastPak('Pick at least one warehouse');
    return;
  }
  // Keep the declared order, so 'all' is recognised by length alone and the
  // label never reads "E3, E1/E2".
  sel = WAREHOUSE_OPTIONS_
    .map(function (o) { return o.key; })
    .filter(function (k) { return sel.indexOf(k) !== -1; });

  setSiteFilter_(warehouseKeyFor_(sel));
  renderWarehouseMenu_();
}

function toggleWarehouseMenu_(force) {
  var menu = document.getElementById('warehouseMenu');
  var btn = document.getElementById('warehouseBtn');
  if (!menu || !btn) return;
  var open = (typeof force === 'boolean') ? force : !menu.classList.contains('open');
  renderWarehouseMenu_();
  menu.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

// Click-away, matching how the other header menus close.
document.addEventListener('click', function (e) {
  if (!e.target || !e.target.closest) return;
  var item = e.target.closest('.warehouse-item');
  if (item && item.getAttribute('data-wh')) {
    toggleWarehouse_(item.getAttribute('data-wh'));
    return;
  }
  // Click-away, matching how the other header menus close.
  if (!e.target.closest('.warehouse-picker')) toggleWarehouseMenu_(false);
});

</script>
