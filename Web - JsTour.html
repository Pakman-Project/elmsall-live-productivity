<script>
// ============================================================================
// Guided tour — a self-contained spotlight/coach-mark walkthrough. No external
// libraries (CSP-safe). Shows demo data (buildTourDummyData_) while the real
// data loads in the background, then applies the real data when the tour ends.
//
// Steps are grouped into "parts" (part 1, 2, ...) with auto sub-numbering shown
// as e.g. "PART 2 OF 7 · 2.3" so the tour never looks like "5 / 32".
//
// The tour plays as a slideshow. Each step shows for its own duration — a
// five-second floor plus reading time, see stepDurationMs_ — and advances on
// its own. Steps carrying an `interactive` config, or a `demo` function, are
// DEMONSTRATED by the tour in the closing stretch of the step (see
// performStepDemo_), so the viewer reads what is coming, watches it happen,
// and moves on.
//
// It used to require the user to click the highlighted control before it would
// move on. That read as an instruction rather than a demonstration, and it
// could dead-end: when a step's target was not on screen — an empty suggestion
// list, a panel that had not rendered — there was nothing to click and no way
// forward but Skip. A missing target is now simply skipped past.
//
// Skip / Back / Next / Pause remain, Space toggles pause, and one button
// cycles the playback speed through 1x, 1.5x and 2x.
// ============================================================================

var tourStepIndex = 0;
var tourCurrentStep = null;
var tourStepCleanup = null;
var currentInteractiveCfg = null;
var _tourRepositionRaf = null;

var tourStartedAuto = false;
var tourReturnPage = 0;
var tourReturnScroll = 0;

var TOUR_STEPS = [
  // ===== Part 1 — Getting around ============================================

  // On a phone the action buttons live inside the burger menu, so it has to be

    title: 'Refresh any time',

  { part: 1, page: 0, target: '#archiveSelect',

  { part: 1, page: 0, target: '.bonus-search-container',

  { part: 1, page: 0, target: '.next-rail', mobileOnly: true,

// Pre-compute part sub-numbering + total parts for the "PART 2 OF 7 · 2.3" label.
var TOUR_TOTAL_PARTS = 0;
(function computeTourParts_() {
  var counts = {};
  for (var i = 0; i < TOUR_STEPS.length; i++) {
    var p = TOUR_STEPS[i].part || 1;
    counts[p] = (counts[p] || 0) + 1;
    TOUR_STEPS[i]._sub = counts[p];
    if (p > TOUR_TOTAL_PARTS) TOUR_TOTAL_PARTS = p;
  }
})();

// Short thematic name per part, shown in the "?" replay menu.
var TOUR_PART_TITLES = {
  1: 'Getting around',
  2: 'Overall — KPIs & breakdown',
  3: 'Overall — charts & groups',
  4: 'Volume page',
  5: 'Bonus Numbers page',
  6: 'Data Table page',
  7: 'Sharing a view',
  8: 'Arranging the layout',
  9: 'Your saved settings',
  10: 'Wrap up'
};

// Parts that are skipped in the "?" replay menu — the wrap-up is just a
// closing note, so it isn't worth jumping to on its own. It still runs at the
// end of a full tour.
var TOUR_MENU_HIDDEN_PARTS = { 10: true };

function firstStepIndexOfPart_(part) {
  for (var i = 0; i < TOUR_STEPS.length; i++) {
    if ((TOUR_STEPS[i].part || 1) === part) return i;
  }
  return 0;
}

// ---- Replay menu (the "?" button) -------------------------------------------
function openTourMenu() {
  if (tourActive) return;
  var list = $('tourMenuList');
  if (list) {
    var html = '';
    for (var p = 1; p <= TOUR_TOTAL_PARTS; p++) {
      if (TOUR_MENU_HIDDEN_PARTS[p]) continue;
      var count = 0;
      for (var i = 0; i < TOUR_STEPS.length; i++) if ((TOUR_STEPS[i].part || 1) === p) count++;
      var title = TOUR_PART_TITLES[p] || ('Part ' + p);
      html += '<button class="tour-menu-item" onclick="startTourPart_(' + p + ')">' +
                '<span class="tour-menu-item-num">' + p + '</span>' +
                '<span class="tour-menu-item-text">' +
                  '<span class="tour-menu-item-title">' + title + '</span>' +
                  '<span class="tour-menu-item-sub">' + count + ' step' + (count === 1 ? '' : 's') + '</span>' +
                '</span>' +
                '<i class="fa-solid fa-chevron-right"></i>' +
              '</button>';
    }
    list.innerHTML = html;
  }
  var ov = $('tourMenuOverlay');
  if (ov) ov.classList.add('active');
}

function closeTourMenu() {
  var ov = $('tourMenuOverlay');
  if (ov) ov.classList.remove('active');
}

function startFullTour_() {
  closeTourMenu();
  startTour(false, 0);
}

function startTourPart_(part) {
  closeTourMenu();
  startTour(false, firstStepIndexOfPart_(part));
}

function isTourMobile_() {
  return window.matchMedia('(max-width: 700px)').matches;
}

// Whether the header's action buttons are CURRENTLY behind the burger.
//
// Not a width test. The header collapses by measuring whether its title still
// fits (see updateHeaderFit_), so the collapse happens at whatever width that
// turns out to be — and on a half-width laptop window it happens far above the
// 700px the tour used to assume. Steps ringing a header button were then
// pointing at display:none elements, which measure 0x0 and get no ring: the
// exact fault the slideshow rewrite was meant to end, reintroduced from the
// other side.
function tourHeaderCollapsed_() {
  return document.body.classList.contains('header-compact');
}

function resolveInteractive_(step) {
  if (!step || !step.interactive) return null;
  return (typeof step.interactive === 'function') ? step.interactive(isTourMobile_()) : step.interactive;
}

function getActivePageScrollTop_() {
  var pages = document.querySelectorAll('.page');
  return (pages[currentPage] ? pages[currentPage].scrollTop : 0);
}
function setPageScrollTop_(index, value) {
  var pages = document.querySelectorAll('.page');
  if (pages[index]) pages[index].scrollTop = value;
}

// The tour's steps assume a known starting state — e.g. 4.2 asks the user to
// pick "Stacked Area" and 5.2 to pick "Overall". If the user's SAVED preference
// already had those values, selecting them again fires no change event, so the
// interactive step could never be completed (Next is disabled on those steps).
// Worse, a saved "Overall" bonus mode hides the work-area chips entirely, so
// step 5.4 had nothing to ring.
//
// So the tour snapshots the user's state, forces tour-friendly defaults, and
// restores everything on exit. saveUserPreferences() is a no-op while the tour
// runs, so none of this temporary state can leak into their saved settings.
var tourSavedState = null;

function applyTourDefaults_() {
  tourSavedState = {
    bonusViewMode: $('bonusViewMode') ? $('bonusViewMode').value : null,
    volumeChartMode: $('volumeChartMode') ? $('volumeChartMode').value : null,
    hiddenBonusAreas: hiddenBonusAreas.slice(),
    hiddenVolumeAreas: hiddenVolumeAreas.slice(),
    selectedBonuses: selectedBonuses.slice(),
    sideSortMetric: sideSortMetric,
    expandedRowKey: expandedRowKey,
    sortState: { key: sortState.key, dir: sortState.dir }
  };

  if ($('bonusViewMode')) $('bonusViewMode').value = 'area';
  if ($('volumeChartMode')) $('volumeChartMode').value = 'separate';
  hiddenBonusAreas = [];
  hiddenVolumeAreas = [];
  selectedBonuses = [];
  sideSortMetric = 'performance';
  expandedRowKey = null;
  sortState.key = 'dateTime';
  sortState.dir = 'asc';
}

function restoreTourState_() {
  if (!tourSavedState) return;
  var st = tourSavedState;
  tourSavedState = null;

  if (st.bonusViewMode !== null && $('bonusViewMode')) $('bonusViewMode').value = st.bonusViewMode;
  if (st.volumeChartMode !== null && $('volumeChartMode')) $('volumeChartMode').value = st.volumeChartMode;
  hiddenBonusAreas = st.hiddenBonusAreas;
  hiddenVolumeAreas = st.hiddenVolumeAreas;
  selectedBonuses = st.selectedBonuses;
  sideSortMetric = st.sideSortMetric;
  expandedRowKey = st.expandedRowKey;
  sortState.key = st.sortState.key;
  sortState.dir = st.sortState.dir;
}

function startTour(isAuto, startIndex) {
  if (tourActive) return;
  tourActive = true;
  tourStartedAuto = (isAuto === true);
  tourReturnPage = currentPage;
  tourReturnScroll = getActivePageScrollTop_();

  document.querySelectorAll('.kpi-tooltip.open').forEach(function(t) { t.classList.remove('open'); });
  // A TM card left open from before is anchored to a number the tour is about
  // to scroll away from, and would sit over the tour's own ring.
  if (typeof closeBonusTipsPak_ === 'function') closeBonusTipsPak_();

  // Must happen BEFORE the demo render so the demo data is drawn with the
  // tour's expected control values.
  applyTourDefaults_();

  try { renderDashboardPayload_(buildTourDummyData_()); } catch (e) { console.warn('Tour demo render failed', e); }

  // Clear BOTH loading indicators. The tour renders its own demo data, so the
  // cold-load skeleton must come off too — otherwise an auto-started tour on a
  // first visit spends its opening steps pointing at shimmer placeholders and
  // canvases hidden by the skeleton CSS until the real fetch happens to land.
  var lo = $('loadingOverlay');
  if (lo) lo.classList.remove('active');
  document.body.classList.remove('loading-skeleton');

  // The mobile chrome auto-hides on scroll; make sure it is restored before the
  // tour starts, since the rail icons are a tour target and a hidden element
  // measures 0x0 and would get no ring.
  if (typeof updatePageScrollChrome_ === 'function') updatePageScrollChrome_();

  $('tourOverlay').classList.add('active');

  window.addEventListener('resize', tourReposition_);
  window.addEventListener('scroll', tourReposition_, true);
  document.addEventListener('keydown', tourKeydown_);

  // A fresh tour always plays. showTourStep_ no longer clears this, so without
  // resetting it here a tour ended while paused would start the next run
  // frozen on its first slide.
  _tourPaused = false;

  // showTourStep_ switches to the step's page itself; start wherever asked
  // (0 for a full run, or the first step of a chosen part from the "?" menu).
  var start = (typeof startIndex === 'number' && startIndex > 0 && startIndex < TOUR_STEPS.length) ? startIndex : 0;
  showTourStep_(start);
}

function endTour_() {
  if (!tourActive) return;
  clearTourTimers_();
  currentInteractiveCfg = null;
  runStepCleanup_();
  tourActive = false;

  var ov = $('tourOverlay');
  ov.classList.remove('active', 'no-spotlight', 'passthrough', 'interactive');

  window.removeEventListener('resize', tourReposition_);
  window.removeEventListener('scroll', tourReposition_, true);
  document.removeEventListener('keydown', tourKeydown_);

  try { localStorage.setItem(TOUR_SEEN_KEY, '1'); } catch (e) {}

  // Put the user's own settings back before re-rendering their real data.
  restoreTourState_();
  renderBonusChips();
  updateClearBtnVisibility();

  var payload = pendingRealData || lastRealPayload;
  pendingRealData = null;
  if (payload) {
    try {
      renderDashboardPayload_(payload);
      currentArchiveUrl = (typeof payload.__archiveUrl !== 'undefined') ? payload.__archiveUrl : currentArchiveUrl;
      lastRealPayload = payload;
    } catch (e) { console.error('Restore after tour failed', e); }
  } else {
    $('status').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading...';
    var lo = $('loadingOverlay');
    if (lo) lo.classList.add('active');
  }

  if (tourStartedAuto) {
    goToPage(0);
    setPageScrollTop_(0, 0);
  } else {
    goToPage(tourReturnPage);
    setPageScrollTop_(tourReturnPage, tourReturnScroll);
  }
}

function runStepCleanup_() {
  if (tourStepCleanup) {
    try { tourStepCleanup(); } catch (e) {}
    tourStepCleanup = null;
  }
}

// A step can declare itself mobileOnly or desktopOnly — genuinely about the
// viewport, like pull-to-refresh — or whenCollapsed / whenExpanded, which are
// about the header's current shape and can both be true at 900px or at 400px.
// Anything declaring none of them runs everywhere.
function stepAppliesHere_(step) {
  if (!step) return false;
  var mobile = isTourMobile_();
  if (step.mobileOnly && !mobile) return false;
  if (step.desktopOnly && mobile) return false;
  if (step.whenCollapsed && !tourHeaderCollapsed_()) return false;
  if (step.whenExpanded && tourHeaderCollapsed_()) return false;
  return true;
}

function tourKeydown_(e) {
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); toggleTourPause_(); }
  else if (e.key === 'Escape') { endTour_(); }
  else if (e.key === 'ArrowRight') { tourNext_(); }
  else if (e.key === 'ArrowLeft' && tourStepIndex > 0) { showTourStep_(tourStepIndex - 1); }
}

function tourReposition_() {
  if (!tourActive) return;
  if (_tourRepositionRaf) cancelAnimationFrame(_tourRepositionRaf);
  _tourRepositionRaf = requestAnimationFrame(function() { placeTourTooltip_(tourCurrentStep); });
}

// ---- Try-it-yourself helpers ------------------------------------------------
// Several steps let the user genuinely operate the dashboard. Anything they
// change is snapshotted first and put back when the part ends, so a tour never
// leaves someone's setup different from how they left it. Preferences are not
// written during a tour either (saveUserPreferences bails while tourActive), so
// nothing here can outlive the page.

// Safe to call repeatedly. Any step ringing a header action has to make sure
// the menu holding it is open first — including when the step is reached by
// stepping backwards, which is why this is idempotent rather than a toggle.
function tourOpenHeaderMenuIfCollapsed_() {
  if (!tourHeaderCollapsed_()) return;
  if (typeof toggleHeaderMenu_ !== 'function') return;
  if (!document.body.classList.contains('header-menu-open')) toggleHeaderMenu_(true);
}

// ---- Making every step reachable backwards ---------------------------------
// A step that RINGS something only a previous step's demonstration created is
// fine going forwards and blank coming back. Each of these puts that state back
// if it is missing, and does nothing if it is already there, so Back lands on a
// step that looks exactly as it did on the way through.

function tourEnsureFilter_() {
  if (typeof selectedBonuses === 'undefined') return;
  if (selectedBonuses.length) return;
  var pick = (typeof allBonusList !== 'undefined' && allBonusList.length) ? allBonusList[0] : null;
  if (!pick) return;
  selectedBonuses = [pick];
  renderBonusChips();
  updateClearBtnVisibility();
  applyLocalFiltersPak();
}

function tourEnsureExpandedRow_() {
  if (document.querySelector('.main-detail-row.open')) return;
  if (typeof currentMainRows === 'undefined' || !currentMainRows.length) return;
  // Any row will do, but one with detail behind it demonstrates more: the
  // table can legitimately hold blocks with nothing in them.
  var row = null;
  for (var i = 0; i < currentMainRows.length; i++) {
    if ((currentMainRows[i].stdHours || 0) > 0) { row = currentMainRows[i]; break; }
  }
  if (!row) row = currentMainRows[0];
  expandedRowKey = row.dateTime;
  if (typeof renderMainTablePak === 'function') renderMainTablePak(currentMainRows);
}

function tourPrimeSearch_() {
  var input = $('bonusSearch');
  if (!input) return;

  // Reached backwards, the box is empty and the suggestion list is closed —
  // seed it so the step has something to point at either way.
  if (!input.value) {
    input.value = String((allBonusList && allBonusList[0]) || 'A').charAt(0);
  }
  input.dispatchEvent(new Event('input', { bubbles: true }));

  // The previous step let the user type anything at all, and a query matching
  // nothing leaves no suggestion to click — which would strand them on a step
  // that cannot be completed. Fall back to a character that is guaranteed to
  // match one of the loaded bonus numbers.
  var dd = $('searchDropdown');
  if (!dd || !dd.querySelector('.search-item')) {
    input.value = String((allBonusList && allBonusList[0]) || 'A').charAt(0);
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

function tourClearFilter_() {
  var input = $('bonusSearch');
  if (input) input.value = '';
  if (typeof closeSearchDropdown_ === 'function') closeSearchDropdown_();
  // Cleared directly rather than through clearAllBonuses, which raises an Undo
  // toast — useful normally, noise in the middle of a tour.
  if (typeof selectedBonuses !== 'undefined' && selectedBonuses.length) {
    selectedBonuses = [];
    renderBonusChips();
    updateClearBtnVisibility();
    applyLocalFiltersPak();
  }
}

var _tourSavedAreaGroups = null;
var _tourSavedAreaSplit = null;

function tourOpenAreaGroups_() {
  if (_tourSavedAreaGroups === null) {
    _tourSavedAreaGroups = JSON.parse(JSON.stringify(areaGroupState));
    _tourSavedAreaSplit = JSON.parse(JSON.stringify(areaGroupSplitState));
  }
  var ov = $('areaGroupOverlay');
  if (ov && !ov.classList.contains('active') && typeof openAreaGroups === 'function') {
    openAreaGroups();
  }
}

function tourRestoreAreaGroups_() {
  if (typeof closeAreaGroups === 'function') closeAreaGroups();
  if (_tourSavedAreaGroups === null) return;
  areaGroupState = _tourSavedAreaGroups;
  areaGroupSplitState = _tourSavedAreaSplit;
  _tourSavedAreaGroups = null;
  _tourSavedAreaSplit = null;
  if (typeof applyLocalFiltersPak === 'function') applyLocalFiltersPak();
}

var _tourSavedChartOrder = null;

function tourEnterReorder_() {
  if (_tourSavedChartOrder === null && typeof chartOrderState !== 'undefined') {
    _tourSavedChartOrder = JSON.parse(JSON.stringify(chartOrderState));
  }
  if (typeof setReorderMode_ === 'function' && !_reorderMode) setReorderMode_(true);
}

function tourRestoreReorder_() {
  if (typeof setReorderMode_ === 'function' && typeof _reorderMode !== 'undefined' && _reorderMode) {
    setReorderMode_(false);
  }
  if (typeof toggleHeaderMenu_ === 'function') toggleHeaderMenu_(false);
  if (_tourSavedChartOrder === null) return;
  chartOrderState = _tourSavedChartOrder;
  _tourSavedChartOrder = null;
  if (typeof applyChartOrder_ === 'function') applyChartOrder_();
  if (typeof reorderChipsToMatch_ === 'function') {
    reorderChipsToMatch_('volumeAreaToggles', 'volume');
    reorderChipsToMatch_('bonusAreaToggles', 'bonus');
  }
}

// ---- Slideshow playback ------------------------------------------------------
// The tour plays itself. It used to require the user to click each highlighted
// control before it would move on, which read as an instruction rather than a
// demonstration and — worse — could strand them: if a step's target was not on
// screen (an empty suggestion list, a panel that had not rendered yet) there
// was nothing to click and no way forward but Skip.
//
// Now every step shows for a fixed time and the tour performs the demonstration
// itself. A missing target is simply skipped over, so no step can dead-end.

// A floor, not the whole budget — a step also gets time to be read. Long
// bodies in Parts 3 and 8 were being pulled off screen mid-sentence at a flat
// five seconds.
var TOUR_STEP_FLOOR_MS = 5000;
var TOUR_STEP_CAP_MS = 14000;
// ~200 words per minute, the usual comfortable rate for short on-screen prose.
var TOUR_MS_PER_WORD = 300;

// The demonstration fires in the CLOSING stretch of a step: the viewer reads
// what is about to happen, watches it happen, and moves on. Firing it early
// left the rest of the step sitting on an already-changed screen.
var TOUR_DEMO_TAIL_MS = 1500;

// Playback speed. Divides every duration, so 2x halves both the step length and
// the wait before the demonstration — and 0.5x doubles them, for a first-time
// viewer, a second language, or a screen being read across a room.
//
// Ordered slowest-first and starting at 1x, so one click from the default goes
// FASTER. Someone who wants to slow down will hunt for the control; someone
// speeding through a tour they have seen before is clicking without looking.
var TOUR_SPEEDS = [0.5, 1, 1.5, 2];
var _tourSpeedIdx = 1;
function tourSpeed_() { return TOUR_SPEEDS[_tourSpeedIdx] || 1; }

// Title and body together: the title is read too, and some are long enough to
// matter.
function stepDurationMs_(step) {
  var text = ((step && step.title) || '') + ' ' + ((step && step.body) || '');
  var words = text.split(/\s+/).filter(function (w) { return w.length > 0; }).length;
  var ms = Math.max(TOUR_STEP_FLOOR_MS, words * TOUR_MS_PER_WORD);
  return Math.round(Math.min(TOUR_STEP_CAP_MS, ms) / tourSpeed_());
}

var _tourTimer = null;
var _tourDemoTimer = null;
var _tourPaused = false;
var _tourStepStartedAt = 0;
var _tourStepTotalMs = 0;
var _tourDemoPending = false;
var _tourDemoAtMs = 0;

function clearTourTimers_() {
  if (_tourTimer) { clearTimeout(_tourTimer); _tourTimer = null; }
  if (_tourDemoTimer) { clearTimeout(_tourDemoTimer); _tourDemoTimer = null; }
}

// Performs a step's demonstration WITHOUT advancing — the timer owns advancing.
// Every failure here is non-fatal on purpose: a demonstration that cannot run
// should cost the viewer a dull step, not a broken tour.
// A visible cue on whatever the tour is about to operate. Without it a control
// changes state with no indication of what caused it, which reads as the page
// glitching rather than as a demonstration.
function flashDemoTarget_(el) {
  if (!el || !el.classList) return;
  el.classList.remove('tour-demo-hit');
  void el.offsetWidth;
  el.classList.add('tour-demo-hit');
  setTimeout(function () { el.classList.remove('tour-demo-hit'); }, 650);
}

// Types a value a character at a time so the suggestion list is seen filling
// in, rather than appearing fully formed out of nowhere.
function typeIntoDemo_(el, value, perCharMs) {
  if (!el) return;
  el.focus();
  el.value = '';
  var i = 0;
  (function tick() {
    if (!tourActive || i >= value.length) return;
    el.value += value.charAt(i++);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    setTimeout(tick, perCharMs);
  })();
}

// A full press-release-click sequence, not just .click().
//
// Some controls here deliberately listen for mousedown rather than click — the
// search suggestions do, because the input would otherwise blur first and close
// the list out from under the click. element.click() dispatches ONLY a click
// event, so those handlers never ran and the tour appeared to select nothing:
// that is why the filter step showed a dropdown and then moved on having
// applied no filter at all.
function demoClick_(sel) {
  var el = document.querySelector(sel);
  if (!el) return false;
  flashDemoTarget_(el);
  // Slightly after the flash, so the cue is seen before the effect.
  setTimeout(function () {
    try {
      var opts = { bubbles: true, cancelable: true, view: window };
      el.dispatchEvent(new MouseEvent('mousedown', opts));
      el.dispatchEvent(new MouseEvent('mouseup', opts));
      el.click();
    } catch (e) {
      try { el.click(); } catch (e2) { console.warn('Tour demo click failed', e2); }
    }
  }, 220);
  return true;
}

// Performs a step's demonstration WITHOUT advancing — the timer owns advancing.
// Every failure here is non-fatal on purpose: a demonstration that cannot run
// should cost the viewer a dull step, not a broken tour.
function performStepDemo_(step) {
  // A `demo` function is for anything that takes more than one action to show
  // properly — ticking two boxes, or typing then choosing.
  if (typeof step.demo === 'function') {
    try { step.demo(); } catch (e) { console.warn('Tour demo failed', e); }
    return;
  }

  var cfg = resolveInteractive_(step);
  if (!cfg) return;
  var el = document.querySelector(cfg.sel);
  if (!el) return;
  try {
    if (cfg.type === 'change') {
      flashDemoTarget_(el);
      setTimeout(function () {
        el.value = cfg.changeValue;
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }, 220);
    } else if (cfg.type === 'input') {
      typeIntoDemo_(el, String(cfg.inputValue || 'A'), 180);
    } else {
      demoClick_(cfg.sel);
    }
  } catch (e) {
    console.warn('Tour demo failed', e);
  }
}

// Brings a ringed element into view, in the page or inside a scrolling modal.
// 'nearest' inside a modal so the dialog is nudged just enough rather than
// yanked to centre, which looks like a jump when the control was already
// mostly visible.
function scrollTourTargetIntoView_(el, insideModal) {
  if (!el || !el.scrollIntoView) return;
  try {
    el.scrollIntoView({
      block: insideModal ? 'nearest' : 'center',
      inline: 'nearest',
      behavior: 'smooth'
    });
  } catch (e) {
    try { el.scrollIntoView(); } catch (e2) {}
  }
}

function setTourProgress_(pct, durationMs) {
  var bar = $('tourProgressBar');
  if (!bar) return;
  bar.style.transition = durationMs ? ('width ' + durationMs + 'ms linear') : 'none';
  bar.style.width = pct + '%';
  // Reading a layout property flushes the pending style change. Without it the
  // browser coalesces "width: 0, no transition" and "width: 100%, transition"
  // into a single computation and the bar simply jumps — which is why it only
  // ever animated on the very first step, the one where the element had just
  // been laid out for other reasons.
  void bar.offsetWidth;
}

function freezeTourProgress_() {
  var bar = $('tourProgressBar');
  if (!bar || !bar.parentElement) return;
  var w = bar.getBoundingClientRect().width;
  var total = bar.parentElement.getBoundingClientRect().width || 1;
  setTourProgress_(Math.min(100, (w / total) * 100), 0);
}

function startStepPlayback_(step) {
  clearTourTimers_();
  _tourStepTotalMs = stepDurationMs_(step);
  _tourDemoPending = !!(step.interactive || step.demo);
  // Scaled with speed so the tail keeps its proportion, and floored so a short
  // step still shows the ring before acting on it.
  var tail = Math.round(TOUR_DEMO_TAIL_MS / tourSpeed_());
  _tourDemoAtMs = Math.max(500, _tourStepTotalMs - tail);
  _tourStepStartedAt = Date.now();

  setTourProgress_(0, 0);
  if (_tourPaused) return;
  scheduleTourTimers_(_tourStepTotalMs, _tourDemoPending ? _tourDemoAtMs : -1);
}

function scheduleTourTimers_(remainingMs, demoInMs) {
  var startedIndex = tourStepIndex;
  var stepAtStart = tourCurrentStep;

  if (demoInMs >= 0) {
    _tourDemoTimer = setTimeout(function () {
      _tourDemoTimer = null;
      if (!tourActive || tourStepIndex !== startedIndex) return;
      _tourDemoPending = false;
      performStepDemo_(stepAtStart);
      // The demonstration may have opened a modal, re-rendered a panel or moved
      // one — so the ring needs re-measuring, and whatever it now points at may
      // have ended up off screen.
      setTimeout(function () {
        if (!tourActive || tourStepIndex !== startedIndex) return;
        var sel = stepAtStart.target ||
                  (currentInteractiveCfg && currentInteractiveCfg.sel);
        var el = sel ? document.querySelector(sel) : null;
        if (el) scrollTourTargetIntoView_(el, !!stepAtStart.modal);
        placeTourTooltip_(stepAtStart);
      }, 260);
    }, demoInMs);
  }

  _tourTimer = setTimeout(function () {
    _tourTimer = null;
    if (!tourActive || tourStepIndex !== startedIndex) return;
    showTourStep_(tourStepIndex + 1);
  }, remainingMs);

  setTourProgress_(100, remainingMs);
}

function pauseTour_() {
  if (_tourPaused) return;
  _tourPaused = true;
  var elapsed = Date.now() - _tourStepStartedAt;
  _tourStepTotalMs = Math.max(0, _tourStepTotalMs - elapsed);
  if (_tourDemoPending) _tourDemoAtMs = Math.max(0, _tourDemoAtMs - elapsed);
  clearTourTimers_();
  freezeTourProgress_();
  updateTourPauseBtn_();
}

function resumeTour_() {
  if (!_tourPaused) return;
  _tourPaused = false;
  updateTourPauseBtn_();
  _tourStepStartedAt = Date.now();
  // A step paused right at its end would otherwise flick past on resume.
  if (_tourStepTotalMs < 400) _tourStepTotalMs = 400;
  scheduleTourTimers_(_tourStepTotalMs, _tourDemoPending ? _tourDemoAtMs : -1);
}

function toggleTourPause_() {
  if (_tourPaused) resumeTour_(); else pauseTour_();
}

function updateTourSpeedBtn_() {
  var btn = $('tourSpeedBtn');
  if (!btn) return;
  btn.textContent = tourSpeed_() + '\u00d7';
  var label = 'Playback speed ' + tourSpeed_() + '\u00d7 \u2014 click to change';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
}

// Re-times the CURRENT step as well as the ones after it, so the change is felt
// immediately rather than at the next slide.
function cycleTourSpeed_() {
  var before = tourSpeed_();
  _tourSpeedIdx = (_tourSpeedIdx + 1) % TOUR_SPEEDS.length;
  updateTourSpeedBtn_();

  if (_tourPaused || !tourActive) return;
  var elapsed = Date.now() - _tourStepStartedAt;
  var remaining = Math.max(300, (_tourStepTotalMs - elapsed) * (before / tourSpeed_()));
  var demoIn = _tourDemoPending
    ? Math.max(0, (_tourDemoAtMs - elapsed) * (before / tourSpeed_()))
    : -1;
  clearTourTimers_();
  _tourStepStartedAt = Date.now();
  _tourStepTotalMs = remaining;
  _tourDemoAtMs = demoIn > 0 ? demoIn : 0;
  freezeTourProgress_();
  scheduleTourTimers_(remaining, demoIn);
}

function updateTourPauseBtn_() {
  var btn = $('tourPauseBtn');
  if (!btn) return;
  var icon = btn.querySelector('i');
  if (icon) icon.className = _tourPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
  var label = _tourPaused ? 'Resume the tour' : 'Pause the tour';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
}

function tourNext_() {
  // Manual override of the timer — the slideshow advances on its own, but a
  // viewer who has read the step should not have to sit through the rest of it.
  clearTourTimers_();
  showTourStep_(tourStepIndex + 1);
}

// ---- Rendering ---------------------------------------------------------------
function getStepRect_(step) {
  var selector = step && (step.target || (currentInteractiveCfg && currentInteractiveCfg.sel));
  if (!selector) return null;
  var els = step.union
    ? Array.prototype.slice.call(document.querySelectorAll(selector))
    : [document.querySelector(selector)];
  var left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity, found = false;
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (!el) continue;
    var r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) continue;
    found = true;
    left = Math.min(left, r.left); top = Math.min(top, r.top);
    right = Math.max(right, r.right); bottom = Math.max(bottom, r.bottom);
  }
  if (!found) return null;
  return { left: left, top: top, width: right - left, height: bottom - top };
}

function positionSpotlight_(rect) {
  var sp = $('tourSpotlight');
  var pad = 8;
  sp.style.left = (rect.left - pad) + 'px';
  sp.style.top = (rect.top - pad) + 'px';
  sp.style.width = (rect.width + pad * 2) + 'px';
  sp.style.height = (rect.height + pad * 2) + 'px';
}

function showTourStep_(i) {
  if (i < 0) i = 0;
  if (i >= TOUR_STEPS.length) { endTour_(); return; }

  // Steps about mobile-only chrome are skipped on a desktop, and vice versa.
  // Skipping in the direction of travel, so stepping Back through them does not
  // bounce the viewer forwards again.
  var forwards = (i >= tourStepIndex);
  while (i >= 0 && i < TOUR_STEPS.length && !stepAppliesHere_(TOUR_STEPS[i])) {
    i += forwards ? 1 : -1;
  }
  if (i < 0) i = 0;
  if (i >= TOUR_STEPS.length) { endTour_(); return; }

  clearTourTimers_();
  currentInteractiveCfg = null;
  // Pause is deliberately NOT cleared here. Back and Next both land in this
  // function, and clearing it made the tour resume playing the moment a paused
  // viewer stepped anywhere - so pausing to read, then nudging back one slide
  // to re-read the previous one, silently started the clock again. Pause is the
  // viewer's state, not the step's; only starting a tour resets it.
  runStepCleanup_();

  tourStepIndex = i;
  var step = TOUR_STEPS[i];
  tourCurrentStep = step;

  var pageChanged = (typeof step.page === 'number' && step.page !== currentPage);
  if (pageChanged) goToPage(step.page);

  $('tourStepCounter').textContent = 'Part ' + step.part + ' of ' + TOUR_TOTAL_PARTS + '  ·  ' + step.part + '.' + step._sub;
  $('tourTipTitle').textContent = step.title;
  $('tourTipBody').textContent = step.body;

  var isLast = (i === TOUR_STEPS.length - 1);
  var interactive = !!step.interactive;

  $('tourBackBtn').disabled = (i === 0);
  $('tourNextBtn').textContent = isLast ? 'Done' : 'Next';
  // Always available now: nothing has to be clicked for the tour to progress.
  $('tourNextBtn').disabled = false;
  $('tourSkipBtn').style.visibility = isLast ? 'hidden' : 'visible';
  updateTourPauseBtn_();
  updateTourSpeedBtn_();

  var delay = pageChanged ? 400 : 0;
  setTimeout(function() {
    if (step.action) { try { step.action(); } catch (e) { console.warn('Tour action failed', e); } }
    tourStepCleanup = step.cleanup || null;

    // Resolved for the ring's benefit — the selector is often the control the
    // step is about — but nothing is armed to listen for a click any more.
    currentInteractiveCfg = interactive ? resolveInteractive_(step) : null;
    startStepPlayback_(step);

    var selector = step.target || (currentInteractiveCfg && currentInteractiveCfg.sel);
    var firstEl = selector ? document.querySelector(selector) : null;
    if (firstEl && !step.modal) {
      scrollTourTargetIntoView_(firstEl, false);
      setTimeout(function() { placeTourTooltip_(step); }, 220);
    } else {
      placeTourTooltip_(step);
      // Modals scale in over ~0.3s — re-measure the close-button ring once the
      // modal has settled so the highlight lands squarely on the ×.
      if (step.modal) {
        // Modal bodies scroll independently, and a ringed control can easily sit
        // below their fold — the editors in Groups & Charts are taller than the
        // dialog. Scrolled once the modal has finished scaling in.
        setTimeout(function() {
          if (tourCurrentStep !== step) return;
          if (firstEl) scrollTourTargetIntoView_(firstEl, true);
          placeTourTooltip_(step);
        }, 400);
        setTimeout(function() { if (tourCurrentStep === step) placeTourTooltip_(step); }, 700);
      }
    }
  }, delay);
}

function placeTourTooltip_(step) {
  var ov = $('tourOverlay');
  var tip = $('tourTooltip');

  ov.classList.remove('no-spotlight', 'passthrough', 'interactive');

  // Modal steps: transparent overlay so the opened modal shows; tooltip pins
  // to the bottom (CSS). If interactive, ring the modal's close button.
  if (step && step.modal) {
    ov.classList.add('passthrough');
    if (step.interactive) {
      ov.classList.add('interactive');
      var mRect = getStepRect_(step);
      if (mRect) positionSpotlight_(mRect);
    }
    tip.style.left = ''; tip.style.top = ''; tip.style.transform = '';
    return;
  }

  var rect = getStepRect_(step);

  if (!rect) {
    ov.classList.add('no-spotlight');
    tip.style.left = ''; tip.style.top = ''; tip.style.transform = '';
    return;
  }

  if (step && step.interactive) ov.classList.add('interactive');
  positionSpotlight_(rect);

  if (isTourMobile_()) {
    tip.style.left = ''; tip.style.top = ''; tip.style.transform = '';
    // The tooltip is pinned to the bottom by CSS, which puts it straight over
    // anything ringed in the lower half of the screen — and on a phone that is
    // most of the page. Flip it to the top when the ring is low enough to be
    // covered. Measured against the tooltip's real height rather than a
    // guess, since the bodies vary a lot in length.
    var tipHeight = tip.offsetHeight || 260;
    var coversTarget = (rect.top + rect.height) > (window.innerHeight - tipHeight - 28);
    tip.classList.toggle('pin-top', coversTarget);
    return;
  }
  tip.classList.remove('pin-top');

  var margin = 14;
  var tipW = tip.offsetWidth;
  var tipH = tip.offsetHeight;

  var top = rect.top + rect.height + 12;
  if (top + tipH > window.innerHeight - margin) top = rect.top - tipH - 12;
  if (top < margin) top = margin;

  var left = rect.left + rect.width / 2 - tipW / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - tipW - margin));

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.transform = 'none';
}

function maybeAutoStartTour_() {
  // TOUR_FORCE comes from the ?tour= parameter / the preview menu. It exists
  // because this app usually runs inside a sandboxed iframe, where clearing the
  // "seen" flag from a browser console is unreliable — the console is almost
  // always pointed at the wrong frame, so the key never actually gets removed.
  var forced = (typeof TOUR_FORCE !== 'undefined') ? String(TOUR_FORCE || '') : '';

  if (forced === 'reset') {
    try { localStorage.removeItem(TOUR_SEEN_KEY); } catch (e) {}
  }
  if (forced === '1' || forced === 'reset') {
    setTimeout(function() { startTour(true); }, 500);
    return;
  }

  var seen = null;
  try {
    seen = localStorage.getItem(TOUR_SEEN_KEY);
  } catch (e) {
    // Storage blocked: we cannot tell whether this user has already seen the
    // tour, so stay quiet rather than replaying it on every single load.
    console.info('[tour] localStorage unavailable — auto-start skipped.');
    return;
  }

  if (seen) {
    console.info('[tour] Auto-start skipped: "' + TOUR_SEEN_KEY + '" is set, so this ' +
                 'browser has seen the tour. Use the Sheets menu ' +
                 '"Preview Dashboard (First-time / Tour)", or add ?tour=reset to the ' +
                 'web-app URL, to replay the first-visit experience.');
    return;
  }

  setTimeout(function() { startTour(true); }, 500);
}

// Wire the tooltip buttons once (markup exists before this script runs).
(function wireTour_() {
  var next = $('tourNextBtn');
  var back = $('tourBackBtn');
  var skip = $('tourSkipBtn');
  var pause = $('tourPauseBtn');
  var speed = $('tourSpeedBtn');
  if (speed) speed.addEventListener('click', cycleTourSpeed_);
  if (next) next.addEventListener('click', function() { if (!next.disabled) tourNext_(); });
  if (back) back.addEventListener('click', function() {
    if (tourStepIndex > 0) { clearTourTimers_(); showTourStep_(tourStepIndex - 1); }
  });
  if (skip) skip.addEventListener('click', function() { endTour_(); });
  if (pause) pause.addEventListener('click', toggleTourPause_);
})();
</script>
