<header class="next-header">
  <div class="next-header-left">
    <div class="next-brand">
      <a class="next-logo" href="#" onclick="return false;" aria-label="NEXT">NEXT</a>
      <span class="next-header-divider" aria-hidden="true"></span>
      <h1 class="next-header-title">E3 Live Productivity</h1>
    </div>
    <div class="next-header-meta">
      <span id="status">Loading...</span>
      <span id="noteText" class="note-text"></span>
      <span id="lastUpdateText">-</span>
    </div>
  </div>

  <div class="next-header-right">
    <div class="next-header-controls">
      <select id="archiveSelect" class="input header-input">
        <option value="" selected>Loading History...</option>
      </select>

      <div class="bonus-search-container">
        <div class="search-row">
          <button id="clearFilterBtn" class="clear-filter-btn" onclick="clearAllBonuses()">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div id="searchInputWrap" class="search-input-wrap">
            <input id="bonusSearch" class="input" type="text" placeholder="Filter by Bonus..." autocomplete="off">
            <i class="fa fa-search"></i>
          </div>
        </div>
        <div id="searchDropdown" class="search-dropdown"></div>
      </div>
    </div>

    <div class="next-header-actions">
      <button class="header-icon-btn refresh-btn" onclick="loadDataPak()" title="Refresh" aria-label="Refresh">
        <span class="material-symbols-outlined">refresh</span>
      </button>
      <button class="header-icon-btn tour-help-btn" onclick="openTourMenu()" title="Take the tour" aria-label="Take the tour">
        <span class="material-symbols-outlined">help</span>
      </button>
      <button class="header-icon-btn" id="themeToggleBtn" onclick="toggleTheme_()" title="Switch to dark mode" aria-label="Switch to dark mode">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
    </div>
  </div>
</header>
