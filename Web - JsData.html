<script>

function getPerfSplitGroups_() {
  // Saved groups are kept exactly as the user built them, but a group made
  // entirely of the other building's areas draws nothing. When NONE of them has
  // an area in view - which is what switching building does to an untouched
  // setup - fall back to this building's defaults rather than render an empty
  // chart. The saved state is not overwritten, so switching back restores it.
  var source = areaGroupState;
  var anyInScope = false;
  for (var s = 0; s < source.length; s++) {
    var sk = (source[s] || {}).keys || [];
    for (var t = 0; t < sk.length; t++) { if (areaInSite_(sk[t])) { anyInScope = true; break; } }
    if (anyInScope) break;
  }
  if (!anyInScope) source = defaultAreaGroupState_();

  var groups = [];
  for (var i = 0; i < source.length; i++) {
    var entry = source[i] || {};
    var keys = entry.keys || [];
    var labels = [];
    for (var k = 0; k < keys.length; k++) {
      for (var v = 0; v < VOLUME_TYPES.length; v++) {
        if (VOLUME_TYPES[v].key === keys[k]) { labels.push(VOLUME_TYPES[v].label); break; }
      }
    }
    if (labels.length === 0) continue;
    groups.push({
      id: 'g' + i,
      label: joinAreaLabels_(labels),
      keys: keys,
      color: groupColor_(i),
      showLine: entry.showLine !== false,
      showTrend: entry.showTrend === true
    });
  }
  return groups;
}

function handleControlChangePak(sourceElement, type) {
  var syncAttr = 'data-sync="' + type + '"';
  var allSynced = document.querySelectorAll('[' + syncAttr + ']');
  for (var i = 0; i < allSynced.length; i++) {
    if (allSynced[i] !== sourceElement) { allSynced[i].value = sourceElement.value; }
  }
  applyLocalFiltersPak();
}

// Builds all 96 fifteen-minute blocks (00:00-00:15 … 23:45-00:00) for a single
// day, so the Data Table can always show the full day regardless of the Hours
// Range selector — including blocks later than "now" or with no data yet, which
// come back as zero-value placeholder rows from generateMainRows_.
//
// The day is anchored to the MOST RECENT loaded block's date, not the first.
// On the live view the feed can include a couple of pre-midnight blocks from
// yesterday (the pipeline's pre-midnight grace), so the first block can be
// yesterday — the latest block is today, which is the day we want. For a
// History snapshot the latest block is simply that day. Returns null if there's
// no data yet (caller falls back to the Hours-Range-scoped list).
function buildFullDayTimeList_() {
  if (!timeRanges.length) return null;
  var latest = timeRanges[timeRanges.length - 1];
  var dayStart = parseDateTimePartPak(extractRangePartsPak(latest).start);
  if (!dayStart) return null;
  dayStart.setHours(0, 0, 0, 0);
  var list = [];
  for (var b = 0; b < 96; b++) {
    var s = new Date(dayStart.getTime() + b * 15 * 60000);
    var e = new Date(s.getTime() + 15 * 60000);
    list.push(formatDatePak(s) + ' - ' + formatDatePak(e));
  }
  return list;
}

function applyLocalFiltersPak() {
  // Before anything reads rawSideData: a bonus filter overrides the building
  // filter, and this is the one place every path that changes either of them
  // passes through.
  if (typeof syncSiteScope_ === 'function') syncSiteScope_();

  // The KPI cards read the same scoped payload, so they are rendered here
  // rather than once per data load - a building change has to move them too.
  if (typeof renderKpiCards_ === 'function') renderKpiCards_();

  var hoursRange = parseInt($('hoursRange').value, 10) || 3;
  var windowMinutes = parseInt($('timeWindow').value, 10);
  var rowsLimit = parseInt($('sharedRowsLimit').value, 10) || 10;
  var blocksToKeep = hoursRange * 4;
  var targetTimeList = timeRanges.slice(-blocksToKeep);
  var targetTimeRanges = {};
  for (var i = 0; i < targetTimeList.length; i++) { targetTimeRanges[targetTimeList[i]] = true; }
  var filteredData = rawSideData.filter(function(row) {
    if (!targetTimeRanges[row.timeRange]) return false;
    if (selectedBonuses.length > 0 && selectedBonuses.indexOf(row.bonus) === -1) return false;
    return true;
  });
  var baseRows = generateMainRows_(filteredData, targetTimeList);

  var activeTrendCharts = [];
  if (trendSplitState.enabled && trendSplitState.charts) {
    activeTrendCharts = trendSplitState.charts.filter(function(c) { return c.length > 0; });
  }

  var trendRowsList, trendTitles, trendAreaKeysList;
  if (activeTrendCharts.length > 0) {
    trendRowsList = activeTrendCharts.map(function(areaKeys) {
      return generateTrendRowsForAreas_(filteredData, targetTimeList, areaKeys);
    });
    trendTitles = activeTrendCharts.map(function(areaKeys) { return getTrendTitle(areaKeys); });
    trendAreaKeysList = activeTrendCharts;
  } else {
    trendRowsList = [baseRows];
    trendTitles = ['Deployment Trend'];
    trendAreaKeysList = [[]];
  }

  // Data Table: the full day, independent of Hours Range (only the Bonus filter
  // still applies) — but ONLY blocks that actually exist in the database. Blocks
  // in the future, and any the pipeline has not published, are dropped rather
  // than shown as empty rows. Presence is judged against the UNFILTERED data so
  // the table keeps the same shape when a bonus filter is applied.
  var tableTimeList = buildFullDayTimeList_() || targetTimeList;
  var presentBlocks = {};
  for (var pb = 0; pb < rawSideData.length; pb++) { presentBlocks[rawSideData[pb].timeRange] = true; }
  tableTimeList = tableTimeList.filter(function(tr) { return presentBlocks[tr]; });
  var tableSourceData = rawSideData.filter(function(row) {
    return selectedBonuses.length === 0 || selectedBonuses.indexOf(row.bonus) !== -1;
  });
  // Raw on purpose: no threshold filtering, so the Data Table shows exactly what
  // the database holds. Every other page keeps the threshold applied.
  var tableBaseRows = generateMainRows_(tableSourceData, tableTimeList, { applyThreshold: false });

  var tableData = tableBaseRows;
  if (windowMinutes !== 15) { tableData = getAggregatedDataPak(tableBaseRows, windowMinutes); }
  currentMainRows = tableData;

  // Only the page the user is actually looking at is rendered now; the other
  // three are marked dirty and built when first shown (see renderPageIfNeeded_).
  // Rendering all four up front meant building ~13 charts and every table on
  // load, even though only one page is visible.
  invalidateChartCommon_();
  pageRenderCtx = {
    baseRows: baseRows,
    trendRowsList: trendRowsList,
    trendTitles: trendTitles,
    trendAreaKeysList: trendAreaKeysList,
    filteredData: filteredData,
    targetTimeList: targetTimeList,
    rowsLimit: rowsLimit
  };
  markAllPagesDirty_();
  renderPageIfNeeded_(currentPage);

  saveUserPreferences();
}

// opts.applyThreshold (default true): drop rows whose standard hours for the
// block are at or below the threshold, from BOTH the hours and the head count.
// The charts want that filtering; the Data Table deliberately does not, so it
// stays a raw view of what is actually in the database.
function generateMainRows_(data, timeList, opts) {
  var applyThreshold = !(opts && opts.applyThreshold === false);
  var rows = [];
  timeList.forEach(function(tr) {
    var blockData = data.filter(function(r) { return r.timeRange === tr; });
    // An OS block is non-productive time: it must never count as deployed hours
    // or as head count, or every person on an indirect task would drag the site
    // figures down. The threshold filter below happens to exclude them, but only
    // by accident of them being zero — and that accident fails on the two paths
    // where it matters most: the Data Table passes applyThreshold:false, and a
    // threshold of zero or less admits them. So exclude them by name, not by
    // arithmetic. An OS row that DOES carry hours is still counted.
    var counted = blockData.filter(function(r) { return !(r.os === true && (r.value || 0) <= 0); });
    var qualifiedData = applyThreshold
      ? counted.filter(function(r) { return (r.value || 0) > currentThreshold; })
      : counted;
    var osFlag = blockData.some(function(r) { return r.os === true; });
    // The approval status travels with the flag so the band can say which kind
    // of absence this was. Read off the flagged rows only: a productive row
    // has no status and must not be mistaken for one that disagrees.
    var osStatus = osStatusOfPak_(blockData.map(function(r) {
      return r.os === true ? (r.osStatus || '') : '';
    }));
    var stdHours = qualifiedData.reduce(function(sum, r) { return sum + (r.value || 0); }, 0);
    var pieTotal = blockData.reduce(function(sum, r) { return sum + (r.pie || 0); }, 0);
    var topUpTotal = blockData.reduce(function(sum, r) { return sum + (r.topUp || 0); }, 0);
    var forwardTpaTotal = blockData.reduce(function(sum, r) { return sum + (r.forwardTpa || 0); }, 0);
    var tpRetailTotal = blockData.reduce(function(sum, r) { return sum + (r.tpRetail || 0); }, 0);
    var rtfTotal = blockData.reduce(function(sum, r) { return sum + (r.rtf || 0); }, 0);
    var e3PackingTotal = blockData.reduce(function(sum, r) { return sum + (r.e3Packing || 0); }, 0);
    var parcelSortationTotal = blockData.reduce(function(sum, r) { return sum + (r.parcelSortation || 0); }, 0);
    var parcelInductTotal = blockData.reduce(function(sum, r) { return sum + (r.parcelInduct || 0); }, 0);
    var inboundDecantingTotal = blockData.reduce(function(sum, r) { return sum + (r.inboundDecanting || 0); }, 0);
    var osrDecantingTotal = blockData.reduce(function(sum, r) { return sum + (r.osrDecanting || 0); }, 0);
    var bcrInductingTotal = blockData.reduce(function(sum, r) { return sum + (r.bcrInducting || 0); }, 0);
    var e1e2InductingTotal = blockData.reduce(function(sum, r) { return sum + (r.e1e2Inducting || 0); }, 0);
    var sorter6PackingTotal = blockData.reduce(function(sum, r) { return sum + (r.sorter6Packing || 0); }, 0);
    var sorter6ParcelInductTotal = blockData.reduce(function(sum, r) { return sum + (r.sorter6ParcelInduct || 0); }, 0);
    var sorter6ItemInductTotal = blockData.reduce(function(sum, r) { return sum + (r.sorter6ItemInduct || 0); }, 0);
    var onlinePickingDriveTotal = blockData.reduce(function(sum, r) { return sum + (r.onlinePickingDrive || 0); }, 0);
    var onlinePickingWayTotal = blockData.reduce(function(sum, r) { return sum + (r.onlinePickingWay || 0); }, 0);
    var onlinePickingE3Total = blockData.reduce(function(sum, r) { return sum + (r.onlinePickingE3 || 0); }, 0);
    var e3BppTotal = blockData.reduce(function(sum, r) { return sum + (r.e3Bpp || 0); }, 0);
    var e1e2BppTotal = blockData.reduce(function(sum, r) { return sum + (r.e1e2Bpp || 0); }, 0);
    var rspsTopUpTotal = blockData.reduce(function(sum, r) { return sum + (r.rspsTopUp || 0); }, 0);
    var rspsPickTotal = blockData.reduce(function(sum, r) { return sum + (r.rspsPick || 0); }, 0);
    var ispsTopUpTotal = blockData.reduce(function(sum, r) { return sum + (r.ispsTopUp || 0); }, 0);
    var ispsPickTotal = blockData.reduce(function(sum, r) { return sum + (r.ispsPick || 0); }, 0);
    var bonuses = {};
    for (var j = 0; j < qualifiedData.length; j++) { bonuses[qualifiedData[j].bonus] = true; }
    var bonusNumber = calculateBonusDisplay(bonuses, selectedBonuses.length > 0);
    var hourDeployed = 0;
    if (selectedBonuses.length > 0) {
      var selectedInBlock = qualifiedData.filter(function(r) { return selectedBonuses.indexOf(r.bonus) !== -1; });
      hourDeployed = selectedInBlock.length * 0.25;
    } else {
      var uniqueCount = 0;
      for (var key in bonuses) { if (bonuses.hasOwnProperty(key)) uniqueCount++; }
      hourDeployed = uniqueCount / 4;
    }
    var performance = hourDeployed !== 0 ? (stdHours / hourDeployed) * 100 : 0;
    rows.push({ dateTime: tr, bonusNumber: bonusNumber, hourDeployed: hourDeployed, stdHours: stdHours, pieVol: pieTotal, topUpVol: topUpTotal, forwardTpaVol: forwardTpaTotal, tpRetailVol: tpRetailTotal, rtfVol: rtfTotal, e3PackingVol: e3PackingTotal, parcelSortationVol: parcelSortationTotal, parcelInductVol: parcelInductTotal, inboundDecantingVol: inboundDecantingTotal, osrDecantingVol: osrDecantingTotal, bcrInductingVol: bcrInductingTotal, e1e2InductingVol: e1e2InductingTotal, sorter6PackingVol: sorter6PackingTotal, sorter6ParcelInductVol: sorter6ParcelInductTotal, sorter6ItemInductVol: sorter6ItemInductTotal, onlinePickingDriveVol: onlinePickingDriveTotal, onlinePickingWayVol: onlinePickingWayTotal, onlinePickingE3Vol: onlinePickingE3Total, e3BppVol: e3BppTotal, e1e2BppVol: e1e2BppTotal, rspsTopUpVol: rspsTopUpTotal, rspsPickVol: rspsPickTotal, ispsTopUpVol: ispsTopUpTotal, ispsPickVol: ispsPickTotal, performance: performance, os: osFlag, osStatus: osStatus, rawBonusSet: bonuses });
  });
  return rows;
}

function buildIndividualEntryRows_(entries) {
  return entries.map(function (r) {
    var stdHours = Number(r.value) || 0;
    return {
      timeRange: r.timeRange,
      bonus: r.bonus,
      hourDeployed: 0.25,
      stdHours: stdHours,
      pieVol: Number(r.pie) || 0,
      topUpVol: Number(r.topUp) || 0,
      forwardTpaVol: Number(r.forwardTpa) || 0,
      tpRetailVol: Number(r.tpRetail) || 0,
      rtfVol: Number(r.rtf) || 0,
      e3PackingVol: Number(r.e3Packing) || 0,
      parcelInductVol: Number(r.parcelInduct) || 0,
      parcelSortationVol: Number(r.parcelSortation) || 0,
      inboundDecantingVol: Number(r.inboundDecanting) || 0,
      osrDecantingVol: Number(r.osrDecanting) || 0,
      bcrInductingVol: Number(r.bcrInducting) || 0,
      e1e2InductingVol: Number(r.e1e2Inducting) || 0,
      sorter6PackingVol: Number(r.sorter6Packing) || 0,
      sorter6ParcelInductVol: Number(r.sorter6ParcelInduct) || 0,
      sorter6ItemInductVol: Number(r.sorter6ItemInduct) || 0,
      onlinePickingDriveVol: Number(r.onlinePickingDrive) || 0,
      onlinePickingWayVol: Number(r.onlinePickingWay) || 0,
      onlinePickingE3Vol: Number(r.onlinePickingE3) || 0,
      e3BppVol: Number(r.e3Bpp) || 0,
      e1e2BppVol: Number(r.e1e2Bpp) || 0,
      rspsTopUpVol: Number(r.rspsTopUp) || 0,
      rspsPickVol: Number(r.rspsPick) || 0,
      ispsTopUpVol: Number(r.ispsTopUp) || 0,
      ispsPickVol: Number(r.ispsPick) || 0,
      performance: stdHours / 0.25 * 100
    };
  });
}

function compareEntryRowsPak(a, b) {
  var da = parseDateTimePartPak(extractRangePartsPak(a.timeRange).start);
  var db = parseDateTimePartPak(extractRangePartsPak(b.timeRange).start);
  var ta = da ? da.getTime() : 0;
  var tb = db ? db.getTime() : 0;
  if (ta !== tb) return ta - tb;
  return safeTextPak(a.bonus).localeCompare(safeTextPak(b.bonus));
}

// A window wider than 15 minutes is built out of several 15-minute blocks, and
// the newest one is still filling. At 06:20 the feed holds 06:00-06:15 and
// nothing else, so a 30-minute row labelled 06:00-06:30 carried a quarter of an
// hour's work under a half-hour heading — which does not read as "not finished
// yet", it reads as a collapse in productivity.
//
// So a group short of its full complement of blocks is dropped. Only at the
// ENDS of the series: a group missing a block in the middle of the day is a gap
// in the data, and quietly removing that row would hide the gap rather than
// show it. The leading edge matters too — an Hours Range slice can begin
// mid-window (3 hours back from 06:15 starts at 03:15, half-way through the
// 03:00-03:30 window), which is partial for exactly the same reason.
function dropPartialEdgeGroupKeys_(sortedKeys, groups, windowMinutes) {
  var expected = Math.max(1, Math.round(windowMinutes / 15));
  if (expected < 2) return sortedKeys;
  var start = 0;
  var end = sortedKeys.length;
  while (start < end && (groups[sortedKeys[start]].blockCount || 0) < expected) start++;
  while (end > start && (groups[sortedKeys[end - 1]].blockCount || 0) < expected) end--;
  return sortedKeys.slice(start, end);
}

function getAggregatedDataPak(rows, windowMinutes) {
  var groups = {};
  rows.forEach(function(r) {
    var p = extractRangePartsPak(r.dateTime);
    var startDate = parseDateTimePartPak(p.start);
    if (!startDate) return;
    var groupDate = new Date(startDate);
    if (windowMinutes === 30) { var m = groupDate.getMinutes(); groupDate.setMinutes(m >= 30 ? 30 : 0, 0, 0); }
    else if (windowMinutes === 60) { groupDate.setMinutes(0, 0, 0); }
    else { groupDate.setSeconds(0, 0); }
    var k = groupDate.getTime();
    if (!groups[k]) { groups[k] = { startTime: groupDate, blockCount: 0, hourDeployed: 0, stdHours: 0, pieVol: 0, topUpVol: 0, forwardTpaVol: 0, tpRetailVol: 0, rtfVol: 0, e3PackingVol: 0, parcelSortationVol: 0, parcelInductVol: 0, inboundDecantingVol: 0, osrDecantingVol: 0, bcrInductingVol: 0, e1e2InductingVol: 0, sorter6PackingVol: 0, sorter6ParcelInductVol: 0, sorter6ItemInductVol: 0, onlinePickingDriveVol: 0, onlinePickingWayVol: 0, onlinePickingE3Vol: 0, e3BppVol: 0, e1e2BppVol: 0, rspsTopUpVol: 0, rspsPickVol: 0, ispsTopUpVol: 0, ispsPickVol: 0, os: false, osStatuses: [], bonusSet: {} }; }
    var g = groups[k];
    g.blockCount++;
    // OR, not AND: a 15-minute spell of OS shades the whole 30- or 60-minute
    // bucket it lands in. Consistent with every other field here, which sums
    // rather than averaging, and the alternative — shading only fully-OS
    // buckets — would hide short indirect spells entirely at wider windows.
    //
    // The statuses are collected rather than OR'd, because they do not combine
    // the way the flag does: see osStatusOfPak_.
    if (r.os) { g.os = true; g.osStatuses.push(r.osStatus || ''); }
    g.hourDeployed += (Number(r.hourDeployed) || 0); g.stdHours += (Number(r.stdHours) || 0); g.pieVol += (Number(r.pieVol) || 0); g.topUpVol += (Number(r.topUpVol) || 0); g.forwardTpaVol += (Number(r.forwardTpaVol) || 0); g.tpRetailVol += (Number(r.tpRetailVol) || 0); g.rtfVol += (Number(r.rtfVol) || 0); g.e3PackingVol += (Number(r.e3PackingVol) || 0); g.parcelSortationVol += (Number(r.parcelSortationVol) || 0); g.parcelInductVol += (Number(r.parcelInductVol) || 0); g.inboundDecantingVol += (Number(r.inboundDecantingVol) || 0); g.osrDecantingVol += (Number(r.osrDecantingVol) || 0); g.bcrInductingVol += (Number(r.bcrInductingVol) || 0); g.e1e2InductingVol += (Number(r.e1e2InductingVol) || 0); g.sorter6PackingVol += (Number(r.sorter6PackingVol) || 0); g.sorter6ParcelInductVol += (Number(r.sorter6ParcelInductVol) || 0); g.sorter6ItemInductVol += (Number(r.sorter6ItemInductVol) || 0); g.onlinePickingDriveVol += (Number(r.onlinePickingDriveVol) || 0); g.onlinePickingWayVol += (Number(r.onlinePickingWayVol) || 0); g.onlinePickingE3Vol += (Number(r.onlinePickingE3Vol) || 0); g.e3BppVol += (Number(r.e3BppVol) || 0); g.e1e2BppVol += (Number(r.e1e2BppVol) || 0); g.rspsTopUpVol += (Number(r.rspsTopUpVol) || 0); g.rspsPickVol += (Number(r.rspsPickVol) || 0); g.ispsTopUpVol += (Number(r.ispsTopUpVol) || 0); g.ispsPickVol += (Number(r.ispsPickVol) || 0);
    if (r.rawBonusSet) { for (var bKey in r.rawBonusSet) { if (r.rawBonusSet.hasOwnProperty(bKey)) { g.bonusSet[bKey] = true; } } }
  });
  var result = [];
  var sortedKeys = Object.keys(groups).map(Number).sort(function(a, b) { return a - b; });
  sortedKeys = dropPartialEdgeGroupKeys_(sortedKeys, groups, windowMinutes);
  var isFiltered = selectedBonuses.length > 0;
  sortedKeys.forEach(function(k) {
    var g = groups[k]; var start = g.startTime; var end = new Date(start.getTime() + (windowMinutes * 60000));
    var label = formatDatePak(start) + ' - ' + formatDatePak(end);
    result.push({ dateTime: label, rangeLabel: label, hourDeployed: g.hourDeployed, stdHours: g.stdHours, pieVol: g.pieVol, topUpVol: g.topUpVol, forwardTpaVol: g.forwardTpaVol, tpRetailVol: g.tpRetailVol, rtfVol: g.rtfVol, e3PackingVol: g.e3PackingVol, parcelSortationVol: g.parcelSortationVol, parcelInductVol: g.parcelInductVol, inboundDecantingVol: g.inboundDecantingVol, osrDecantingVol: g.osrDecantingVol, bcrInductingVol: g.bcrInductingVol, e1e2InductingVol: g.e1e2InductingVol, sorter6PackingVol: g.sorter6PackingVol, sorter6ParcelInductVol: g.sorter6ParcelInductVol, sorter6ItemInductVol: g.sorter6ItemInductVol, onlinePickingDriveVol: g.onlinePickingDriveVol, onlinePickingWayVol: g.onlinePickingWayVol, onlinePickingE3Vol: g.onlinePickingE3Vol, e3BppVol: g.e3BppVol, e1e2BppVol: g.e1e2BppVol, rspsTopUpVol: g.rspsTopUpVol, rspsPickVol: g.rspsPickVol, ispsTopUpVol: g.ispsTopUpVol, ispsPickVol: g.ispsPickVol, performance: g.hourDeployed > 0 ? (g.stdHours / g.hourDeployed) * 100 : 0, os: g.os, osStatus: osStatusOfPak_(g.osStatuses), bonusNumber: calculateBonusDisplay(g.bonusSet, isFiltered) });
  });
  return result;
}

function aggregateTrendRows(rows, windowMinutes) {
  var groups = {};
  rows.forEach(function(r) {
    var p = extractRangePartsPak(r.dateTime);
    var startDate = parseDateTimePartPak(p.start);
    if (!startDate) return;
    var groupDate = new Date(startDate);
    if (windowMinutes === 30) { var m = groupDate.getMinutes(); groupDate.setMinutes(m >= 30 ? 30 : 0, 0, 0); }
    else if (windowMinutes === 60) { groupDate.setMinutes(0, 0, 0); }
    var k = groupDate.getTime();
    if (!groups[k]) { groups[k] = { startTime: groupDate, blockCount: 0, hourDeployed: 0, stdHours: 0, os: false, osStatuses: [], stdBreakdown: {} }; }
    var g = groups[k];
    g.blockCount++;
    if (r.os) { g.os = true; g.osStatuses.push(r.osStatus || ''); }
    g.hourDeployed += (Number(r.hourDeployed) || 0);
    g.stdHours += (Number(r.stdHours) || 0); 
    if (r.stdBreakdown) {
      for (var bKey in r.stdBreakdown) {
        if (r.stdBreakdown.hasOwnProperty(bKey)) {
          g.stdBreakdown[bKey] = (g.stdBreakdown[bKey] || 0) + r.stdBreakdown[bKey];
        }
      }
    }
  });
  var result = [];
  var sortedKeys = Object.keys(groups).map(Number).sort(function(a, b) { return a - b; });
  sortedKeys = dropPartialEdgeGroupKeys_(sortedKeys, groups, windowMinutes);
  sortedKeys.forEach(function(k) {
    var g = groups[k];
    var start = g.startTime;
    var end = new Date(start.getTime() + (windowMinutes * 60000));
    result.push({ dateTime: formatDatePak(start) + ' - ' + formatDatePak(end), hourDeployed: g.hourDeployed, stdHours: g.stdHours, os: g.os, osStatus: osStatusOfPak_(g.osStatuses), stdBreakdown: g.stdBreakdown });
  });
  return result;
}

function generateTrendRowsForAreas_(data, timeList, areaKeys) {
  var rows = [];
  timeList.forEach(function(tr) {
    var blockData = data.filter(function(r) { return r.timeRange === tr; });
    var qualifiedData = blockData.filter(function(r) { return (r.value || 0) > currentThreshold; });
    var totalDeployed = 0;
    var stdBreakdown = {};
    for (var a = 0; a < areaKeys.length; a++) { stdBreakdown[areaKeys[a]] = 0; }

    for (var i = 0; i < qualifiedData.length; i++) {
      var r = qualifiedData[i];
      var hasActivity = false;
      for (var a = 0; a < areaKeys.length; a++) {
        var key = areaKeys[a];
        var volType = VOLUME_TYPES.filter(function(v){ return v.key === key; })[0];
        var stdVal = r[volType.stdKey] || 0;
        if (stdVal > 0) {
          hasActivity = true;
          stdBreakdown[key] += stdVal;
        }
      }
      if (hasActivity) { totalDeployed += 0.25; }
    }
    // Read off blockData, not qualifiedData: an OS row has no hours and so is
    // never qualified, which is the whole reason the band needs to say why.
    var osFlag = blockData.some(function(r) { return r.os === true; });
    var osStatus = osStatusOfPak_(blockData.map(function(r) {
      return r.os === true ? (r.osStatus || '') : '';
    }));
    rows.push({ dateTime: tr, hourDeployed: totalDeployed, stdBreakdown: stdBreakdown, os: osFlag, osStatus: osStatus });
  });
  return rows;
}

function getTrendTitle(areaKeys) {
  if (!areaKeys || areaKeys.length === 0) return 'Deployment Trend';
  var labels = [];
  for (var i = 0; i < areaKeys.length; i++) {
    for (var j = 0; j < VOLUME_TYPES.length; j++) {
      if (VOLUME_TYPES[j].key === areaKeys[i]) {
        labels.push(VOLUME_TYPES[j].label);
        break;
      }
    }
  }
  return 'Deployment Trend - ' + joinAreaLabels_(labels);
}

// pureOnly: count ONLY people whose work in the block fell entirely inside the
// group's areas.
//
// Without it, a row joined a group on having any standard hours in any of its
// areas, and then contributed a full 0.25 h of deployment while contributing
// only the group's share of the standard hours. So somebody who split a block
// between RSPS Pick and ISPS Pick dragged an RSPS Pick group down using
// deployment they had spent in ISPS - the group's percentage was being charged
// for time that was never its own. There is no way to divide a block between
// areas after the fact, so the honest fix is to leave those people out: what
// remains is a denominator that genuinely belongs to the numerator.
//
// "Outside the group" means all 24 areas, both buildings. scopeRowsToSite_
// copies every area field across and only rewrites `value`, so a row still
// carries its out-of-building standard hours - and time spent in the other
// building dilutes a percentage exactly as much as time spent in the next aisle.
//
// The cost is that the groups no longer cover the whole area: anyone working
// across a group boundary is now in no group at all. That is stated under the
// chart title, because unexplained it reads as productivity having dropped.
function generatePerfSplitRows_(data, timeList, groups, pureOnly) {
  var rows = [];

  // Resolved once per call, not once per row per group. This runs over every
  // block times every group, and VOLUME_TYPES.find inside that loop was
  // already the hot path here.
  var groupStdKeys = groups.map(function (group) {
    var keys = [];
    group.keys.forEach(function (areaKey) {
      var volType = VOLUME_TYPES.find(function (v) { return v.key === areaKey; });
      if (volType) keys.push(volType.stdKey);
    });
    return keys;
  });
  var outsideStdKeys = groups.map(function (group, gi) {
    var mine = groupStdKeys[gi];
    var out = [];
    for (var i = 0; i < VOLUME_TYPES.length; i++) {
      if (mine.indexOf(VOLUME_TYPES[i].stdKey) === -1) out.push(VOLUME_TYPES[i].stdKey);
    }
    return out;
  });

  timeList.forEach(function(tr) {
    var blockData = data.filter(function(r) { return r.timeRange === tr; });
    var row = { dateTime: tr };
    groups.forEach(function(group, gi) {
      var totalStd = 0;
      var deployedCount = 0;
      var mineKeys = groupStdKeys[gi];
      var outKeys = outsideStdKeys[gi];
      blockData.forEach(function(r) {
        var hasActivity = false;
        var bonusStd = 0;
        for (var k = 0; k < mineKeys.length; k++) {
          var stdVal = Number(r[mineKeys[k]]) || 0;
          if (stdVal > 0) { hasActivity = true; bonusStd += stdVal; }
        }
        if (hasActivity && pureOnly) {
          for (var o = 0; o < outKeys.length; o++) {
            if ((Number(r[outKeys[o]]) || 0) > 0) { hasActivity = false; break; }
          }
        }
        if (hasActivity) { totalStd += bonusStd; deployedCount++; }
      });
      var deployedHours = deployedCount * 0.25;
      // Store raw values to be safely aggregated later!
      row[group.id + '_std'] = totalStd;
      row[group.id + '_dep'] = deployedHours;
    });
    rows.push(row);
  });
  return rows;
}

function getAggregatedPerfSplitDataPak(rows, windowMinutes, splitGroups) {
  var groups = {};
  rows.forEach(function(r) {
    var p = extractRangePartsPak(r.dateTime);
    var startDate = parseDateTimePartPak(p.start);
    if (!startDate) return;
    var groupDate = new Date(startDate);
    if (windowMinutes === 30) { var m = groupDate.getMinutes(); groupDate.setMinutes(m >= 30 ? 30 : 0, 0, 0); }
    else if (windowMinutes === 60) { groupDate.setMinutes(0, 0, 0); }
    var k = groupDate.getTime();
    if (!groups[k]) {
      groups[k] = { startTime: groupDate };
      splitGroups.forEach(function(g) {
        groups[k][g.id + '_std'] = 0;
        groups[k][g.id + '_dep'] = 0;
      });
    }
    var g = groups[k];
    splitGroups.forEach(function(grp) {
      g[grp.id + '_std'] += (r[grp.id + '_std'] || 0);
      g[grp.id + '_dep'] += (r[grp.id + '_dep'] || 0);
    });
  });
  var result = [];
  var sortedKeys = Object.keys(groups).map(Number).sort(function(a, b) { return a - b; });
  sortedKeys.forEach(function(k) {
    var g = groups[k]; var start = g.startTime; var end = new Date(start.getTime() + (windowMinutes * 60000));
    var label = formatDatePak(start) + ' - ' + formatDatePak(end);
    var row = { dateTime: label, rangeLabel: label };
    // Calculate the actual productivity % for the whole time window
    splitGroups.forEach(function(grp) {
      var std = g[grp.id + '_std'] || 0;
      var dep = g[grp.id + '_dep'] || 0;
      row[grp.id] = dep > 0 ? (std / dep) * 100 : 0;
      // Carried through so callers can tell the two kinds of zero apart. A
      // block where nobody was deployed and a block where someone was deployed
      // and produced nothing both read as 0% here, and they mean opposite
      // things: one is "not running", the other is "running badly".
      row[grp.id + '_dep'] = dep;
      // Kept as well as the ratio, because under a bonus filter this chart
      // draws standard hours instead of a percentage. One filtered operator's
      // percentage is the same story told once per area they touched, where
      // the hours say how their time actually divided up.
      row[grp.id + '_std'] = std;
    });
    result.push(row);
  });
  return result;
}
</script>
