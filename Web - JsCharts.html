<script>
  // Theme-aware chart colors (canvas can't read CSS vars directly). Re-read on
  // each chart build so a light/dark toggle + re-render picks up the new theme.
  function _isLightTheme_() {
    return !document.documentElement.classList.contains('dark-theme');
  }
  function CHART_MUTED() { return _isLightTheme_() ? "#434848" : "rgba(255,255,255,0.70)"; }
  function CHART_TEXT()  { return _isLightTheme_() ? "rgba(0,0,0,0.87)" : "rgba(255,255,255,0.92)"; }
  function CHART_GRID()  { return _isLightTheme_() ? "rgba(0,0,0,0.08)" : "rgba(255,255,255,0.08)"; }
  // Area-fill shading: keep it minimal in light mode so charts stay clean.
  function CHART_FILL_A(a) { return _isLightTheme_() ? +(a * 0.35).toFixed(3) : a; }
  function CHART_CROSSHAIR() { return _isLightTheme_() ? "rgba(0,0,0,0.38)" : "rgba(255,255,255,0.45)"; }

  // ── Hover crosshair ────────────────────────────────────────────────────────
  // The charts already sync on hover: pointing at 14:30 on the volume chart
  // activates 14:30 on the productivity chart and every trend chart too. But a
  // tooltip is drawn next to the cursor on the chart under the mouse and
  // floats at some unrelated height on all the others, so "these are all
  // showing the same 15-minute block" was something the reader had to take on
  // trust. A vertical rule at the active index makes the connection visible,
  // and doubles as a straight edge for reading a value off the axis.
  //
  // Driven by getActiveElements() rather than by mouse position, so it follows
  // the existing sync for free — including on charts the pointer is nowhere
  // near — instead of needing its own coordinate plumbing.
  var e3CrosshairPlugin = {
    id: 'e3Crosshair',
    afterDatasetsDraw: function (chart) {
      // Cartesian charts only: a vertical rule means nothing on a doughnut, and
      // chartArea for those is not a plot box.
      var type = chart.config && chart.config.type;
      if (type !== 'line' && type !== 'bar') return;

      var active = chart.getActiveElements();
      if (!active || active.length === 0) return;
      var el = active[0].element;
      var area = chart.chartArea;
      if (!el || !area) return;

      // A hidden dataset can leave an active element parked outside the plot.
      var x = el.x;
      if (!(x >= area.left && x <= area.right)) return;

      var ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      // Dashed, thin and low contrast: this is a reading aid sitting on top of
      // the data, and it must not be mistaken for a series of its own.
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = CHART_CROSSHAIR();
      ctx.moveTo(x, area.top);
      ctx.lineTo(x, area.bottom);
      ctx.stroke();
      ctx.restore();
    }
  };

  // afterDatasetsDraw runs before the tooltip is painted, so the line passes
  // under the tooltip rather than across it.
  if (typeof Chart !== 'undefined') { Chart.register(e3CrosshairPlugin); }

  // Every render rebuilds all ~13 charts from scratch. Animating that on a
  // background auto-refresh makes the whole dashboard look like it's stuttering
  // once a minute, so animation is reserved for user-driven renders.
  var _chartAnimDefault;
  function setChartAnimationEnabled_(enabled) {
    if (typeof Chart === 'undefined') return;
    if (_chartAnimDefault === undefined) { _chartAnimDefault = Chart.defaults.animation; }
    Chart.defaults.animation = enabled ? _chartAnimDefault : false;
  }

  function syncTooltipHover(sourceChart, targetChart, event, activeElements) {
    if (!targetChart) return;
    if (activeElements.length > 0) {
      var index = activeElements[0].index;
      var activeList = [];
      if (targetChart.data.datasets.length > 1) { for (var i = 0; i < targetChart.data.datasets.length; i++) { activeList.push({ datasetIndex: i, index: index }); } }
      else { activeList.push({ datasetIndex: 0, index: index }); }
      targetChart.setActiveElements(activeList); targetChart.tooltip.setActiveElements(activeList, event);
    } else { targetChart.setActiveElements([]); targetChart.tooltip.setActiveElements([], event); }
    targetChart.update('none');
  }

  function syncToTargets(sourceChart, targets, event, elements) { for (var i = 0; i < targets.length; i++) { if (targets[i]) syncTooltipHover(sourceChart, targets[i], event, elements); } }

  function syncVolumeCharts(event, elements) {
    for (var i = 0; i < volumeCharts.length; i++) {
      var targetChart = volumeCharts[i]; if (!targetChart) continue;
      if (elements.length > 0) { var index = elements[0].index; var activeList = [{ datasetIndex: 0, index: index }]; targetChart.setActiveElements(activeList); targetChart.tooltip.setActiveElements(activeList, event); }
      else { targetChart.setActiveElements([]); targetChart.tooltip.setActiveElements([], event); }
      targetChart.update('none');
    }
  }

  function toggleVolumeArea(key) {
    var idx = hiddenVolumeAreas.indexOf(key);
    if (idx === -1) { hiddenVolumeAreas.push(key); }
    else { hiddenVolumeAreas.splice(idx, 1); }
    saveUserPreferences();
    applyLocalFiltersPak();
  }

  function renderVolumeAreaToggles_(mode) {
    // Only meaningful in Separate Charts mode — Combined/Stacked already have
    // their own per-series toggle via the Chart.js legend.
    renderAreaToggleChips_({
      containerId: 'volumeAreaToggles',
      visible: mode === 'separate',
      hiddenKeys: hiddenVolumeAreas,
      orderKeys: (typeof areaKeyOrderForZone_ === 'function') ? areaKeyOrderForZone_('volume') : null,
      onToggle: 'toggleVolumeArea'
    });
  }

  // ── Volume page: build charts as they come into view ───────────────────────
  // Separate Charts mode draws one chart per work area — up to nine. On a phone
  // barely one fits on screen at a time, yet all nine Chart.js instances were
  // constructed the moment the page was first shown. That is the single most
  // expensive thing this dashboard does, and eight ninths of it was for charts
  // the user had not scrolled to and might never reach.
  var _volPendingBuilders = {};
  var _volObserver = null;

  function teardownVolumeLazyLoad_() {
    if (_volObserver) { _volObserver.disconnect(); _volObserver = null; }
    _volPendingBuilders = {};
  }

  function buildVolumeChartAt_(idx) {
    var build = _volPendingBuilders[idx];
    if (!build) return;
    // Removed first: a chart must never be built twice, and building one is
    // slow enough for a second observer callback to arrive meanwhile.
    delete _volPendingBuilders[idx];
    build();
  }

  // The image export captures the whole page including everything scrolled out
  // of sight, so a chart still waiting on the observer would come out as a
  // blank panel. Forcing the remainder is cheap and only happens on an explicit
  // export. Also the fallback where IntersectionObserver is unavailable.
  function buildAllPendingVolumeCharts_() {
    var keys = Object.keys(_volPendingBuilders);
    for (var i = 0; i < keys.length; i++) { buildVolumeChartAt_(keys[i]); }
    if (_volObserver) { _volObserver.disconnect(); _volObserver = null; }
  }

  function observeVolumePanels_() {
    if (typeof IntersectionObserver === 'undefined') {
      buildAllPendingVolumeCharts_();
      return;
    }
    _volObserver = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (!entries[i].isIntersecting) continue;
        buildVolumeChartAt_(parseInt(entries[i].target.dataset.volIndex, 10));
        _volObserver.unobserve(entries[i].target);
      }
    }, {
      // Measured against the viewport rather than the .page scroll container.
      // An intersection rect is clipped by every scrolling ancestor, so this
      // already reports nothing while the Volume page is swiped off to the
      // side — no need to name a root. The margin builds each chart shortly
      // before it arrives, so scrolling never lands on an empty panel.
      rootMargin: '250px 0px',
      threshold: 0
    });
    var pending = Object.keys(_volPendingBuilders);
    for (var k = 0; k < pending.length; k++) {
      var panel = $('volPanel' + pending[k]);
      if (!panel) continue;
      panel.dataset.volIndex = pending[k];
      _volObserver.observe(panel);
    }
  }

  function renderVolumeChartsPak(agg, xOpt, tOpt) {
    var labels = agg.map(function(r) { return r.dateTime; });
    var rl = agg.map(function(r) { return r.rangeLabel; });
    var mode = $('volumeChartMode').value;
    var container = $('volumeChartsContainer');
    var primaryTitle = $('volPanel0').querySelector('h2');
    if (mode === 'separate') { container.classList.remove('combined-mode'); primaryTitle.textContent = 'PiE'; }
    else { container.classList.add('combined-mode'); primaryTitle.textContent = mode === 'stacked' ? 'Volume - E3 Stacked Area Chart' : 'Volume - E3 Combined Line Chart'; }
    for (var i = 0; i < volumeCharts.length; i++) { if (volumeCharts[i]) volumeCharts[i].destroy(); }
    volumeCharts = [];
    // Drop any builders left over from the previous render before queueing new
    // ones, or a stale closure could later build a chart from old data.
    teardownVolumeLazyLoad_();

    renderVolumeAreaToggles_(mode);

    // Panel show/hide only applies in separate mode; combined/stacked always
    // show every series (toggled via the chart's own legend instead).
    var visibleIndices = [];
    for (var vp = 0; vp < VOLUME_TYPES.length; vp++) {
      var panelEl = $('volPanel' + vp);
      if (!panelEl) continue;
      panelEl.classList.remove('vol-span-full');
      if (mode === 'separate') {
        var isHidden = hiddenVolumeAreas.indexOf(VOLUME_TYPES[vp].key) !== -1;
        panelEl.style.display = isHidden ? 'none' : '';
        if (!isHidden) visibleIndices.push(vp);
      } else {
        panelEl.style.display = '';
      }
    }
    // Last visible panel spans full width when the visible count is odd —
    // driven by JS (not :nth-child) so it stays correct no matter which areas
    // are hidden, not just when every panel is shown.
    if (mode === 'separate' && visibleIndices.length % 2 === 1) {
      // DOM order, not VOLUME_TYPES order. The panels can be rearranged, so
      // "last" has to mean last on screen — indexing back into VOLUME_TYPES
      // would centre whichever panel happens to be last in the data model.
      var domPanels = container.querySelectorAll('.vol-chart-panel');
      var lastVisibleEl = null;
      for (var dp = 0; dp < domPanels.length; dp++) {
        if (domPanels[dp].style.display !== 'none') lastVisibleEl = domPanels[dp];
      }
      if (lastVisibleEl) lastVisibleEl.classList.add('vol-span-full');
    }

    var commonTooltip = { callbacks: { title: function(c) { return rl[c[0].dataIndex] || ''; }, label: function(c) { return (c.dataset.label || '') + ': ' + (c.parsed.y !== null ? Number(c.parsed.y).toFixed(0) : ''); } } };
    var isStacked = mode === 'stacked';
    var volYAxis = { beginAtZero: true, ticks: { color: CHART_MUTED() }, grid: { color: CHART_GRID() }, title: { display: true, text: 'Volume', color: CHART_MUTED(), font: { size: 12 } }, stacked: isStacked };
    if (mode === 'separate') {
      for (var i = 0; i < VOLUME_TYPES.length; i++) {
        if (hiddenVolumeAreas.indexOf(VOLUME_TYPES[i].key) !== -1) continue;
        // The series data is mapped now — it is cheap, and doing it here keeps
        // `agg` out of the closure. Only the Chart.js construction, which is
        // the expensive half, is deferred to observeVolumePanels_ below.
        var volType = VOLUME_TYPES[i]; var dataArr = agg.map(function(r) { return r[volType.key]; });
        (function (idx, vType, series) {
          _volPendingBuilders[idx] = function () {
            volumeCharts.push(new Chart($('volChart' + idx), { type: 'line', data: { labels: labels, datasets: [{ label: vType.label, data: series, borderWidth: 2, borderColor: vType.color, backgroundColor: hexToRgbaPak(vType.color, CHART_FILL_A(0.1)), tension: 0.35, pointRadius: 2, fill: true }] }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: commonTooltip }, scales: { x: xOpt, y: volYAxis }, onHover: function(event, elements) { syncVolumeCharts(event, elements); } } }));
          };
        })(i, volType, dataArr);
      }
      observeVolumePanels_();
    } else {
      var datasets = [];
      for (var i = 0; i < VOLUME_TYPES.length; i++) {
        var volType = VOLUME_TYPES[i]; var dataArr = agg.map(function(r) { return r[volType.key]; });
        datasets.push({ label: volType.label, data: dataArr, borderWidth: 2, borderColor: volType.color, backgroundColor: hexToRgbaPak(volType.color, CHART_FILL_A(isStacked ? 0.6 : 0.1)), tension: 0.35, pointRadius: 2, fill: isStacked });
      }
      var chart = new Chart($('volChart0'), { type: 'line', data: { labels: labels, datasets: datasets }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, position: 'bottom', labels: { color: CHART_TEXT(), usePointStyle: true, pointStyle: 'rectRounded', padding: 16, font: { size: 12 } }, onClick: function(e, legendItem, legend) { e.stopPropagation(); e.preventDefault(); var index = legendItem.datasetIndex; var ci = legend.chart; if (ci.isDatasetVisible(index)) { ci.hide(index); legendItem.hidden = true; } else { ci.show(index); legendItem.hidden = false; } } }, tooltip: commonTooltip }, scales: { x: xOpt, y: volYAxis } } });
      volumeCharts.push(chart);
    }
  }

  // Aggregation + shared axis/tooltip config, used by BOTH the Overall page's
  // charts and the Volume page's. Cached per applyLocalFiltersPak() pass so that
  // deferring one page's render doesn't mean recomputing this for the other.
  var _chartCommon = null;
  function invalidateChartCommon_() { _chartCommon = null; }

  function getChartCommon_(rows) {
    if (_chartCommon) return _chartCommon;
    if (!rows || rows.length === 0) return null;

    var wm = parseInt($('timeWindow').value, 10);
    var agg = getAggregatedDataPak(rows, wm);
    var hRange = parseInt($('hoursRange').value, 10);
    var labels = agg.map(function(r) { return r.dateTime; });
    var rl = agg.map(function(r) { return r.rangeLabel; });
    var pieData = agg.map(function(r) { return r.pieVol; });
    var topUpData = agg.map(function(r) { return r.topUpVol; });

    var yMax = Math.ceil((agg.map(function(r){return r.performance;}).length ? Math.max.apply(null, agg.map(function(r){return r.performance;})) : 100) / 10) * 10 + 10;
    var xTicksConfig = { color: CHART_MUTED(), maxRotation: 45, minRotation: 45, autoSkip: true, callback: function(value) { return trimTimeLabelPak(this.getLabelForValue(value)); } };
    if (hRange >= 24) { xTicksConfig.maxTicksLimit = 24; } else if (hRange >= 12) { xTicksConfig.maxTicksLimit = 12; } else if (hRange >= 6) { xTicksConfig.maxTicksLimit = 8; }
    var xOpt = { ticks: xTicksConfig, grid: { color: CHART_GRID() }, title: { display: true, text: 'Date & Time', color: CHART_MUTED(), font: { size: 12 } } };
    var tOpt = { callbacks: { title: function(c) { return rl[c[0].dataIndex] || ''; }, label: function(c) { return (c.dataset.label || '') + ': ' + (c.parsed.y !== null ? Number(c.parsed.y).toFixed(1) : ''); } } };

    _chartCommon = { agg: agg, labels: labels, rl: rl, pieData: pieData, topUpData: topUpData,
                     yMax: yMax, xOpt: xOpt, tOpt: tOpt, wm: wm, hRange: hRange };
    return _chartCommon;
  }

  function renderChartsPak(rows, trendRowsList, trendTitles, trendAreaKeysList, rawFilteredData, rawTimeList) {
    for (var agd = 0; agd < areaGroupCharts.length; agd++) { if (areaGroupCharts[agd]) areaGroupCharts[agd].destroy(); }
    areaGroupCharts = [];
    areaGroupChart = null;
    if (overviewVolChart) overviewVolChart.destroy();
    for (var ti = 0; ti < trendCharts.length; ti++) { if (trendCharts[ti]) trendCharts[ti].destroy(); }
    trendCharts = [];
    if (perfChart) perfChart.destroy();

    var _c = getChartCommon_(rows);
    if (!_c) { return; }
    var agg = _c.agg, labels = _c.labels, rl = _c.rl, pieData = _c.pieData,
        topUpData = _c.topUpData, yMax = _c.yMax, xOpt = _c.xOpt, tOpt = _c.tOpt,
        wm = _c.wm, hRange = _c.hRange;

    // --- 1. VOLUME ---
    var overviewTitleEl = $('overviewVolChart').closest('.card.panel').querySelector('h2');
    var overviewDatasets = [];
    if (selectedBonuses.length > 0) {
      overviewTitleEl.textContent = 'Volume - E3 Stacked Area Chart';
      for (var v = 0; v < VOLUME_TYPES.length; v++) {
        var vType = VOLUME_TYPES[v]; var vData = agg.map(function(r) { return r[vType.key]; });
        overviewDatasets.push({ label: vType.label, data: vData, borderWidth: 2, borderColor: vType.color, backgroundColor: hexToRgbaPak(vType.color, CHART_FILL_A(0.6)), tension: 0.35, pointRadius: 2, fill: true });
      }
    } else {
      overviewTitleEl.textContent = 'Volume - PiE & Top Up';
      overviewDatasets = [
        { label: 'Volume PiE', data: pieData, borderWidth: 2, borderColor: APP_CONFIG.colors.accent, backgroundColor: hexToRgbaPak(APP_CONFIG.colors.accent, CHART_FILL_A(0.6)), tension: 0.35, pointRadius: 2, fill: true },
        { label: 'Volume Top Up', data: topUpData, borderWidth: 2, borderColor: APP_CONFIG.colors.good, backgroundColor: hexToRgbaPak(APP_CONFIG.colors.good, CHART_FILL_A(0.6)), tension: 0.35, pointRadius: 2, fill: true }
      ];
    }
    overviewVolChart = new Chart($('overviewVolChart'), { type: 'line', data: { labels: labels, datasets: overviewDatasets }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, labels: { color: CHART_TEXT() }, position: 'bottom' }, tooltip: { callbacks: { title: function(c) { return rl[c[0].dataIndex] || ''; }, label: function(c) { return (c.dataset.label || '') + ': ' + (c.parsed.y !== null ? Number(c.parsed.y).toFixed(0) : ''); } } } }, scales: { x: xOpt, y: { beginAtZero: true, stacked: true, ticks: { color: CHART_MUTED() }, grid: { color: CHART_GRID() }, title: { display: true, text: 'Volume', color: CHART_MUTED(), font: { size: 12 } } } }, onHover: function(event, elements) { syncToTargets(overviewVolChart, [perfChart].concat(areaGroupCharts).concat(trendCharts), event, elements); } } });

    // --- 2. OVERALL PRODUCTIVITY ---
    perfChart = new Chart($('perfChart'), { type: 'bar', data: { labels: labels, datasets: [{ label: 'Productivity %', data: agg.map(function(r){return r.performance;}), backgroundColor: function(ctx) { var v = ctx.raw; return v >= APP_CONFIG.thresholds.good ? APP_CONFIG.colors.good : v >= APP_CONFIG.thresholds.warn ? APP_CONFIG.colors.warn : APP_CONFIG.colors.bad; }, borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { title: function(c) { return rl[c[0].dataIndex] || ''; }, label: function(c) { return (c.dataset.label || '') + ': ' + (c.parsed.y !== null ? Number(c.parsed.y).toFixed(1) + '%' : ''); } } } }, scales: { x: xOpt, y: { ticks: { color: CHART_MUTED() }, grid: { color: CHART_GRID() }, max: yMax, title: { display: true, text: 'Productivity %', color: CHART_MUTED(), font: { size: 12 } } } }, onHover: function(event, elements) { syncToTargets(perfChart, [overviewVolChart].concat(areaGroupCharts).concat(trendCharts), event, elements); } } });

    // --- 3. AREA GROUP (1 to MAX_AREA_GROUP_CHARTS charts) ---
    var areaGroupBuckets = [];
    var buildAreaGroupDatasets_ = function () { return []; };
    if (rawFilteredData && rawTimeList) {
      var perfGroups;
      if (selectedBonuses.length > 0) {
        // Bonus filter active: ignore the user's configured groups and show each
        // involved work area as its own group (mirrors the Volume chart behavior)
        perfGroups = [];
        for (var pg = 0; pg < VOLUME_TYPES.length; pg++) {
          var pgType = VOLUME_TYPES[pg];
          var pgHasActivity = false;
          for (var pd = 0; pd < rawFilteredData.length; pd++) {
            if ((Number(rawFilteredData[pd][pgType.stdKey]) || 0) > 0) { pgHasActivity = true; break; }
          }
          if (pgHasActivity) {
            perfGroups.push({ id: 'g' + pg, label: pgType.label, keys: [pgType.key], color: pgType.color, showLine: true, showTrend: true });
          }
        }
      } else {
        perfGroups = getPerfSplitGroups_();
      }
      var perfSplitBase = generatePerfSplitRows_(rawFilteredData, rawTimeList, perfGroups);
      var perfSplitAgg = getAggregatedPerfSplitDataPak(perfSplitBase, wm, perfGroups);

      // Datasets for ONE chart, from the groups assigned to it. A group still
      // contributes a line, a trend line, or both — splitting decides which
      // chart a group is drawn on, not how it is drawn.
      buildAreaGroupDatasets_ = function (groupsForChart) {
        var ds = [];
        groupsForChart.forEach(function (group) {
          var dataArr = perfSplitAgg.map(function (r) { return r[group.id] || 0; });
          if (group.showLine) {
            ds.push({ label: group.label, data: dataArr, borderWidth: 2, borderColor: group.color, backgroundColor: hexToRgbaPak(group.color, 0.1), tension: 0.35, pointRadius: 2, fill: false });
          }
          if (group.showTrend) {
            ds.push({ label: group.label + ' (Trend)', data: linearTrendPak(dataArr), borderWidth: 2, borderColor: group.color, backgroundColor: 'transparent', borderDash: [6, 4], tension: 0, pointRadius: 0, fill: false });
          }
        });
        return ds;
      };

      // Which groups land on which chart. A bonus filter replaces the user's
      // configured groups with one per active work area, so an index-based
      // split would be pointing at groups that no longer exist — in that case
      // it collapses back to a single chart.
      if (areaGroupSplitState.enabled && areaGroupSplitState.charts.length > 0 && selectedBonuses.length === 0) {
        for (var ac = 0; ac < areaGroupSplitState.charts.length; ac++) {
          var picked = [];
          var idxList = areaGroupSplitState.charts[ac] || [];
          for (var pi = 0; pi < idxList.length; pi++) {
            if (perfGroups[idxList[pi]]) picked.push(perfGroups[idxList[pi]]);
          }
          if (picked.length > 0) areaGroupBuckets.push(picked);
        }
      }
      if (areaGroupBuckets.length === 0) areaGroupBuckets = [perfGroups];
    }
    var agWrap = $('areaGroupChartsWrap');
    areaGroupCharts = [];
    if (agWrap) {
      agWrap.innerHTML = '';
      var agSplit = areaGroupBuckets.length > 1;
      for (var ag = 0; ag < areaGroupBuckets.length; ag++) {
        (function (agIdx) {
          var panelEl = document.createElement('div');
          panelEl.className = 'card panel';
          var heading = agSplit
            ? 'Productivity % - ' + (TREND_CHART_LABELS[agIdx] || ('Chart ' + (agIdx + 1)))
            : 'Productivity % by Work Area';
          var titleHtml = '<h2>' + safeTextPak(heading) + '</h2>';
          // Both buttons live on the first panel only: they configure the whole
          // section, and repeating them per chart would imply otherwise.
          if (agIdx === 0) {
            titleHtml += '<div style="display:flex; gap:5px; align-items:center;">' +
              '<button class="breakdown-btn" onclick="openAreaGroups()"><i class="fa-solid fa-layer-group"></i> Groups &amp; Charts</button></div>';
          }
          panelEl.innerHTML = '<div class="mini-table-title">' + titleHtml + '</div>' +
                              '<canvas id="areaGroupChart' + (agIdx === 0 ? '' : '_' + agIdx) + '"></canvas>';
          agWrap.appendChild(panelEl);

          var chart = new Chart(panelEl.querySelector('canvas'), { type: 'line', data: { labels: labels, datasets: buildAreaGroupDatasets_(areaGroupBuckets[agIdx]) }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, labels: { color: CHART_TEXT() }, position: 'bottom', onClick: function(e, legendItem, legend) { e.stopPropagation(); e.preventDefault(); var index = legendItem.datasetIndex; var ci = legend.chart; if (ci.isDatasetVisible(index)) { ci.hide(index); legendItem.hidden = true; } else { ci.show(index); legendItem.hidden = false; } } }, tooltip: { callbacks: { title: function(c) { return rl[c[0].dataIndex] || ''; }, label: function(c) { return (c.dataset.label || '') + ': ' + (c.parsed.y !== null ? Number(c.parsed.y).toFixed(1) + '%' : ''); } } } }, scales: { x: xOpt, y: { beginAtZero: true, ticks: { color: CHART_MUTED() }, grid: { color: CHART_GRID() }, title: { display: true, text: 'Productivity %', color: CHART_MUTED(), font: { size: 12 } } } }, onHover: function(event, elements) {
            var others = [perfChart, overviewVolChart].concat(trendCharts);
            for (var oc = 0; oc < areaGroupCharts.length; oc++) { if (oc !== agIdx) others.push(areaGroupCharts[oc]); }
            syncToTargets(areaGroupCharts[agIdx], others, event, elements);
          } } });
          areaGroupCharts.push(chart);
        })(ag);
      }
      // Alias to the first chart: the tour and some sync arrays still speak of
      // "the" area group chart.
      areaGroupChart = areaGroupCharts[0] || null;
    }

    // --- 4. TREND (1 to MAX_TREND_CHARTS charts) ---
    function buildTrendDatasets(aggData, areaKeys) {
      var ds = [{ label: 'Hour Deployed', data: aggData.map(function(r) { return r.hourDeployed; }), borderWidth: 2.5, borderColor: APP_CONFIG.colors.accent, backgroundColor: 'transparent', tension: 0.35, pointRadius: 2, fill: false, stack: 'deployed-line', order: 1 }];
      for (var a = 0; a < areaKeys.length; a++) { var key = areaKeys[a]; var type = VOLUME_TYPES.filter(function(v){ return v.key === key; })[0]; ds.push({ label: type.label + ' Std Hrs', data: aggData.map(function(r) { return (r.stdBreakdown && r.stdBreakdown[key]) || 0; }), borderWidth: 1, borderColor: type.color, backgroundColor: hexToRgbaPak(type.color, CHART_FILL_A(0.35)), tension: 0.35, pointRadius: 0, fill: true, stack: 'std-hours-stack', order: 2 }); }

    var trendAggList = trendRowsList.map(function(tr) { return aggregateTrendRows(tr, wm); });

          allVals.push(blockTotal);

      });
      var peakVal = allVals.length ? Math.max.apply(null, allVals) : 0;

    if (trendYMax !== null) { trendY.max = trendYMax; trendY.stacked = true; }

    var trendWrap = $('trendChartsWrap');
    trendWrap.innerHTML = '';

    var totalChartPanels = 3 + trendRowsList.length;

    for (var ti = 0; ti < trendRowsList.length; ti++) {
      (function(idx) {
        var panelEl = document.createElement('div');
        panelEl.className = 'card panel';
        if (idx === trendRowsList.length - 1 && totalChartPanels % 2 === 1) {

        }
        var titleHtml = '<h2>' + safeTextPak(trendTitles[idx]) + '</h2>';
        if (idx === 0) {
          titleHtml += '<div style="display:flex; gap:5px; align-items:center;"><button class="breakdown-btn" onclick="openTrendSplit()"><i class="fa-solid fa-table-columns"></i> Split</button></div>';
        }
        panelEl.innerHTML = '<div class="mini-table-title">' + titleHtml + '</div><canvas id="trendChart_' + idx + '"></canvas>';
        trendWrap.appendChild(panelEl);

        var aggData = trendAggList[idx];
        var areaKeys = trendAreaKeysList[idx] || [];
        var datasets;
        if (isSplitMode && areaKeys.length > 0) {
          datasets = buildTrendDatasets(aggData, areaKeys);
        } else {
          var dep = aggData.map(function(r) { return r.hourDeployed; });
          var std = aggData.map(function(r) {
            if (r.stdBreakdown) { var total = 0; for (var k in r.stdBreakdown) { total += (r.stdBreakdown[k] || 0); } if (total > 0) return total; }
            return r.stdHours || 0;
          });
          datasets = [
            { label: 'Hour Deployed', data: dep, borderWidth: 2, borderColor: APP_CONFIG.colors.accent, backgroundColor: hexToRgbaPak(APP_CONFIG.colors.accent, CHART_FILL_A(0.1)), tension: 0.35, pointRadius: 2, fill: true },
            { label: 'Standard Hours', data: std, borderWidth: 2, borderColor: APP_CONFIG.colors.good, backgroundColor: hexToRgbaPak(APP_CONFIG.colors.good, CHART_FILL_A(0.1)), tension: 0.35, pointRadius: 2, fill: true }
          ];
        }

        trendCharts[idx] = new Chart($('trendChart_' + idx), { type: 'line', data: { labels: labels, datasets: datasets }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: CHART_TEXT() }, position: 'bottom' }, tooltip: tOpt }, scales: { x: xOpt, y: trendY }, onHover: function(event, elements) {
          var others = [perfChart, overviewVolChart].concat(areaGroupCharts);
          for (var k = 0; k < trendCharts.length; k++) { if (k !== idx && trendCharts[k]) others.push(trendCharts[k]); }
          syncToTargets(trendCharts[idx], others, event, elements);
        } } });
      })(ti);
    }

    // The trend panels have just been replaced, and the odd-panel centering was
    // decided against the old ones — recompute it against what is there now.
    if (typeof refreshChartLayoutAfterRender_ === 'function') {
      refreshChartLayoutAfterRender_();
    }
  }

  // Volume page (page 1) is rendered separately so it can be deferred until the

  function renderVolumePagePak(rows) {

  }
