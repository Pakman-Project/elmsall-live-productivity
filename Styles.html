<style>
:root {
  /* NEXT design system (Material 3 --mat-sys-* palette), light = default.
     Dark theme lives under .dark-theme on <html>. */
  --bg: #f5f5f5;                    /* --mat-sys-background */
  --panel: #ffffff;                 /* --mat-sys-surface */
  --border: #c3c7c7;                /* --mat-sys-outline-variant */
  --text: rgba(0, 0, 0, 0.87);      /* --mat-sys-on-surface */
  --muted: #434848;                 /* --mat-sys-on-surface-variant */
  --accent: #007a7a;                /* --mat-sys-primary (teal) */
  --accent-contrast: #ffffff;       /* text on accent */
  --color-good: #3c6939;            /* --mat-sys-success */
  --color-warn: #cc4b00;            /* --mat-sys-warning */
  --color-bad: #d32f2f;             /* --mat-sys-error */
  --header-bg: #000000;             /* black top bar */
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.10);
  --radius-card: 8px;

  --w2: rgba(0, 0, 0, 0.02);
  --w3: rgba(0, 0, 0, 0.03);
  --w4: rgba(0, 0, 0, 0.04);
  --w5: rgba(0, 0, 0, 0.05);
  --w6: rgba(0, 0, 0, 0.06);
  --w7: rgba(0, 0, 0, 0.06);
  --w8: rgba(0, 0, 0, 0.08);
  --w10: rgba(0, 0, 0, 0.09);
  --w12: rgba(0, 0, 0, 0.10);
  --w15: rgba(0, 0, 0, 0.12);
  --w25: rgba(0, 0, 0, 0.18);

  --surface-dropdown: #ffffff;
  --surface-dropdown-2: #f6f3f2;    /* --mat-sys-surface-container-low */
  --surface-solid: #ffffff;
  --surface-solid-0: rgba(255, 255, 255, 0);
  --surface-elevated: #ffffff;
  --surface-panel-strong: #f0edec;  /* --mat-sys-surface-container */
  --tour-tip-bg: #ffffff;

  --text-soft-95: rgba(0, 0, 0, 0.87);
  --text-soft-40: rgba(0, 0, 0, 0.40);

  --tour-mask: rgba(0, 0, 0, 0.45);
  --control-bg: #ffffff;
}

.dark-theme {
  --bg: #121212;
  --panel: #1e1e1e;                 /* --mat-sys-surface */
  --border: rgba(255, 255, 255, 0.23);
  --text: rgba(255, 255, 255, 0.92);
  --muted: rgba(255, 255, 255, 0.70);
  --accent: #009393;
  --accent-contrast: #ffffff;
  --color-good: #a1d399;
  --color-warn: #ff9d5c;
  --color-bad: #f44336;
  --header-bg: #000000;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.45);
  --radius-card: 8px;

  --w2: rgba(255, 255, 255, 0.02);
  --w3: rgba(255, 255, 255, 0.03);
  --w4: rgba(255, 255, 255, 0.04);
  --w5: rgba(255, 255, 255, 0.05);
  --w6: rgba(255, 255, 255, 0.06);
  --w7: rgba(255, 255, 255, 0.07);
  --w8: rgba(255, 255, 255, 0.08);
  --w10: rgba(255, 255, 255, 0.10);
  --w12: rgba(255, 255, 255, 0.12);
  --w15: rgba(255, 255, 255, 0.15);
  --w25: rgba(255, 255, 255, 0.25);

  --surface-dropdown: #2c272d;      /* --mat-sys-surface-container */
  --surface-dropdown-2: #2c272d;
  --surface-solid: #1e1e1e;
  --surface-solid-0: rgba(30, 30, 30, 0);
  --surface-elevated: #2c272d;
  --surface-panel-strong: #1b211e;  /* --mat-sys-surface-container-high */
  --tour-tip-bg: #1e1e1e;

  --text-soft-95: rgba(255, 255, 255, 0.95);
  --text-soft-40: rgba(255, 255, 255, 0.40);

  --tour-mask: rgba(0, 0, 0, 0.62);
  --control-bg: #2c272d;
}
/* === end theme tokens === */

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#loadingOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  color: var(--text);
}

#loadingOverlay.active {
  opacity: 1;
  pointer-events: all;
}

#loadingOverlay i {
  font-size: 48px;
  color: var(--accent);
}

.wrap {
  width: 100%;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ============================================================
   NEXT chrome — black top header, left icon rail, main column
   ============================================================ */
.next-header {
  flex: 0 0 auto;
  height: 64px;
  background: var(--header-bg);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 20px;
  box-shadow: rgba(0, 0, 0, 0.19) 0 1px 2px, rgba(0, 0, 0, 0.12) 0 1px 3px 1px;
  z-index: 1000;
  position: relative;
}
.next-header-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  min-width: 0;
}
.next-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.next-header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.72);
}
.next-header-meta .note-text { color: #ff9d5c; font-weight: 600; }
.next-logo {
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.04em;
  color: #fff;
  text-decoration: none;
  line-height: 1;
  transition: filter 0.15s ease, transform 0.15s ease;
}
.next-logo:hover {
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
  transform: scale(1.03);
}
.next-header-divider {
  width: 1px;
  height: 26px;
  background: rgba(255, 255, 255, 0.35);
  flex: 0 0 auto;
}
.next-header-title {
  margin: 0;
  font-size: 22px;
  font-weight: 200;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.next-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
}
.next-header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.next-header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
/* Inputs sitting on the black bar: translucent light fields. */
.next-header .input,
.next-header #archiveSelect {
  background: rgba(255, 255, 255, 0.12) !important;
  color: #fff !important;
  border: 1px solid rgba(255, 255, 255, 0.22);
  height: 36px;
}
.next-header .input::placeholder { color: rgba(255, 255, 255, 0.7); }
.next-header #archiveSelect { min-width: 150px; max-width: 200px; }
.next-header #archiveSelect option { background: var(--surface-dropdown) !important; color: var(--text) !important; }
.next-header .input:focus { border-color: rgba(255, 255, 255, 0.55); }
.next-header .search-input-wrap .fa-search { color: rgba(255, 255, 255, 0.7); }

.header-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 9999px;
  border: none;
  background: transparent;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
  flex: 0 0 auto;
}
.header-icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
.header-icon-btn .material-symbols-outlined { font-size: 22px; }

.app-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}
.next-rail {
  flex: 0 0 96px;
  width: 96px;
  background: var(--panel);
  box-shadow: inset -1px 0 0 var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding-top: 20px;
  overflow-y: auto;
}
.next-rail .rail-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  width: 100%;
  border: none;
  background: transparent;
  padding: 0;
  letter-spacing: 0;
  text-transform: none;
}
.next-rail .rail-item .rail-icon {
  width: 56px;
  height: 32px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: 24px;
  transition: background 0.15s ease, color 0.15s ease;
}
.next-rail .rail-item .rail-label {
  line-height: 1.2;
  white-space: normal;
}
.next-rail .rail-item:hover { color: var(--text); }
.next-rail .rail-item:hover .rail-icon { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.next-rail .rail-item.active { color: var(--accent); }
.next-rail .rail-item.active .rail-icon {
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
}

.app-main {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
@media (max-width: 700px) {
  /* Header reflows into 3 rows:
       [ brand            | actions (buttons) ]
       [ Live + Filter    (controls, one row) ]
       [ status .... last-update   (meta)     ]  */
  .next-header {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "brand    actions"
      "controls controls"
      "meta     meta";
    align-items: center;
    row-gap: 8px;
    column-gap: 8px;
    height: auto;
    padding: 8px 12px;
  }
  .next-header-left,
  .next-header-right { display: contents; }
  .next-brand { grid-area: brand; }
  .next-header-actions { grid-area: actions; }
  .next-header-controls { grid-area: controls; display: flex; gap: 8px; }
  .next-header-meta {
    grid-area: meta;
    justify-content: space-between;
    font-size: 10.5px;
  }
  .next-header-title { font-size: 17px; }
  .next-header-controls #archiveSelect { flex: 0 0 auto; min-width: 110px; max-width: 150px; }
  .next-header-controls .bonus-search-container { flex: 1 1 auto; width: auto; }

  /* Rail becomes a horizontal strip under the header. */
  .app-body { flex-direction: column; }
  .next-rail {
    flex: 0 0 auto;
    width: 100%;
    height: auto;
    flex-direction: row;
    justify-content: space-around;
    gap: 4px;
    padding: 6px 0;
    box-shadow: inset 0 -1px 0 var(--border);
  }
  .next-rail .rail-item { width: auto; font-size: 0.64rem; }
  .next-rail .rail-item .rail-icon { width: 46px; height: 28px; font-size: 20px; }
}

.sticky-header {
  position: relative;
  z-index: 1000;
  background: var(--surface-solid-0);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 15px 22px 10px 22px;
  flex: 0 0 auto;
  overflow: visible;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.title h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -0.03em;
}

.title p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

#archiveSelect {
  min-width: 180px;
  max-width: 220px;
  cursor: pointer;
  background: var(--w5) !important;
  color: var(--text) !important;
  background-image: none;
  padding: 6px 10px;
  z-index: 1;
  margin-right: 8px;
}

#archiveSelect option {
  background: var(--bg) !important;
  color: var(--text) !important;
}

.bonus-search-container {
  position: relative;
  width: 250px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.search-row {
  display: flex;
  align-items: stretch;
}

.clear-filter-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  min-width: 36px;
  border: 1px solid rgba(255, 122, 122, 0.25);
  border-right: none;
  background: rgba(255, 122, 122, 0.10);
  color: var(--color-bad);
  border-radius: 10px 0 0 10px;
  cursor: pointer;
  font-size: 12px;
}

.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-input-wrap .input {
  width: 100%;
  padding: 6px 30px 6px 10px;
  border-radius: 0 10px 10px 0;
  font-size: 13px;
}

.search-input-wrap.with-clear .input {
  border-radius: 0 10px 10px 0;
}

.search-input-wrap i.fa-search {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 12px;
}

.search-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--surface-panel-strong);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 2000;
  display: none;
}

.search-dropdown.active {
  display: block;
}

.search-item {
  padding: 8px 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
}

.search-item:hover {
  background: var(--w8);
}

.active-filter-banner {
  display: none;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 8px 14px;
  border-radius: 10px;
  background: rgba(105, 167, 255, 0.14);
  border: 1px solid rgba(105, 167, 255, 0.35);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}

.active-filter-banner.active {
  display: flex;
}

.active-filter-banner > i {
  font-size: 12px;
  flex-shrink: 0;
}

.active-filter-banner-text {
  white-space: nowrap;
  flex-shrink: 0;
}

.active-filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 0;
}

.active-filter-clear-btn {
  background: transparent;
  border: 1px solid rgba(105, 167, 255, 0.45);
  color: var(--accent);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-family: inherit;
  transition: all 0.15s;
}

.active-filter-clear-btn:hover {
  background: rgba(105, 167, 255, 0.22);
}

.chip {
  display: inline-flex;
  align-items: center;
  background: rgba(105, 167, 255, 0.15);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  overflow: visible;
}

.chip .remove-chip {
  margin-left: 6px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}

.input,
.btn,
.row-select {
  border: 1px solid var(--border);
  background: var(--w5);
  color: var(--text);
  border-radius: 10px;
  padding: 6px 10px;
  outline: none;
  transition: all 0.2s;
  font-size: 13px;
}

.input:focus {
  border-color: var(--accent);
  background: var(--w8);
}

.btn {
  cursor: pointer;
  font-weight: 600;
}

.btn:hover {
  transform: translateY(-1px);
  background: var(--w10);
}

.btn:active {
  transform: translateY(0);
}

.icon-btn {
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.meta {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.meta-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.note-text {
  color: var(--color-bad);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.3;
}

.nav-dots {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 24px;
  padding: 0;
  background: transparent;
  flex-shrink: 0;
  flex-wrap: nowrap;
}

.dot {
  min-width: auto;
  padding: 6px 2px 8px 2px;
  border-radius: 0;
  background: transparent;
  opacity: 1;
  transition: color 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  text-align: center;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 2px solid transparent;
}

.dot.active {
  opacity: 1;
  transform: none;
  background: transparent;
  color: var(--text);
  border-bottom-color: var(--accent);
}

.dot:hover {
  color: var(--text);
}

.swipe-container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  position: relative;
  width: 100%;
  touch-action: pan-y pinch-zoom;
}

.swipe-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
  min-height: 0;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.page::-webkit-scrollbar {
  width: 6px;
}

.page::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: none;
}

.kpi {
  padding: 14px;
  grid-column: span 3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.kpi-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.kpi .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.kpi .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
}

.kpi .sub {
  margin-top: auto;
  padding-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.kpi-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 4px;
}

.kpi-tooltip {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--w8);
  color: var(--muted);
  font-size: 9px;
  cursor: help;
  flex-shrink: 0;
}

.kpi-tooltip:hover {
  background: rgba(105, 167, 255, 0.2);
  color: var(--accent);
}

.kpi-tooltip-content {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  padding: 12px;
  background: var(--surface-dropdown);
  border: 1px solid var(--w15);
  border-radius: 12px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  z-index: 2000;
  font-size: 11px;
  line-height: 1.4;
  text-align: left;
  pointer-events: none;
}

.kpi-tooltip:hover .kpi-tooltip-content,
.kpi-tooltip.open .kpi-tooltip-content {
  display: block;
}

.tt-title {
  font-weight: 700;
  color: var(--text);
  font-size: 11px;
  margin-bottom: 4px;
}

.kpi-tooltip-content ul {
  margin: 4px 0 0;
  padding-left: 15px;
  color: var(--muted);
  list-style: none;
}

.kpi-tooltip-content ul li::before {
  content: '\2022';
  position: absolute;
  left: 5px;
  color: var(--accent);
}

.kpi-tooltip-content ul li {
  position: relative;
  padding-left: 10px;
}

.panel {
  padding: 14px;
}

.span-12 {
  grid-column: span 12;
}

.table-wrap {
  overflow-x: auto;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  max-width: 100%;
  min-height: 0;
}

table {

.breakdown-overlay {

  background: var(--w5);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;

  grid-column: 1 / -1;

  margin: 0 auto;
