<script>
  // ── The Potential Fraudulent Claims page ───────────────────────────────────
  // An OS or NPL claim says "I was not producing between these two times". The
  // pivot says what each bonus number actually produced, block by block. Where
  // those two disagree, somebody has been paid for time they were working.
  //
  // This page is the join. It is NOT an accusation: a block can carry standard
  // hours for reasons a form cannot see - a claim typed with the wrong finish
  // time, work booked to the wrong code, two people sharing a number. Hence
  // "Potential", and hence a table naming every part of the case rather than a
  // count: the whole point is that somebody can go and look.
  //
  // The rule, as asked for:
  //   - a production day runs 06:00 to 06:00, so the day picked on the date
  //     control means [that date 06:00, the next date 06:00);
  //   - only the 15-minute blocks FULLY inside a claim count. A claim of
  //     05:55-06:40 covers 06:00-06:15 and 06:15-06:30 and no others: the
  //     05:45 block started before the claim did, and the 06:30 block ends
  //     after it. A partly-covered block cannot tell you WHEN in it the work
  //     happened, so it cannot tell you whether it clashed;
  //   - any standard hours at all in those blocks flags the claim;
  //   - an OS claim already marked Rejected is left out. A rejected claim was
  //     never paid, so there is nothing here for it to be fraudulent ABOUT -
  //     the case this page exists for is time paid for and also worked, and a
  //     rejected claim was not paid for. NPL has no equivalent verdict on its
  //     Check column, so nothing is excluded there.

  var FRAUD_DAY_START_HOUR_ = 6;
  var FRAUD_BLOCK_MINUTES_ = 15;

  // ── the window ─────────────────────────────────────────────────────────────

  // The production day the date control is pointing at.
  //
  // Live means today, which is what the date control itself says - so between
  // midnight and 06:00 this is the day that has not started yet, and the page
  // is empty until it does. That is the literal reading of the rule and the
  // predictable one: the window is always the date on the button, never a
  // different date the page worked out for itself.
  function fraudSelectedDayPak_() {
    var sel = $('archiveSelect');
    var name = (sel && sel.selectedIndex >= 0)
      ? String(sel.options[sel.selectedIndex].textContent || '').trim() : '';
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(name);
    if (m) {
      return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    }
    // Live. Taken from the newest block on the axis rather than from the
    // browser's clock: that is the data's own idea of now, and it is what
    // every other number on the dashboard is drawn against.
    var newest = null;
    for (var i = timeRanges.length - 1; i >= 0 && !newest; i--) {
      newest = parseDateTimePartPak(extractRangePartsPak(timeRanges[i]).start);
    }
    var d = newest || new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function fraudWindowPak_() {
    var day = fraudSelectedDayPak_();
    var start = new Date(day.getFullYear(), day.getMonth(), day.getDate(),
                         FRAUD_DAY_START_HOUR_, 0);
    return { start: start, finish: new Date(start.getTime() + 86400000) };
  }

  // dd/mm/yyyy for the log rows, which key their Date column on the PRODUCTION
  // day - so every row of the day this page is about carries this one date,
  // whether its clock time lands before or after midnight.
  function fraudDateKeyPak_(d) {
    return ('0' + d.getDate()).slice(-2) + '/' +
           ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  // ── the blocks a claim actually covers ─────────────────────────────────────

  // The 15-minute blocks lying WHOLLY inside [start, finish). Aligned to the
  // quarter hour, because that is what the pivot's rows are.
  function fraudFullBlocksPak_(start, finish) {
    var out = [];
    // No 'finish <= start' clause: the loop below already covers it. Its
    // first block is at or after start, and start >= finish means block + 15
    // minutes is past finish on the very first test, so the body never runs.
    // A guard that cannot fail is a line that reads as protection and is not.
    if (!start || !finish) return out;
    var ms = FRAUD_BLOCK_MINUTES_ * 60000;
    // The first block boundary at or after the claim's start.
    var b = new Date(start.getTime());
    b.setSeconds(0, 0);
    var rem = b.getMinutes() % FRAUD_BLOCK_MINUTES_;
    if (rem !== 0 || b.getTime() < start.getTime()) {
      b = new Date(b.getTime() - rem * 60000 + ms);
    }
    for (var t = b.getTime(); t + ms <= finish.getTime(); t += ms) {
      out.push(t);
    }
    return out;
  }

  // ── what was produced, and where ───────────────────────────────────────────

  // bonus||blockStartMs -> the pivot row for that person in that block.
  //
  // Built from allSideData, NOT the site-scoped rawSideData: the Warehouse
  // picker is a way of looking at a shift, and a claim that only stops looking
  // fraudulent because somebody switched building is exactly the answer this
  // page must not give.
  function fraudStdIndexPak_() {
    var idx = {};
    var src = (typeof allSideData !== 'undefined' && allSideData.length)
      ? allSideData : rawSideData;
    for (var i = 0; i < src.length; i++) {
      var r = src[i];
      var d = parseDateTimePartPak(extractRangePartsPak(r.timeRange).start);
      if (!d) continue;
      idx[String(r.bonus).toUpperCase() + '||' + d.getTime()] = r;
    }
    return idx;
  }

  // bonus -> total standard hours that bonus number produced across the WHOLE
  // window, not just the blocks a claim overlaps. A separate pass rather than
  // a running total folded into fraudStdIndexPak_ above: that index is read
  // per BLOCK, once per claim that happens to cover it, so a bonus worked by
  // three overlapping claims would have this summed three times over if the
  // two were combined.
  function fraudTotalStdIndexPak_(win) {
    var totals = {};
    var src = (typeof allSideData !== 'undefined' && allSideData.length)
      ? allSideData : rawSideData;
    for (var i = 0; i < src.length; i++) {
      var r = src[i];
      var d = parseDateTimePartPak(extractRangePartsPak(r.timeRange).start);
      if (!d) continue;
      var t = d.getTime();
      if (t < win.start.getTime() || t >= win.finish.getTime()) continue;
      var key = String(r.bonus).toUpperCase();
      totals[key] = (totals[key] || 0) + (Number(r.value) || 0);
    }
    return totals;
  }

  // An OS claim already marked Rejected. Folded through osStatusBandPak_
  // rather than matched on the literal word: that is the same fold the OS
  // page's own band and chart use, so "Cancelled" or "Withdrawn" - never
  // paid either - count as rejected here too, and a blank cell (no verdict
  // yet) does not, because osStatusBandPak_('') is '' and not the reject
  // band. NPL's Check has no equivalent verdict, so this only ever fires
  // for an OS row.
  function fraudIsRejectedPak_(row, kind) {
    return kind === 'OS' && osStatusBandPak_(row.status) === OS_STATUS_REJECTED_PAK_;
  }

  // The record's own verdict, as a chip - the OS Record Status chip for an OS
  // claim, the NPL Check chip for an NPL one. Reused wholesale from the two
  // pages' own tables rather than redrawn here, so a colour or a wording
  // cannot read differently on this page than it does on theirs.
  function fraudStatusHtmlPak_(row, kind) {
    return (kind === 'OS') ? osStatusChipPak_(row.status) : nplCheckChipPak_(row.check);
  }

  // The work areas a pivot row carries standard hours in, by their display
  // names - "OSR PiE", "ISPS Top Up". Read off VOLUME_TYPES so the wording is
  // the same one the Volume page's legend uses; a second list of names here
  // would drift from it the first time an area was renamed.
  // `into` accumulates HOURS per label rather than a bare true. Object.keys on
  // it still gives the same list of names it always did - which is what the
  // area filter and its dropdown read - but the cell can now say how much of
  // the overlap each area actually accounts for, which is the difference
  // between "they were in Packing" and "they were in Packing for six minutes".
  function fraudAreasOfRowPak_(row, into) {
    for (var i = 0; i < VOLUME_TYPES.length; i++) {
      var t = VOLUME_TYPES[i];
      var std = Number(row[t.stdKey]) || 0;
      if (std > 0) { into[t.label] = (into[t.label] || 0) + std; }
    }
  }

  // ── the scan ───────────────────────────────────────────────────────────────

  // Every claim of the day, flagged or not, with what the pivot says about the
  // blocks it covers. Returns the flagged ones plus the counts needed to say
  // honestly how much was looked at.
  function fraudScanPak_(win) {
    var idx = fraudStdIndexPak_();
    var totals = fraudTotalStdIndexPak_(win);
    var out = [];
    var claims = 0;
    var ms = FRAUD_BLOCK_MINUTES_ * 60000;

    function consider(row, kind, auth, extra) {
      var w = osSpellWindowPak_(row);
      if (!w) return;                       // cannot be placed on a clock
      if (w.finish <= win.start || w.start >= win.finish) return;
      if (fraudIsRejectedPak_(row, kind)) return;   // never paid; nothing to flag
      claims++;

      var blocks = fraudFullBlocksPak_(w.start, w.finish);
      var overlapStd = 0;
      var areas = {};
      var covered = 0;
      // The bounds of the blocks that actually HIT the pivot, not of the
      // claim's own from/to - "Claim Time" says what was logged; this says
      // which part of it the produced hours were found in, and the two can
      // differ whenever the claim only partly clashes.
      var overlapFrom = null, overlapTo = null;
      for (var b = 0; b < blocks.length; b++) {
        var hit = idx[String(row.bonus).toUpperCase() + '||' + blocks[b]];
        // A block only counts as OVERLAP when it carries real production. A
        // row can exist in idx with zero std hours - this bonus was flagged
        // OS or NPL for that block but produced nothing in it, which the
        // payload now admits so the chart's band draws unbroken (see
        // buildSideEntry_/the payload-admission fix). Treating that as a hit
        // here would widen Overlap Time to every block the claim itself
        // touches, which is exactly the claim's own span, not evidence
        // against it.
        var hitStd = hit ? (Number(hit.value) || 0) : 0;
        if (!hit || hitStd <= 0) continue;
        covered++;
        overlapStd += hitStd;
        fraudAreasOfRowPak_(hit, areas);
        if (overlapFrom === null) overlapFrom = new Date(blocks[b]);
        overlapTo = new Date(blocks[b] + ms);
      }
      // "any standard hour produced", as asked - not the Front sheet's
      // threshold. That number is about whether a block counts as WORKED for
      // a productivity figure; this is about whether any work happened at all
      // while somebody was booked as not working, and the two questions do not
      // share an answer.
      if (overlapStd <= 0) return;

      out.push({
        bonus: row.bonus,
        kind: kind,
        from: w.start,
        to: w.finish,
        overlapFrom: overlapFrom,
        overlapTo: overlapTo,
        overlapStd: overlapStd,
        totalStd: totals[String(row.bonus).toUpperCase()] || 0,
        areas: Object.keys(areas).sort(),
        // The same areas with their hours, for the cell. Kept beside the plain
        // list rather than replacing it: the filter and its dropdown want
        // names, and threading hours through those would buy nothing.
        areaStd: areas,
        auth: auth,
        statusHtml: fraudStatusHtmlPak_(row, kind),
        // The same verdict as plain text, for the filter list and the sort.
        // Read off each page's own reader rather than stripped back out of
        // the chip's HTML, which would be a parser where a function already
        // exists.
        statusText: (kind === 'OS') ? osRecordStatusPak_(row) : nplCheckValuePak_(row),
        blocks: blocks.length,
        covered: covered,
        extra: extra || ''
      });
    }

    for (var i = 0; i < fraudOsRows.length; i++) {
      consider(fraudOsRows[i], 'OS', fraudOsRows[i].auth, fraudOsRows[i].job);
    }
    for (var j = 0; j < fraudNplRows.length; j++) {
      consider(fraudNplRows[j], 'NPL', fraudNplRows[j].tmAuth, fraudNplRows[j].task);
    }

    // Worst first: the biggest number of OVERLAPPING hours is the one to look
    // at - the total column can be large for someone who simply works a lot,
    // and that says nothing about this claim. Bonus number breaks ties, so
    // the same data draws the same way twice.
    out.sort(function (a, b) {
      return (b.overlapStd - a.overlapStd) ||
             (a.bonus < b.bonus ? -1 : a.bonus > b.bonus ? 1 : 0);
    });
    return { rows: out, claims: claims };
  }

  // How much of the day the pivot on hand can actually speak for. The dashboard
  // holds a rolling 96 blocks, so a window reaching past them is not "clean",
  // it is unchecked - and an empty table that cannot tell the reader which of
  // those it is would be worse than no table.
  function fraudCoveragePak_(win) {
    var lo = null, hi = null;
    var src = (typeof allSideData !== 'undefined' && allSideData.length)
      ? allSideData : rawSideData;
    for (var i = 0; i < src.length; i++) {
      var d = parseDateTimePartPak(extractRangePartsPak(src[i].timeRange).start);
      if (!d) continue;
      var t = d.getTime();
      if (lo === null || t < lo) lo = t;
      if (hi === null || t > hi) hi = t;
    }
    if (lo === null) return null;
    var ms = FRAUD_BLOCK_MINUTES_ * 60000;
    var from = Math.max(lo, win.start.getTime());
    var to = Math.min(hi + ms, win.finish.getTime());
    return (to > from) ? { from: new Date(from), to: new Date(to) } : null;
  }

  // ── the fetch ──────────────────────────────────────────────────────────────
  // Both logs, for the one production day. Its own copies rather than the OS
  // and NPL pages' - those are fetched for the axis window, which is a rolling
  // 24 hours and not the same thing as a production day, and a page that
  // quietly scanned the wrong range would be the worst kind of wrong here.

  function ensureFraudLogsPak_() {
    if (fraudLogState === null) {
      fraudLogState = 'loading';
      renderFraudPagePak();
      // Held during a date change - see ensureOsLogPak_, which this mirrors.
      if (!logFetchesHeldPak_) fraudFetchLogsPak_(false);
      return;
    }
    // The silent path this page used to lack. It was dropped to null on every
    // dashboard refresh instead, so an automatic refresh nobody asked for took
    // the table down to a skeleton - on a page that is one table, where the
    // only thing a skeleton achieves is losing the reader's place.
    if (fraudLogState === 'ready' && fraudLogNeedsRefresh && !logFetchesHeldPak_) {
      // Cleared before the fetch, not after: a second refresh arriving while
      // this one is in the air must not queue a duplicate.
      fraudLogNeedsRefresh = false;
      fraudFetchLogsPak_(true);
    }
  }

  function fraudMarkControlChangedPak_() {
    fraudLogState = null;
    fraudLogNeedsRefresh = false;
  }

  // silent: a background refresh keeps the table on screen while it waits, and
  // on failure keeps it showing rather than replacing good rows with an error -
  // the next refresh simply tries again. The same bargain osFetchLogPak_ makes.
  function fraudFetchLogsPak_(silent) {
    var key = fraudDateKeyPak_(fraudSelectedDayPak_());
    var pending = 2;
    var failed = '';

    function done() {
      if (--pending > 0) return;   // the other log is still in the air
      progressEndPak_('claims');
      if (failed && silent) {
        console.warn('Claims background refresh failed: ' + failed);
      } else {
        fraudLogState = failed || 'ready';
        if (!failed) fraudLogEverLoaded = true;
      }
      renderFraudPagePak();
    }

    google.script.run
      .withSuccessHandler(function (res) {
        fraudOsRows = (res && res.rows) || [];
        if (res && res.error) failed = res.error;
        done();
      })
      .withFailureHandler(function (err) {
        failed = (err && err.message) || 'The OS log could not be read';
        done();
      })
      .getOsLogRows([key], currentArchiveUrl || null);

    google.script.run
      .withSuccessHandler(function (res) {
        fraudNplRows = (res && res.rows) || [];
        if (res && res.error) failed = res.error;
        done();
      })
      .withFailureHandler(function (err) {
        failed = (err && err.message) || 'The NPL log could not be read';
        done();
      })
      .getNplLogRows([key], currentArchiveUrl || null);
  }

  // ── the table ──────────────────────────────────────────────────────────────

  // ONE list: the heading, the column width, the row field it reads and how
  // that field sorts. It was two lists - labels and widths - and a third was
  // about to be added for sorting, which is three things to keep in the same
  // order by hand. The widths still have to sum to 100; test_fraudpage checks
  // that, because a colgroup that does not is a table that drifts.
  var FRAUD_COLUMNS_ = [
    { key: 'bonus',       label: 'Bonus',           width: 8,  sort: 'text' },
    { key: 'areas',       label: 'Work Areas',      width: 18, sort: 'text' },
    { key: 'totalStd',    label: 'Total Std Hrs',   width: 9,  sort: 'num'  },
    { key: 'overlapStd',  label: 'Overlap Std Hrs', width: 10, sort: 'num'  },
    { key: 'overlapFrom', label: 'Overlap Time',    width: 12, sort: 'time' },
    { key: 'kind',        label: 'Claim',           width: 6,  sort: 'text' },
    { key: 'from',        label: 'Claim Time',      width: 12, sort: 'time' },
    { key: 'auth',        label: 'TM authorised',   width: 15, sort: 'text' },
    { key: 'statusText',  label: 'Status',          width: 10, sort: 'text' }
  ];

  // ── the five filters ───────────────────────────────────────────────────

  // A blank TM cell is a real state - somebody logged a claim nobody has put
  // their name to - so it gets a name rather than being dropped from the list.
  function fraudAuthValuePak_(row) {
    return osLabelPak_(row.auth, 'TM');
  }

  // Work Areas is the one filter matching against a LIST rather than a value:
  // a claim can span three areas, and picking one of them has to find it.
  function fraudPassesAreasPak_(chosen, areas) {
    for (var k in chosen) {
      if (!chosen.hasOwnProperty(k)) continue;
      // Something is picked, so from here it is a whitelist.
      for (var i = 0; i < areas.length; i++) {
        if (chosen[areas[i]]) return true;
      }
      return false;
    }
    return true;      // nothing picked: no filter
  }

  function fraudPassesPak_(r) {
    return osPassesSetPak_(fraudBonusFilter, r.bonus) &&
           fraudPassesAreasPak_(fraudAreaFilter, r.areas) &&
           osPassesSetPak_(fraudKindFilter, r.kind) &&
           osPassesSetPak_(fraudAuthFilter, fraudAuthValuePak_(r)) &&
           osPassesSetPak_(fraudStatusFilter, r.statusText);
  }

  function toggleFraudFilterPak_(which, value) {
    var set = { bonus: fraudBonusFilter, area: fraudAreaFilter, kind: fraudKindFilter,
                auth: fraudAuthFilter, status: fraudStatusFilter }[which];
    if (!set) return;
    if (set[value]) { delete set[value]; } else { set[value] = true; }
    renderFraudPagePak();
  }
  function clearFraudFilterPak_(which) {
    if (which === 'bonus') fraudBonusFilter = {};
    else if (which === 'area') fraudAreaFilter = {};
    else if (which === 'kind') fraudKindFilter = {};
    else if (which === 'auth') fraudAuthFilter = {};
    else if (which === 'status') fraudStatusFilter = {};
    renderFraudPagePak();
  }
  // Named wrappers, because the multi-select builder writes the handler into
  // an onclick attribute as a bare function name.
  function toggleFraudBonus(v) { toggleFraudFilterPak_('bonus', v); }
  function toggleFraudArea(v) { toggleFraudFilterPak_('area', v); }
  function toggleFraudKind(v) { toggleFraudFilterPak_('kind', v); }
  function toggleFraudAuth(v) { toggleFraudFilterPak_('auth', v); }
  function toggleFraudStatus(v) { toggleFraudFilterPak_('status', v); }
  function clearFraudBonus() { clearFraudFilterPak_('bonus'); }
  function clearFraudArea() { clearFraudFilterPak_('area'); }
  function clearFraudKind() { clearFraudFilterPak_('kind'); }
  function clearFraudAuth() { clearFraudFilterPak_('auth'); }
  function clearFraudStatus() { clearFraudFilterPak_('status'); }

  function fraudUniquePak_(rows, get) {
    var seen = {}, out = [];
    for (var i = 0; i < rows.length; i++) {
      var v = get(rows[i]);
      // Array.isArray, not instanceof: instanceof asks whether the value came
      // from THIS realm's Array, and a row built anywhere else - another
      // frame, a test harness - answers no to an array that plainly is one.
      var list = Array.isArray(v) ? v : [v];
      for (var j = 0; j < list.length; j++) {
        if (list[j] !== '' && !seen[list[j]]) { seen[list[j]] = true; out.push(list[j]); }
      }
    }
    out.sort();
    return out;
  }

  // ── sorting ────────────────────────────────────────────────────────────

  function fraudColumnPak_(key) {
    for (var i = 0; i < FRAUD_COLUMNS_.length; i++) {
      if (FRAUD_COLUMNS_[i].key === key) return FRAUD_COLUMNS_[i];
    }
    return FRAUD_COLUMNS_[3];   // the overlap hours, which is the default
  }

  function fraudSortValuePak_(r, col) {
    var v = r[col.key];
    if (col.sort === 'num') return Number(v) || 0;
    // A Date sorts as its number; everything else as lower-cased text, so
    // "Approved" and "approved" do not land in two different places.
    if (col.sort === 'time') return v ? v.getTime() : 0;
    if (Array.isArray(v)) return v.join(', ').toLowerCase();
    return String(v == null ? '' : v).toLowerCase();
  }

  function fraudSortRowsPak_(rows) {
    var col = fraudColumnPak_(fraudSort.key);
    var dir = fraudSort.dir === 'asc' ? 1 : -1;
    return rows.slice().sort(function (a, b) {
      var av = fraudSortValuePak_(a, col), bv = fraudSortValuePak_(b, col);
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      // The bonus number breaks every tie, so the same data draws the same
      // way twice however it is sorted.
      return a.bonus < b.bonus ? -1 : a.bonus > b.bonus ? 1 : 0;
    });
  }

  function fraudSortByPak_(key) {
    // A new column starts descending - biggest, latest, last alphabetically -
    // which is what somebody clicking a column for the first time is nearly
    // always after. Clicking the one already sorted flips it.
    fraudSort.dir = (fraudSort.key === key)
      ? (fraudSort.dir === 'asc' ? 'desc' : 'asc') : 'desc';
    fraudSort.key = key;
    renderFraudPagePak();
  }

  function fraudToggleSortDirPak_() {
    fraudSort.dir = fraudSort.dir === 'asc' ? 'desc' : 'asc';
    renderFraudPagePak();
  }

  function fraudTimeTextPak_(d) {
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // "22:40 - 01:10", with a marker on a finish that lands on the next date -
  // a production day crosses midnight and two bare clock times cannot say so.
  function fraudRangeTextPak_(from, to) {
    var t = fraudTimeTextPak_(from) + ' - ' + fraudTimeTextPak_(to);
    return (to.getDate() !== from.getDate()) ? t + ' (+1)' : t;
  }

  function fraudKindChipPak_(kind) {
    return '<span class="fraud-kind fraud-kind-' + kind.toLowerCase() + '">' +
           kind + '</span>';
  }

  function fraudAreasCellPak_(areas, areaStd) {
    if (!areas.length) {
      // Standard hours with no area carrying them: the total column on the
      // pivot moved but no single area's did. Worth saying rather than
      // leaving the cell blank, which reads as "not looked at".
      return '<span class="cell-none" title="Standard hours, but no single' +
             ' work area carries them">&ndash;</span>';
    }
    // One area carries the whole overlap by definition, so its figure is the
    // Overlap Std Hrs column repeated a cell to the left. The hours are here
    // to SPLIT a total between areas; with nothing to split they are noise.
    if (areas.length === 1) return escapeTextPak_(areas[0]);
    // Ordered by hours, largest first, so the area that actually explains the
    // overlap reads first rather than whichever happens to sort alphabetically.
    // Falls back to the plain names if the hours are not there - an archive
    // read before areaStd existed still has areas.
    if (!areaStd) return escapeTextPak_(areas.join(', '));
    var ordered = areas.slice().sort(function (a, b) {
      return (Number(areaStd[b]) || 0) - (Number(areaStd[a]) || 0);
    });
    return ordered.map(function (label) {
      var std = Number(areaStd[label]) || 0;
      return '<span class="fraud-area">' + escapeTextPak_(label) +
             '<span class="fraud-area-std" title="Standard hours this area' +
             ' carries inside the overlapping time">' + std.toFixed(2) +
             '</span></span>';
    }).join('');
  }

  function fraudTableHtmlPak_(rows) {
    var html = '<div class="table-wrap record-table-wrap"><table class="record-table' +
               ' fraud-table"><colgroup>';
    for (var w = 0; w < FRAUD_COLUMNS_.length; w++) {
      html += '<col style="width:' + FRAUD_COLUMNS_[w].width + '%">';
    }
    html += '</colgroup><thead><tr>';
    for (var c = 0; c < FRAUD_COLUMNS_.length; c++) {
      var col = FRAUD_COLUMNS_[c];
      var on = (fraudSort.key === col.key);
      // Bonus and Work Areas stay left-aligned - one names a person, the
      // other a list of names, and centering either just makes it harder to
      // start reading at the edge of the column. Every other column here is
      // a single short value (a number, a time, a chip), which centering
      // reads as a table, not text.
      var leftAlign = (col.key === 'bonus' || col.key === 'areas');
      html += '<th class="fraud-th' + (leftAlign ? ' fraud-th-left' : '') +
              (on ? ' active-sort ' + fraudSort.dir : '') + '"' +
              ' onclick="fraudSortByPak_(\'' + escapeAttrPak(col.key) + '\')"' +
              ' title="Sort by ' + escapeAttrPak(col.label) + '">' +
              escapeTextPak_(col.label) + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var esc = escapeAttrPak(r.bonus);
      var picked = selectedBonuses.indexOf(r.bonus) !== -1;
      // The whole row, not just the chip: a filtered bonus should be
      // findable at a glance down the table, not only once the reader's eye
      // has already reached the first column.
      html += '<tr' + (picked ? ' class="fraud-row-selected"' : '') + '>';
      html += '<td data-label="Bonus" class="fraud-bonus-cell">' +
              '<span class="bonus-chip bonus-tip-host clickable-bonus' +
              (picked ? ' selected' : '') + '"' +
              ' onclick="event.stopPropagation();toggleBonusFilter(\'' + esc + '\');">' +
              escapeTextPak_(r.bonus) +
              '<i class="fa-solid fa-filter chip-filter-icon"></i>' +
              bonusTipHtmlPak_(r.bonus, picked) + '</span></td>';
      html += '<td data-label="Work Areas" class="fraud-areas-cell">' +
              fraudAreasCellPak_(r.areas, r.areaStd) + '</td>';
      // fraud-total-cell, not fraud-std-cell: it is styled to stand out in
      // red (see the CSS) because it is the figure a reader compares
      // "Overlap Std Hrs" against to judge how much of the day this one
      // claim actually accounts for.
      html += '<td data-label="Total Std Hrs" class="fraud-std-cell fraud-total-cell"' +
              ' title="Standard hours this bonus number produced across the whole day">' +
              r.totalStd.toFixed(2) + '</td>';
      html += '<td data-label="Overlap Std Hrs" class="fraud-std-cell"' +
              ' title="Standard hours produced inside the overlapping time only">' +
              r.overlapStd.toFixed(2) + '</td>';
      html += '<td data-label="Overlap Time" class="time-cell"' +
              ' title="The part of the claim where produced hours were actually found">' +
              escapeTextPak_(fraudRangeTextPak_(r.overlapFrom, r.overlapTo)) + '</td>';
      html += '<td data-label="Claim">' + fraudKindChipPak_(r.kind) + '</td>';
      html += '<td data-label="Claim Time" class="time-cell"' +
              (r.extra ? ' title="' + escapeAttrPak(r.extra) + '"' : '') + '>' +
              escapeTextPak_(fraudRangeTextPak_(r.from, r.to)) + '</td>';
      html += '<td data-label="TM authorised">' + osPersonCellPak_(r.auth) + '</td>';
      html += '<td data-label="Status">' + r.statusHtml + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

  // The five dropdowns and the phone's sort control. Rebuilt on every render,
  // like the OS page's row, which is why the open menu has to be put back.
  function fraudRenderControlsPak_(all) {
    var host = document.getElementById('fraudFilters');
    if (host) {
      host.innerHTML =
        osMultiSelectHtmlPak_('fraudBonusMenu', 'Bonuses',
          fraudUniquePak_(all, function (r) { return r.bonus; }),
          fraudBonusFilter, 'toggleFraudBonus', 'clearFraudBonus', 'Bonus') +
        osMultiSelectHtmlPak_('fraudAreaMenu', 'Work Areas',
          fraudUniquePak_(all, function (r) { return r.areas; }),
          fraudAreaFilter, 'toggleFraudArea', 'clearFraudArea', 'Areas') +
        osMultiSelectHtmlPak_('fraudKindMenu', 'Claims',
          fraudUniquePak_(all, function (r) { return r.kind; }),
          fraudKindFilter, 'toggleFraudKind', 'clearFraudKind', 'Claim') +
        osMultiSelectHtmlPak_('fraudAuthMenu', 'TMs',
          fraudUniquePak_(all, fraudAuthValuePak_),
          fraudAuthFilter, 'toggleFraudAuth', 'clearFraudAuth', 'TM auth.') +
        osMultiSelectHtmlPak_('fraudStatusMenu', 'Statuses',
          fraudUniquePak_(all, function (r) { return r.statusText; }),
          fraudStatusFilter, 'toggleFraudStatus', 'clearFraudStatus', 'Status');
      if (osOpenFilterMenu) { toggleOsMenu_(osOpenFilterMenu, true); }
    }

    // The phone's stand-in for the clickable headers, filled from the same one
    // list of columns so the two can never offer different things to sort by.
    var sel = document.getElementById('fraudSortSelect');
    if (sel) {
      var want = FRAUD_COLUMNS_.map(function (c) {
        return '<option value="' + escapeAttrPak(c.key) + '">' +
               escapeTextPak_(c.label) + '</option>';
      }).join('');
      if (sel.innerHTML !== want) { sel.innerHTML = want; }
      if (sel.value !== fraudSort.key) sel.value = fraudSort.key;
    }
    var dirBtn = document.getElementById('fraudSortDirBtn');
    if (dirBtn) dirBtn.classList.toggle('desc', fraudSort.dir === 'desc');
  }

  // Wired once, not on every render: the two controls live in the static
  // markup, so re-binding them each time would stack listeners.
  if (typeof document !== 'undefined' && document && document.addEventListener) {
    document.addEventListener('DOMContentLoaded', function () {
      var sel = document.getElementById('fraudSortSelect');
      if (sel) {
        sel.addEventListener('change', function () {
          // Same as clicking a header: a different column starts descending,
          // so the dropdown and the direction button never disagree about
          // what the table is actually sorted by.
          if (sel.value !== fraudSort.key) fraudSort.dir = 'desc';
          fraudSort.key = sel.value;
          renderFraudPagePak();
        });
      }
      var dirBtn = document.getElementById('fraudSortDirBtn');
      if (dirBtn) dirBtn.addEventListener('click', fraudToggleSortDirPak_);
    });
  }

  // ── the page ───────────────────────────────────────────────────────────────

  function renderFraudPagePak() {
    var body = document.getElementById('fraudBody');
    if (!body) return;

    var win = fraudWindowPak_();
    var badge = document.getElementById('fraudRangeBadge');
    if (badge) {
      // "to", not an arrow glyph: this badge is set in Roboto Mono, which has
      // no U+2192 and drew a replacement box instead - and the one thing this
      // line has to be is unambiguous about which direction the day runs.
      badge.textContent = fraudDateKeyPak_(win.start) + ' 06:00  to  ' +
                          fraudDateKeyPak_(win.finish) + ' 06:00';
    }

    if (fraudLogState === null) { ensureFraudLogsPak_(); return; }
    if (fraudLogState === 'loading') {
      // First paint only - see renderOsPagePak, which this mirrors.
      if (fraudLogEverLoaded) {
        progressAttachBarPak_('fraudBody', 'claims');
        // and fall through to draw the rows already held
      } else {
        if (!body.firstChild || !body.firstChild.classList ||
            !body.firstChild.classList.contains('page-skeleton')) {
          body.innerHTML = '<div class="page-skeleton" aria-label="Loading">' +
            progressBarHtmlPak_('claims') +
            '<div class="skel-summary"></div>' +
            '<div class="skel-row"></div><div class="skel-row"></div>' +
            '<div class="skel-row"></div><div class="skel-row"></div></div>';
          progressStartPak_('claims');
        }
        return;
      }
    }
    if (fraudLogState !== 'ready' && fraudLogState !== 'loading') {
      body.innerHTML = '<div class="breakdown-empty">' +
        '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
        escapeTextPak_(fraudLogState) + '</div>';
      return;
    }

    var scan = fraudScanPak_(win);
    // The filters offer what is in the whole day's flagged claims, not what
    // survived the OTHER filters - see the note on the state, above.
    fraudRenderControlsPak_(scan.rows);
    var rows = fraudSortRowsPak_(scan.rows.filter(fraudPassesPak_));
    var heads = {};
    // The OVERLAP figure, not each bonus's total - the total is what they
    // produced all day and this line is about the hours actually in question.
    var sumOverlapStd = 0;
    for (var i = 0; i < rows.length; i++) {
      heads[rows[i].bonus] = true;
      sumOverlapStd += rows[i].overlapStd;
    }
    var headCount = Object.keys(heads).length;

    var html = '<div class="breakdown-summary">';
    html += '<span class="breakdown-summary-num">' + rows.length + '</span>' +
            '<span class="breakdown-summary-label">to check</span>';
    html += '<span class="breakdown-summary-sep">&middot;</span>';
    html += '<span class="breakdown-summary-num">' + headCount + '</span>' +
            '<span class="breakdown-summary-label">bonus number' +
            (headCount === 1 ? '' : 's') + '</span>';
    html += '<span class="breakdown-summary-sep">&middot;</span>';
    html += '<span class="breakdown-summary-num">' + sumOverlapStd.toFixed(2) + '</span>' +
            '<span class="breakdown-summary-label">overlap std hours</span>';
    html += '</div>';

    // What was actually looked at. An empty table means one of two completely
    // different things - nothing found, or nothing loaded to look at - and the
    // reader cannot tell them apart without this line.
    var cov = fraudCoveragePak_(win);
    html += '<div class="fraud-note">';
    if (!cov) {
      html += '<i class="fa-solid fa-circle-info" aria-hidden="true"></i>' +
              'None of this production day is loaded yet, so nothing has been ' +
              'checked. ' + scan.claims + ' claim' + (scan.claims === 1 ? '' : 's') +
              ' fall in the window.';
    } else {
      html += '<i class="fa-solid fa-circle-info" aria-hidden="true"></i>' +
              scan.claims + ' claim' + (scan.claims === 1 ? '' : 's') +
              ' in this production day, checked against produced hours from ' +
              fraudDateKeyPak_(cov.from) + ' ' + fraudTimeTextPak_(cov.from) +
              ' to ' + fraudDateKeyPak_(cov.to) + ' ' + fraudTimeTextPak_(cov.to) +
              '. Both buildings, whatever the Warehouse picker says.';
    }
    html += '</div>';

    if (rows.length === 0) {
      // Two very different empties, and the reader cannot act on either
      // without being told which one this is.
      var filtered = scan.rows.length > 0;
      html += '<div class="breakdown-empty">' +
              '<i class="fa-solid fa-' + (filtered ? 'filter' : 'circle-check') +
              '" aria-hidden="true"></i>' +
              (filtered
                ? ('All ' + scan.rows.length + ' of them are filtered out')
                : ('No claim overlaps produced hours in the part of this day ' +
                   'that has been checked')) + '</div>';
      body.innerHTML = html;
      return;
    }

    html += fraudTableHtmlPak_(rows);
    body.innerHTML = html;
  }
</script>
