<style>
:root {
  /* Tells the browser which way this document leans, so the parts it draws
     itself follow the theme: the popup list a <select> opens, the caret and
     focus ring inside form controls, the default canvas colour behind the page,
     and scrollbars anywhere our own rules do not reach. Without it those all
     stayed light while the dashboard around them went dark — most obvious on a
     phone, where every dropdown opens as a full-height native picker.

     Bound to the app's own toggle rather than to prefers-color-scheme, so it
     tracks the theme button rather than the operating system.

     Unlike <meta name="theme-color">, this works inside the Apps Script iframe:
     color-scheme applies per document, whereas theme-color is only honoured on
     the top-level one. */
  color-scheme: light;

  /* NEXT design system (Material 3 --mat-sys-* palette), light = default.
     Dark theme lives under .dark-theme on <html>. */
  --bg: #f5f5f5;                    /* --mat-sys-background */
  --panel: #ffffff;                 /* --mat-sys-surface */
  --border: #c3c7c7;                /* --mat-sys-outline-variant */
  --text: rgba(0, 0, 0, 0.87);      /* --mat-sys-on-surface */
  --muted: #434848;                 /* --mat-sys-on-surface-variant */
  --accent: #007a7a;                /* --mat-sys-primary (teal) */
  --accent-contrast: #ffffff;       /* text on accent */
  --color-good: #3c6939;            /* --mat-sys-success */
  --color-warn: #cc4b00;            /* --mat-sys-warning */
  --color-bad: #d32f2f;             /* --mat-sys-error */
  --header-bg: #000000;             /* black top bar */
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.10);
  --radius-card: 8px;

  --w2: rgba(0, 0, 0, 0.02);
  --w3: rgba(0, 0, 0, 0.03);
  --w4: rgba(0, 0, 0, 0.04);
  --w5: rgba(0, 0, 0, 0.05);
  --w6: rgba(0, 0, 0, 0.06);
  --w7: rgba(0, 0, 0, 0.06);
  --w8: rgba(0, 0, 0, 0.08);
  --w10: rgba(0, 0, 0, 0.09);
  --w12: rgba(0, 0, 0, 0.10);
  --w15: rgba(0, 0, 0, 0.12);
  --w25: rgba(0, 0, 0, 0.18);

  --surface-dropdown: #ffffff;
  --surface-dropdown-2: #f6f3f2;    /* --mat-sys-surface-container-low */
  --surface-solid: #ffffff;
  --surface-solid-0: rgba(255, 255, 255, 0);
  --surface-elevated: #ffffff;
  --surface-panel-strong: #f0edec;  /* --mat-sys-surface-container */
  --tour-tip-bg: #ffffff;

  --text-soft-95: rgba(0, 0, 0, 0.87);
  --text-soft-40: rgba(0, 0, 0, 0.40);

  --tour-mask: rgba(0, 0, 0, 0.45);
  --control-bg: #ffffff;

  /* Data Table frozen columns. A pinned cell has to be opaque, so the row-hover
     and expanded-row tints are pre-blended against --panel here rather than
     layered as alpha — otherwise a hovered row would look striped where the
     frozen columns meet the scrolling ones. */
  --table-freeze-hover: #fafcff;
  --table-freeze-expanded: #f7fafe;

  /* Edge cue for horizontally scrollable tables. */
  --scroll-shadow: rgba(0, 0, 0, 0.28);

  /* Expanded-row drawer on the Data Table. Light needs far less than dark: on
     white, 5% already separates the drawer from the row above it. */
  --detail-recess: rgba(0, 0, 0, 0.05);

  /* Productivity bars on the Bonus tables. Faint enough to sit behind the
     figure without competing with it — the bar is for the shape of the
     ranking, the number is still what you read. */
  --perf-bar-good: rgba(60, 105, 57, 0.16);
  --perf-bar-warn: rgba(204, 75, 0, 0.16);
  --perf-bar-bad: rgba(211, 47, 47, 0.14);

  /* Precomputed alpha tints. Defined per theme instead of using color-mix(),
     which html2canvas cannot parse — it made image export fail entirely. */
  --accent-10: rgba(0, 122, 122, 0.10);
  --accent-14: rgba(0, 122, 122, 0.14);
  --accent-15: rgba(0, 122, 122, 0.15);
  --accent-22: rgba(0, 122, 122, 0.22);
  --good-14: rgba(60, 105, 57, 0.14);
  --bad-14: rgba(211, 47, 47, 0.14);
}

.dark-theme {
  color-scheme: dark;

  --bg: #121212;
  --panel: #1e1e1e;                 /* --mat-sys-surface */
  --border: rgba(255, 255, 255, 0.23);
  --text: rgba(255, 255, 255, 0.92);
  --muted: rgba(255, 255, 255, 0.70);
  --accent: #009393;
  --accent-contrast: #ffffff;
  --color-good: #a1d399;
  --color-warn: #ff9d5c;
  --color-bad: #f44336;
  --header-bg: #000000;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.45);
  --radius-card: 8px;

  --w2: rgba(255, 255, 255, 0.02);
  --w3: rgba(255, 255, 255, 0.03);
  --w4: rgba(255, 255, 255, 0.04);
  --w5: rgba(255, 255, 255, 0.05);
  --w6: rgba(255, 255, 255, 0.06);
  --w7: rgba(255, 255, 255, 0.07);
  --w8: rgba(255, 255, 255, 0.08);
  --w10: rgba(255, 255, 255, 0.10);
  --w12: rgba(255, 255, 255, 0.12);
  --w15: rgba(255, 255, 255, 0.15);
  --w25: rgba(255, 255, 255, 0.25);

  --surface-dropdown: #2c272d;      /* --mat-sys-surface-container */
  --surface-dropdown-2: #2c272d;
  --surface-solid: #1e1e1e;
  --surface-solid-0: rgba(30, 30, 30, 0);
  --surface-elevated: #2c272d;
  --surface-panel-strong: #1b211e;  /* --mat-sys-surface-container-high */
  --tour-tip-bg: #1e1e1e;

  --text-soft-95: rgba(255, 255, 255, 0.95);
  --text-soft-40: rgba(255, 255, 255, 0.40);

  --tour-mask: rgba(0, 0, 0, 0.62);
  --control-bg: #2c272d;

  --table-freeze-hover: #212328;
  --table-freeze-expanded: #23262c;

  --scroll-shadow: rgba(0, 0, 0, 0.6);

  --detail-recess: rgba(0, 0, 0, 0.22);

  --perf-bar-good: rgba(161, 211, 153, 0.18);
  --perf-bar-warn: rgba(255, 157, 92, 0.18);
  --perf-bar-bad: rgba(244, 67, 54, 0.20);

  --accent-10: rgba(0, 147, 147, 0.10);
  --accent-14: rgba(0, 147, 147, 0.14);
  --accent-15: rgba(0, 147, 147, 0.15);
  --accent-22: rgba(0, 147, 147, 0.22);
  --good-14: rgba(161, 211, 153, 0.14);
  --bad-14: rgba(244, 67, 54, 0.14);
}
/* === end theme tokens === */

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#loadingOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  color: var(--text);
}

#loadingOverlay.active {
  opacity: 1;
  pointer-events: all;
}

#loadingOverlay i {
  font-size: 48px;
  color: var(--accent);
}

.wrap {
  width: 100%;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ============================================================
   NEXT chrome — black top header, left icon rail, main column
   ============================================================ */
.next-header {
  flex: 0 0 auto;
  height: 64px;
  background: var(--header-bg);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 20px;
  box-shadow: rgba(0, 0, 0, 0.19) 0 1px 2px, rgba(0, 0, 0, 0.12) 0 1px 3px 1px;
  z-index: 1000;
  position: relative;
}
/* Desktop: collapse the left/right wrappers so brand, meta, controls and
   actions are all direct flex children of the header on one row. The brand's
   auto right-margin pushes everything after it (meta + controls + actions) to
   the right edge, so status/last-update sit on the right in web view. */
.next-header-left,
.next-header-right {
  display: contents;
}
.next-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  margin-right: auto;
}
.next-header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.72);
  white-space: nowrap;
}
.next-header-meta .note-text { color: #ff9d5c; font-weight: 600; }
/* Retry affordance shown next to a failed-load status message. */
.status-retry-btn {
  margin-left: 6px;
  padding: 2px 10px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 999px;
  cursor: pointer;
}
.status-retry-btn:hover { filter: brightness(1.1); }

/* Shared empty state (main table, and the look other empty panels follow). */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 42px 20px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.empty-state i {
  font-size: 26px;
  opacity: 0.35;
}

/* KPI change vs the previous hour. */
.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  white-space: nowrap;
  line-height: 1.4;
}
.kpi-trend.up { color: var(--color-good); background: var(--good-14); }
.kpi-trend.down { color: var(--color-bad); background: var(--bad-14); }
.kpi-trend.flat { color: var(--muted); background: var(--w6); }
.kpi-trend i { font-size: 9px; }

/* Auto-refresh countdown in the header meta row. */
.refresh-countdown {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
  white-space: nowrap;
}
.header-icon-btn.paused { color: var(--color-warn); }

/* ── Skeleton loading ──────────────────────────────────────────────────────
   Shown on a COLD first load only (a returning user is painted instantly from
   the localStorage cache instead). Placeholders mirror the real layout so the
   page doesn't visibly jump when the data lands. */
@keyframes skelShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
body.loading-skeleton .kpi .value,
body.loading-skeleton #thresholdDisplay {
  color: transparent !important;
  border-radius: 6px;
  background-image: linear-gradient(90deg, var(--w6) 25%, var(--w12) 37%, var(--w6) 63%);
  background-size: 200% 100%;
  animation: skelShimmer 1.4s ease-in-out infinite;
  min-width: 64px;
  display: inline-block;
}
body.loading-skeleton .kpi-trend { display: none !important; }
/* Cover each chart panel with a shimmering block while the canvas is empty. */
body.loading-skeleton .charts .card.panel { position: relative; min-height: 220px; }
body.loading-skeleton .charts .card.panel::after {
  content: '';
  position: absolute;
  left: 14px; right: 14px; top: 52px; bottom: 14px;
  border-radius: 8px;
  background-image: linear-gradient(90deg, var(--w4) 25%, var(--w10) 37%, var(--w4) 63%);
  background-size: 200% 100%;
  animation: skelShimmer 1.4s ease-in-out infinite;
}
body.loading-skeleton canvas { visibility: hidden; }

/* Pipeline-stall warning in the header meta row. */
.stale-warning {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(204, 75, 0, 0.16);
  color: #ff9d5c;
  font-weight: 600;
  white-space: nowrap;
}
.next-logo {
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.04em;
  color: #fff;
  text-decoration: none;
  line-height: 1;
  transition: filter 0.15s ease, transform 0.15s ease;
}
.next-logo:hover {
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
  transform: scale(1.03);
}
.next-header-divider {
  width: 1px;
  height: 26px;
  background: rgba(255, 255, 255, 0.35);
  flex: 0 0 auto;
}
.next-header-title {
  margin: 0;
  font-size: 22px;
  font-weight: 200;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.next-header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.next-header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
/* Inputs sitting on the black bar: translucent light fields. */
.next-header .input,
.next-header #archiveSelect {
  background: rgba(255, 255, 255, 0.12) !important;
  color: #fff !important;
  border: 1px solid rgba(255, 255, 255, 0.22);
  height: 36px;
}
.next-header .input::placeholder { color: rgba(255, 255, 255, 0.7); }
.next-header #archiveSelect { min-width: 150px; max-width: 200px; }
.next-header #archiveSelect option { background: var(--surface-dropdown) !important; color: var(--text) !important; }
.next-header .input:focus { border-color: rgba(255, 255, 255, 0.55); }
.next-header .search-input-wrap .fa-search { color: rgba(255, 255, 255, 0.7); }

.header-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 9999px;
  border: none;
  background: transparent;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
  flex: 0 0 auto;
}
.header-icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
.header-icon-btn i { font-size: 19px; }

.app-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}
.next-rail {
  flex: 0 0 96px;
  width: 96px;
  background: var(--panel);
  box-shadow: inset -1px 0 0 var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding-top: 20px;
  overflow-y: auto;
}
.next-rail .rail-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  width: 100%;
  border: none;
  background: transparent;
  padding: 0;
  letter-spacing: 0;
  text-transform: none;
}
.next-rail .rail-item .rail-icon {
  width: 56px;
  height: 32px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: 24px;
  transition: background 0.15s ease, color 0.15s ease;
}
.next-rail .rail-item .rail-label {
  line-height: 1.2;
  white-space: normal;
}
/* Keyboard users need to see where focus is — the rail items are real
   <button>s now, so give them a visible focus ring. */
.next-rail .rail-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  border-radius: 8px;
}
.next-rail .rail-item:hover { color: var(--text); }
.next-rail .rail-item:hover .rail-icon { background: var(--accent-10); }
.next-rail .rail-item.active { color: var(--accent); }
.next-rail .rail-item.active .rail-icon {
  background: var(--accent-15);
  color: var(--accent);
}

.app-main {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
@media (max-width: 700px) {
  /* Header reflows into 3 rows:
       [ brand            | actions (buttons) ]
       [ Live + Filter    (controls, one row) ]
       [ status .... last-update   (meta)     ]  */
  .next-header {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "brand    actions"
      "controls controls"
      "meta     meta";
    align-items: center;
    row-gap: 8px;
    column-gap: 8px;
    height: auto;
    padding: 8px 12px;
  }
  .next-header-left,
  .next-header-right { display: contents; }
  .next-brand { grid-area: brand; margin-right: 0; }
  .next-header-actions { grid-area: actions; }
  .next-header-controls { grid-area: controls; display: flex; gap: 8px; }
  .next-header-meta {
    grid-area: meta;
    justify-content: space-between;
    font-size: 10.5px;
    white-space: normal;
  }
  .next-header-title { font-size: 17px; }
  .next-header-controls #archiveSelect { flex: 0 0 auto; min-width: 110px; max-width: 150px; }
  .next-header-controls .bonus-search-container { flex: 1 1 auto; width: auto; }

  /* Rail becomes a horizontal strip under the header. */
  .app-body { flex-direction: column; }
  .next-rail {
    flex: 0 0 auto;
    width: 100%;
    height: auto;
    flex-direction: row;
    justify-content: space-around;
    gap: 4px;
    padding: 6px 0;
    box-shadow: inset 0 -1px 0 var(--border);
  }
  .next-rail .rail-item { width: auto; font-size: 0.64rem; }
  .next-rail .rail-item .rail-icon { width: 46px; height: 28px; font-size: 20px; }
}

#archiveSelect {
  min-width: 180px;
  max-width: 220px;
  cursor: pointer;
  background: var(--w5) !important;
  color: var(--text) !important;
  background-image: none;
  padding: 6px 10px;
  z-index: 1;
  margin-right: 8px;
}

#archiveSelect option {
  background: var(--bg) !important;
  color: var(--text) !important;
}

.bonus-search-container {
  position: relative;
  width: 250px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.search-row {
  display: flex;
  align-items: stretch;
}

.clear-filter-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  min-width: 36px;
  border: 1px solid rgba(255, 122, 122, 0.25);
  border-right: none;
  background: rgba(255, 122, 122, 0.10);
  color: var(--color-bad);
  border-radius: 10px 0 0 10px;
  cursor: pointer;
  font-size: 12px;
}

.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-input-wrap .input {
  width: 100%;
  padding: 6px 30px 6px 10px;
  border-radius: 0 10px 10px 0;
  font-size: 13px;
}

.search-input-wrap.with-clear .input {
  border-radius: 0 10px 10px 0;
}

.search-input-wrap i.fa-search {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 12px;
}

.search-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--surface-panel-strong);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 2000;
  display: none;
}

.search-dropdown.active {
  display: block;
}

.search-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
}

/* `.active` is the keyboard cursor and is kept identical to :hover, so moving
   between the mouse and the arrow keys doesn't change what "the row I am on"
   looks like. Mouse movement reassigns `.active`, so the two never disagree. */
.search-item:hover,
.search-item.active {
  background: var(--w8);
}

.search-item-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Already part of the filter. Selecting it again removes it, so this is a
   toggle state rather than a disabled one — hence normal text colour. */
.search-item.picked .search-item-name {
  font-weight: 600;
}

.search-item-check {
  color: var(--accent);
  font-size: 11px;
  flex-shrink: 0;
}

/* An unmatched query used to just close the list, which reads as the search
   having broken rather than as "nothing matches". */
.search-empty,
.search-more {
  padding: 10px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

.search-more {
  border-top: 1px solid var(--w8);
  font-style: italic;
}

.active-filter-banner {
  display: none;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 8px 14px;
  border-radius: 10px;
  background: rgba(105, 167, 255, 0.14);
  border: 1px solid rgba(105, 167, 255, 0.35);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}

.active-filter-banner.active {
  display: flex;
}

.active-filter-banner > i {
  font-size: 12px;
  flex-shrink: 0;
}

.active-filter-banner-text {
  white-space: nowrap;
  flex-shrink: 0;
}

.active-filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 0;
}

.active-filter-clear-btn {
  background: transparent;
  border: 1px solid rgba(105, 167, 255, 0.45);
  color: var(--accent);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-family: inherit;
  transition: all 0.15s;
}

.active-filter-clear-btn:hover {
  background: rgba(105, 167, 255, 0.22);
}

.chip {
  display: inline-flex;
  align-items: center;
  background: rgba(105, 167, 255, 0.15);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  overflow: visible;
}

.chip .remove-chip {
  margin-left: 6px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}

.input,
.btn,
.row-select {
  border: 1px solid var(--border);
  background: var(--w5);
  color: var(--text);
  border-radius: 10px;
  padding: 6px 10px;
  outline: none;
  transition: all 0.2s;
  font-size: 13px;
}

.input:focus {
  border-color: var(--accent);
  background: var(--w8);
}

.btn {
  cursor: pointer;
  font-weight: 600;
}

.btn:hover {
  transform: translateY(-1px);
  background: var(--w10);
}

.btn:active {
  transform: translateY(0);
}

.icon-btn {
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.note-text {
  color: var(--color-bad);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.3;
}

.swipe-container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  position: relative;
  width: 100%;
  touch-action: pan-y pinch-zoom;
}

.swipe-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
  min-height: 0;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.page::-webkit-scrollbar {
  width: 6px;
}

.page::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

/* ── Scrollbars everywhere else ──────────────────────────────────────────────
   Only .page was themed, so every other scrolling area — the tables, the modal
   bodies, the search suggestions — fell back to the browser's default bar. In
   dark mode that meant a chunky light-grey scrollbar sitting inside a dark
   panel, which is the single most obvious place the reskin stopped short. */
.table-wrap,
.breakdown-body,
.search-dropdown,
.main-detail-table-wrap,
.tour-menu-list {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.table-wrap::-webkit-scrollbar,
.breakdown-body::-webkit-scrollbar,
.search-dropdown::-webkit-scrollbar,
.main-detail-table-wrap::-webkit-scrollbar,
.tour-menu-list::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.table-wrap::-webkit-scrollbar-thumb,
.breakdown-body::-webkit-scrollbar-thumb,
.search-dropdown::-webkit-scrollbar-thumb,
.main-detail-table-wrap::-webkit-scrollbar-thumb,
.tour-menu-list::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

.table-wrap::-webkit-scrollbar-track,
.breakdown-body::-webkit-scrollbar-track,
.search-dropdown::-webkit-scrollbar-track,
.main-detail-table-wrap::-webkit-scrollbar-track,
.tour-menu-list::-webkit-scrollbar-track {
  background: transparent;
}

/* ── "There is more to the right" ────────────────────────────────────────────
   The Data Table is far wider than the panel holding it, but with overlay
   scrollbars (the default on macOS, and on Windows while not scrolling) there
   was nothing on screen to say so — the columns simply appeared to end.

   An INSET shadow is used rather than a positioned overlay because it paints
   against the scroll container's padding box and therefore stays put while the
   content moves under it. Right edge only: the left edge is already marked by
   the frozen columns' divider, and those cells are opaque so they would cover
   an inset shadow anyway. */
.table-wrap.has-scroll-x:not(.at-scroll-end) {
  box-shadow: inset -16px 0 16px -16px var(--scroll-shadow);
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: none;
}

.kpi {
  padding: 14px;
  grid-column: span 3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.kpi-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.kpi .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.kpi .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
}

.kpi .sub {
  margin-top: auto;
  padding-top: 4px;
  color: var(--muted);

}

.kpi-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 4px;
}

.kpi-tooltip {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--w8);
  color: var(--muted);
  font-size: 9px;
  cursor: help;
  flex-shrink: 0;
}

.kpi-tooltip:hover {
  background: rgba(105, 167, 255, 0.2);
  color: var(--accent);
}

.kpi-tooltip-content {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  padding: 12px;
  background: var(--surface-dropdown);
  border: 1px solid var(--w15);
  border-radius: 12px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  z-index: 2000;
  font-size: 11px;

  pointer-events: none;
}

.kpi-tooltip:hover .kpi-tooltip-content,
.kpi-tooltip.open .kpi-tooltip-content {
  display: block;
}

.tt-title {
  font-weight: 700;
  color: var(--text);
  font-size: 11px;
  margin-bottom: 4px;
}

.kpi-tooltip-content ul {
  margin: 4px 0 0;
  padding-left: 15px;
  color: var(--muted);
  list-style: none;
}

.kpi-tooltip-content ul li::before {
  content: '\2022';
  position: absolute;
  left: 5px;
  color: var(--accent);
}

.kpi-tooltip-content ul li {
  position: relative;
  padding-left: 10px;
}

.panel {
  padding: 14px;
}

.span-12 {
  grid-column: span 12;
}

.table-wrap {
  overflow-x: auto;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  max-width: 100%;
  min-height: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 0;
}

#mainTable {
  min-width: 1300px;
}

.side-table {
  min-width: 100%;
  width: 100%;
}

/* ── Productivity bars on the Bonus tables ───────────────────────────────────
   These tables answer "who is at the top and who is at the bottom", which a
   column of percentages turns into a reading exercise. The bar makes the shape
   of the ranking visible at a glance — whether the top ten are bunched together
   or one person is far ahead, and how steep the drop-off is.

   Drawn as a background layer behind the existing pill rather than replacing
   it: the exact figure is still the thing being read, the bar just gives it
   somewhere to sit. */
.side-table .perf-cell {
  position: relative;
  /* The bar grows from the left, so the figure is parked on the right where it
     has a fixed edge to be read against. Left-aligned, it sat on top of the
     start of its own bar and moved around as the bar changed length. */
  text-align: right;
}

/* Over its own bar the pill's grey lozenge is doubled-up chrome — the bar is
   already carrying the shape. Dropping it leaves the figure sitting cleanly on
   the tint. */
.side-table .perf-cell .pill {
  background: transparent;
  min-width: 0;
  padding: 4px 0;
}

.perf-bar {
  position: absolute;
  left: 0;
  top: 3px;
  bottom: 3px;
  border-radius: 0 3px 3px 0;
  /* Behind the pill, and out of the way of clicks on the row. */
  z-index: 0;
  pointer-events: none;
}

.perf-cell .pill {
  position: relative;
  z-index: 1;
}

.perf-bar.good { background: var(--perf-bar-good); }
.perf-bar.warn { background: var(--perf-bar-warn); }
.perf-bar.bad  { background: var(--perf-bar-bad); }

/* Standard Hours is a quantity, so it gets the same right alignment as the
   Data Table's numeric columns — the two tables sit on the same screen and
   should not disagree about how a number is presented. */
.side-table td.num {
  text-align: right;
  padding-right: 14px;
}

.side-table th:nth-child(2) {
  text-align: right;
  padding-right: 14px;
}

th,
td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--w8);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  /* Poppins' default figures are proportional, so a 1 is narrower than a 7 and
     nothing lines up vertically down a column of numbers. Tabular figures are
     the whole reason a column of data reads as a column. */
  font-variant-numeric: tabular-nums;
}

/* ── Numeric cells ───────────────────────────────────────────────────────────
   #mainTable centred every cell, which puts 1,234 and 12 at different offsets;
   the eye then has to read each number rather than run down the column. Right
   alignment is what makes the digits stack — units over units, tens over tens.
   Columns 1-2 (Date Time, Bonus Number) are labels, not quantities, and the
   last column is a centred pill, so both keep their existing alignment. */
#mainTable td.num,
.main-detail-table td.num {
  text-align: right;
  padding-right: 16px;
}

#mainTable th:nth-child(n+3):nth-child(-n+13),
.main-detail-table th:nth-child(n+3):nth-child(-n+13) {
  text-align: right;
  padding-right: 16px;
}

/* Eleven of the fourteen columns are volumes, and for any given operator all
   but one or two are 0. At full contrast those zeros carry the same visual
   weight as the figures that matter, so the table reads as a wall. Fading them
   leaves the real numbers standing out on their own.

   A missing value is NOT faded: it renders as "-", means something different,
   and should stay legible. */
#mainTable td.num.zero,
.main-detail-table td.num.zero,
.main-card-metric-value.zero {
  color: var(--text-soft-40);
}

#mainTable th,
#mainTable td {
  text-align: center;
}

th {
  position: sticky;
  top: 0;
  background: var(--surface-dropdown-2);
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}

tr:hover td {
  background: var(--w3);
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: var(--w6);
  min-width: 50px;
}

.good {
  color: var(--color-good);
}

.warn {
  color: var(--color-warn);
}

.bad {
  color: var(--color-bad);
}


.volume-charts {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
  min-height: 0;
}

.volume-charts.combined-mode {
  grid-template-columns: 1fr;
}

.volume-charts.combined-mode .vol-chart-panel:not(.vol-primary-panel) {
  display: none;
}

/* Last VISIBLE volume panel when the visible count is odd. Driven by JS
   (renderVolumeChartsPak) rather than a pure :nth-child rule, since hiding
   panels via the area-toggle chips makes DOM position != visible position. */
.volume-charts:not(.combined-mode) > .vol-chart-panel.vol-span-full {
  grid-column: 1 / -1;
  width: calc((100% - 14px) / 2);
  margin: 0 auto;
}

.volume-controls {
  grid-column: 1 / -1;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* Sit the chips ~10px under the controls row (matching the Bonus page), rather
   than the volume grid's full 14px row-gap plus the controls' bottom padding. */
.volume-charts > #volumeAreaToggles.bonus-area-toggles {
  grid-column: 1 / -1;
  margin-top: -4px;
}

.volume-controls label {
  color: var(--muted);
  font-size: 12px;
  margin-right: 8px;
}

.vol-control-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.volume-charts canvas {
  height: 280px !important;
}

.volume-charts.combined-mode canvas {
  height: 500px !important;
}

.chartjs-legend {
  cursor: default !important;
  user-select: none;
}

.chartjs-legend ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.chartjs-legend li {
  cursor: pointer !important;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background 0.2s ease, opacity 0.2s ease;
}

.chartjs-legend li:hover {
  background: var(--w8);
}

.chartjs-legend li.hidden {
  opacity: 0.4;
}

.chartjs-legend li span {
  pointer-events: none;
}

canvas {
  width: 100% !important;
  height: 400px !important;
}

.mini-table-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.mini-table-title h2 {
  flex: 1;
  text-align: left;
  margin: 0;
  font-size: 16px;
}

.tag {
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--muted);
  background: var(--w5);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.row-select {
  padding: 3px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--control-bg);
  color: var(--text);
  font-size: 11px;
  outline: none;
  cursor: pointer;

}

.row-select:hover {

}

.two-panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
  min-height: 0;
}

.side-table th,
.side-table td {
  text-align: center;
}

.side-table th:nth-child(1),
.side-table td:nth-child(1) {
  width: 50%;
}

.side-table th:nth-child(2),
.side-table td:nth-child(2) {
  width: 25%;
}

.side-table th:nth-child(3),
.side-table td:nth-child(3) {
  width: 25%;
}

.clickable-bonus {
  position: relative;
  cursor: pointer;
  color: var(--text);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px;
  border-radius: 4px;
  border: 1px solid transparent;
}

.clickable-bonus:hover {
  color: #fff;
  background: rgba(105, 167, 255, 0.1);
}

.clickable-bonus .filter-icon {
  font-size: 9px;
  opacity: 0;
  transition: opacity 0.2s;
}

.clickable-bonus:hover .filter-icon {
  opacity: 0.6;
}

.clickable-bonus.active {
  color: #fff;
  background: rgba(105, 167, 255, 0.2);
  border-color: rgba(105, 167, 255, 0.4);
}

.clickable-bonus.active .filter-icon {
  opacity: 1;
  color: var(--accent);
}

.bonus-tip {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 8px;
  background: var(--surface-dropdown);
  border: 1px solid var(--w15);
  border-radius: 6px;
  font-size: 10px;
  white-space: nowrap;
  z-index: 500;
  pointer-events: none;
}

.bonus-tip::before {
  content: '';
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-bottom-color: var(--surface-dropdown);
}

.clickable-bonus:hover .bonus-tip {
  display: block;
}

.side-table th {
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.side-table th:hover {
  color: #fff;
  background: var(--w10);
}

.side-table th.active-sort {
  color: #fff;
  background: rgba(105, 167, 255, 0.25);
  border-bottom: 2px solid var(--accent);
}

.side-table th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 5px;
  font-size: 10px;
  opacity: 0.8;
}

.side-table th.active-sort.asc::after {
  content: ' \25B2';
}

.side-table th.active-sort.desc::after {
  content: ' \25BC';
}

.side-table th.no-sort {
  cursor: default;
  user-select: none;
}

.side-table th.no-sort:hover {
  color: var(--muted);
  background: var(--surface-dropdown-2);
}

#mainTable th {
  cursor: pointer;
  transition: background 0.2s;
  user-select: none;
  position: relative;
}

#mainTable th:hover {
  background: var(--w10);
}

#mainTable th.active-sort {
  color: #fff;
  background: rgba(105, 167, 255, 0.25);
  border-bottom: 2px solid var(--accent);
}

#mainTable th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.8;
}

#mainTable th.active-sort.asc::after {
  content: ' \25B2';
}

#mainTable th.active-sort.desc::after {
  content: ' \25BC';
}

/* Expanded-row detail table: sortable sub-headers, matching #mainTable's
   affordance and indicators. */
.main-detail-table th.detail-sortable {
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, color 0.15s;
}
.main-detail-table th.detail-sortable:hover {
  background: var(--accent-14);
  color: var(--text);
}
.main-detail-table th.active-sort {
  color: var(--text);
  background: var(--accent-22);
  border-bottom: 2px solid var(--accent);
}
.main-detail-table th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.8;
}
.main-detail-table th.active-sort.asc::after { content: ' B2'; }
.main-detail-table th.active-sort.desc::after { content: ' BC'; }

/* ── Toasts ──────────────────────────────────────────────────────────────────
   Bottom-left, so it never collides with the back-to-top button on the right.
   z-index is above the overlays: a toast raised by an action taken inside a
   modal has to be readable without closing it first. */
.toast-host {
  position: fixed;
  left: 24px;
  bottom: 24px;
  z-index: 10050;
  display: flex;
  flex-direction: column;
  gap: 8px;
  /* The host spans no wider than its toast, and must not swallow clicks on the
     dashboard underneath; the toast itself takes them back. */
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(420px, calc(100vw - 48px));
  padding: 12px 12px 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-elevated);
  color: var(--text);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
  font-size: 13px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.in {
  opacity: 1;
  transform: none;
}

.toast > .fa-solid:first-child {
  color: var(--accent);
  font-size: 14px;
  flex-shrink: 0;
}

.toast-warn > .fa-solid:first-child {
  color: var(--color-bad);
}

.toast-text {
  flex: 1;
  line-height: 1.35;
}

/* Underlined and in the accent colour: an undo has seconds to be recognised as
   something to click, so it should not read as body text. */
.toast-action {
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 4px 6px;
  font: inherit;
  font-weight: 600;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
  border-radius: 6px;
}

.toast-action:hover {
  background: var(--w8);
}

/* The confirming action. Given a filled button rather than the underlined text
   the secondary actions use, so "Done" is obviously the way out and does not
   read as just another link in the sentence. */
.toast-action-primary {
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  padding: 6px 12px;
}

.toast-action-primary:hover {
  background: var(--accent);
  filter: brightness(1.1);
}

/* A persistent toast can carry two actions plus a close button, which is more
   than fits beside the text on a narrow phone — let it wrap onto its own line
   rather than squeezing the buttons to nothing. */
@media (max-width: 700px) {
  .toast {
    flex-wrap: wrap;
  }
  .toast-text {
    flex: 1 1 100%;
  }
  .toast-action {
    margin-left: auto;
  }
  .toast-action + .toast-action {
    margin-left: 0;
  }
}

.toast-close {
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 4px 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  border-radius: 6px;
}

.toast-close:hover {
  color: var(--text);
  background: var(--w8);
}

.toast-action:focus-visible,
.toast-close:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Full width at the bottom on a phone, where a floating card in the corner
   crowds the content and leaves the Undo an awkwardly small target. */
@media (max-width: 700px) {
  .toast-host {
    left: 12px;
    right: 12px;
    /* Stacked above the back-to-top button (30px up, 42px tall, plus a gap).
       On desktop the toast is left-anchored and narrow so the two never meet,
       but a full-width toast would sit directly under the button and hide its
       own Dismiss. */
    bottom: calc(84px + env(safe-area-inset-bottom));
  }
  .toast {
    max-width: none;
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .toast {
    transition: none;
  }
}

/* ── Mobile header menu ──────────────────────────────────────────────────────
   Six action buttons sit comfortably in a desktop header and overrun a phone's,
   crowding out the "E3 Live Productivity" title. Below 700px they collapse
   behind one button and drop down as a labelled list.

   Desktop is untouched: the toggle is hidden and .next-header-actions keeps the
   inline row it has always had. */
.header-menu-btn {
  display: none;
}

@media (max-width: 700px) {
  /* The mobile header is a grid with named areas, and .next-header-left /
     -right are display:contents — so this button is itself a grid item. It
     takes over the "actions" cell that the button row used to occupy. */
  .header-menu-btn {
    display: flex;
    grid-area: actions;
    justify-self: end;
  }

  /* The dropdown is positioned against the header, so the header has to be the
     containing block. */
  .next-header {
    position: relative;
  }

  .next-header-actions {
    display: none;
    /* grid-area must be cleared as well as position set. For an absolutely
       positioned grid item whose containing block is the grid, the named area
       becomes that containing block — so `right: 8px` would resolve against
       the narrow actions cell rather than against the header. */
    grid-area: auto;
    position: absolute;
    top: calc(100% + 4px);
    right: 8px;
    z-index: 4100;
    flex-direction: column;
    gap: 2px;
    min-width: 190px;
    padding: 6px;
    border-radius: 12px;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
  }

  body.header-menu-open .next-header-actions {
    display: flex;
  }

  /* Icon plus text, left-aligned — a column of unlabelled icons is a guessing
     game, and there is room for the words once they are stacked. */
  .next-header-actions .header-icon-btn {
    width: 100%;
    height: 42px;
    justify-content: flex-start;
    gap: 12px;
    padding: 0 12px;
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }

  /* data-menu-label, NOT aria-label: the auto-refresh button rewrites its
     aria-label every second with the countdown, which would make this item
     jitter and change width once a second. */
  .next-header-actions .header-icon-btn::after {
    content: attr(data-menu-label);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }

  .next-header-actions .header-icon-btn:hover,
  .next-header-actions .header-icon-btn:focus-visible {
    background: var(--accent-10);
  }

  /* The rearrange button's active state still has to read as "on" in here,
     where it is a row rather than a round icon. */
  .next-header-actions .header-icon-btn.active {
    background: var(--accent);
    color: #fff;
  }
}

/* ── Rearrange mode ──────────────────────────────────────────────────────────
   A bar pinned to the top of each movable panel, with the two move buttons.
   Deliberately buttons rather than drag: see the reasoning in JsReorder. */
.reorder-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px -4px 8px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--accent-10);
  border: 1px dashed var(--accent);
}

.reorder-pos {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.reorder-label {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reorder-btn {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.reorder-btn:hover:not([disabled]) {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* At an end of the list. Kept visible rather than hidden so the buttons do not
   move around under the user's finger as a panel travels up the page. */
.reorder-btn[disabled] {
  opacity: 0.3;
  cursor: default;
}

/* Marks out what is movable, so it is obvious the mode is on and which panels
   it applies to. */
body.reorder-mode #page1Charts > [data-reorder-key],
body.reorder-mode #volumeChartsContainer > [data-reorder-key],
body.reorder-mode #bonusTablesContainer > [data-reorder-key] {
  outline: 2px dashed var(--accent);
  outline-offset: 3px;
  border-radius: 12px;
}

/* .trend-charts-wrap is normally display:contents, so it has no box of its own
   and nothing to attach a bar to. In edit mode it becomes a real container
   spanning the grid, which also makes it read correctly as "this whole section
   moves as one unit". */
body.reorder-mode .trend-charts-wrap {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}

body.reorder-mode .trend-charts-wrap > .reorder-bar {
  grid-column: 1 / -1;
}

.header-icon-btn.active {
  background: var(--accent);
  color: #fff;
}

@media (max-width: 700px) {
  /* Full-size tap targets on a phone, where these are the whole interaction. */
  .reorder-btn {
    width: 40px;
    height: 40px;
    font-size: 15px;
  }
  body.reorder-mode .trend-charts-wrap {
    grid-template-columns: 1fr;
  }
}

/* ── Pull to refresh (mobile) ────────────────────────────────────────────────
   Sits below the toasts and above the page content. Fixed to the viewport
   rather than to .page, so it does not scroll away with the content being
   pulled, and so it stays out of the share image export. */
.ptr-indicator {
  position: fixed;
  top: 0;
  left: 50%;
  margin-left: -18px;
  z-index: 9000;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
  color: var(--muted);
  font-size: 13px;
  display: none;
  align-items: center;
  justify-content: center;
  /* Follows the finger, so no transition on transform — it would lag behind the
     gesture and feel broken. Only the colour change is animated. */
  transition: color 0.15s ease, border-color 0.15s ease;
  pointer-events: none;
}

.ptr-indicator.visible {
  display: flex;
}

/* Armed: releasing now will refresh. The arrow is flipped by the transform in
   ptrRender_, so this only has to carry the colour. */
.ptr-indicator.ready {
  color: var(--accent);
  border-color: var(--accent);
}

.ptr-indicator.spinning {
  color: var(--accent);
  border-color: var(--accent);
}

.ptr-indicator.spinning i {
  animation: ptrSpin 0.8s linear infinite;
}

@keyframes ptrSpin {
  to { transform: rotate(360deg); }
}

/* Belt and braces: the gesture is already gated on the same breakpoint in JS,
   but nothing should be able to put this on a desktop screen. */
@media (min-width: 701px) {
  .ptr-indicator {
    display: none !important;
  }
}

/* ── Back to top ─────────────────────────────────────────────────────────────
   The Data Table runs to 192 rows and the Volume page stacks nine charts, and
   every control that governs them sits at the very top. Getting back to change
   an Hours Range meant a long scroll (or, on a phone, a lot of flicks).

   Hidden with visibility rather than display so it can fade, and so it drops
   out of the tab order when it is not on screen. z-index sits well below the
   overlays (10001) — a floating button over a modal backdrop would be wrong. */
.back-to-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 900;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
}

body.page-scrolled-far .back-to-top {
  opacity: 1;
  visibility: visible;
  transform: none;
}

.back-to-top:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.back-to-top:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .back-to-top {
    transition: none;
  }
}

/* On a phone the bottom edge is contested: an iPhone's home indicator and the
   collapsing browser toolbars both live there, and a button at 16px sat inside
   the swipe-up gesture strip, so dismissing the app and pressing the button
   were the same movement.

   env(safe-area-inset-bottom) is included for correctness but is INERT as
   deployed: HtmlService serves this document inside an iframe, and the safe-area
   insets only ever resolve against the top-level document — so they read 0 here
   however notched the handset is. The literal 30px is what actually does the
   work; the env() term only starts contributing if this page is ever served
   outside the Apps Script frame. The same caveat applies to the existing
   .page and .tour-tooltip rules that use it. */
@media (max-width: 700px) {
  .back-to-top {
    right: 14px;
    bottom: calc(30px + env(safe-area-inset-bottom));
    width: 42px;
    height: 42px;
  }
}

}

#mainTable th:nth-child(10), #mainTable td:nth-child(10),
.main-detail-table th:nth-child(10), .main-detail-table td:nth-child(10) {

}

#mainTable th:nth-child(14), #mainTable td:nth-child(14),
.main-detail-table th:nth-child(14), .main-detail-table td:nth-child(14) {
  width: 120px;
}

/* ── Frozen identity columns on the Data Table ───────────────────────────────
   #mainTable is 1770px wide against a viewport that is almost always narrower,
   so Date Time and Bonus Number scrolled out of sight well before the
   right-hand volume columns arrived. That left the reader looking at a row of
   numbers with no way to tell which time block or operator they belonged to,
   and no way to check without scrolling back. Pinning the two identity columns
   keeps that anchor on screen.

   Every combinator here is a CHILD combinator, not a descendant one. The
   expanded per-entry table is a whole <table> nested inside a cell of this one,
   so its own thead/tbody/tr are all descendants of #mainTable — a descendant
   selector reaches straight into it and pins its first two columns as well,
   which is exactly what happened: they turned opaque white and floated over the
   detail row's recessed background while the rest of it stayed grey.

   The :not(.main-detail-row) guard is still needed for a different reason: that
   row's single colspan cell is also at :nth-child(1), and pinning it would drag
   the entire nested table sideways with the horizontal scroll.

   Mobile is untouched — under 700px the table is replaced by .main-card-list. */
#mainTable > thead > tr > th:nth-child(1),
#mainTable > thead > tr > th:nth-child(2),
#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(1),
#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(2) {
  position: sticky;
  /* Table cells are transparent by default; a pinned one must be opaque or the
     columns sliding underneath show straight through it. */
  background: var(--panel);
}

#mainTable > thead > tr > th:nth-child(1),
#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(1) {
  left: 0;
}

/* 260px is the width given to column 1 in the shared width block above; the two
   must stay in step or the columns will overlap. The shadow draws the freeze
   line, so it is obvious which columns are being held still. */
#mainTable > thead > tr > th:nth-child(2),
#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(2) {
  left: 260px;
  box-shadow: 1px 0 0 var(--border);
}

#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(1),
#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(2) {
  z-index: 4;
}

/* The two header corners are pinned in both directions, so they must sit above
   both the remaining headers (z-index 10) and the pinned body cells. */
#mainTable > thead > tr > th:nth-child(1),
#mainTable > thead > tr > th:nth-child(2) {
  z-index: 20;
}

/* Row hover and the expanded highlight are translucent tints, which have no
   effect over an opaque pinned cell — these are the same tints pre-blended, so
   a hovered row still reads as one continuous band across the freeze line.
   !important because the rules they mirror use it too. */
#mainTable tbody tr.main-expandable-row:hover > td:nth-child(1),
#mainTable tbody tr.main-expandable-row:hover > td:nth-child(2) {
  background: var(--table-freeze-hover) !important;
}

#mainTable tbody tr.main-expandable-row.expanded > td:nth-child(1),
#mainTable tbody tr.main-expandable-row.expanded > td:nth-child(2) {
  background: var(--table-freeze-expanded) !important;
}

.main-expandable-row {
  cursor: pointer;
}

.main-expandable-row.expanded > td {

/* ============================================================
   Guided tour (spotlight + coach-mark tooltip)
   ============================================================ */
.tour-help-btn i {
  color: var(--accent);
}

.tour-overlay {
  position: fixed;
  inset: 0;
  /* Above the breakdown/loading overlays (z 10001/10000) so button-demo modals
     appear beneath the tour layer while the tooltip stays on top. */
  z-index: 10002;
  display: none;
}
.tour-overlay.active {
  display: block;
}
/* When a step has no target, the overlay itself provides the dark backdrop. */
.tour-overlay.no-spotlight {
  background: var(--tour-mask);
}
/* Button-demo steps: overlay is transparent so the opened modal (which draws its
   own dark backdrop) shows through, with only the tooltip floating on top. */
.tour-overlay.passthrough {
  background: transparent;
}
.tour-overlay.passthrough .tour-spotlight {
  display: none;
}

.tour-spotlight {
  position: fixed;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  border-radius: 12px;
  border: 2px solid var(--accent);
  /* The huge spread box-shadow darkens the whole screen EXCEPT this rectangle. */
  box-shadow: 0 0 0 9999px var(--tour-mask), 0 0 22px rgba(105, 167, 255, 0.55);
  pointer-events: none;
  transition: left 0.25s ease, top 0.25s ease, width 0.25s ease, height 0.25s ease;
}
.tour-overlay.no-spotlight .tour-spotlight {
  display: none;
}

.tour-tooltip {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 330px;
  max-width: calc(100vw - 32px);
  /* Solid, opaque surface (the --panel token is only 6% white, too see-through). */
  background: var(--tour-tip-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.6);
  z-index: 4001;
}
/* Button-demo steps: pin the tooltip to the bottom so it doesn't cover the modal. */
.tour-overlay.passthrough .tour-tooltip {
  left: 50%;
  right: auto;
  top: auto;
  bottom: 26px;
  transform: translateX(-50%);
}
.tour-tip-step {
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.tour-tooltip h3 {
  margin: 6px 0 8px;
  font-size: 17px;
  color: var(--text);
}
.tour-tooltip p {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--muted);
}
.tour-tip-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 18px;
}
.tour-nav {
  display: flex;
  gap: 8px;
}
.tour-tooltip button {
  font-family: inherit;
  cursor: pointer;
  border-radius: 8px;
  padding: 8px 15px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}
.tour-skip {
  color: var(--muted);
  padding-left: 4px !important;
  padding-right: 4px !important;
  border-color: transparent !important;
}
.tour-skip:hover {
  color: var(--text);
}
.tour-back:hover {
  border-color: var(--accent);
}
.tour-back[disabled] {
  opacity: 0.35;
  cursor: default;
}
.tour-next {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tour-next:hover {
  filter: brightness(1.08);
}
.tour-next[disabled] {
  opacity: 0.4;
  cursor: default;
  filter: none;
}

/* Interactive step: the overlay lets clicks reach the highlighted control (only
   that control and the tooltip are usable — a document guard blocks the rest). */
.tour-tooltip {
  pointer-events: auto;
}
.tour-overlay.interactive {
  pointer-events: none;
}
.tour-overlay.interactive .tour-spotlight {
  animation: tourPulse 1.5s ease-in-out infinite;
}
@keyframes tourPulse {
  0%, 100% { box-shadow: 0 0 0 9999px var(--tour-mask), 0 0 0 3px rgba(105, 167, 255, 0.65); }
  50%      { box-shadow: 0 0 0 9999px var(--tour-mask), 0 0 0 8px rgba(105, 167, 255, 0.28); }
}
/* Modal-close (passthrough + interactive): ring-only highlight, no dark mask,
   so the opened modal stays fully visible while its close button pulses. */
.tour-overlay.passthrough .tour-spotlight {
  display: none;
}
.tour-overlay.passthrough.interactive .tour-spotlight {
  display: block;
  box-shadow: 0 0 0 3px rgba(105, 167, 255, 0.95);
  animation: tourRing 1.4s ease-in-out infinite;
}
@keyframes tourRing {
  0%, 100% { box-shadow: 0 0 0 3px rgba(105, 167, 255, 0.95); }
  50%      { box-shadow: 0 0 0 6px rgba(105, 167, 255, 0.35); }
}
.tour-click-hint {
  display: inline-block;
  margin-top: 10px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent);
}
.tour-click-hint i {
  margin-right: 5px;
}

@media (max-width: 700px) {
  /* Tooltip becomes a fixed bottom sheet; the element stays spotlit above it. */
  .tour-tooltip {
    left: 12px;
    right: 12px;
    top: auto;
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: auto;
    max-width: none;
    transform: none;
  }
  .tour-tip-actions {
    margin-top: 14px;
  }
  .tour-tooltip button {
    padding: 10px 16px;
  }
}

/* ---- Tour replay menu (the "?" picker) ---- */
.tour-menu-modal {

}
.tour-menu-start {

}

}
.tour-menu-list {

}

}
.tour-menu-item-title {

}
.tour-menu-item-sub {

}
.tour-menu-item > i {

}

/* ============================================================
   Mobile final overrides — intentionally LAST in the cascade.
   Earlier max-width:700px blocks re-impose min-width:130px and larger padding
   on the From/To selects, which (combined with flex-wrap:nowrap) pushed the
   pair off the right edge of the screen and clipped their text.
   ============================================================ */
@media (max-width: 700px) {
  /* From/To: both pairs on one row, fully on-screen, text never clipped.
     The font is deliberately small — showing the whole "dd/mm/yyyy hh:mm"
     value matters more here than type size. */
  .breakdown-time-bar {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 0;
    min-width: 0;
    width: auto;
  }
  .breakdown-time-label {
    font-size: 10px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .time-row .breakdown-time-select,
  .breakdown-time-select {
    flex: 1 1 0;
    width: 100%;
    min-width: 0;
    max-width: none;
    box-sizing: border-box;
    font-size: 10.5px;
    /* Right padding leaves room for the native dropdown arrow so the value
       is never rendered underneath it. */
    padding: 9px 18px 9px 6px;
  }
  .breakdown-range-badge,
  .breakdown-time-sep {
    display: none;
  }
}

@media (max-width: 380px) {
  .breakdown-time-label { font-size: 9px; }
  .time-row .breakdown-time-select,
  .breakdown-time-select {
    font-size: 9.5px;
    padding: 9px 16px 9px 4px;
  }
}

/* ============================================================
   Mobile: reclaim vertical space once the page is scrolled.
   Driven by the `page-scrolled` class that JsUi puts on <body> when the active
   .page is scrolled off the top. Deliberately mobile-only — desktop has room.
   ============================================================ */
@media (max-width: 700px) {
  /* Only the ICONS are hidden. The page names stay visible and tappable, so
     navigation is never lost — this just trades the icon's height for content. */
  body.page-scrolled .next-rail .rail-item .rail-icon {
    display: none;
  }
  body.page-scrolled .next-rail .rail-item {
    gap: 0;
  }
  body.page-scrolled .next-rail {
    padding-top: 5px;
    padding-bottom: 5px;
  }

  /* With the icon pill gone, the active page is marked on its label instead. */
  body.page-scrolled .next-rail .rail-item.active .rail-label {
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* The status and last-update line hides too. The stale-data warning and the
     note stay visible — they are exception states worth keeping on screen even
     when space is tight. */
  body.page-scrolled #status,
  body.page-scrolled #lastUpdateText {
    display: none;
  }
}

/* ============================================================
   Mobile: one dropdown text size everywhere.
   The From/To selects were shrunk so a full "dd/mm/yyyy hh:mm" value fits;
   every other dropdown now matches them so the controls read as one set
   instead of two different sizes. Last in the cascade so it overrides the
   earlier 14px mobile rules. Touch targets (min-height) are left alone.
   ============================================================ */
@media (max-width: 700px) {
  .row-select,
  select.input,
  #mainSortSelect,
  #hoursRange,
  #timeWindow,
  #volumeChartMode,
  #bonusViewMode,
  #sharedRowsLimit,
  .breakdown-time-select {
    font-size: 10.5px;
  }
}

@media (max-width: 380px) {
  .row-select,
  select.input,
  #mainSortSelect,
  #hoursRange,
  #timeWindow,
  #volumeChartMode,
  #bonusViewMode,
  #sharedRowsLimit,
  .breakdown-time-select {
    font-size: 9.5px;
  }
}

/* ============================================================
   Mobile: one dropdown size across every page.
   The From/To selects on the Bonus page were already compact, but every other
   dropdown — Hours Range and Time Window on Overall, all three on Volume,
   Display Mode and Rows on Bonus, Sort on the Data Table — carried
   min-height: 44px and roomier padding, so two different control sizes sat on
   screen at once. They now match the From/To pair exactly.

   The header is untouched by construction rather than by exception: every page
   dropdown is .row-select, while the History picker in the black bar is
   .input.header-input and matches none of these selectors.

   #mainSortSelect is named explicitly because an id outranks a class no matter
   how late this block sits, and .bonus-controls .row-select likewise — its
   padding-right: 24px is a two-class selector that would otherwise survive.

   Trade-off worth being explicit about: this drops these controls from a 44px
   touch target to roughly 34px. That is the size the From/To selects have
   always been, which is the basis for matching them, but it is below the usual
   44px guideline.
   ============================================================ */
@media (max-width: 700px) {
  .row-select,
  .bonus-controls .row-select,
  #mainSortSelect {
    /* Identical to .breakdown-time-select below. The generous right padding
       leaves room for the native arrow so a long value is never drawn under it. */
    padding: 9px 18px 9px 6px;
    border-radius: 8px;
    min-height: 0;
    box-sizing: border-box;
  }

  /* The direction toggle shares a row with the sort dropdown, so it shrinks to
     match — a 44px button beside a 34px select reads as a mistake. */
  .main-sort-mobile .icon-btn {
    width: 36px;
    height: 36px;
    min-height: 0;
  }
}

@media (max-width: 380px) {
  .row-select,
  .bonus-controls .row-select,
  #mainSortSelect {
    padding: 9px 16px 9px 4px;
  }
}

/* ============================================================
   Mobile: Live/History dropdown, and the active-filter banner.
   ============================================================ */
@media (max-width: 700px) {
  /* The Live/History select sits beside "Filter by Bonus..." in the header and
     is the same kind of control, so it matches that input rather than the
     smaller size used by the in-page dropdowns. 16px also avoids iOS zooming
     the page when the control is focused. */
  .next-header #archiveSelect,
  #archiveSelect {
    font-size: 16px;
  }

  /* Active-filter banner: one row that never grows. Previously the chips
     wrapped, so selecting several bonus numbers pushed the banner taller and
     taller and shoved the page down. They now sit in a horizontally scrollable
     strip, with a fade at the right edge hinting there is more to scroll. */
  .active-filter-banner {
    flex-wrap: nowrap;
    gap: 6px;
    padding: 6px 10px;
    font-size: 11px;
  }
  .active-filter-banner > i {
    font-size: 11px;
  }
  /* Just the count on a phone — the sentence around it costs more room than it
     is worth once the chips themselves say what is filtered. */
  .afb-word {
    display: none;
  }
  .active-filter-banner-text {
    white-space: nowrap;
    flex: 0 0 auto;
    font-size: 12px;
  }
  .active-filter-chips {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1 1 0;
    min-width: 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent 100%);
  }
  .active-filter-chips::-webkit-scrollbar {
    display: none;
  }
  .active-filter-chips .chip {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 11px;
  }
  .active-filter-clear-btn {
    padding: 5px 10px;
    font-size: 11px;
    flex: 0 0 auto;
  }
}

/* ============================================================
   Bonus page + chip refinements
   ============================================================ */

/* The eye / eye-slash icons are different widths, so toggling a chip changed
   its width and reflowed the whole chip block into different rows. Reserving a
   fixed box keeps every chip the same size in both states. */
.bonus-area-chip i {
  width: 1.15em;
  text-align: center;
  flex: 0 0 auto;
}

/* Three equal columns — the bonus number no longer takes half the table.
   Overrides the earlier 50/25/25 rule. */
.side-table th:nth-child(1),
.side-table td:nth-child(1),
.side-table th:nth-child(2),
.side-table td:nth-child(2),
.side-table th:nth-child(3),
.side-table td:nth-child(3) {
  width: 33.33%;
}

/* Compact bonus tables: half the vertical padding of the global th/td rule. */
.side-table th,
.side-table td {
  padding-top: 4px;
  padding-bottom: 4px;
}

/* Desktop keeps label-beside-select; the Rows label is redundant there because
   each option already reads "10 Rows". */
.bonus-control-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bonus-rows-label {
  display: none;
}

@media (max-width: 700px) {
  /* Bonus page controls laid out like the Volume page: label above its
     dropdown, same label size, and the four dropdowns aligned 2 x 2. The two
     wrappers collapse with display:contents so their children become direct
     grid items. */
  .bonus-page-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
    align-items: end;
  }
  .bonus-controls,
