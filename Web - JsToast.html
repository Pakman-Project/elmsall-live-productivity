<script>
// ============================================================================
// Transient confirmations.
//
// Several actions on this dashboard complete with no visible sign that they
// happened. Clearing every bonus filter wipes the banner and redraws four
// pages, so the one thing the user was looking at disappears — which reads
// like the page broke rather than like the filter cleared. Downloading the raw
// CSV hands the file to the browser and says nothing.
//
// The #status element in the header is the existing place for messages, but it
// is also where the row count and the load state live, so writing to it either
// gets overwritten a moment later or overwrites something the user needed.
// These are separate, out of the way, and self-dismissing.
//
// Deliberately NOT used for the share dialog, which has its own inline hints
// next to the buttons they describe — closer to the action than a corner toast.
// ============================================================================

var TOAST_DEFAULT_MS = 4000;
// Long enough to notice, reach for, and click. An undo the user cannot get to
// in time is worse than none, because they will trust it next time and lose.
var TOAST_UNDO_MS = 8000;

var _toastTimer = null;
// Set by a toast that wants to know when its close button is used. Only the X
// fires it — a timeout or being replaced by another toast does not, because
// those are not the user saying "I am finished with this".
var _toastOnClose = null;

function toastHost_() {
  var host = document.getElementById('toastHost');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toastHost';
    host.className = 'toast-host';
    // Polite, not assertive: these confirm something the user just did, so they
    // should wait their turn rather than interrupt whatever is being read.
    host.setAttribute('role', 'status');
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  return host;
}

function dismissToast_() {
  _toastOnClose = null;
  var host = document.getElementById('toastHost');
  if (!host) return;
  clearTimeout(_toastTimer);
  _toastTimer = null;
  var toast = host.querySelector('.toast');
  if (!toast) return;
  toast.classList.remove('in');
  // Let the transition run before the node goes, but only if it is still the
  // one on screen — a replacement may have arrived in the meantime.
  setTimeout(function () {
    if (toast.parentNode === host) host.removeChild(toast);
  }, 200);
}

// Options:
//   action    {label, onClick}          - a single button, kept for callers
//                                         that predate `actions`
//   actions   [{label, onClick, primary}] - one or more buttons
//   persist   true                      - never auto-dismiss; for a toast that
//                                         reflects a mode the user is still in
//   onClose   fn                        - the close button was pressed
//
// Showing a toast replaces any toast already up rather than stacking — these
// confirm the last thing the user did, and a queue of them just gets in the way.
function showToastPak(message, opts) {
  opts = opts || {};

  // A tour demonstrates real actions, and those actions raise real toasts —
  // clearing the bonus filter in Part 1 raises an Undo. On a phone the toast
  // and the tour tooltip both pin to the bottom of the screen, so the toast
  // landed on top of the thing explaining it. Transient toasts are dropped
  // while a tour is running; they are feedback for something the user did, and
  // during a tour the user did not do it.
  //
  // Persistent ones are kept: rearrange mode's toast IS the mode's indicator,
  // and Part 8 rings it deliberately.
  if (typeof tourActive !== 'undefined' && tourActive && !opts.persist) return;
  var host = toastHost_();
  host.innerHTML = '';
  clearTimeout(_toastTimer);
  _toastOnClose = opts.onClose || null;

  var toast = document.createElement('div');
  toast.className = 'toast' + (opts.kind ? ' toast-' + opts.kind : '');

  var icon = document.createElement('i');
  icon.className = 'fa-solid ' + (opts.icon || 'fa-circle-check');
  icon.setAttribute('aria-hidden', 'true');
  toast.appendChild(icon);

  var text = document.createElement('span');
  text.className = 'toast-text';
  text.textContent = message;
  toast.appendChild(text);

  var life = opts.durationMs || TOAST_DEFAULT_MS;

  var actions = opts.actions || (opts.action ? [opts.action] : []);
  for (var a = 0; a < actions.length; a++) {
    (function (action) {
      if (typeof action.onClick !== 'function') return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toast-action' + (action.primary ? ' toast-action-primary' : '');
      btn.textContent = action.label || 'Undo';
      btn.addEventListener('click', function () {
        // Dismiss first: the handler may put a fresh toast up, and clearing
        // afterwards would take that one down with it.
        dismissToast_();
        action.onClick();
      });
      toast.appendChild(btn);
    })(actions[a]);
  }
  if (actions.length > 0) life = opts.durationMs || TOAST_UNDO_MS;

  var close = document.createElement('button');
  close.type = 'button';
  close.className = 'toast-close';
  close.setAttribute('aria-label', 'Dismiss');
  close.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
  close.addEventListener('click', function () {
    var cb = _toastOnClose;
    dismissToast_();
    if (cb) cb();
  });
  toast.appendChild(close);

  host.appendChild(toast);
  // Next frame, so the browser has laid the element out and the entry
  // transition actually runs instead of being skipped.
  requestAnimationFrame(function () { toast.classList.add('in'); });

  // A toast standing in for a mode has to stay until the mode ends; letting it
  // time out would leave the user in that mode with nothing on screen saying so.
  if (!opts.persist) _toastTimer = setTimeout(dismissToast_, life);
}
</script>
