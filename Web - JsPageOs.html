<script>
  // ── The OS page ────────────────────────────────────────────────────────────
  // Operational Support: who was on an indirect task, by site, zone and
  // department.
  //
  // Read from the OS log rather than from "Processed Data (15mins)", because
  // the pivot keeps only two facts about an indirect block - that it was one,
  // and what was decided about it. Everything a manager actually asks next is
  // in the log and nowhere else: which department, which job, who authorised
  // it, who deployed them, who they report to.
  //
  // Two levels of bar, both expandable: a zone opens onto its departments as
  // bars of their own, and a department opens onto its records grouped by job
  // type. Shaped like the Head Deployed Breakdown down to reusing its row, bar
  // and open/close classes - same gesture, same reading, one fewer thing to
  // learn.

  // Production counts a day from 06:00 to 06:00, so the log's Date column is
  // NOT the calendar date the work happened on: a row reading 08/09 with a
  // 02:00 start happened on the 09th. Getting this wrong moves a whole night
  // shift onto the wrong day, where it matches no window and simply vanishes.
  // Same rule, same constants, as the notebook's _os_windows.
  var OS_DAY_START_HOUR_PAK_ = 6;
  var OS_MAX_SHIFT_HOURS_PAK_ = 16;

  // The Warehouse picker in the control panel names buildings; the OS log's
  // Site column holds what the form calls them. Mapped rather than guessed,
  // because the two vocabularies were never going to converge on their own.
  //
  // Matched on a trimmed, upper-cased value: this is free text off a form, so
  // "Elmsall 3 " and "ELMSALL 3" are the same site.
  var OS_SITE_BY_BUILDING_ = {
    e3: ['ELMSALL 3'],
    e1e2: ['ELMSALL WAY', 'ELMSALL DRIVE']
  };

  function osSiteKeyPak_(v) {
    return String(v == null ? '' : v).trim().toUpperCase();
  }

  // Does this record belong to the building in view? 'all' admits everything,
  // INCLUDING a site nobody has mapped - a spell logged against a site name
  // this does not recognise is still a real spell, and hiding it would be a
  // silent loss. It only drops out when a specific building is chosen.
  function osInBuildingPak_(site) {
    var want = OS_SITE_BY_BUILDING_[siteFilter];
    if (!want) return true;
    return want.indexOf(osSiteKeyPak_(site)) !== -1;
  }

  // "HH:MM" -> minutes past midnight, or -1.
  function osLogMinsPak_(v) {
    var m = /^(\d{1,2}):(\d{2})/.exec(String(v == null ? '' : v).trim());
    if (!m) return -1;
    var h = Number(m[1]), mi = Number(m[2]);
    return (h >= 0 && h < 24 && mi >= 0 && mi < 60) ? h * 60 + mi : -1;
  }

  // A logged record -> the absolute { start, finish } it covers, or null when
  // the row cannot be placed on a clock at all.
  //
  // osSpellProblemPak_ is the same walk, returning the REASON instead. The two
  // are deliberately one function with a flag rather than two implementations:
  // a page that counts eight bad records and a page that lists them have to
  // agree about which eight, and two copies of this logic would eventually not.
  function osSpellWindowPak_(row) { return osSpellWalkPak_(row, false); }
  function osSpellProblemPak_(row) { return osSpellWalkPak_(row, true); }

  function osSpellWalkPak_(row, why) {
    var d = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(row && row.date || '').trim());
    var a = osLogMinsPak_(row && row.from);
    var b = osLogMinsPak_(row && row.to);
    if (!d) return why ? 'the date is not a date' : null;
    if (a < 0 && b < 0) return why ? 'neither the start nor the finish is a time' : null;
    if (a < 0) return why ? 'the start is not a time' : null;
    if (b < 0) return why ? 'the finish is not a time' : null;

    var day = new Date(Number(d[3]), Number(d[2]) - 1, Number(d[1]));
    if (Math.floor(a / 60) < OS_DAY_START_HOUR_PAK_) {
      day = new Date(day.getTime() + 86400000);
    }
    var start = new Date(day.getFullYear(), day.getMonth(), day.getDate(),
                         Math.floor(a / 60), a % 60);
    var finish = new Date(day.getFullYear(), day.getMonth(), day.getDate(),
                          Math.floor(b / 60), b % 60);
    // 22:00-02:00 finishes the next morning, and the log has one Date column
    // with nowhere to say so.
    if (finish <= start) finish = new Date(finish.getTime() + 86400000);
    // A finish typed 06:00 instead of 18:00 is indistinguishable from a real
    // overnight spell, and the line above turns it into twenty-four hours.
    // Dropped rather than drawn across the whole day off one slip.
    if (finish - start > OS_MAX_SHIFT_HOURS_PAK_ * 3600000) {
      return why ? ('the shift runs ' +
                    Math.round((finish - start) / 3600000) + ' hours, over the ' +
                    OS_MAX_SHIFT_HOURS_PAK_ + '-hour cap') : null;
    }
    return why ? '' : { start: start, finish: finish };
  }

  // The two selects, filled from the same 96 blocks the Bonus page uses. Kept
  // separate from that page's pair rather than shared: the two pages are
  // looked at for different reasons and a range set on one has no business
  // moving the other.
  function ensureOsTimeSelects_() {
    var fromSel = $('osFrom');
    var toSel = $('osTo');
    if (!fromSel || !toSel) return;

    var sliced = timeRanges.slice(-96);
    var sig = sliced.length
      ? (sliced[0] + '||' + sliced[sliced.length - 1] + '||' + sliced.length) : '';
    if (fromSel.dataset.sig === sig) return;

    var prevFrom = fromSel.value;
    var prevTo = toSel.value;
    fromSel.innerHTML = '';
    toSel.innerHTML = '';

    for (var i = 0; i < sliced.length; i++) {
      var parts = extractRangePartsPak(sliced[i]);
      var optF = document.createElement('option');
      optF.value = sliced[i];
      optF.textContent = parts.start;
      fromSel.appendChild(optF);

      var optT = document.createElement('option');
      optT.value = sliced[i];
      optT.textContent = parts.end;
      toSel.appendChild(optT);
    }
    fromSel.dataset.sig = sig;

    var fromRestored = false, toRestored = false;
    for (var j = 0; j < sliced.length; j++) {
      if (sliced[j] === prevFrom) { fromSel.selectedIndex = j; fromRestored = true; }
      if (sliced[j] === prevTo) { toSel.selectedIndex = j; toRestored = true; }
    }
    if (!fromRestored || !toRestored || toSel.selectedIndex < fromSel.selectedIndex) {
      fromSel.selectedIndex = Math.max(0, sliced.length - 4);
      toSel.selectedIndex = sliced.length - 1;
    }
  }

  function onOsRangeChange() {
    var fromSel = $('osFrom');
    var toSel = $('osTo');
    if (!fromSel || !toSel) return;
    if (toSel.selectedIndex < fromSel.selectedIndex) {
      toSel.selectedIndex = fromSel.selectedIndex;
    }
    renderOsPagePak();
  }

  // The chosen range as an absolute half-open interval. Half-open because the
  // blocks are: a spell finishing exactly at 08:00 does not belong to the
  // 08:00 block.
  function osSelectedWindowPak_() {
    var fromSel = $('osFrom');
    var toSel = $('osTo');
    if (!fromSel || !toSel || !fromSel.value || !toSel.value) return null;
    var a = parseDateTimePartPak(extractRangePartsPak(fromSel.value).start);
    var b = parseDateTimePartPak(extractRangePartsPak(toSel.value).end);
    return (a && b && b > a) ? { start: a, finish: b } : null;
  }

  // The dd/mm/yyyy keys the log has to cover for the window on screen, plus
  // the day BEFORE each: the Date column is the production day, which runs
  // 06:00 to 06:00, so a spell starting at 02:00 on the 9th is logged against
  // the 8th. Sent to the server so it needs no read of its own to work this
  // out.
  function osLogWantDates_() {
    var out = {}, keys = [];
    for (var i = 0; i < timeRanges.length; i++) {
      var d = parseDateTimePartPak(extractRangePartsPak(timeRanges[i]).start);
      if (!d) continue;
      [d, new Date(d.getTime() - 86400000)].forEach(function (x) {
        var k = ('0' + x.getDate()).slice(-2) + '/' +
                ('0' + (x.getMonth() + 1)).slice(-2) + '/' + x.getFullYear();
        if (!out[k]) { out[k] = true; keys.push(k); }
      });
    }
    return keys;
  }

  // Fetched once, on first open, rather than with every dashboard load: it
  // cost 431ms of a load for a page most viewers never look at. A second open
  // is served from osLogRows without a round trip.
  function ensureOsLogPak_() {
    if (osLogState !== null) return;
    osLogState = 'loading';
    renderOsPagePak();
    google.script.run
      .withSuccessHandler(function (res) {
        osLogRows = (res && res.rows) || [];
        osLogSkipped = (res && Number(res.skipped)) || 0;
        osLogBad = (res && res.bad) || [];
        osLogState = (res && res.error) ? res.error : 'ready';
        if (res && res.timing) { console.info(res.timing); }
        renderOsPagePak();
      })
      .withFailureHandler(function (err) {
        // Named rather than left as an empty page: "nobody was on OS" and
        // "the log could not be read" look identical otherwise.
        osLogState = (err && err.message) || 'The OS log could not be read';
        renderOsPagePak();
      })
      .getOsLogRows(osLogWantDates_(), currentArchiveUrl || null);
  }

  // ── filters ────────────────────────────────────────────────────────────────
  // Three of them, and they compose. The type filter is about the PERSON and
  // the other two are about the record, which is why the type one is applied
  // against the whole window rather than against what the other two left.

  var OS_TYPE_LABELS_ = { all: 'All', pure: 'Pure OS', multi: 'Multi Tasks' };

  function setOsTypeFilter(mode) {
    osTypeFilter = (OS_TYPE_LABELS_[mode] ? mode : 'all');
    renderOsPagePak();
  }

  // Pure OS: this bonus number did nothing BUT indirect work in the window -
  // no standard hours anywhere. Multi Tasks: they did both. Read off
  // rawSideData rather than off the log, because the log knows nothing about
  // productive work; it is the pivot that does.
  function osPureBonusesPak_(win) {
    var productive = {};
    for (var i = 0; i < rawSideData.length; i++) {
      var r = rawSideData[i];
      if ((Number(r.value) || 0) <= 0) continue;
      var d = parseDateTimePartPak(extractRangePartsPak(r.timeRange).start);
      if (!d || d < win.start || d >= win.finish) continue;
      productive[r.bonus] = true;
    }
    return productive;
  }

  // The unique values behind each multi-select, so the dropdowns offer exactly
  // what is in the data rather than a hand-kept list that drifts.
  function osUniqueValuesPak_(rows, key, kind) {
    var seen = {}, out = [];
    for (var i = 0; i < rows.length; i++) {
      var v = osLabelPak_(rows[i][key], kind);
      if (!seen[v]) { seen[v] = true; out.push(v); }
    }
    out.sort();
    return out;
  }

  // A chosen set is a whitelist; an EMPTY set means no filter, not nothing.
  // The alternative - empty meaning nothing shown - makes the first click on
  // a fresh dropdown empty the page, which reads as the page being broken.
  function osPassesSetPak_(chosen, value) {
    for (var k in chosen) { if (chosen.hasOwnProperty(k)) return !!chosen[value]; }
    return true;
  }

  function toggleOsZoneFilter(zone) {
    if (osZoneFilter[zone]) { delete osZoneFilter[zone]; } else { osZoneFilter[zone] = true; }
    renderOsPagePak();
  }

  function toggleOsDeptFilter(dept) {
    if (osDeptFilter[dept]) { delete osDeptFilter[dept]; } else { osDeptFilter[dept] = true; }
    renderOsPagePak();
  }

  function toggleOsStatusFilter(status) {
    if (osStatusFilter[status]) { delete osStatusFilter[status]; }
    else { osStatusFilter[status] = true; }
    renderOsPagePak();
  }

  function clearOsZoneFilter() { osZoneFilter = {}; renderOsPagePak(); }
  function clearOsDeptFilter() { osDeptFilter = {}; renderOsPagePak(); }
  function clearOsStatusFilter() { osStatusFilter = {}; renderOsPagePak(); }

  // Filtered on the DISPLAYED verdict, not on the raw wording - filtering on
  // something the reader cannot see would be a list of options nobody could
  // match to the page. Which means this and the chip have to agree, so both go
  // through osStatusTextPak_.
  var OS_STATUS_NONE_PAK_ = 'No verdict';

  // What a record's status SAYS on this page.
  //
  // Not the chart's three-state fold. osStatusBandPak_ sends everything that is
  // not approved and not pending to "Rejected", which is right for a band - one
  // label, full height of the plot, no room to be subtle - and wrong for a
  // table with a cell per record. A spell logged "Cancelled" or "Withdrawn" is
  // not a rejection, and reading this page to find out what happened to a
  // record is exactly the case where the difference matters.
  //
  // So the two known translations still fold - "OK" is Approved and "authorise
  // or reject" is Awaiting Approval, because those are the form's words for
  // states the page already names - and everything else passes through as it
  // was logged, trimmed and no more.
  function osStatusTextPak_(status) {
    var raw = String(status == null ? '' : status).trim();
    var band = osStatusBandPak_(raw);
    if (!band) return '';
    return (band === OS_STATUS_REJECTED_PAK_) ? raw : band;
  }

  function osRecordStatusPak_(row) {
    return osStatusTextPak_(row && row.status) || OS_STATUS_NONE_PAK_;
  }

  function osStatusValuesPak_(rows) {
    var seen = {}, out = [];
    for (var i = 0; i < rows.length; i++) {
      var v = osRecordStatusPak_(rows[i]);
      if (!seen[v]) { seen[v] = true; out.push(v); }
    }
    // Approved, then undecided, then everything the form actually said, then
    // the blanks. Reading down a list of verdicts that way is how somebody
    // thinks about them; alphabetically would put Awaiting first and scatter
    // the logged wordings through the middle.
    //
    // The wordings are no longer a fixed set - they are whatever has been typed
    // into the log - so they rank together at 3 and sort by name among
    // themselves, which keeps the list stable between renders.
    var rank = {};
    rank[OS_STATUS_APPROVED_PAK_] = 1;
    rank[OS_STATUS_AWAITING_PAK_] = 2;
    rank[OS_STATUS_NONE_PAK_] = 4;
    out.sort(function (a, b) {
      var d = (rank[a] || 3) - (rank[b] || 3);
      return d || (a < b ? -1 : a > b ? 1 : 0);
    });
    return out;
  }

  function toggleOsMenu_(id, force) {
    var menu = document.getElementById(id);
    var btn = document.getElementById(id + 'Btn');
    if (!menu || !btn) return;
    var open = (typeof force === 'boolean') ? force : !menu.classList.contains('open');
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function osMultiSelectHtmlPak_(id, title, values, chosen, handler, clearHandler) {
    var picked = values.filter(function (v) { return chosen[v]; });
    var label = picked.length === 0 ? 'All ' + title
              : picked.length === 1 ? picked[0]
              : picked.length + ' of ' + values.length;
    var html = '<div class="os-filter">';
    html += '<span class="breakdown-time-label">' + title + '</span>';
    html += '<div class="os-multi">';
    html += '<button type="button" class="hc-control os-multi-btn" id="' + id + 'Btn"' +
            ' onclick="toggleOsMenu_(\'' + id + '\')" aria-haspopup="listbox"' +
            ' aria-expanded="false" aria-controls="' + id + '">' +
            '<span class="os-multi-label">' + escapeTextPak_(label) + '</span>' +
            '<i class="fa-solid fa-chevron-down warehouse-caret" aria-hidden="true"></i>' +
            '</button>';
    html += '<div class="warehouse-menu os-multi-menu" id="' + id + '" role="listbox"' +
            ' aria-multiselectable="true" aria-label="' + title + '">';
    if (values.length === 0) {
      html += '<span class="os-multi-empty">Nothing in range</span>';
    } else {
      // "All" first, so getting back out of a narrow selection is one click
      // rather than un-ticking six things.
      html += '<button type="button" class="warehouse-item os-multi-all" role="option"' +
              ' aria-selected="' + (picked.length === 0 ? 'true' : 'false') + '"' +
              ' onclick="' + clearHandler + '()">' +
              '<span class="warehouse-check' + (picked.length === 0 ? ' on' : '') + '"' +
              ' aria-hidden="true">' +
              (picked.length === 0 ? '<i class="fa-solid fa-check"></i>' : '') + '</span>' +
              '<span>All ' + title + '</span></button>';
      for (var i = 0; i < values.length; i++) {
        var on = !!chosen[values[i]];
        html += '<button type="button" class="warehouse-item" role="option"' +
                ' aria-selected="' + (on ? 'true' : 'false') + '"' +
                ' onclick="' + handler + '(\'' + escapeAttrPak(values[i]) + '\')">' +
                '<span class="warehouse-check' + (on ? ' on' : '') + '" aria-hidden="true">' +
                (on ? '<i class="fa-solid fa-check"></i>' : '') + '</span>' +
                '<span>' + escapeTextPak_(values[i]) + '</span></button>';
      }
    }
    html += '</div></div></div>';
    return html;
  }

  // ── grouping ───────────────────────────────────────────────────────────────

  // "07:26 - 08:06", trimmed to the clock times. The date is on the page's own
  // range picker; repeating it on every row of every job would crowd out the
  // six things the row is there to show.
  function osRowTimeTextPak_(row) {
    return row.from + ' - ' + row.to;
  }

  // Blank site, zone, department and job names all happen - the form does not
  // require them - and an unlabelled heading reads as a rendering fault. Named
  // rather than dropped, because the record underneath it is real.
  function osLabelPak_(v, kind) {
    var s = String(v == null ? '' : v).trim();
    return s || ('(no ' + kind + ')');
  }

  // Sorted so the same data draws the same way twice: heads descending, then
  // the name, so two zones of equal size do not swap places between renders.
  function osByCountThenNamePak_(a, b) {
    return (b.count - a.count) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
  }

  // site -> zone -> department -> job type -> records.
  //
  // Counted in unique BONUS NUMBERS at every level, not in records: one person
  // re-submitting a form, or logged for two jobs in the same zone, is one head
  // on OS. Counting records would make the bars a measure of paperwork.
  function osGroupPak_(rows) {
    var sites = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var siteName = osLabelPak_(r.site, 'site');
      var zoneName = osLabelPak_(r.zone, 'zone');
      var deptName = osLabelPak_(r.dept, 'department');
      var jobName = osLabelPak_(r.job, 'job type');

      var site = sites[siteName] || (sites[siteName] = { name: siteName, zones: {}, heads: {} });
      site.heads[r.bonus] = true;
      var zone = site.zones[zoneName] || (site.zones[zoneName] = { name: zoneName, depts: {}, heads: {} });
      zone.heads[r.bonus] = true;
      var dept = zone.depts[deptName] || (zone.depts[deptName] = { name: deptName, jobs: {}, heads: {} });
      dept.heads[r.bonus] = true;
      var job = dept.jobs[jobName] || (dept.jobs[jobName] = { name: jobName, records: [] });
      job.records.push(r);
    }

    var out = [];
    Object.keys(sites).forEach(function (sk) {
      var s = sites[sk];
      var zones = [];
      Object.keys(s.zones).forEach(function (zk) {
        var z = s.zones[zk];
        var depts = [];
        Object.keys(z.depts).forEach(function (dk) {
          var d = z.depts[dk];
          var jobs = Object.keys(d.jobs).map(function (jk) { return d.jobs[jk]; });
          jobs.forEach(function (j) {
            // Earliest record first: a job's records read as a timeline.
            j.records.sort(function (a, b) {
              return (a.from < b.from ? -1 : a.from > b.from ? 1 : 0) ||
                     (a.bonus < b.bonus ? -1 : a.bonus > b.bonus ? 1 : 0);
            });
          });
          jobs.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
          depts.push({ name: d.name, jobs: jobs, count: Object.keys(d.heads).length });
        });
        depts.sort(osByCountThenNamePak_);
        zones.push({ name: z.name, depts: depts, count: Object.keys(z.heads).length });
      });
      zones.sort(osByCountThenNamePak_);
      out.push({ name: s.name, zones: zones, count: Object.keys(s.heads).length });
    });
    out.sort(osByCountThenNamePak_);
    return out;
  }

  // ── open/closed, kept across a re-render ──────────────────────────────────
  // A refresh used to collapse whatever was open, which on a page that polls
  // every fifteen minutes meant losing your place while reading. The keys are
  // the names, so they survive the rows being rebuilt, re-sorted, or filtered
  // and unfiltered again.
  function osNodeKeyPak_() {
    return Array.prototype.slice.call(arguments).join('\u001f');
  }

  function toggleOsNode(el) {
    if (!el) return;
    var key = el.getAttribute('data-os-key');
    if (!key) return;
    if (osOpenNodes[key]) { delete osOpenNodes[key]; } else { osOpenNodes[key] = true; }
    // Toggled in place rather than re-rendered: re-rendering on every click
    // would be correct but visibly slower, and the state object is what the
    // next render reads anyway.
    var open = !!osOpenNodes[key];
    el.classList.toggle('expanded', open);
    var detail = el.nextElementSibling;
    if (detail && detail.classList.contains('breakdown-detail')) {
      detail.classList.toggle('open', open);
      if (open) {
        var bars = detail.querySelectorAll('.breakdown-bar');
        for (var i = 0; i < bars.length; i++) {
          bars[i].style.width = bars[i].dataset.target + '%';
        }
      }
    }
  }

  // ── the record table ──────────────────────────────────────────────────────

  // The COLOUR still comes from the three-state fold - anything that is neither
  // approved nor pending is a record that did not get its hours, and that is
  // amber-or-red information whatever word the form used for it. The WORD comes
  // from osStatusTextPak_, so a record logged "Cancelled" says Cancelled rather
  // than being renamed to something nobody typed.
  function osStatusChipPak_(status) {
    var band = osStatusBandPak_(status);
    var text = osStatusTextPak_(status);
    if (!band) {
      // Logged with the status cell empty. Not a verdict, so it is not given
      // one - calling an undecided record rejected would be an accusation the
      // data does not support.
      return '<span class="os-status os-status-none" title="Logged without a verdict against it">&ndash;</span>';
    }
    var cls = band === OS_STATUS_APPROVED_PAK_ ? 'os-status-good'
            : band === OS_STATUS_AWAITING_PAK_ ? 'os-status-warn' : 'os-status-bad';
    var raw = String(status == null ? '' : status).trim();
    var title = (raw && raw.toLowerCase() !== text.toLowerCase())
      ? ' title="Logged as: ' + escapeAttrPak(raw) + '"' : '';
    return '<span class="os-status ' + cls + '"' + title + '>' + escapeTextPak_(text) + '</span>';
  }

  function osPersonCellPak_(v) {
    var s = String(v == null ? '' : v).trim();
    return s ? escapeTextPak_(s) : '<span class="os-cell-none">&ndash;</span>';
  }

  var OS_JOB_COLUMNS_ = ['Bonus', 'Time', 'TM Authorising', 'Deployed by',
                         'Reports to', 'Record Status'];

  function osJobTableHtmlPak_(records) {
    var html = '<div class="table-wrap os-job-table-wrap"><table class="os-job-table"><thead><tr>';
    for (var c = 0; c < OS_JOB_COLUMNS_.length; c++) {
      html += '<th>' + OS_JOB_COLUMNS_[c] + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      var esc = escapeAttrPak(r.bonus);
      var picked = selectedBonuses.indexOf(r.bonus) !== -1;
      html += '<tr>';
      html += '<td><span class="os-bonus-chip bonus-tip-host clickable-bonus' +
              (picked ? ' selected' : '') + '"' +
              ' onclick="event.stopPropagation();toggleBonusFilter(\'' + esc + '\');">' +
              escapeTextPak_(r.bonus) +
              '<i class="fa-solid fa-filter chip-filter-icon"></i>' +
              bonusTipHtmlPak_(r.bonus, picked) + '</span></td>';
      html += '<td class="os-time-cell">' + escapeTextPak_(osRowTimeTextPak_(r)) + '</td>';
      html += '<td>' + osPersonCellPak_(r.auth) + '</td>';
      html += '<td>' + osPersonCellPak_(r.deployedBy) + '</td>';
      html += '<td>' + osPersonCellPak_(r.reportsTo) + '</td>';
      html += '<td>' + osStatusChipPak_(r.status) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

  // The records that could not be read, NAMED and attributable.
  //
  // This is not a warning to be tidied away. An OS record with an impossible
  // date or a nineteen-hour shift is a real form somebody filled in wrongly,
  // and the point of a dashboard is that the abnormal is visible - so the
  // section lists each one with the code it was logged against, what the three
  // cells actually said, the task, its verdict, and WHO authorised and deployed
  // it, which is who there is to ask about it.
  // No row number and no Problem column: the row number named a place in a
  // sheet most readers of this page cannot open, and the reason is on the row
  // itself as a title instead - so hovering still says what is wrong with it
  // without spending a column of a table that is already too wide for a phone.
  var OS_BAD_COLUMNS_ = ['Bonus', 'Date', 'Start', 'Finish', 'Site / Zone',
                         'Task', 'TM Authorising', 'Deployed by', 'Record Status'];

  function osBadRowsHtmlPak_(bad, unnamed) {
    var total = (bad ? bad.length : 0) + (unnamed || 0);
    if (total <= 0) return '';
    var key = osNodeKeyPak_('__bad');
    var open = !!osOpenNodes[key];

    var html = '<div class="breakdown-row clickable-row os-dropped-row' +
               (open ? ' expanded' : '') + '"' +
               ' data-os-key="' + escapeAttrPak(key) + '" onclick="toggleOsNode(this)">';
    html += '<div class="breakdown-label os-dropped-label">' +
            '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
            total + ' record' + (total === 1 ? '' : 's') +
            ' that cannot be placed on a clock' +
            '<i class="fa-solid fa-chevron-down breakdown-chevron"></i></div></div>';

    html += '<div class="breakdown-detail' + (open ? ' open' : '') + '">' +
            '<div class="os-zone-detail">';
    html += '<div class="os-bad-intro">These are on the OS log and could not be ' +
            'placed on a clock, so they are in none of the figures above. Hover a ' +
            'row to see what is wrong with it.</div>';

    if (bad && bad.length) {
      html += '<div class="table-wrap os-job-table-wrap"><table class="os-job-table os-bad-table"><thead><tr>';
      for (var c = 0; c < OS_BAD_COLUMNS_.length; c++) {
        html += '<th>' + OS_BAD_COLUMNS_[c] + '</th>';
      }
      html += '</tr></thead><tbody>';
      for (var i = 0; i < bad.length; i++) {
        var b = bad[i];
        var zone = [b.site, b.zone].filter(function (x) { return String(x || '').trim(); })
                                   .join(' / ');
        // The reason rides on the row rather than in a column of its own. It is
        // still the most useful thing here, but it is also the longest, and on
        // a phone a paragraph-wide last column pushed the eight cells somebody
        // reads first off the side of the table.
        html += '<tr' + (b.why ? ' title="' + escapeAttrPak(b.why) + '"' : '') +
                ' class="os-bad-row">';
        // Clickable like every other bonus number on the dashboard: the code is
        // often the fastest way to find out whose record this is.
        html += '<td>' + (String(b.bonus || '').trim()
          ? '<span class="os-bonus-chip bonus-tip-host clickable-bonus"' +
            ' onclick="event.stopPropagation();toggleBonusFilter(\'' +
            escapeAttrPak(b.bonus) + '\');">' + escapeTextPak_(b.bonus) +
            bonusTipHtmlPak_(b.bonus, selectedBonuses.indexOf(b.bonus) !== -1) + '</span>'
          : '<span class="os-cell-none">&ndash;</span>') + '</td>';
        html += '<td class="os-bad-cell">' + osPersonCellPak_(b.date) + '</td>';
        html += '<td class="os-bad-cell">' + osPersonCellPak_(b.from) + '</td>';
        html += '<td class="os-bad-cell">' + osPersonCellPak_(b.to) + '</td>';
        html += '<td>' + osPersonCellPak_(zone) + '</td>';
        html += '<td>' + osPersonCellPak_(b.job) + '</td>';
        html += '<td>' + osPersonCellPak_(b.auth) + '</td>';
        html += '<td>' + osPersonCellPak_(b.deployedBy) + '</td>';
        html += '<td>' + osStatusChipPak_(b.status) + '</td>';
        html += '</tr>';
      }
      html += '</tbody></table></div>';
    }

    // Only ever a RESIDUAL: the server counted these but could not name them,
    // which now means only that it hit its own cap. Counted separately from
    // the table above so the two cannot double up - the heading used to say
    // eight and this line say "8 more", which read as sixteen.
    if (unnamed) {
      html += '<div class="os-bad-intro">' + unnamed + ' more could not be read, past ' +
              'the limit on how many the server will name in one go.</div>';
    }
    html += '</div></div>';
    return html;
  }

  // ── the page ───────────────────────────────────────────────────────────────

  function renderOsPagePak() {
    var body = document.getElementById('osBody');
    if (!body) return;
    ensureOsTimeSelects_();

    var win = osSelectedWindowPak_();
    var badge = document.getElementById('osRangeBadge');
    if (badge) {
      badge.textContent = win
        ? (Math.round((win.finish - win.start) / 60000) + ' min')
        : '-';
    }

    if (!win) {
      body.innerHTML = '<div class="breakdown-empty">' +
        '<i class="fa-solid fa-clock" aria-hidden="true"></i>' +
        'Waiting for a time range</div>';
      return;
    }

    if (osLogState === null) { ensureOsLogPak_(); return; }
    // A skeleton while it loads, as everywhere else on the dashboard - and for
    // the same reason: this page fetches the log on first open, so without one
    // the first thing a new arrival sees is an empty card, which reads as
    // "nobody was on OS" rather than as "not here yet".
    //
    // Shaped like what is coming - a summary line, then bars - so the page does
    // not visibly jump when the rows land. Written once: a re-render while
    // still loading would restart every shimmer from the left.
    if (osLogState === 'loading') {
      if (!body.firstChild || !body.firstChild.classList ||
          !body.firstChild.classList.contains('os-skeleton')) {
        body.innerHTML = '<div class="os-skeleton" aria-label="Loading">' +
          '<div class="os-skel-summary"></div>' +
          '<div class="os-skel-row"></div><div class="os-skel-row"></div>' +
          '<div class="os-skel-row"></div><div class="os-skel-row"></div></div>';
      }
      return;
    }
    if (osLogState !== 'ready') {
      body.innerHTML = '<div class="breakdown-empty">' +
        '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
        escapeTextPak_(osLogState) + '</div>';
      return;
    }

    // OVERLAP, not containment. A spell that started before the window and is
    // still running is the case this page exists for; requiring it to fit
    // inside would hide exactly the people currently on OS.
    //
    // The building filter is applied here too: Warehouse names buildings and
    // the log names sites, so the two are mapped - see OS_SITE_BY_BUILDING_.
    var inWindow = [];
    // The records the CLIENT cannot place, NAMED. These are the ones the page
    // used to count and then shrug at - "the server could not say which" -
    // because only the server's own rejects carried a row number. Every record
    // carries one now, so an over-long shift or an impossible date can be
    // pointed at like any other.
    var unplaceable = [];
    for (var i = 0; i < osLogRows.length; i++) {
      var rec = osLogRows[i];
      // The building filter first: a record for the OTHER warehouse is not
      // "on OS, elsewhere" once E3 is chosen, and it should not be either once
      // it also cannot be placed on a clock. The Site column is exactly what
      // the mapping in OS_SITE_BY_BUILDING_ is for, and it is read off the row
      // whether or not the row parses as a valid spell.
      if (!osInBuildingPak_(rec.site)) continue;
      var w = osSpellWindowPak_(rec);
      if (!w) {
        unplaceable.push({
          row: rec.row, bonus: rec.bonus, date: rec.date,
          from: rec.from, to: rec.to, site: rec.site, zone: rec.zone,
          job: rec.job, auth: rec.auth, deployedBy: rec.deployedBy,
          status: rec.status,
          why: osSpellProblemPak_(rec) || 'it cannot be placed on a clock'
        });
        continue;
      }
      if (w.finish <= win.start || w.start >= win.finish) continue;
      inWindow.push(rec);
    }

    // The server's own rejects go through the same filter - they carry a Site
    // cell too, and a reject from the other building is exactly the "elsewhere"
    // case above.
    var badInBuilding = (osLogBad || []).filter(function (b) {
      return osInBuildingPak_(b.site);
    });

    // The dropdowns offer what is actually in range, so a zone nobody worked
    // is not on the list. Built BEFORE the zone and department filters are
    // applied, or choosing one would empty the list you chose it from.
    var zoneValues = osUniqueValuesPak_(inWindow, 'zone', 'zone');
    var deptValues = osUniqueValuesPak_(inWindow, 'dept', 'department');
    var statusValues = osStatusValuesPak_(inWindow);

    // Pure OS / Multi Tasks is about the PERSON across the whole window, so it
    // is judged before the zone and department filters narrow the records.
    var productive = osPureBonusesPak_(win);
    var rows = inWindow.filter(function (r) {
      if (osTypeFilter === 'pure' && productive[r.bonus]) return false;
      if (osTypeFilter === 'multi' && !productive[r.bonus]) return false;
      if (!osPassesSetPak_(osZoneFilter, osLabelPak_(r.zone, 'zone'))) return false;
      if (!osPassesSetPak_(osDeptFilter, osLabelPak_(r.dept, 'department'))) return false;
      if (!osPassesSetPak_(osStatusFilter, osRecordStatusPak_(r))) return false;
      return true;
    });

    var heads = {};
    for (var h = 0; h < rows.length; h++) { heads[rows[h].bonus] = true; }
    var headCount = Object.keys(heads).length;
    var sites = osGroupPak_(rows);
    var zoneCount = 0;
    for (var s = 0; s < sites.length; s++) { zoneCount += sites[s].zones.length; }

    var controls = document.getElementById('osFilters');
    if (controls) {
      controls.innerHTML =
        '<div class="os-filter"><span class="breakdown-time-label">Type</span>' +
        '<select class="hc-control os-type-select" onchange="setOsTypeFilter(this.value)"' +
        ' title="Everyone on OS, only those who did nothing else, or only those who did both">' +
        Object.keys(OS_TYPE_LABELS_).map(function (k) {
          return '<option value="' + k + '"' + (osTypeFilter === k ? ' selected' : '') +
                 '>' + OS_TYPE_LABELS_[k] + '</option>';
        }).join('') + '</select></div>' +
        osMultiSelectHtmlPak_('osZoneMenu', 'Zones', zoneValues, osZoneFilter,
                              'toggleOsZoneFilter', 'clearOsZoneFilter') +
        osMultiSelectHtmlPak_('osDeptMenu', 'Departments', deptValues, osDeptFilter,
                              'toggleOsDeptFilter', 'clearOsDeptFilter') +
        osMultiSelectHtmlPak_('osStatusMenu', 'Record Status', statusValues, osStatusFilter,
                              'toggleOsStatusFilter', 'clearOsStatusFilter');
    }

    var html = '<div class="breakdown-summary">';
    html += '<span class="breakdown-summary-num">' + headCount + '</span>' +
            '<span class="breakdown-summary-label">on OS</span>';
    html += '<span class="breakdown-summary-sep">&middot;</span>';
    html += '<span class="breakdown-summary-num">' + zoneCount + '</span>' +
            '<span class="breakdown-summary-label">zone' + (zoneCount === 1 ? '' : 's') + '</span>';
    html += '<span class="breakdown-summary-sep">&middot;</span>';
    html += '<span class="breakdown-summary-num">' + rows.length + '</span>' +
            '<span class="breakdown-summary-label">record' + (rows.length === 1 ? '' : 's') + '</span>';
    html += '</div>';

    // One list, server rejects and client drops together, plus whatever the
    // server counted but could not name. Counted ONCE: the heading used to say
    // eight and the note underneath say "8 more", which read as sixteen.
    //
    // The residual - rows the server counted but hit its cap before it could
    // name - carries no Site cell to filter by, because it was never read. Left
    // unfiltered rather than guessed at: a building filter that silently
    // dropped a number it cannot actually attribute would undercount without
    // saying so.
    osRenderBadCardPak_(
      badInBuilding.concat(unplaceable),
      Math.max(0, (Number(osLogSkipped) || 0) - (osLogBad || []).length));

    if (sites.length === 0) {
      html += '<div class="breakdown-empty">' +
              '<i class="fa-solid fa-ghost" aria-hidden="true"></i>' +
              'Nobody on OS in the selected range</div>';
      body.innerHTML = html;
      osApplyBarsPak_(body);
      return;
    }

    for (var si = 0; si < sites.length; si++) {
      var site = sites[si];
      // Bars are scaled WITHIN their site, not across the whole page: a site
      // with three people on OS still deserves a readable breakdown, and
      // scaled against a site of forty every one of its bars would be a stub.
      var maxZone = 0;
      for (var z = 0; z < site.zones.length; z++) {
        if (site.zones[z].count > maxZone) maxZone = site.zones[z].count;
      }

      html += '<div class="os-site">';
      html += '<div class="os-site-head"><span class="os-site-name">' +
              escapeTextPak_(site.name) + '</span>' +
              '<span class="os-site-count">' + site.count + ' on OS</span></div>';

      for (var zi = 0; zi < site.zones.length; zi++) {
        var zone = site.zones[zi];
        var zKey = osNodeKeyPak_(site.name, zone.name);
        var zOpen = !!osOpenNodes[zKey];
        var zPct = maxZone > 0 ? (zone.count / maxZone * 100) : 0;

        html += '<div class="breakdown-row clickable-row' + (zOpen ? ' expanded' : '') + '"' +
                ' data-os-key="' + escapeAttrPak(zKey) + '" onclick="toggleOsNode(this)">';
        html += '<div class="breakdown-label">' + escapeTextPak_(zone.name) +
                '<i class="fa-solid fa-chevron-down breakdown-chevron"></i></div>';
        html += '<div class="breakdown-bar-wrap"><div class="breakdown-bar os-zone-bar"' +
                ' style="width:0%;" data-target="' + zPct + '"></div></div>';
        html += '<div class="breakdown-count">' + zone.count + '</div></div>';

        html += '<div class="breakdown-detail' + (zOpen ? ' open' : '') + '">' +
                '<div class="os-zone-detail">';

        // A zone opens onto its departments as bars of their own, as a SHARE OF
        // THE ZONE above them - 9 of 33 is a bar a third of the way across.
        //
        // Scaled against the largest department instead, which this did, the
        // biggest one always filled the track whatever it was: four
        // departments of 9, 9, 9 and 6 drew three full-width bars and one at
        // two thirds, which reads as "nearly everybody" three times over. The
        // zone's own total is the number the reader has just looked at on the
        // row above, so it is the one the bars should be answering.
        //
        // Clamped, because a person logged in two departments of one zone is
        // one head in the zone and one in each - so the parts can legitimately
        // sum past the whole, and a bar wider than its track would be the only
        // sign of it.
        for (var di = 0; di < zone.depts.length; di++) {
          var dept = zone.depts[di];
          var dKey = osNodeKeyPak_(site.name, zone.name, dept.name);
          var dOpen = !!osOpenNodes[dKey];
          var dPct = zone.count > 0
            ? Math.min(100, dept.count / zone.count * 100) : 0;

          html += '<div class="breakdown-row clickable-row os-dept-row' +
                  (dOpen ? ' expanded' : '') + '"' +
                  ' data-os-key="' + escapeAttrPak(dKey) + '" onclick="toggleOsNode(this)">';
          html += '<div class="breakdown-label">' + escapeTextPak_(dept.name) +
                  '<i class="fa-solid fa-chevron-down breakdown-chevron"></i></div>';
          html += '<div class="breakdown-bar-wrap"><div class="breakdown-bar os-dept-bar"' +
                  ' style="width:0%;" data-target="' + dPct + '"></div></div>';
          html += '<div class="breakdown-count">' + dept.count + '</div></div>';

          html += '<div class="breakdown-detail' + (dOpen ? ' open' : '') + '">' +
                  '<div class="os-dept-detail">';
          for (var ji = 0; ji < dept.jobs.length; ji++) {
            var job = dept.jobs[ji];
            html += '<div class="os-job">';
            html += '<div class="os-job-head">' + escapeTextPak_(job.name) +
                    '<span class="os-job-count">' + job.records.length + '</span></div>';
            html += osJobTableHtmlPak_(job.records);
            html += '</div>';
          }
          html += '</div></div>';
        }
        html += '</div></div>';
      }
      html += '</div>';
    }

    body.innerHTML = html;
    osApplyBarsPak_(body);
  }

  // Its own card, separate from the breakdown: these records are in none of
  // the figures up there, and a warning living inside that card read as part
  // of the same total it is explicitly excluded from. Hidden outright rather
  // than left as an empty card when there is nothing to show.
  function osRenderBadCardPak_(bad, unnamed) {
    var card = document.getElementById('osBadCard');
    var body = document.getElementById('osBadBody');
    if (!card || !body) return;
    var html = osBadRowsHtmlPak_(bad, unnamed);
    card.hidden = !html;
    body.innerHTML = html;
  }

  // Widths are set after the markup lands so the CSS transition has a value to
  // animate FROM - the same trick, and the same 60ms, as the head breakdown's
  // bars. Only bars inside an OPEN detail are animated; a closed one has no
  // width to measure and would animate from nothing the moment it opens.
  function osApplyBarsPak_(body) {
    setTimeout(function () {
      var bars = body.querySelectorAll('.breakdown-bar');
      for (var i = 0; i < bars.length; i++) {
        var detail = bars[i].closest ? bars[i].closest('.breakdown-detail') : null;
        if (detail && !detail.classList.contains('open')) continue;
        bars[i].style.width = bars[i].dataset.target + '%';
      }
    }, 60);
  }

  // Click-away for the two multi-selects, matching how the header menus close.
  //
  // Guarded, because everything else in this file is pure string and date work
  // that its test suite runs directly with no DOM at all. One unguarded
  // listener at load time would make the whole module untestable.
  if (typeof document !== 'undefined' && document && document.addEventListener) {
    document.addEventListener('click', function (e) {
      if (!e.target || !e.target.closest) return;
      if (e.target.closest('.os-multi')) return;
      toggleOsMenu_('osZoneMenu', false);
      toggleOsMenu_('osDeptMenu', false);
    });
  }
</script>
