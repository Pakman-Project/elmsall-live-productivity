<script>
var APP_CONFIG = {
  thresholds: { good: 80, warn: 60 },
  colors: { good: '#32d583', warn: '#ffcc66', bad: '#ff7a7a', accent: '#69a7ff' },
  classes: { good: 'good', warn: 'warn', bad: 'bad' }
};

// ── Work-area colour ──────────────────────────────────────────────────
// Colour carries two things at once: hue says which FAMILY of work an area
// belongs to, lightness says which area within it. So the three Online
// Pickings are three blues, the three Top Ups three oranges, and both BPPs
// are yellows - the grouping reads off a chart without anyone consulting a
// legend.
//
// Both columns are generated in OKLCH from the eight fixed hues below and
// measured, not eyeballed: every colour sits inside its mode's lightness
// band, clears the chroma floor under which a hue starts reading as grey, and
// every family ramp is monotone with a real lightness step between
// neighbours. The dark column is its own set of steps chosen for the dark
// surface, not the light column lightened.
//
// What colour cannot do: nineteen shades are not all tellable apart at once,
// and no palette fixes that - it is a limit of the eye, not of the hexes. So
// charts where series touch draw the eight FAMILIES instead (the Volume
// page's Combined and Stacked modes), and these per-area shades are used
// where areas do not sit edge to edge: separate panels, chips, dots,
// breakdown bars.
var VOLUME_TYPES = [
  { key: 'pieVol', stdKey: 'pieStd', label: 'PiE', family: 'Picking', color: '#0453a5', colorDark: '#035cb3' },
  { key: 'topUpVol', stdKey: 'topUpStd', label: 'Top Up', family: 'Top Up', color: '#913203', colorDark: '#a73a07' },
  { key: 'e3PackingVol', stdKey: 'e3PackingStd', label: 'E3 Packing', family: 'Packing', color: '#076c49', colorDark: '#0c7954' },
  { key: 'parcelInductVol', stdKey: 'parcelInductStd', label: 'Parcel Induct', family: 'Parcel', color: '#95305b', colorDark: '#ae2b60' },
  { key: 'parcelSortationVol', stdKey: 'parcelSortationStd', label: 'Parcel Sortation', family: 'Parcel', color: '#db7099', colorDark: '#db5786' },
  { key: 'inboundDecantingVol', stdKey: 'inboundDecantingStd', label: 'Inbound Decanting', family: 'Decanting', color: '#016f01', colorDark: '#0a7c08' },
  { key: 'osrDecantingVol', stdKey: 'osrDecantingStd', label: 'OSR Decanting', family: 'Decanting', color: '#49b343', colorDark: '#3aa635' },
  { key: 'bcrInductingVol', stdKey: 'bcrInductingStd', label: 'BCR Inducting', family: 'Inducting', color: '#5345b3', colorDark: '#6355b4' },
  { key: 'e1e2InductingVol', stdKey: 'e1e2InductingStd', label: 'E1/E2 Inducting', family: 'Inducting', color: '#8d86fa', colorDark: '#877cdf' },
  { key: 'sorter6PackingVol', stdKey: 'sorter6PackingStd', label: 'Sorter 6 Packing', family: 'Packing', color: '#22b37d', colorDark: '#24a476' },
  { key: 'onlinePickingDriveVol', stdKey: 'onlinePickingDriveStd', label: 'Drive - Online Picking', family: 'Picking', color: '#1d6dca', colorDark: '#1d6eca' },
  { key: 'onlinePickingWayVol', stdKey: 'onlinePickingWayStd', label: 'Way - Online Picking', family: 'Picking', color: '#3c89e9', colorDark: '#3482e0' },
  { key: 'onlinePickingE3Vol', stdKey: 'onlinePickingE3Std', label: 'E3 - Online Picking', family: 'Picking', color: '#64a6fd', colorDark: '#4996f5' },
  { key: 'e3BppVol', stdKey: 'e3BppStd', label: 'E3 BPP', family: 'BPP', color: '#7b5100', colorDark: '#8b5b00' },
  { key: 'e1e2BppVol', stdKey: 'e1e2BppStd', label: 'E1/E2 BPP', family: 'BPP', color: '#cb8903', colorDark: '#bc7d09' },
  { key: 'rspsTopUpVol', stdKey: 'rspsTopUpStd', label: 'RSPS Top Up', family: 'Top Up', color: '#cb4b0b', colorDark: '#c94a11' },
  { key: 'rspsPickVol', stdKey: 'rspsPickStd', label: 'RSPS Pick', family: 'Returns Pick', color: '#ab0b1d', colorDark: '#af343a' },
  { key: 'ispsTopUpVol', stdKey: 'ispsTopUpStd', label: 'ISPS Top Up', family: 'Top Up', color: '#f97542', colorDark: '#e36230' },
  { key: 'ispsPickVol', stdKey: 'ispsPickStd', label: 'ISPS Pick', family: 'Returns Pick', color: '#f85d59', colorDark: '#dc5e5e' }
];

// The eight family hues. Their ORDER is a safety property, not a taste one -
// it is what keeps neighbouring families apart under red-green colour
// blindness - so it does not get re-ordered to look nicer. These are what a
// folded chart draws; a family hue is never handed to an individual area.
var AREA_FAMILIES = [
  { name: 'Picking',      color: '#2a78d6', colorDark: '#3987e5' },
  { name: 'Top Up',       color: '#eb6834', colorDark: '#d95926' },
  { name: 'Packing',      color: '#1baf7a', colorDark: '#199e70' },
  { name: 'BPP',          color: '#eda100', colorDark: '#c98500' },
  { name: 'Parcel',       color: '#e87ba4', colorDark: '#d55181' },
  { name: 'Decanting',    color: '#008300', colorDark: '#008300' },
  { name: 'Inducting',    color: '#4a3aa7', colorDark: '#9085e9' },
  { name: 'Returns Pick', color: '#e34948', colorDark: '#e66767' }
];

/**
 * The colour to draw `t` in right now, for anything carrying a color /
 * colorDark pair - a work area or a family. Resolving here rather than at
 * each call site is what makes the theme toggle one rebuild instead of a
 * conditional at every place a colour is used.
 */
function areaColor_(t) {
  if (!t) return '#888888';
  return (currentTheme === 'dark' && t.colorDark) ? t.colorDark : t.color;
}

/**
 * The families that actually have work areas in the building currently in
 * force, each carrying its member VOLUME_TYPES entries. Empty families are
 * dropped, so an E1/E2 dashboard draws five families rather than eight with
 * three of them flat at zero.
 */
function volumeFamiliesActive_() {
  var byName = {}, out = [];
  for (var i = 0; i < AREA_FAMILIES.length; i++) {
    var f = AREA_FAMILIES[i];
    byName[f.name] = { name: f.name, color: f.color, colorDark: f.colorDark, types: [] };
    out.push(byName[f.name]);
  }
  for (var v = 0; v < VOLUME_TYPES.length; v++) {
    var t = VOLUME_TYPES[v];
    if (!areaInSite_(t.key)) continue;
    if (byName[t.family]) byName[t.family].types.push(t);
  }
  return out.filter(function(f) { return f.types.length > 0; });
}

// ── The site filter ────────────────────────────────────────────────────────
// Elmsall is three buildings, and most people only run one of them. The header
// title doubles as the picker, so what the dashboard says it is showing and
// what it IS showing cannot drift apart.
//
// E1/E2 Inducting is E3 work despite the name: the operator stands in E3
// inducting totes that arrived from E1/E2. The building is where the hours are
// earned, not where the stock came from.
var AREA_SITE = {
  pie: 'e3', topUp: 'e3', e3Packing: 'e3', parcelInduct: 'e3',
  parcelSortation: 'e3', inboundDecanting: 'e3', osrDecanting: 'e3',
  bcrInducting: 'e3', e1e2Inducting: 'e3', onlinePickingE3: 'e3', e3Bpp: 'e3',
  sorter6Packing: 'e1e2', onlinePickingDrive: 'e1e2', onlinePickingWay: 'e1e2',
  e1e2Bpp: 'e1e2',
  // Returns processing, all four in E1/E2.
  rspsTopUp: 'e1e2', rspsPick: 'e1e2', ispsTopUp: 'e1e2', ispsPick: 'e1e2'
};

var SITES = [
  { key: 'all',  title: 'Elmsall Live Productivity', short: 'Elmsall' },
  { key: 'e3',   title: 'E3 Live Productivity',      short: 'E3' },
  { key: 'e1e2', title: 'E1/E2 Live Productivity',   short: 'E1/E2' }
];

// siteFilterPreferred is what the user chose; siteFilter is what is actually
// in force. They differ while a bonus filter is active - see
// effectiveSiteFilter_ below - and only the preference is ever saved.
var siteFilterPreferred = 'all';
var siteFilter = 'all';

/**
 * The building actually in force.
 *
 * Filtering to a bonus number is a question about a PERSON, and a person is not
 * confined to one building: an operator can pick in Drive before lunch and pack
 * in E3 after it. Answering "how did they do" with only one building's half of
 * their shift is worse than not answering - so a bonus filter overrides the
 * building filter and shows the whole site. Clearing it hands the building
 * back.
 */
function effectiveSiteFilter_() {
  var filtering = (typeof selectedBonuses !== 'undefined') && selectedBonuses.length > 0;
  return filtering ? 'all' : siteFilterPreferred;
}

/** True when a bonus filter is currently overriding a chosen building. */
function siteFilterOverridden_() {
  return siteFilterPreferred !== 'all' && effectiveSiteFilter_() === 'all';
}

/**
 * Brings siteFilter into line with the preference and the bonus filter, and
 * re-scopes the payload if it moved. Called at the top of applyLocalFiltersPak,
 * which every path that touches the bonus selection already ends in - so the
 * eight places that add, remove, replace or clear a bonus need no changes.
 */
function syncSiteScope_() {
  var want = effectiveSiteFilter_();
  if (want === siteFilter) return false;
  siteFilter = want;
  rawSideData = scopeRowsToSite_(allSideData);
  refreshBonusListForScope_();
  if (typeof syncSiteUi_ === 'function') syncSiteUi_();
  return true;
}

/**
 * The operator list, rebuilt from whatever is currently in scope.
 *
 * Derived rather than filtered in place, because the scope widens as well as
 * narrows: picking E3 and then filtering to someone flips the view back to the
 * whole site, and a list left narrowed to E3 would offer a smaller set of
 * people than the dashboard is showing.
 */
function refreshBonusListForScope_() {
  var present = {};
  for (var r = 0; r < rawSideData.length; r++) { present[rawSideData[r].bonus] = true; }
  allBonusList = Object.keys(present).sort();
}

// The unscoped payload. rawSideData holds the SCOPED view, so every existing
// reader of it - KPIs, charts, tables, export, breakdown - narrows to the
// chosen building without knowing the filter exists.
var allSideData = [];

// 'pieVol' and 'pieStd' both describe the area 'pie'.
function areaBaseKey_(key) {
  return String(key || '').replace(/(Vol|Std)$/, '');
}

// True for anything that is not a work area at all (Date Time, Productivity %,
// and so on), so a column list can be filtered without losing its scaffolding.
function areaInSite_(key) {
  var base = areaBaseKey_(key);
  if (!AREA_SITE.hasOwnProperty(base)) return true;
  return siteFilter === 'all' || AREA_SITE[base] === siteFilter;
}

function filterAreaList_(list) {
  if (siteFilter === 'all') return list;
  return list.filter(function (x) { return areaInSite_(x.key); });
}

// Rendering reads these; validation deliberately does NOT. A saved area group
// or hidden-area choice naming the other building stays valid and comes back
// intact when the filter is cleared, rather than being pruned on sight.
function volumeTypesActive_()      { return filterAreaList_(VOLUME_TYPES); }
function breakdownAreasActive_()   { return filterAreaList_(BREAKDOWN_AREAS); }
function mainMetricColumnsActive_(){ return filterAreaList_(MAIN_TABLE_METRIC_COLUMNS); }
function sortableColumnsActive_()  { return filterAreaList_(mainTableSortableColumns); }

/**
 * Joins work-area labels for a chart title, folding a shared suffix.
 *
 * "Drive - Online Picking, Way - Online Picking, E3 - Online Picking" says
 * "Online Picking" three times and pushes the useful part off the end of the
 * panel. Areas named "<where> - <what>" that share the same <what> collapse to
 * "Drive, Way & E3 - Online Picking".
 *
 * `sep` joins the pieces that remain: ", " by default, " & " where the
 * caller wants the two-item reading ("PiE & Top Up").
 *
 * Folding is per family and order-preserving, so a mixed group still reads
 * correctly: Drive, Way and Sorter 6 Packing gives
 * "Drive & Way - Online Picking, Sorter 6 Packing" rather than all-or-nothing.
 */
function joinAreaLabels_(labels, sep) {
  var order = [], bySuffix = {};
  for (var i = 0; i < labels.length; i++) {
    var label = String(labels[i]);
    var cut = label.indexOf(' - ');
    var suffix = cut === -1 ? null : label.slice(cut + 3);
    var prefix = cut === -1 ? label : label.slice(0, cut);
    // A label with no " - " is its own family, keyed on itself so two
    // different plain labels never merge.
    var key = suffix === null ? '\u0000' + label + i : suffix;
    if (!bySuffix[key]) { bySuffix[key] = { suffix: suffix, parts: [] }; order.push(key); }
    bySuffix[key].parts.push(prefix);
  }

  var out = [];
  for (var o = 0; o < order.length; o++) {
    var fam = bySuffix[order[o]];
    if (fam.suffix === null || fam.parts.length === 1) {
      out.push(fam.suffix === null ? fam.parts[0] : fam.parts[0] + ' - ' + fam.suffix);
      continue;
    }
    var head = fam.parts.slice(0, -1).join(', ');
    out.push(head + ' & ' + fam.parts[fam.parts.length - 1] + ' - ' + fam.suffix);
  }
  return out.join(sep || ', ');
}

function siteConfig_(key) {
  for (var i = 0; i < SITES.length; i++) { if (SITES[i].key === key) return SITES[i]; }
  return SITES[0];
}

/**
 * The payload, narrowed to the chosen building.
 *
 * `value` is the row's total standard hours across every area, and the whole
 * dashboard is built on it - KPIs, the productivity ratio, the threshold test.
 * Rewriting it to the chosen building's hours is what turns this from "hide
 * some charts" into an actual E3 or E1/E2 dashboard, and it means none of
 * those consumers need to know about the filter.
 *
 * A row with no hours AND no volume in this building is dropped rather than
 * kept at zero, so head counts describe who worked in the building rather than
 * who was on site. An operator who worked in both is counted in both, which is
 * the honest answer when their hours genuinely split across two buildings.
 */
function scopeRowsToSite_(rows) {
  if (siteFilter === 'all') return rows.slice();

  var stdKeys = [], volKeys = [];
  for (var i = 0; i < VOLUME_TYPES.length; i++) {
    if (!areaInSite_(VOLUME_TYPES[i].key)) continue;
    stdKeys.push(VOLUME_TYPES[i].stdKey);
    volKeys.push(areaBaseKey_(VOLUME_TYPES[i].key));
  }

  var out = [];
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r], std = 0, vol = 0;
    for (var s = 0; s < stdKeys.length; s++) { std += Number(row[stdKeys[s]]) || 0; }
    for (var v = 0; v < volKeys.length; v++) { vol += Number(row[volKeys[v]]) || 0; }
    if (std <= 0 && vol <= 0) continue;

    var copy = {};
    for (var k in row) { if (row.hasOwnProperty(k)) copy[k] = row[k]; }
    copy.value = std;
    out.push(copy);
  }
  return out;
}

// Same order as VOLUME_TYPES, #mainTable's columns and the CSV export header.
// Parcel Induct used to sit after Parcel Sortation here and before it
// everywhere else, so the Volume page listed the two the opposite way round to
// the rest of the dashboard; Induct comes first in both now.
var MAIN_TABLE_METRIC_COLUMNS = [
  { key: 'pieVol', label: 'PiE' },
  { key: 'topUpVol', label: 'Top Up' },
  { key: 'e3PackingVol', label: 'E3 Packing' },
  { key: 'parcelInductVol', label: 'Parcel Induct' },
  { key: 'parcelSortationVol', label: 'Parcel Sortation' },
  { key: 'inboundDecantingVol', label: 'Inbound Decanting' },
  { key: 'osrDecantingVol', label: 'OSR Decanting' },
  { key: 'bcrInductingVol', label: 'BCR Inducting' },
  { key: 'e1e2InductingVol', label: 'E1/E2 Inducting' },
  { key: 'sorter6PackingVol', label: 'Sorter 6 Packing' },
  { key: 'onlinePickingDriveVol', label: 'Drive - Online Picking' },
  { key: 'onlinePickingWayVol', label: 'Way - Online Picking' },
  { key: 'onlinePickingE3Vol', label: 'E3 - Online Picking' },
  { key: 'e3BppVol', label: 'E3 BPP' },
  { key: 'e1e2BppVol', label: 'E1/E2 BPP' },
  { key: 'rspsTopUpVol', label: 'RSPS Top Up' },
  { key: 'rspsPickVol', label: 'RSPS Pick' },
  { key: 'ispsTopUpVol', label: 'ISPS Top Up' },
  { key: 'ispsPickVol', label: 'ISPS Pick' }
];

// Mirrors the #mainTable <th data-key> list, used to populate the mobile sort <select>.
var mainTableSortableColumns = [
  { key: 'dateTime', label: 'Date Time' },
  { key: 'bonusNumber', label: 'Unique Bonus Number' },
  { key: 'hourDeployed', label: 'Est. Hours Deployed' },
  { key: 'stdHours', label: 'Standard Hours' },
  { key: 'pieVol', label: 'PiE' },
  { key: 'topUpVol', label: 'Top Up' },
  { key: 'e3PackingVol', label: 'E3 Packing' },
  { key: 'parcelInductVol', label: 'Parcel Induct' },
  { key: 'parcelSortationVol', label: 'Parcel Sortation' },
  { key: 'inboundDecantingVol', label: 'Inbound Decanting' },
  { key: 'osrDecantingVol', label: 'OSR Decanting' },
  { key: 'bcrInductingVol', label: 'BCR Inducting' },
  { key: 'e1e2InductingVol', label: 'E1/E2 Inducting' },
  { key: 'sorter6PackingVol', label: 'Sorter 6 Packing' },
  { key: 'onlinePickingDriveVol', label: 'Drive - Online Picking' },
  { key: 'onlinePickingWayVol', label: 'Way - Online Picking' },
  { key: 'onlinePickingE3Vol', label: 'E3 - Online Picking' },
  { key: 'e3BppVol', label: 'E3 BPP' },
  { key: 'e1e2BppVol', label: 'E1/E2 BPP' },
  { key: 'rspsTopUpVol', label: 'RSPS Top Up' },
  { key: 'rspsPickVol', label: 'RSPS Pick' },
  { key: 'ispsTopUpVol', label: 'ISPS Top Up' },
  { key: 'ispsPickVol', label: 'ISPS Pick' },
  { key: 'performance', label: 'Productivity %' }
];

// Caches the last-known table/card mode so the resize handler only re-renders on an actual flip.
var lastMainTableCardMode = null;

// Colours for user-composed area GROUPS. A group is any set of areas someone
// chose to combine, so it has no family - it just takes the next of the eight
// hues in their fixed order, which is the case those hues were selected and
// checked for.
var AREA_GROUP_COLORS = AREA_FAMILIES.map(function(f) { return f.color; });
var AREA_GROUP_COLORS_DARK = AREA_FAMILIES.map(function(f) { return f.colorDark; });

/** The nth group's colour in the current theme, wrapping past the eighth. */
function groupColor_(i) {
  var list = (currentTheme === 'dark') ? AREA_GROUP_COLORS_DARK : AREA_GROUP_COLORS;
  return list[((i % list.length) + list.length) % list.length];
}
// The Overall page leads on two picking areas and contrasts them with a packing
// area. Which ones depends on the building: PiE and Top Up do not exist in
// E1/E2, so an E1/E2 view built on them is three flat lines at zero.
var SITE_HEADLINE = {
  all:  { pick: ['pieVol', 'topUpVol'], pack: ['e3PackingVol'] },
  e3:   { pick: ['pieVol', 'topUpVol'], pack: ['e3PackingVol'] },
  e1e2: { pick: ['onlinePickingDriveVol', 'onlinePickingWayVol'], pack: ['sorter6PackingVol'] }
};

function siteHeadline_() {
  return SITE_HEADLINE[siteFilter] || SITE_HEADLINE.all;
}

/** VOLUME_TYPES entries for this building's headline picking areas. */
function headlinePickTypes_() {
  var want = siteHeadline_().pick, out = [];
  for (var i = 0; i < VOLUME_TYPES.length; i++) {
    if (want.indexOf(VOLUME_TYPES[i].key) !== -1) out.push(VOLUME_TYPES[i]);
  }
  return out;
}

/** The default work-area groups for the building in view. */
function defaultAreaGroupsForSite_() {
  var h = siteHeadline_();
  return [h.pick.slice(), h.pack.slice()];
}

var DEFAULT_AREA_GROUPS = [['pieVol', 'topUpVol'], ['e3PackingVol']];
var MAX_AREA_GROUPS = 7;

function defaultAreaGroupState_() {
  return defaultAreaGroupsForSite_().map(function(g) {
    return { keys: g.slice(), showLine: true, showTrend: true };
  });
}

var areaGroupState = defaultAreaGroupState_();

// One chart by default, carrying every group. The dialog still OFFERS a second,
// empty chart as an affordance (see openAreaGroups) — but an empty chart is
// dropped on Apply, so the default that actually renders stays a single chart.
function defaultAreaGroupSplitState_() {
  return { enabled: false, charts: [] };
}

// The Bonus page's breakdown bars, over the same nineteen areas as
// VOLUME_TYPES - so they are DERIVED from it rather than restated. The hand
// written copy that used to live here had to be edited in lockstep every time
// an area was added or a colour changed, which is the same second-source-of-
// truth that has caused trouble elsewhere in this pipeline.
//
// The keys differ by one suffix and that is the only reason this list exists:
// breakdown reads the raw side data, whose volume field is the bare area name
// ('pie'), while VOLUME_TYPES is keyed for the shaped rows ('pieVol').
var BREAKDOWN_AREAS = VOLUME_TYPES.map(function(t) {
  return { key: areaBaseKey_(t.key), label: t.label, family: t.family,
           color: t.color, colorDark: t.colorDark };
});

// APP_CONFIG.colors is the CHART palette — saturated colours chosen to read as
// distinct series against a plot background. It used to be pushed into
// --color-good/warn/bad as inline styles on <html>, which beat both the :root
// and the .dark-theme token blocks and so applied one palette to both themes.
//
// That is why warn text was unreadable in light mode: #ffcc66 is a mid-yellow
// picked to glow on a dark plot, and on white it has a contrast ratio of about
// 1.5:1. The stylesheet already carries proper per-theme values (#cc4b00 light,
// #ff9d5c dark) which had simply never been allowed to take effect.
//
// The charts are unaffected — they read APP_CONFIG.colors directly rather than
// through CSS, so the two palettes can now differ, which is the point: a
// colour that works as a bar fill is not automatically a colour that works as
// 11px text.
// Every alpha of the accent used anywhere in the stylesheet. Derived here
// rather than written out per theme so a tint cannot drift from the accent it
// is a tint of — which is exactly what had happened: --accent was being set to
// APP_CONFIG's blue at runtime while --accent-10/14/15/22 stayed the authored
// teal, so accent borders and accent fills were two different colours.
var ACCENT_ALPHAS = [4, 7, 8, 10, 14, 15, 18, 20, 22, 25, 28, 30, 35, 40, 45, 55, 65, 75, 95];

function applyConfigToCSSPak() {
  var root = document.documentElement;
  var accent = APP_CONFIG.colors.accent;
  root.style.setProperty('--accent', accent);
  for (var i = 0; i < ACCENT_ALPHAS.length; i++) {
    var a = ACCENT_ALPHAS[i];
    root.style.setProperty('--accent-' + a, hexToRgbaPak(accent, a / 100));
  }
}

var timeRanges = [];
var rawSideData = [];
var allBonusList = [];
// Bonus number -> { tm, email }, from the 'TM List' tab. Keyed on the
// upper-cased code, matching how bonus numbers are canonicalised everywhere
// else; see readTmDirectory_ in Code.js.
var tmDirectory = {};
var selectedBonuses = [];
var currentThreshold = 0;
var currentMainRows = [];
// Bonus number -> how many work areas they registered volume in, for the set of
// rows the table being drawn is showing. Rebuilt per render by whoever is about
// to draw; see bonusAreaCountMapPak. Two of them because the Bonus page and an
// expanded Data Table row cover different periods and must not share an answer.
var currentBonusAreaCount = {};
var currentDetailAreaCount = {};
// Filtering by more than one bonus number at a time. Off by default: a pick
// replaces the filter and jumps to the top of Overall. Lifted from the "?"
// dialog, and persisted with the rest of the preferences.
var allowMultiBonusFilter = false;
var overviewVolChart = null;
var trendCharts = [];
var trendSplitState = { enabled: false, charts: [] };
var MAX_TREND_CHARTS = 7;
var TREND_CHART_LABELS = ['Chart A', 'Chart B', 'Chart C', 'Chart D', 'Chart E', 'Chart F', 'Chart G'];
var perfChart = null;
var volumeCharts = [];
var sortState = { key: 'dateTime', dir: 'asc' };
// Sort for the per-entry detail table shown when a Data Table row is expanded.
// key === null means the default: chronological, then by bonus.
var detailSortState = { key: null, dir: 'asc' };
var expandedRowKey = null;
var currentArchiveUrl = null;
var lastRefreshTimestamp = null;
