<script>
function csvEscapePak(value) {
  var s = value === null || value === undefined ? '' : String(value);
  if (/[",\r\n]/.test(s)) {
    s = '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// Header and row are one list, so a column cannot appear in the header without
// a value under it. The area columns come from the same active list the table
// uses, so the export narrows with the building filter and a new work area
// needs no edit here at all - which the two hand-maintained lists this replaces
// did, every time, in step with each other.
function rawDataCsvColumns_() {
  var cols = [
    { label: 'Time Block',          get: function (r) { return r.timeRange; } },
    { label: 'Bonus Number',        get: function (r) { return r.bonus; } },
    { label: 'Est. Hours Deployed', get: function (r) { return (Number(r.hourDeployed) || 0).toFixed(2); } },
    { label: 'Standard Hours',      get: function (r) { return (Number(r.stdHours) || 0).toFixed(2); } }
  ];
  mainMetricColumnsActive_().forEach(function (m) {
    cols.push({ label: m.label, get: function (r) { return Math.round(Number(r[m.key]) || 0); } });
  });
  cols.push({ label: 'Productivity %', get: function (r) { return (Number(r.performance) || 0).toFixed(1); } });
  return cols;
}

function entryRowToCsvLinePak_(r, cols) {
  cols = cols || rawDataCsvColumns_();
  return cols.map(function (c) { return c.get(r); }).map(csvEscapePak).join(',');
}

function buildRawDataCsvPak_(entryRows) {
  var cols = rawDataCsvColumns_();
  var lines = [cols.map(function (c) { return c.label; }).map(csvEscapePak).join(',')];
  for (var i = 0; i < entryRows.length; i++) {
    lines.push(entryRowToCsvLinePak_(entryRows[i], cols));
  }
  return lines.join('\r\n');
}

function buildExportTimestampPak_() {
  var d = new Date();
  var pad = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    '_' + pad(d.getHours()) + pad(d.getMinutes());
}

function downloadRawDataCsvPak() {
  if (!rawSideData || rawSideData.length === 0) {
    // A toast rather than #status: that element also carries the row count and
    // the load state, so a message written there is overwritten by the next
    // render — often before it has been read.
    showToastPak('There is no data loaded to export yet.',
      { kind: 'warn', icon: 'fa-triangle-exclamation' });
    return;
  }

  var entryRows = buildIndividualEntryRows_(rawSideData).sort(compareEntryRowsPak);
  var csv = buildRawDataCsvPak_(entryRows);
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);

  var link = document.createElement('a');
  link.href = url;
  link.download = 'e3-raw-data_' + buildExportTimestampPak_() + '.csv';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

  // Browsers drop a download into the shelf or the downloads folder with no
  // in-page sign it happened, and the row count says how much was exported —
  // useful confirmation that the full dataset came out, not just the filtered
  // view the user is looking at.
  showToastPak('Exported ' + entryRows.length.toLocaleString() + ' rows to CSV.',
    { icon: 'fa-file-csv' });
}
</script>
