  font-size: 14px;
  line-height: 1;
}

.input,
.btn,
.row-select {
  border: 1px solid var(--border);
  background: var(--w5);
  color: var(--text);
  border-radius: 10px;
  padding: 6px 10px;
  outline: none;
  transition: all 0.2s;
  font-size: 13px;
}

.input:focus {
  border-color: var(--accent);
  background: var(--w8);
}

.btn {
  cursor: pointer;
  font-weight: 600;
}

.btn:hover {
  transform: translateY(-1px);
  background: var(--w10);
}

.btn:active {
  transform: translateY(0);
}

.icon-btn {
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.note-text {
  color: var(--color-bad);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.3;
}

.swipe-container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  position: relative;
  width: 100%;
  touch-action: pan-y pinch-zoom;
}

.swipe-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
  min-height: 0;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  /* Doubled from 10px. This is the only gap between the panels and the two
     pieces of chrome they sit against — the black header above and the rail to
     the left — and at 10px the cards read as crammed against both rather than
     sitting inside a page. The mobile override below is deliberately left
     alone: horizontal room is the scarce thing on a phone, and spending it on
     margin would cost chart width. */
  padding: 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.page::-webkit-scrollbar {
  width: 6px;
}

.page::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

/* ── Scrollbars everywhere else ──────────────────────────────────────────────
   Only .page was themed, so every other scrolling area — the tables, the modal
   bodies, the search suggestions — fell back to the browser's default bar. In
   dark mode that meant a chunky light-grey scrollbar sitting inside a dark
   panel, which is the single most obvious place the reskin stopped short. */
.table-wrap,
.breakdown-body,
.search-dropdown,
.main-detail-table-wrap,
.tour-menu-list {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.table-wrap::-webkit-scrollbar,
.breakdown-body::-webkit-scrollbar,
.search-dropdown::-webkit-scrollbar,
.main-detail-table-wrap::-webkit-scrollbar,
.tour-menu-list::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.table-wrap::-webkit-scrollbar-thumb,
.breakdown-body::-webkit-scrollbar-thumb,
.search-dropdown::-webkit-scrollbar-thumb,
.main-detail-table-wrap::-webkit-scrollbar-thumb,
.tour-menu-list::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

.table-wrap::-webkit-scrollbar-track,
.breakdown-body::-webkit-scrollbar-track,
.search-dropdown::-webkit-scrollbar-track,
.main-detail-table-wrap::-webkit-scrollbar-track,
.tour-menu-list::-webkit-scrollbar-track {
  background: transparent;
}

/* ── "There is more to the right" ────────────────────────────────────────────
   The Data Table is far wider than the panel holding it, but with overlay
   scrollbars (the default on macOS, and on Windows while not scrolling) there
   was nothing on screen to say so — the columns simply appeared to end.

   An INSET shadow is used rather than a positioned overlay because it paints
   against the scroll container's padding box and therefore stays put while the
   content moves under it. Right edge only: the left edge is already marked by
   the frozen columns' divider, and those cells are opaque so they would cover
   an inset shadow anyway. */
.table-wrap.has-scroll-x:not(.at-scroll-end) {
  box-shadow: inset -16px 0 16px -16px var(--scroll-shadow);
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: none;
}

.kpi {
  padding: 14px;
  grid-column: span 3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.kpi-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.kpi .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.kpi .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
}

.kpi .sub {
  margin-top: auto;
  padding-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.kpi-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 4px;
}

.kpi-tooltip {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--w8);
  color: var(--muted);
  font-size: 9px;
  cursor: help;
  flex-shrink: 0;
}

.kpi-tooltip:hover {
  background: var(--accent-20);
  color: var(--accent);
}

.kpi-tooltip-content {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  padding: 12px;
  background: var(--surface-dropdown);
  border: 1px solid var(--w15);
  border-radius: 12px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  z-index: 2000;
  font-size: 11px;
  line-height: 1.4;
  text-align: left;
  pointer-events: none;
}

.kpi-tooltip:hover .kpi-tooltip-content,
.kpi-tooltip.open .kpi-tooltip-content {
  display: block;
}

.tt-title {
  font-weight: 700;
  color: var(--text);
  font-size: 11px;
  margin-bottom: 4px;
}

.kpi-tooltip-content ul {
  margin: 4px 0 0;
  padding-left: 15px;
  color: var(--muted);
  list-style: none;
}

.kpi-tooltip-content ul li::before {
  content: '\2022';
  position: absolute;
  left: 5px;
  color: var(--accent);
}

.kpi-tooltip-content ul li {
  position: relative;
  padding-left: 10px;
}

.panel {
  padding: 14px;
}

.span-12 {
  grid-column: span 12;
}

.table-wrap {
  overflow-x: auto;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  max-width: 100%;
  min-height: 0;
}

/* The bonus-number tooltip is absolutely positioned inside these tables, and an
   overflow container clips it — which is exactly why it appeared on the header
   banner's filter chips, which sit in no wrapper, and nowhere else.
   overflow-y: auto is enough on its own: the moment either axis is not
   `visible`, the other is forced to clip too.

   Neither table can overflow any more. .side-table is width: 100%, and
   #mainTable became table-layout: fixed at width: 100% when its columns were
   made proportional — so scrolling is not what these containers were still
   doing for us. Clipping the tooltip was. */
.bonus-two-tables .table-wrap,
#mainTableWrapper .table-wrap {
  overflow: visible;
}

/* Losing `overflow` above also lost what was rounding the table's corners. The
   wrapper's border still curves, but a header cell's background is a plain
   rectangle and now paints straight over that curve and out through it. Only
   clipping was ever hiding that, so the corner cells have to carry the radius
   themselves. 11px, not 12: the wrapper's 1px border sits outside its own
   radius, so matching it exactly leaves a hairline of background showing. */
.bonus-two-tables .table-wrap thead tr:first-child th:first-child,
#mainTableWrapper .table-wrap thead tr:first-child th:first-child {
  border-top-left-radius: 11px;
}

.bonus-two-tables .table-wrap thead tr:first-child th:last-child,
#mainTableWrapper .table-wrap thead tr:first-child th:last-child {
  border-top-right-radius: 11px;
}

/* The bottom pair matters as soon as a row is striped, hovered or expanded —
   the same square background against the same curve. */
.bonus-two-tables .table-wrap tbody tr:last-child td:first-child,
#mainTableWrapper .table-wrap tbody tr:last-child td:first-child {
  border-bottom-left-radius: 11px;
}

.bonus-two-tables .table-wrap tbody tr:last-child td:last-child,
#mainTableWrapper .table-wrap tbody tr:last-child td:last-child {
  border-bottom-right-radius: 11px;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 0;
}

#mainTable {
  min-width: 0;
}

.side-table {
  min-width: 100%;
  width: 100%;
}

/* ── Productivity bars on the Bonus tables ───────────────────────────────────
   These tables answer "who is at the top and who is at the bottom", which a
   column of percentages turns into a reading exercise. The bar makes the shape
   of the ranking visible at a glance — whether the top ten are bunched together
   or one person is far ahead, and how steep the drop-off is.

   Drawn as a background layer behind the existing pill rather than replacing
   it: the exact figure is still the thing being read, the bar just gives it
   somewhere to sit. */
.side-table .perf-cell {
  position: relative;
  /* The bar grows from the left, so the figure is parked on the right where it
     has a fixed edge to be read against. Left-aligned, it sat on top of the
     start of its own bar and moved around as the bar changed length. */
  text-align: right;
}

/* Over its own bar the pill's grey lozenge is doubled-up chrome — the bar is
   already carrying the shape. Dropping it leaves the figure sitting cleanly on
   the tint. */
.side-table .perf-cell .pill {
  background: transparent;
  min-width: 0;
  padding: 4px 0;
}

.perf-bar {
  position: absolute;
  left: 0;
  top: 3px;
  bottom: 3px;
  border-radius: 0 3px 3px 0;
  /* Behind the pill, and out of the way of clicks on the row. */
  z-index: 0;
  pointer-events: none;
}

.perf-cell .pill {
  position: relative;
  z-index: 1;
}

.perf-bar.good { background: var(--perf-bar-good); }
.perf-bar.warn { background: var(--perf-bar-warn); }
.perf-bar.bad  { background: var(--perf-bar-bad); }

/* Standard Hours is a quantity, so it gets the same right alignment as the
   Data Table's numeric columns — the two tables sit on the same screen and
   should not disagree about how a number is presented. */
.side-table td.num {
  text-align: right;
  padding-right: 14px;
}

.side-table th:nth-child(2) {
  text-align: right;
  padding-right: 14px;
}

th,
td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--w8);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  /* Poppins' default figures are proportional, so a 1 is narrower than a 7 and
     nothing lines up vertically down a column of numbers. Tabular figures are
     the whole reason a column of data reads as a column. */
  font-variant-numeric: tabular-nums;
}

/* A cell holding a bonus number must not clip. The tooltip is absolutely
   positioned and hangs BELOW its cell, so `overflow: hidden` above cuts off all
   of it — the element is in the DOM, correctly built, and invisible.
   .table-wrap was doing the same thing one level up; both had to go, which is
   why fixing only the wrapper changed nothing.
   :has() covers any future placement; the two explicit selectors are the ones
   that actually matter today and work regardless of :has() support. */
.side-table td:first-child,
.main-detail-table td:nth-child(2),
td:has(> .clickable-bonus) {
  overflow: visible;
  text-overflow: clip;
}

/* ── Numeric cells ───────────────────────────────────────────────────────────
   #mainTable centred every cell, which puts 1,234 and 12 at different offsets;
   the eye then has to read each number rather than run down the column. Right
   alignment is what makes the digits stack — units over units, tens over tens.
   Columns 1-2 (Date Time, Bonus Number) are labels, not quantities, and the
   last column is a centred pill, so both keep their existing alignment. */
/* The Main Table is centred throughout, by request. Right alignment stacks
   digits - units over units - which is easier to scan down a column, and that
   is why it was set that way; centring is the trade for a table whose columns
   are now narrow enough that a right-aligned number sat oddly far from its
   header. The expanded detail table keeps right alignment. */
.main-detail-table td.num {
  text-align: right;
  padding-right: 16px;
}

/* Every numeric header: column 3 to the last-but-one, the last being the
   Productivity % pill. Written as "from 3, but not the last" rather than an
   explicit 3-13, which stopped covering the newer areas the moment any were
   added.

   CURRENTLY INERT, and so is `.main-detail-table td.num` above it. The detail
   table is rendered INSIDE a cell of #mainTable, so `#mainTable th, #mainTable
   td` reaches it too — and an id beats any number of classes, whatever the
   order. The whole detail table is therefore centred along with the Main
   Table, not right-aligned as the comment above claims. Left as-is rather than
   quietly changed: it is a deliberate-looking alignment nobody has complained
   about. To make it bite, scope this and the .num rule under #mainTable. */
.main-detail-table th:nth-child(n+3):not(:last-child) {
  text-align: right;
  padding-right: 16px;
}

/* Most of the columns are volumes, and for any given operator all
   but one or two are 0. At full contrast those zeros carry the same visual
   weight as the figures that matter, so the table reads as a wall. Fading them
   leaves the real numbers standing out on their own.

   A missing value is NOT faded: it renders as "-", means something different,
   and should stay legible. */
#mainTable td.num.zero,
.main-detail-table td.num.zero,
.main-card-metric-value.zero {
  color: var(--text-soft-40);
}

#mainTable th,
#mainTable td,
#mainTable td.num {
  text-align: center;
  padding-left: 6px;
  padding-right: 6px;
}

th {
  position: sticky;
  top: 0;
  background: var(--surface-dropdown-2);
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  /* 500, not the browser's default bold for <th>. The template sets its table
     heads to medium (MuiTableCell.head), and at this size uppercase already
     carries the emphasis - bold on top of it reads as shouting and competes
     with the figures underneath. Size stays 11px rather than the template's
     12px: the main table now shows up to 29 columns, and a point of header
     size there costs a wrapped line. */
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}

tr:hover td {
  background: var(--w3);
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: var(--w6);
  min-width: 50px;
}

.good {
  color: var(--color-good);
}

.warn {
  color: var(--color-warn);
}

.bad {
  color: var(--color-bad);
}


.volume-charts {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
  min-height: 0;
}

.volume-charts.combined-mode {
  grid-template-columns: 1fr;
}

.volume-charts.combined-mode .vol-chart-panel:not(.vol-primary-panel) {
  display: none;
}

/* Last VISIBLE volume panel when the visible count is odd. Driven by JS
   (renderVolumeChartsPak) rather than a pure :nth-child rule, since hiding
   panels via the area-toggle chips makes DOM position != visible position. */
.volume-charts:not(.combined-mode) > .vol-chart-panel.vol-span-full {
  grid-column: 1 / -1;
  width: calc((100% - 14px) / 2);
  margin: 0 auto;
}

.volume-controls {
  grid-column: 1 / -1;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* Sit the chips ~10px under the controls row (matching the Bonus page), rather
   than the volume grid's full 14px row-gap plus the controls' bottom padding. */
.volume-charts > #volumeAreaToggles.bonus-area-toggles {
  grid-column: 1 / -1;
  margin-top: -4px;
}

.volume-controls label {
  color: var(--muted);
  font-size: 12px;
  margin-right: 8px;
}

.vol-control-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Chart.js sizes itself from the canvas's PARENT. Every canvas is wrapped in a
   .chart-box (see ensureChartBoxesPak_) so that parent is a plain box of
   exactly the intended height - not the panel, which also holds the title and
   was making Chart.js compute a size tens of pixels off what the canvas is
   actually displayed at. That mismatch is what made legend clicks miss. */
.chart-box {
  position: relative;
  width: 100%;
  min-height: 0;
}

.chart-box > canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

.volume-charts .chart-box {
  height: 280px;
}

.volume-charts.combined-mode .chart-box {
  height: 500px;
}

.chartjs-legend {
  cursor: default !important;
  user-select: none;
}

.chartjs-legend ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.chartjs-legend li {
  cursor: pointer !important;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background 0.2s ease, opacity 0.2s ease;
}

.chartjs-legend li:hover {
  background: var(--w8);
}

.chartjs-legend li.hidden {
  opacity: 0.4;
}

.chartjs-legend li span {
  pointer-events: none;
}

canvas {
  width: 100% !important;
  height: 400px !important;
}

.chart-box {
  height: 400px;
}

.mini-table-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.mini-table-title h2 {
  flex: 1;
  text-align: left;
  margin: 0;
  font-size: 16px;
}

.tag {
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--muted);
  background: var(--w5);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.row-select {
  padding: 3px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--control-bg);
  color: var(--text);
  font-size: 11px;
  outline: none;
  cursor: pointer;
  transition: border 0.2s;
  padding-right: 15px;
}

.row-select:hover {
  border-color: var(--accent);
}

.two-panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
  min-height: 0;
}

.side-table th,
.side-table td {
  text-align: center;
}

.side-table th:nth-child(1),
.side-table td:nth-child(1) {
  width: 50%;
}

.side-table th:nth-child(2),
.side-table td:nth-child(2) {
  width: 25%;
}

.side-table th:nth-child(3),
.side-table td:nth-child(3) {
  width: 25%;
}

.clickable-bonus {
  position: relative;
  cursor: pointer;
  color: var(--text);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px;
  border-radius: 4px;
  border: 1px solid transparent;
}

.clickable-bonus:hover {
  color: var(--text);
  background: var(--accent-10);
}

/* The number itself has to rise with its card. It is positioned but has no
   z-index of its own, so it paints in DOM order against everything else that
   is positioned — and a card is only ever above what its host is above. */
.clickable-bonus:hover,
.clickable-bonus.tip-open {
  z-index: 2500;
}

.clickable-bonus .filter-icon {
  font-size: 9px;
  opacity: 0;
  transition: opacity 0.2s;
}

.clickable-bonus:hover .filter-icon {
  opacity: 0.6;
}

.clickable-bonus.active {
  color: var(--text);
  font-weight: 600;
  background: var(--accent-14);
  border-color: var(--accent);
}

.clickable-bonus.active .filter-icon {
  opacity: 1;
  color: var(--accent);
}

/* Marks a bonus number that registered volume in more than one work area over
   the period on screen. Same idea as the marker on the breakdown chips, now
   carried onto the Bonus page tables and the Data Table's expanded rows.
   Deliberately quiet: it is a footnote on the name, not a status. .clickable-bonus
   is a flex row with its own gap, so no margin is needed here. */
.multi-area-icon {
  font-size: 8px;
  opacity: 0.45;
  flex-shrink: 0;
}

.clickable-bonus:hover .multi-area-icon,
.clickable-bonus.active .multi-area-icon {
  opacity: 0.8;
}

.bonus-tip {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 10px;
  background: var(--surface-dropdown);
  border: 1px solid var(--w15);
  border-radius: 6px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  font-size: 11px;
  font-weight: 400;
  line-height: 1.45;
  text-align: left;
  /* Each line is its own block, so nowrap keeps a name or an address on one
     line rather than the whole card on one line. */
  white-space: nowrap;
  /* Above the panels and toolbars the card overhangs — 500 still lost to the
     search dropdown and the group panel (both 2000), so a card opening near
     one had its left-hand side painted over by that panel's surface. Kept
     below the overlays (10000+) so a modal still covers it. */
  z-index: 2500;
  /* The card holds controls now, so the pointer has to be able to reach it.
     It is only in the layout while it is shown, so nothing beneath it is
     blocked the rest of the time. */
  pointer-events: auto;
}

/* A transparent bridge across the 6px gap between the number and its card.
   Without it, moving the mouse down towards a copy button leaves the number,
   the :hover rule stops matching, and the card disappears mid-reach. */
.bonus-tip::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 100%;
  height: 8px;
}

.bonus-tip-line {
  display: block;
  color: var(--text);
}

.bonus-tip-line b {
  color: var(--muted);
  font-weight: 600;
  margin-right: 4px;
}

/* A detail line with a copy button on the end: label, value, button, with the
   value taking whatever is left so the buttons line up under each other. */
.bonus-tip-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.bonus-tip-row b {
  /* The flex gap already spaces the label. */
  margin-right: 0;
  /* "1st Line Manager:" is long enough that flex would otherwise shrink it and
     wrap it mid-phrase before touching the value beside it. */
  flex: 0 0 auto;
  white-space: nowrap;
}

.bonus-tip-val {
  flex: 1 1 auto;
  min-width: 0;
}

.bonus-tip-copy {
  flex: 0 0 auto;
  margin-left: auto;
  padding: 3px 6px;
  background: transparent;
  border: 1px solid var(--w15);
  border-radius: 4px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}

.bonus-tip-copy:hover {
  color: var(--text);
  background: var(--w10);
  border-color: var(--w25);
}

.bonus-tip-copy.copied {
  color: var(--color-good);
  border-color: var(--color-good);
}

.bonus-tip-copy.copy-failed {
  color: var(--color-bad);
  border-color: var(--color-bad);
}

/* The click hint was the whole tooltip before the manager was added to it. It
   is still worth saying, but it is no longer the reason anyone hovers, so it
   drops below the details and quietens down. */
.bonus-tip-hint {
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px solid var(--w8);
  color: var(--muted);
  font-size: 10px;
}

.bonus-tip-hint i {
  margin-right: 4px;
  font-size: 9px;
}

.bonus-tip::before {
  content: '';
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-bottom-color: var(--surface-dropdown);
}

/* Display is driven by JS (initBonusTipHover_ / openBonusTipPak_) adding
   .tip-open, not by :hover directly — a plain :hover rule showed the card in
   place, unclamped, and let .swipe-container's edge-clipping (needed for the
   paging swipe) cut off a card centred near a page's left edge. */
.clickable-bonus.tip-open .bonus-tip {
  display: block;
}

/* An opened card is moved out to <body> (see openBonusTipPak_), so it is no
   longer a descendant of the number and the rules above no longer reach it. */
.bonus-tip.tip-floating {
  display: block;
}

/* Re-anchored to the viewport by openBonusTipPak_, which may have put it above
   the number or nudged it sideways to stay on screen — so the arrow no longer
   points anywhere true, and the hover bridge has no gap to bridge. */
.bonus-tip.tip-floating::before,
.bonus-tip.tip-floating::after {
  display: none;
}

/* Touchscreens have no hover, so the card is opened by a tap instead (see
   initBonusTipTaps_). Two things change once it is opened that way: it has to
   stay inside a narrow screen, so an email address wraps rather than running
   off the edge, and it is dismissed by a tap rather than by moving away, so it
   is worth making it read as something deliberately open. */
@media (hover: none) {
  .bonus-tip {
    white-space: normal;
    /* NOT `anywhere`. The two look identical once a width is settled, but
       `anywhere` also lets a word count as one character wide when the browser
       works out how narrow the box may be — and this box is sized to its
       contents, so it took that offer and rendered a name one letter per line.
       `break-word` breaks long words without shrinking the box to fit them. */
    overflow-wrap: break-word;
    min-width: 180px;
    max-width: 60vw;
  }

  .clickable-bonus.tip-open {
    background: var(--accent-14);
    border-color: var(--accent);
  }

  /* A 10px icon is not a finger-sized target. */
  .bonus-tip-copy {
    padding: 7px 9px;
    font-size: 12px;
  }
}

.side-table th {
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

/* Hovering a sortable header turned its text white on a light tint — the same
   dark-theme leftover fixed elsewhere, and the last one in the file. */
.side-table th:hover {
  color: var(--text);
  background: var(--w10);
}

.side-table th.active-sort {
  color: var(--text);
  font-weight: 700;
  background: var(--table-sort-bg);
  border-bottom: 2px solid var(--accent);
}

.side-table th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 5px;
  font-size: 10px;
  opacity: 0.8;
}

.side-table th.active-sort.asc::after {
  content: ' \25B2';
}

.side-table th.active-sort.desc::after {
  content: ' \25BC';
}

.side-table th.no-sort {
  cursor: default;
  user-select: none;
}

.side-table th.no-sort:hover {
  color: var(--muted);
  background: var(--surface-dropdown-2);
}

#mainTable th {
  cursor: pointer;
  transition: background 0.2s;
  user-select: none;
  position: relative;
  /* Headers wrap onto as many lines as they need. The columns are far narrower
     now that all of them share the viewport, and a clipped "Inbound Decant..."
     is worse than a two-line header - the header is read once to learn the
     table, then rarely again, so height costs less than meaning. */
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.25;
  /* Middle, not bottom: headers now wrap to one, two or three lines depending
     on the column, and aligning them to the bottom made a one-line header sit
     low against a three-line neighbour. Centring keeps the row reading as one
     band whatever each header's height turns out to be. */
  vertical-align: middle;
}

.main-detail-table th {
  vertical-align: middle;
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.25;
}

/* The time range is the one long value in the body: "30/07/2026 20:30 -
   30/07/2026 20:45" will not fit its share of a narrow window on one line, and
   ellipsis would hide which block the row is. It wraps instead. Every other
   cell keeps nowrap from the base `td` rule - a figure broken across two lines
   is unreadable. */
#mainTable > tbody > tr:not(.main-detail-row) > td:nth-child(1) {
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.3;
  /* The base td rule clips with an ellipsis. That has to be lifted here or the
     second line of a wrapped range is cut off. */
  overflow: visible;
  text-overflow: clip;
}

#mainTable th:hover {
  background: var(--w10);
}

/* The sorted column. `color: #fff` here was a leftover from the original dark
   theme: in light mode it put white text on a pale header, which is why the
   Date Time header — the default sort column, so permanently active — read as
   a different colour from every other header, and in practice as missing.
   It now uses the normal text colour, one step stronger than the --muted of an
   inactive header, with the accent underline and the arrow carrying the rest
   of the signal. */
#mainTable th.active-sort {
  color: var(--text);
  font-weight: 700;
  background: var(--table-sort-bg);
  border-bottom: 2px solid var(--accent);
}

/* Columns 1 and 2 are frozen, and the rule that paints them opaque outranks the
   one above (an id plus three elements and a pseudo-class beats an id, an
   element and a class). Without this the sorted-column tint would be dropped
   for exactly the column that is sorted by default. Pre-blended so the cell
   stays opaque and the scrolling columns cannot show through it. */
#mainTable > thead > tr > th:nth-child(1).active-sort,
#mainTable > thead > tr > th:nth-child(2).active-sort {
  background: var(--table-sort-bg-solid);
  color: var(--text);
}

#mainTable th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.8;
}

#mainTable th.active-sort.asc::after {
  content: ' \25B2';
}

#mainTable th.active-sort.desc::after {
  content: ' \25BC';
}

/* Expanded-row detail table: sortable sub-headers, matching #mainTable's
   affordance and indicators. */
.main-detail-table th.detail-sortable {
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, color 0.15s;
}
.main-detail-table th.detail-sortable:hover {
  background: var(--accent-14);
  color: var(--text);
}
.main-detail-table th.active-sort {
  color: var(--text);
  background: var(--accent-22);
  border-bottom: 2px solid var(--accent);
}
.main-detail-table th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.8;
}
.main-detail-table th.active-sort.asc::after { content: ' B2'; }
.main-detail-table th.active-sort.desc::after { content: ' BC'; }

/* ── Toasts ──────────────────────────────────────────────────────────────────
   Bottom-left, so it never collides with the back-to-top button on the right.
   z-index is above the overlays: a toast raised by an action taken inside a
   modal has to be readable without closing it first. */
.toast-host {
  position: fixed;
  left: 24px;
  bottom: 24px;
  z-index: 10050;
  display: flex;
  flex-direction: column;
  gap: 8px;
  /* The host spans no wider than its toast, and must not swallow clicks on the
     dashboard underneath; the toast itself takes them back. */
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(420px, calc(100vw - 48px));
  padding: 12px 12px 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-elevated);
  color: var(--text);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
  font-size: 13px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.in {
  opacity: 1;
  transform: none;
}

.toast > .fa-solid:first-child {
  color: var(--accent);
  font-size: 14px;
  flex-shrink: 0;
}

.toast-warn > .fa-solid:first-child {
  color: var(--color-bad);
}

.toast-text {
  flex: 1;
  line-height: 1.35;
}

/* Underlined and in the accent colour: an undo has seconds to be recognised as
   something to click, so it should not read as body text. */
.toast-action {
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 4px 6px;
  font: inherit;
  font-weight: 600;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
  border-radius: 6px;
}

.toast-action:hover {
  background: var(--w8);
}

/* The confirming action. Given a filled button rather than the underlined text
   the secondary actions use, so "Done" is obviously the way out and does not
   read as just another link in the sentence. */
.toast-action-primary {
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  padding: 6px 12px;
}

.toast-action-primary:hover {
  background: var(--accent);
  filter: brightness(1.1);
}

/* A persistent toast can carry two actions plus a close button, which is more
   than fits beside the text on a narrow phone — let it wrap onto its own line
   rather than squeezing the buttons to nothing. */
@media (max-width: 700px) {
  .toast {
    flex-wrap: wrap;
  }
  .toast-text {
    flex: 1 1 100%;
  }
  .toast-action {
    margin-left: auto;
  }
  .toast-action + .toast-action {
    margin-left: 0;
  }
}

.toast-close {
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 4px 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  border-radius: 6px;
}

.toast-close:hover {
  color: var(--text);
  background: var(--w8);
}

.toast-action:focus-visible,
.toast-close:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Full width at the bottom on a phone, where a floating card in the corner
   crowds the content and leaves the Undo an awkwardly small target. */
@media (max-width: 700px) {
  .toast-host {
    left: 12px;
    right: 12px;
    /* Stacked above the back-to-top button (30px up, 42px tall, plus a gap).
       On desktop the toast is left-anchored and narrow so the two never meet,
       but a full-width toast would sit directly under the button and hide its
       own Dismiss. */
    bottom: calc(84px + env(safe-area-inset-bottom));
  }
  .toast {
    max-width: none;
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .toast {
    transition: none;
  }
}

/* ── Collapsed header ───────────────────────────────────────────
   Six action buttons sit comfortably in a wide header and crowd out the
   header title in a narrow one. When they do, they collapse
   behind a single button and drop down as a labelled list.

   Driven by body.header-compact, which JS sets by MEASURING whether the title
   still fits — not by a fixed breakpoint. A breakpoint can only ever be right
   for one combination of font, zoom level and title length; the window sizes
   where the title was being clipped sat well above the old 700px line, so on a
   half-width laptop window the header read "E3 Live Producti…" with a full row
   of icons beside it. See updateHeaderFit_ in JsUi. */
.header-menu-btn {
  display: none;
}

body.header-compact .header-menu-btn {
  display: flex;
}

body.header-compact .next-header-actions {
  display: none;
  /* grid-area must be cleared as well as position set. On mobile the header is
     a grid and this is a grid item, so for an absolutely positioned grid item
     the named area becomes the containing block — `right: 8px` would resolve
     against the narrow actions cell rather than against the header. Harmless
     on desktop, where there is no grid to clear. */
  grid-area: auto;
  position: absolute;
  top: calc(100% + 4px);
  right: 8px;
  z-index: 4100;
  flex-direction: column;
  gap: 2px;
  min-width: 190px;
  padding: 6px;
  border-radius: 12px;
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
}

body.header-compact.header-menu-open .next-header-actions {
  display: flex;
}

/* Icon plus text, left-aligned — a column of unlabelled icons is a guessing
   game, and there is room for the words once they are stacked. */
body.header-compact .next-header-actions .header-icon-btn {
  width: 100%;
  height: 42px;
  justify-content: flex-start;
  gap: 12px;
  padding: 0 12px;
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
}

/* data-menu-label, NOT aria-label: the auto-refresh button rewrites its
   aria-label every second with the countdown, which would make this item
   jitter and change width once a second. */
body.header-compact .next-header-actions .header-icon-btn::after {
  content: attr(data-menu-label);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

body.header-compact .next-header-actions .header-icon-btn:hover,
body.header-compact .next-header-actions .header-icon-btn:focus-visible {
  background: var(--accent-10);
}

/* The rearrange button's active state still has to read as "on" in here,
   where it is a row rather than a round icon. */
body.header-compact .next-header-actions .header-icon-btn.active {
  background: var(--accent);
  color: #fff;
}

/* The "21 min ago" stamp is on demand. It is the least load-bearing thing in
   the row - the auto-refresh button already says when the next check is due,
   and the stale warning appears by itself if data really does go cold - but it
   was permanently occupying the space that pushed the title into an ellipsis.
   Hovering the meta line reveals it; on a touchscreen a tap does, via
   .show-age. cursor: help is the affordance, and the container also carries
   the same text as a title attribute so the information is reachable without
   discovering the hover at all. */
#lastUpdateText {
  display: none;
}

.next-header-meta {
  cursor: help;
}

.next-header-meta:hover #lastUpdateText,
.next-header-meta.show-age #lastUpdateText {
  display: inline;
}

@media (max-width: 700px) {
  /* The mobile header is a grid with named areas, and .next-header-left /
     -right are display:contents — so this button is itself a grid item. It
     takes over the "actions" cell that the button row used to occupy. */
  .header-menu-btn {
    grid-area: actions;
    justify-self: end;
  }

  /* No-JS safety net. body.header-compact is set on the first frame after
     DOMContentLoaded, but a phone must never render even one frame with six
     icons ploughing through the title, so the collapse is unconditional here.
     Specificity keeps this from fighting the rules above: the .header-compact
     selectors are more specific, and both agree on `display: none` anyway. */
  .header-menu-btn { display: flex; }
  .next-header-actions { display: none; }
}

/* ── Rearrange mode ──────────────────────────────────────────────────────────
   A bar pinned to the top of each movable panel, with the two move buttons.
   Deliberately buttons rather than drag: see the reasoning in JsReorder. */
.reorder-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px -4px 8px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--accent-10);
  border: 1px dashed var(--accent);
}

.reorder-pos {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.reorder-label {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reorder-btn {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.reorder-btn:hover:not([disabled]) {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* At an end of the list. Kept visible rather than hidden so the buttons do not
   move around under the user's finger as a panel travels up the page. */
.reorder-btn[disabled] {
  opacity: 0.3;
  cursor: default;
}

/* Marks out what is movable, so it is obvious the mode is on and which panels
   it applies to. */
body.reorder-mode #page1Charts > [data-reorder-key],
body.reorder-mode #volumeChartsContainer > [data-reorder-key],
body.reorder-mode #bonusTablesContainer > [data-reorder-key] {
  outline: 2px dashed var(--accent);
  outline-offset: 3px;
  border-radius: 12px;
}

/* .trend-charts-wrap is normally display:contents, so it has no box of its own
   and nothing to attach a bar to. In edit mode it becomes a real container
   spanning the grid, which also makes it read correctly as "this whole section
   moves as one unit". */
body.reorder-mode .trend-charts-wrap,
body.reorder-mode .area-group-charts-wrap {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}

body.reorder-mode .trend-charts-wrap > .reorder-bar,
body.reorder-mode .area-group-charts-wrap > .reorder-bar {
  grid-column: 1 / -1;
}

.header-icon-btn.active {
  background: var(--accent);
  color: #fff;
}

@media (max-width: 700px) {
  /* Full-size tap targets on a phone, where these are the whole interaction. */
  .reorder-btn {
    width: 40px;
    height: 40px;
    font-size: 15px;
  }
  body.reorder-mode .trend-charts-wrap,
  body.reorder-mode .area-group-charts-wrap {
    grid-template-columns: 1fr;
  }
}

/* ── Pull to refresh (mobile) ────────────────────────────────────────────────
   Sits below the toasts and above the page content. Fixed to the viewport
   rather than to .page, so it does not scroll away with the content being
   pulled, and so it stays out of the share image export. */
.ptr-indicator {
  position: fixed;
  top: 0;
  left: 50%;
  margin-left: -18px;
  z-index: 9000;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
  color: var(--muted);
  font-size: 13px;
  display: none;
  align-items: center;
  justify-content: center;
  /* Follows the finger, so no transition on transform — it would lag behind the
     gesture and feel broken. Only the colour change is animated. */
  transition: color 0.15s ease, border-color 0.15s ease;
  pointer-events: none;
}

.ptr-indicator.visible {
  display: flex;
}

/* Armed: releasing now will refresh. The arrow is flipped by the transform in
   ptrRender_, so this only has to carry the colour. */
.ptr-indicator.ready {
  color: var(--accent);
  border-color: var(--accent);
}

.ptr-indicator.spinning {
  color: var(--accent);
  border-color: var(--accent);
}

.ptr-indicator.spinning i {
  animation: ptrSpin 0.8s linear infinite;
}

@keyframes ptrSpin {
  to { transform: rotate(360deg); }
}

/* Belt and braces: the gesture is already gated on the same breakpoint in JS,
   but nothing should be able to put this on a desktop screen. */
@media (min-width: 701px) {
  .ptr-indicator {
    display: none !important;
  }
}

/* ── Back to top ─────────────────────────────────────────────────────────────
   The Data Table runs to 192 rows and the Volume page stacks nine charts, and
   every control that governs them sits at the very top. Getting back to change
   an Hours Range meant a long scroll (or, on a phone, a lot of flicks).

   Hidden with visibility rather than display so it can fade, and so it drops
   out of the tab order when it is not on screen. z-index sits well below the
   overlays (10001) — a floating button over a modal backdrop would be wrong. */
.back-to-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 900;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
}

body.page-scrolled-far .back-to-top {
  opacity: 1;
  visibility: visible;
  transform: none;
}

.back-to-top:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.back-to-top:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .back-to-top {
    transition: none;
  }
}

/* On a phone the bottom edge is contested: an iPhone's home indicator and the
   collapsing browser toolbars both live there, and a button at 16px sat inside
   the swipe-up gesture strip, so dismissing the app and pressing the button
   were the same movement.

   env(safe-area-inset-bottom) is included for correctness but is INERT as
   deployed: HtmlService serves this document inside an iframe, and the safe-area
   insets only ever resolve against the top-level document — so they read 0 here
   however notched the handset is. The literal 30px is what actually does the
   work; the env() term only starts contributing if this page is ever served
   outside the Apps Script frame. The same caveat applies to the existing
   .page and .tour-tooltip rules that use it. */
@media (max-width: 700px) {
  .back-to-top {
    right: 14px;
    bottom: calc(30px + env(safe-area-inset-bottom));
    width: 42px;
    height: 42px;
  }
}

/* Two numbered steps inside the Groups & Charts dialog. Numbered rather than
   just separated, because the second step is a list OF the first step's groups
   — the order between them is the point. */
.ag-step-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.ag-step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.ag-step-hint {
  margin: 0 0 12px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.ag-step-divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

.breakdown-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(10px);
  z-index: 10001;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.breakdown-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.breakdown-modal {
  background: linear-gradient(180deg, var(--surface-elevated), var(--surface-solid));
  border: 1px solid var(--w12);
  border-radius: 20px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--w4) inset;
  width: 90%;
  max-width: 1000px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.92) translateY(15px);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  overflow: hidden;
}

.breakdown-overlay.active .breakdown-modal {
  transform: scale(1) translateY(0);
}

/* Focus is now trapped inside an open dialog and Tab is a real way to move
   around it, so where focus sits has to be visible. :focus-visible keeps this
   off mouse clicks. The dialog container itself is only a focus target when it
   holds nothing focusable, and does not want a ring of its own. */
.breakdown-modal :focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.breakdown-modal:focus,
.breakdown-modal:focus-visible {
  outline: none;
}

.breakdown-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.breakdown-header h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.breakdown-subtitle {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.breakdown-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--w5);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  flex-shrink: 0;
}

.breakdown-close:hover {
  background: rgba(255, 122, 122, 0.15);
  color: var(--color-bad);
  border-color: rgba(255, 122, 122, 0.3);
}

.breakdown-body {
  padding: 20px 24px;
  overflow-y: auto;
  flex: 1;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.breakdown-body::-webkit-scrollbar {
  width: 5px;
}

.breakdown-body::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

.breakdown-summary {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--w6);
  flex-wrap: wrap;
}

.breakdown-summary-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
}

.breakdown-summary-label {
  font-size: 13px;
  color: var(--muted);
}

.breakdown-summary-sep {
  color: var(--w15);
  font-size: 14px;
  margin: 0 2px;
}

.breakdown-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.breakdown-row:last-child {
  margin-bottom: 0;
}

.breakdown-label {
  width: 150px;
  min-width: 150px;
  font-size: 13px;
  color: var(--text);
  text-align: right;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.breakdown-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.breakdown-bar-wrap {
  flex: 1;
  height: 30px;
  background: var(--w4);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

.breakdown-bar {
  height: 100%;
  border-radius: 8px;
  transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  min-width: 0;
}

.breakdown-count {
  width: 45px;
  min-width: 45px;
  font-size: 16px;
  font-weight: 700;
  text-align: left;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.breakdown-footer {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
  flex-shrink: 0;
  background: rgba(0, 0, 0, 0.15);
}

.breakdown-footer i {
  margin-top: 2px;
  flex-shrink: 0;
  color: var(--accent);
  font-size: 12px;
}

.breakdown-empty {
  text-align: center;
  padding: 30px 0;
  color: var(--muted);
  font-size: 14px;
}

.breakdown-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 7px;
  border: 1px solid var(--accent-25);
  background: var(--accent-8);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
  font-family: inherit;
}

.breakdown-btn:hover {
  background: var(--accent-18);
  border-color: var(--accent-45);
  transform: translateY(-1px);
}

.breakdown-btn:active {
  transform: translateY(0);
}

.breakdown-row.clickable-row {
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s ease;
  padding: 4px 0;
  margin: 0 -6px 0 -6px;
  padding-left: 6px;
  padding-right: 6px;
}

.breakdown-row.clickable-row:hover {
  background: var(--w4);
}

.breakdown-row.clickable-row:active {
  background: var(--w7);
}

.breakdown-chevron {
  font-size: 10px;
  margin-left: 6px;
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  opacity: 0.5;
  flex-shrink: 0;
}

.breakdown-row.clickable-row:hover .breakdown-chevron {
  opacity: 0.9;
}

.breakdown-row.clickable-row.expanded .breakdown-chevron {
  transform: rotate(180deg);
  opacity: 0.9;
}

.breakdown-detail {
  display: none;
  padding: 6px 0 14px 164px;
  overflow: hidden;
}

.breakdown-detail.open {
  display: block;
  animation: detailSlideIn 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}

@keyframes detailSlideIn {
  from {
    opacity: 0;
    max-height: 0;
  }
  to {
    opacity: 1;
    max-height: 300px;
  }
}

.breakdown-detail-inner {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 6px;
  width: 100%;
}

.breakdown-bonus-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border-radius: 7px;
  background: var(--w5);
  border: 1px solid var(--w10);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  justify-content: space-between;
  min-height: 30px;
}

.breakdown-bonus-chip .chip-left {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.breakdown-bonus-chip .chip-right {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  margin-left: auto;
}

.breakdown-chip-pct {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}

.breakdown-bonus-chip.multi-area {
  position: relative;
  padding-left: 14px;
}

.breakdown-bonus-chip.multi-area::before {
  content: '';
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 3px;
  border-radius: 2px;

.breakdown-multi-icon {

.breakdown-bonus-chip.multi-area:hover .breakdown-multi-icon {

.breakdown-bonus-chip:hover {

}

.breakdown-bonus-chip:active {

}

.breakdown-bonus-chip .chip-filter-icon {

  opacity: 0;
  transition: opacity 0.15s;
}

.breakdown-bonus-chip:hover .chip-filter-icon {

}

.breakdown-bonus-chip.good {
  border-color: rgba(50, 213, 131, 0.35);
  background: rgba(50, 213, 131, 0.10);
  color: var(--color-good);
}

.breakdown-bonus-chip.good:hover {
  background: rgba(50, 213, 131, 0.20);
  border-color: rgba(50, 213, 131, 0.55);

}

.breakdown-bonus-chip.warn {
  border-color: rgba(255, 204, 102, 0.35);
  background: rgba(255, 204, 102, 0.10);

}

.breakdown-bonus-chip.warn:hover {

  border-color: rgba(255, 204, 102, 0.55);
  color: var(--color-warn);
}

.breakdown-bonus-chip.bad {

  background: rgba(255, 122, 122, 0.10);

}

.breakdown-bonus-chip.bad:hover {

.breakdown-detail-hint {

.breakdown-time-bar {

/* On desktop these collapse so their children (label/select/arrow) flow

/* Deployment Trend charts — dynamically populated, 1 to MAX_TREND_CHARTS panels.

.area-group-remove {

.area-group-modes {

.area-group-modes .trend-split-cb {

/* ── First-run setup ──────────────────────────────────────────────────────
   Narrower than the area-group dialog it borrows its markup from: that one is
   a twenty-one-column workbench, this one asks two questions and wants to be
   read rather than worked. */
.onboarding-modal {
  max-width: 640px;
}

.onboarding-sites {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.onboarding-site {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13.5px;
  user-select: none;

.onboarding-site:hover {

}

/* The whole row reads as the control, so the selected one is filled rather
   than relying on a 16px radio to carry the state. */
.onboarding-site.selected {

  background: var(--accent-8);

.onboarding-site input[type="radio"] {

  height: 16px;

}

.onboarding-site-name {
  font-weight: 600;
}

.onboarding-site-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-soft-40);
  white-space: nowrap;
}

.onboarding-bulk {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

/* One column, not the nine .area-group-areas uses: these rows carry the member
   labels underneath, which need the width to stay readable. */
.onboarding-modal .area-group-areas {
  grid-template-columns: 1fr;
  gap: 0;
}

.onboarding-modal .area-group-areas .trend-split-cb {
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
  padding: 10px 0;
  font-size: 13px;
}

.onboarding-modal .area-group-areas .trend-split-cb:last-child {

}

.onboarding-modal .trend-split-dot {

}

/* Overrides the single-line ellipsis .area-cb-text sets for the packed grid -
   here a family names its members on a second line. */
.onboarding-modal .area-cb-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  white-space: normal;
  overflow: visible;
  font-weight: 600;

@media (max-width: 700px) {

.bonus-time-bar {

.bonus-area-toggles {

.bonus-area-chip {

  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);

.bonus-area-chip .breakdown-dot {

.bonus-area-chip i {

.bonus-area-chip:hover {

.bonus-area-chip.off {

/* Hidden chips also lose their colour dot, so "off" reads at a glance. */

.bonus-area-chip.off:hover {

.bonus-tables-grid {

  grid-template-columns: repeat(2, minmax(0, 1fr));

.bonus-tables-grid.overall {

/* Last area panel when the count is odd — half width, centered */
.bonus-tables-grid:not(.overall) > .card.panel:last-child:nth-child(odd) {
  grid-column: 1 / -1;

.bonus-tables-grid > .card.panel {

}

.bonus-two-tables {

.bonus-two-tables > div {

.bonus-two-tables > div .table-wrap {

.bonus-table-caption {

.bonus-table-caption.good {

.bonus-table-caption i {

.bonus-empty-row td {

.bonus-empty-panel {

.bonus-empty-panel i {

@media (max-width: 1100px) {
  .area-group-areas {

#mainTable {
  /* No min-width. The table used to be pinned at 1770px against a viewport
     that is almost always narrower, so it always carried a horizontal
     scrollbar and the right-hand volume columns were off screen. It now sizes
     to the space it has and the columns share that space proportionally
     (widths below), which is what lets every column be visible at once. */
  width: 100%;
  table-layout: fixed;
}

.main-card-list {
  display: none;
}

.main-sort-mobile {
  display: none;
  align-items: center;
  gap: 8px;
}

/* Shared column widths - kept identical between #mainTable and
   .main-detail-table (same nth-child position) so the expanded per-entry
   table's columns line up vertically under the Main Table's columns.

   Percentages, not pixels, so every column shares the viewport and all of
   them are visible at once - see #mainTable above.

   Structured as a BASE width carried by every cell - one area column's share
   - with overrides for the four identity columns and for Productivity via
   :last-child. This exists because the previous version enumerated columns
   1-14 summing to exactly 100%: every column added after that (Sorter 6, the
   three Online Picking areas) fell outside the list, was starved to a sliver
   a couple of characters wide, and its header wrapped into the towering
   header row that made the whole table look broken. Under this scheme a new
   area column arrives already carrying the base share, and fixed layout just
   dilutes every column proportionally - no starvation, no CSS edit.

   Current ledger at 18 columns: 12.6 + 8.0 + 6.0 + 5.6 + 13x4.6 + 8.0 = 100. */
#mainTable th, #mainTable td,
.main-detail-table th, .main-detail-table td {
  width: 4.6%;
}

#mainTable th:nth-child(1), #mainTable td:nth-child(1),
.main-detail-table th:nth-child(1), .main-detail-table td:nth-child(1) {
  width: 12.6%;
}

#mainTable th:nth-child(2), #mainTable td:nth-child(2),
.main-detail-table th:nth-child(2), .main-detail-table td:nth-child(2) {
  width: 8%;
}

#mainTable th:nth-child(3), #mainTable td:nth-child(3),
.main-detail-table th:nth-child(3), .main-detail-table td:nth-child(3) {
  width: 6%;
}

#mainTable th:nth-child(4), #mainTable td:nth-child(4),
.main-detail-table th:nth-child(4), .main-detail-table td:nth-child(4) {
  width: 5.6%;
}

#mainTable th:last-child, #mainTable td:last-child,
.main-detail-table th:last-child, .main-detail-table td:last-child {
  width: 8%;
}

/* The Data Table's identity columns used to be frozen: #mainTable was 1770px
   against a narrower viewport, so Date Time and Bonus Number scrolled out of
   sight before the right-hand volume columns arrived, leaving a row of numbers
   with nothing to say which block or operator they belonged to.

   The table now sizes to its container and never scrolls sideways, so there is
   nothing to hold still and the whole mechanism has gone - along with the
   `left: 260px` offset it needed, which was tied to a fixed column width that
   no longer exists and would have misplaced the column the moment either
   changed.

   The pre-blended hover and expanded-row tints for those two cells have gone
   with it. They existed because a pinned cell had to be opaque, which stopped
   the translucent row tints showing through it - so the tint was baked into a
   solid colour instead. Those cells are transparent again now, and leaving the
   baked colours in would paint the first two columns a flat shade while the
   rest of the row took the translucent tint: the same seam, drawn by the fix
   for it. */

.main-expandable-row {
  cursor: pointer;
}

.main-expandable-row:hover > td {
  background: var(--accent-4) !important;
}

.main-expandable-row.expanded > td {
  background: var(--accent-7) !important;
  border-bottom-color: transparent !important;
}

.main-row-dt-cell {
  display: flex;
  /* `align-items: right` was here, which is not a value align-items accepts -
     it is a justify-content one - so it was being dropped and the chevron sat
     stretched. */
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  /* This span sits inside the cell and its own nowrap beat the cell's
     white-space: normal, so the full range could never wrap - it was clipped by
     the td's ellipsis instead. It breaks at the spaces in
     "30/07/2026 20:30 - 30/07/2026 20:45", so the whole range is always
     readable; anywhere is only a fallback for a window narrow enough that one
     date alone will not fit. */
  white-space: normal;
  overflow-wrap: anywhere;
}

.main-row-chevron {
  font-size: 9px;
  opacity: 0.3;
  flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s;
}

.main-expandable-row:hover .main-row-chevron {
  opacity: 0.65;
}

.main-expandable-row.expanded .main-row-chevron {
  transform: rotate(180deg);
  opacity: 0.85;
}

.main-detail-row {
  display: none;
}

.main-detail-row.open {
  display: table-row;
}

/* The expanded drawer sits recessed below its row. The shade was a hardcoded
   18% black, which reads as a gentle recess against a dark panel but as a heavy
   grey wash over a white one — it was only ever tuned for dark mode. It is now
   a per-theme token: barely-there in light, where white already provides the
   contrast, and deeper in dark, where it has to work against #1e1e1e. */
.main-detail-td {
  padding: 0 !important;
  border-bottom: 2px solid var(--border) !important;
  background: var(--detail-recess) !important;
}

.main-detail-content {
  padding: 10px 0 12px;
}

/* No inner scroller any more. The max-height was there to stop a wide
   aggregation window blowing out the page, but an absolutely positioned
   tooltip inside a scroll container is clipped by it - the manager card on a
   bonus number in here would have been cut off at the container's edge, worst
   on exactly the rows nearest the bottom. The detail table now grows and the
   page scrolls instead, which costs a longer page and gains a tooltip that is
   readable wherever it opens. */
.main-detail-table-wrap {
  margin-bottom: 6px;
}

.main-detail-table {
  /* Matches #mainTable: no forced width, so its columns keep sitting directly
     under the Main Table's. */
  min-width: 0;
  width: 100%;
}

.main-detail-table th,
.main-detail-table td {
  text-align: center;
}

.main-detail-table th.no-sort {
  cursor: default;
}

.main-detail-hint {
  font-size: 10px;
  color: var(--muted);
  opacity: 0.55;
  margin-top: 2px;
  padding-left: 10px;
}

.main-detail-empty {
  font-size: 12px;
  color: var(--muted);
  padding: 2px 0 2px 10px;
}

@media (max-width: 1100px) {
  .charts {
    grid-template-columns: 1fr;
  }
  .charts .card.panel.chart-center-odd {
    width: 100%;
  }
  .bonus-tables-grid:not(.overall) > .card.panel:last-child:nth-child(odd) {
    width: 100%;
  }
  .volume-charts:not(.combined-mode) {
    grid-template-columns: 1fr;
  }
  /* Single-column on mobile: the odd-last panel must be full width, not the
     desktop half-width. Must match the .vol-span-full class set by JS. */
  .volume-charts:not(.combined-mode) > .vol-chart-panel.vol-span-full {
    width: 100%;
  }
  .two-panels {
    grid-template-columns: 1fr;
  }
  .bonus-tables-grid {

  }
  .bonus-two-tables {
    grid-template-columns: 1fr;
  }

/* ============================================================
   Guided tour (spotlight + coach-mark tooltip)
   ============================================================ */
.tour-help-btn i {
  color: var(--accent);
}

.tour-overlay {
  position: fixed;
  inset: 0;
  /* Above the breakdown/loading overlays (z 10001/10000) so button-demo modals
     appear beneath the tour layer while the tooltip stays on top. */
  z-index: 10002;
  display: none;
}
.tour-overlay.active {
  display: block;
}
/* When a step has no target, the overlay itself provides the dark backdrop. */
.tour-overlay.no-spotlight {
  background: var(--tour-mask);
}
/* Button-demo steps: overlay is transparent so the opened modal (which draws its
   own dark backdrop) shows through, with only the tooltip floating on top. */
.tour-overlay.passthrough {
  background: transparent;
}
.tour-overlay.passthrough .tour-spotlight {
  display: none;
}

.tour-spotlight {
  position: fixed;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  border-radius: 12px;
  border: 2px solid var(--accent);
  /* The huge spread box-shadow darkens the whole screen EXCEPT this rectangle. */
  box-shadow: 0 0 0 9999px var(--tour-mask), 0 0 22px var(--accent-55);
  pointer-events: none;
  transition: left 0.25s ease, top 0.25s ease, width 0.25s ease, height 0.25s ease;
}
.tour-overlay.no-spotlight .tour-spotlight {
  display: none;
}

.tour-tooltip {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 330px;
  max-width: calc(100vw - 32px);
  /* Solid, opaque surface (the --panel token is only 6% white, too see-through). */
  background: var(--tour-tip-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.6);
  z-index: 4001;
}
/* Button-demo steps: pin the tooltip to the bottom so it doesn't cover the modal. */
.tour-overlay.passthrough .tour-tooltip {
  left: 50%;
  right: auto;
  top: auto;
  bottom: 26px;
  transform: translateX(-50%);
}
.tour-tip-step {
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.tour-tooltip h3 {
  margin: 6px 0 8px;
  font-size: 17px;
  color: var(--text);
}
.tour-tooltip p {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--muted);
}
.tour-tip-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 18px;
}
.tour-nav {
  display: flex;
  gap: 8px;
}
.tour-tooltip button {
  font-family: inherit;
  cursor: pointer;
  border-radius: 8px;
  padding: 8px 15px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}
.tour-skip {
  color: var(--muted);
  padding-left: 4px !important;
  padding-right: 4px !important;
  border-color: transparent !important;
}
.tour-skip:hover {
  color: var(--text);
}
.tour-back:hover {
  border-color: var(--accent);
}
.tour-back[disabled] {
  opacity: 0.35;
  cursor: default;
}
.tour-next {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tour-next:hover {
  filter: brightness(1.08);
}
.tour-next[disabled] {
  opacity: 0.4;
  cursor: default;
  filter: none;
}

/* Interactive step: the overlay lets clicks reach the highlighted control (only
   that control and the tooltip are usable — a document guard blocks the rest). */
.tour-tooltip {
  pointer-events: auto;
}
.tour-overlay.interactive {
  pointer-events: none;
}
.tour-overlay.interactive .tour-spotlight {
  animation: tourPulse 1.5s ease-in-out infinite;
}
@keyframes tourPulse {
  0%, 100% { box-shadow: 0 0 0 9999px var(--tour-mask), 0 0 0 3px var(--accent-65); }
  50%      { box-shadow: 0 0 0 9999px var(--tour-mask), 0 0 0 8px var(--accent-28); }
}
/* Modal-close (passthrough + interactive): ring-only highlight, no dark mask,
   so the opened modal stays fully visible while its close button pulses. */
.tour-overlay.passthrough .tour-spotlight {
  display: none;
}
.tour-overlay.passthrough.interactive .tour-spotlight {
  display: block;
  box-shadow: 0 0 0 3px var(--accent-95);
  animation: tourRing 1.4s ease-in-out infinite;
}
@keyframes tourRing {
  0%, 100% { box-shadow: 0 0 0 3px var(--accent-95); }
  50%      { box-shadow: 0 0 0 6px var(--accent-35); }
}
/* Slideshow timer. The bar is driven by a CSS width transition rather than a
   rAF loop: the browser keeps it smooth on its own, and pausing is just a
   matter of freezing the width where it stands. */
.tour-progress {
  height: 3px;
  border-radius: 999px;
  background: var(--w8);
  overflow: hidden;
  margin: 14px 0 4px;
}

.tour-progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
}

/* Marks the control the tour is about to operate, so a change of state reads as
   a demonstration rather than the page glitching. */
.tour-demo-hit {
  animation: tourDemoHit 0.65s ease-out;
  border-radius: 6px;
}

@keyframes tourDemoHit {
  0%   { box-shadow: 0 0 0 0 var(--accent-75); }
  70%  { box-shadow: 0 0 0 10px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.tour-speed {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  /* Wide enough for "0.5x", the longest label, so cycling through the speeds
     does not resize the button and shuffle the buttons beside it. */
  min-width: 48px;
  height: 34px;
  padding: 0 8px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.tour-speed:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.tour-pause {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.tour-pause:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.tour-click-hint {
  display: inline-block;
  margin-top: 10px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent);
}
.tour-click-hint i {
  margin-right: 5px;
}

@media (max-width: 700px) {
  /* Tooltip becomes a fixed bottom sheet; the element stays spotlit above it. */
  /* Flipped to the top when the ringed element sits low enough that the
     bottom-pinned tooltip would cover it. */
  .tour-tooltip.pin-top {
    top: calc(12px + env(safe-area-inset-top));
    bottom: auto;
  }

  .tour-tooltip {
    left: 12px;
    right: 12px;
    top: auto;
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: auto;
    max-width: none;
    transform: none;
  }
  .tour-tip-actions {
    margin-top: 14px;
  }
  .tour-tooltip button {
    padding: 10px 16px;
  }
}

/* ---- Tour replay menu (the "?" picker) ---- */
.tour-menu-modal {
  max-width: 460px;
}
.tour-menu-start {
  width: 100%;
  justify-content: center;
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
  padding: 11px 14px;
  margin-bottom: 14px;
}

}
.tour-menu-list {
