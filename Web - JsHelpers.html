<script>
function $(id) {
  return document.getElementById(id);
}

// ---- Light / dark theme -----------------------------------------------------
// Light is the default (no attribute); dark is opt-in via data-theme="dark".
// The attribute is also set by a tiny inline script in <head> before first paint
// so a returning dark-mode user doesn't flash light. These keep it in sync and
// update the header toggle button.
function applyTheme_(theme) {
  currentTheme = (theme === 'dark') ? 'dark' : 'light';
  // Match the NEXT site: a `dark-theme` class on <html>, mirrored to localStorage.
  document.documentElement.classList.toggle('dark-theme', currentTheme === 'dark');
  try { localStorage.setItem('theme', currentTheme); } catch (e) {}
  var btn = $('themeToggleBtn');
  if (btn) {
    var icon = btn.querySelector('i');
    if (icon) icon.className = (currentTheme === 'dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    var label = (currentTheme === 'dark') ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
  }
}

function toggleTheme_() {
  applyTheme_(currentTheme === 'dark' ? 'light' : 'dark');
  saveUserPreferences();
  // Canvas charts bake in their colors at build time — rebuild for the new theme.
  if (typeof applyLocalFiltersPak === 'function') {
    try { applyLocalFiltersPak(); } catch (e) {}
  }
}

function saveUserPreferences() {
  // The tour temporarily forces controls to known defaults so its steps work.
  // Never let that temporary state overwrite the user's real saved preferences.
  if (typeof tourActive !== 'undefined' && tourActive) return;
  try {
    // The building in view holds the live copies, so fold them back into its
    // own slot before writing - otherwise everything set up since the last
    // building switch would be saved against nothing.
    if (typeof captureSiteSettings_ === 'function') captureSiteSettings_(siteFilter);
    var prefs = {
      hoursRange: $('hoursRange').value,
      timeWindow: $('timeWindow').value,
      volumeChartMode: $('volumeChartMode').value,
      sharedRowsLimit: $('sharedRowsLimit').value,
      bonusViewMode: $('bonusViewMode') ? $('bonusViewMode').value : 'area',
      hiddenBonusAreas: hiddenBonusAreas,
      hiddenVolumeAreas: hiddenVolumeAreas,
      // Area groups, their split, the trend split and the volume chart's areas
      // are all per building now - see siteSettings_ in JsState.
      siteSettings: siteSettings_,
      chartOrder: chartOrderState,
      allowMultiBonus: allowMultiBonusFilter,
      syncAreaChips: syncAreaChips,
      siteFilter: siteFilterPreferred,
      theme: currentTheme,
      areaOrderVersion: AREA_ORDER_VERSION,
      // Only so the setup dialog can reopen showing what was answered. The
      // filter it produced lives in hiddenVolumeAreas above, and that is what
      // the dashboard actually reads.
      onboarding: (typeof onboardingRemembered_ !== 'undefined') ? onboardingRemembered_ : null
    };
    localStorage.setItem('e3_dashboard_prefs_v1', JSON.stringify(prefs));
  } catch (e) {
    console.warn('Could not save preferences', e);
  }
}

function loadUserPreferences() {
  try {
    var raw = localStorage.getItem('e3_dashboard_prefs_v1');
    if (!raw) return;
    
    var prefs = JSON.parse(raw);

    applyTheme_(prefs.theme === 'dark' ? 'dark' : 'light');

    // Restored before the payload arrives, so the first render is already
    // scoped rather than showing the whole site and then narrowing.
    if (prefs.siteFilter) { siteFilterPreferred = prefs.siteFilter; siteFilter = prefs.siteFilter; }

    if (prefs.hoursRange) $('hoursRange').value = prefs.hoursRange;
    if (prefs.timeWindow) $('timeWindow').value = prefs.timeWindow;
    if (prefs.volumeChartMode) {
      // 'combinedAll' / 'stackedAll' were briefly separate modes. Anyone who
      // saved one would otherwise land on a select with no matching option,
      // which renders blank and reads as a broken control.
      var savedMode = String(prefs.volumeChartMode).replace(/All$/, '');
      $('volumeChartMode').value = savedMode;
      // Apply the layout class now rather than waiting for the first render.
      // Combined and Stacked show one chart, but the markup carries all nine
      // panels — without this, someone whose saved mode is Combined watches
      // nine skeletons shimmer and then collapse into a single chart.
      var volContainer = $('volumeChartsContainer');
      if (volContainer) {
        volContainer.classList.toggle('combined-mode', savedMode !== 'separate');
      }
    }
    if (prefs.sharedRowsLimit) $('sharedRowsLimit').value = prefs.sharedRowsLimit;

    // Strictly === true, so anything other than a deliberate opt-in leaves the
    // one-at-a-time rule in force.
    allowMultiBonusFilter = prefs.allowMultiBonus === true;
    var multiCb = $('multiBonusToggle');
    if (multiCb) multiCb.checked = allowMultiBonusFilter;

    // Strictly !== false, the mirror of the test above: this one defaults ON,
    // so only a deliberate opt-out turns it off.
    syncAreaChips = prefs.syncAreaChips !== false;
    var syncCb = $('syncAreaChipsToggle');
    if (syncCb) syncCb.checked = syncAreaChips;
    if (prefs.bonusViewMode && $('bonusViewMode')) $('bonusViewMode').value = prefs.bonusViewMode;

    if (Array.isArray(prefs.hiddenBonusAreas)) {
      var validAreaKeys = {};
      for (var h = 0; h < VOLUME_TYPES.length; h++) { validAreaKeys[VOLUME_TYPES[h].key] = true; }
      hiddenBonusAreas = prefs.hiddenBonusAreas.filter(function(k) { return validAreaKeys[k]; });
    }

    if (Array.isArray(prefs.hiddenVolumeAreas)) {
      var validVolAreaKeys = {};
      for (var hv = 0; hv < VOLUME_TYPES.length; hv++) { validVolAreaKeys[VOLUME_TYPES[hv].key] = true; }
      hiddenVolumeAreas = prefs.hiddenVolumeAreas.filter(function(k) { return validVolAreaKeys[k]; });
    }

    // Both lists are restored independently above, and a blob saved before the
    // sync setting existed can hold two different selections. Reconcile now
    // rather than letting the pages open disagreeing with each other.
    mirrorHiddenAreasPak_('volume');

    // Validated but never applied - seedOnboardingDraft_ prefers live state, and
    // re-deriving hiddenVolumeAreas from this on every load would undo any chip
    // the user has toggled since.
    if (prefs.onboarding && typeof prefs.onboarding === 'object') {
      var famNames = AREA_FAMILIES.map(function (f) { return f.name; });
      var validOnboardKeys = {};
      for (var ok = 0; ok < VOLUME_TYPES.length; ok++) { validOnboardKeys[VOLUME_TYPES[ok].key] = true; }
      var knownSite = false;
      for (var s = 0; s < SITES.length; s++) { if (SITES[s].key === prefs.onboarding.site) knownSite = true; }
      onboardingRemembered_ = {
        site: knownSite ? prefs.onboarding.site : 'all',
        families: Array.isArray(prefs.onboarding.families)
          ? prefs.onboarding.families.filter(function (f) { return famNames.indexOf(f) !== -1; }) : [],
        areas: Array.isArray(prefs.onboarding.areas)
          ? prefs.onboarding.areas.filter(function (k) { return validOnboardKeys[k]; }) : []
      };
    }

    var syncedHours = document.querySelectorAll('[data-sync="hoursRange"]');
    for (var i = 0; i < syncedHours.length; i++) {
      syncedHours[i].value = $('hoursRange').value;
    }
    
    var syncedWindows = document.querySelectorAll('[data-sync="timeWindow"]');
    for (var i = 0; i < syncedWindows.length; i++) {
      syncedWindows[i].value = $('timeWindow').value;
    }

    // Only keys this build knows about, and no duplicates — a stale or hand-
    // edited entry must not be able to drop a chart off the page or list one
    // twice. Anything missing from a saved order is appended by applyChartOrder_.
    if (prefs.chartOrder && typeof prefs.chartOrder === 'object') {
      var cleanOrder = {};
      var zoneKeys = Object.keys(prefs.chartOrder);
      for (var zk = 0; zk < zoneKeys.length; zk++) {
        var list = prefs.chartOrder[zoneKeys[zk]];
        if (!Array.isArray(list)) continue;
        var seenKeys = {};
        cleanOrder[zoneKeys[zk]] = list.filter(function (k) {
          if (typeof k !== 'string' || seenKeys[k]) return false;
          seenKeys[k] = true;
          return true;
        });
      }
      // The volume zone's keys are 'vol0'..'vol18' - POSITIONS in VOLUME_TYPES,
      // not areas - so a saved arrangement means something different the moment
      // the areas are reordered. It would not error; it would quietly point
      // someone's layout at other areas, which is worse. The work areas were
      // reordered and re-familied in AREA_ORDER_VERSION 2, so an arrangement
      // saved before that marker existed is dropped exactly once. Everything
      // else in the blob is keyed by area and survives.
      if (prefs.areaOrderVersion !== AREA_ORDER_VERSION) delete cleanOrder.volume;
      chartOrderState = cleanOrder;
    }

    // ── Per-building chart settings ────────────────────────────────────────
    // Validation deliberately does NOT prune areas belonging to another
    // building: each building's settings are only ever applied while that
    // building is in view, so an out-of-scope key cannot reach a chart, and
    // pruning would destroy a perfectly good configuration.
    var validAreaKeys = {};
    for (var vk = 0; vk < VOLUME_TYPES.length; vk++) { validAreaKeys[VOLUME_TYPES[vk].key] = true; }

    var cleanGroups_ = function (raw) {
      if (!Array.isArray(raw)) return null;
      var out = [];
      for (var g = 0; g < raw.length && out.length < MAX_AREA_GROUPS; g++) {
        var grp = raw[g];
        // Legacy shape was a plain array of keys; current shape is {keys, showLine, showTrend}
        var keysSrc = Array.isArray(grp) ? grp : (grp && Array.isArray(grp.keys) ? grp.keys : null);
        if (!keysSrc) continue;
        var keys = keysSrc.filter(function (k) { return validAreaKeys[k]; });
        if (keys.length === 0) continue;
        var showLine = Array.isArray(grp) ? true : grp.showLine !== false;
        var showTrend = Array.isArray(grp) ? false : grp.showTrend === true;
        if (!showLine && !showTrend) showLine = true;
        out.push({ keys: keys, showLine: showLine, showTrend: showTrend });
      }
      return out.length > 0 ? out : null;
    };

    // Group indices are validated against MAX_AREA_GROUPS rather than against
    // the group count, which is not known here. An index past the end is simply
    // skipped at render time.
    var cleanGroupSplit_ = function (raw) {
      if (!raw || typeof raw.enabled !== 'boolean' || !Array.isArray(raw.charts)) return null;
      return {
        enabled: !!raw.enabled,
        charts: raw.charts
          .filter(function (c) { return Array.isArray(c); })
          .map(function (c) {
            return c.filter(function (n) { return typeof n === 'number' && n >= 0 && n < MAX_AREA_GROUPS; });
          })
          .slice(0, MAX_AREA_GROUP_CHARTS)
      };
    };

    var cleanTrendSplit_ = function (raw) {
      if (!raw || typeof raw.enabled !== 'boolean' || !Array.isArray(raw.charts)) return null;
      return {
        enabled: !!raw.enabled,
        charts: raw.charts
          .filter(function (c) { return Array.isArray(c); })
          .map(function (c) { return c.filter(function (k) { return validAreaKeys[k]; }); })
          .slice(0, MAX_TREND_CHARTS)
      };
    };

    var cleanKeyList_ = function (raw) {
      if (!Array.isArray(raw)) return null;
      return raw.filter(function (k) { return validAreaKeys[k]; });
    };

    var cleanSiteEntry_ = function (raw) {
      if (!raw || typeof raw !== 'object') return null;
      var entry = {};
      var groups = cleanGroups_(raw.areaGroups);
      if (groups) entry.areaGroups = groups;
      var gsplit = cleanGroupSplit_(raw.areaGroupSplit);
      if (gsplit) entry.areaGroupSplit = gsplit;
      var tsplit = cleanTrendSplit_(raw.trendSplit);
      if (tsplit) entry.trendSplit = tsplit;
      var vol = cleanKeyList_(raw.overviewVolAreas);
      if (vol) entry.overviewVolAreas = vol;
      return entry;
    };

    // Anything that made it into storage was configured by hand at the time, so
    // it stays configured across the reload - otherwise the first building
    // switch would treat it as untouched and discard it.
    var rememberTouched_ = function (site, entry) {
      if (!entry) return;
      for (var f = 0; f < SITE_SETTING_KEYS_.length; f++) {
        var field = SITE_SETTING_KEYS_[f];
        if (field === 'areaGroupSplit') continue;   // held with areaGroups
        if (entry.hasOwnProperty(field)) markSiteSettingsTouched_(site, field);
      }
    };

    siteSettings_ = {};
    siteSettingsTouched_ = {};
    if (prefs.siteSettings && typeof prefs.siteSettings === 'object') {
      for (var ss = 0; ss < SITES.length; ss++) {
        var sk = SITES[ss].key;
        var cleaned = cleanSiteEntry_(prefs.siteSettings[sk]);
        if (cleaned && Object.keys(cleaned).length > 0) {
          siteSettings_[sk] = cleaned;
          rememberTouched_(sk, cleaned);
        }
      }
    } else {
      // A blob from before these were per building. One shared configuration is
      // exactly the bug - a group of E1/E2 areas offered while viewing E3 - so
      // it is filed under the building that was in view when it was saved, and
      // the other two start from the default rule rather than inheriting it.
      var legacy = cleanSiteEntry_({
        areaGroups: prefs.areaGroups,
        areaGroupSplit: prefs.areaGroupSplit,
        trendSplit: prefs.trendSplitState,
        overviewVolAreas: prefs.overviewVolAreas
      });
      if (legacy && Object.keys(legacy).length > 0) {
        var legacySite = prefs.siteFilter || 'all';
        siteSettings_[legacySite] = legacy;
        rememberTouched_(legacySite, legacy);
      }
    }

    // siteFilter was restored near the top of this function, so this hands the
    // live values to the building the page is about to open on.
    applySiteSettings_(siteFilter);

  } catch (e) {
    console.warn('Could not load preferences', e);
  }
}

// Everything the dashboard remembers lives under two localStorage keys. Without
// this the only way out of a layout someone disliked — a chart order, a set of
// groups, a hidden work area they had forgotten about — was devtools.
//
// The page is reloaded rather than the state being unwound in memory: there are
// a dozen module-level variables holding preference state, and re-deriving them
// all correctly is far more likely to go wrong than simply starting again.
function resetAllSettingsPak() {
  if (!confirm('Reset all your saved settings?\n\nTheme, chart order, area groups, split charts, hidden work areas, display modes, row counts and the settings in the gear dialog all go back to their defaults, and you will be asked which work areas you want again. Your data is untouched, and other people are unaffected.')) return;
  try {
    localStorage.removeItem('e3_dashboard_prefs_v1');
    // Every payload version, not just the current one: the key carries the area
    // count so that adding an area retires the old copy, which means old keys
    // accumulate. Naming one of them here would leave the rest behind, taking
    // up quota and ready to be painted if the count ever returned to that value.
    for (var pk = localStorage.length - 1; pk >= 0; pk--) {
      var k = localStorage.key(pk);
      if (k && k.indexOf('e3_dashboard_payload_v') === 0) localStorage.removeItem(k);
    }
  } catch (e) {
    console.warn('Could not clear saved settings', e);
  }
  // The tour's "already seen" flag is deliberately NOT cleared: someone
  // resetting their layout has not forgotten the tour, and replaying it
  // unasked would be a strange thing to happen.
  //
  // The onboarding flag IS cleared, which looks inconsistent and is not. The
  // tour teaches the dashboard; this asks which areas you want. Wiping the
  // hidden-area list without asking again would drop someone back into all
  // twenty-one areas with no prompt and no memory of how they had narrowed it -
  // so resetting the layout IS a request to be asked.
  if (typeof clearOnboardingSeen_ === 'function') clearOnboardingSeen_();
  location.reload();
}

function isCardModePak() {
  return window.matchMedia('(max-width: 700px)').matches;
}

function normalizePerfPak(v) {
  var x = Number(v);
  return Number.isFinite(x) ? x : 0;
}

// Least-squares linear fit over the series; returns the fitted value per index.
function linearTrendPak(data) {
  var n = 0, sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (var i = 0; i < data.length; i++) {
    var y = Number(data[i]);
    if (!Number.isFinite(y)) continue;
    n++; sx += i; sy += y; sxy += i * y; sxx += i * i;
  }
  if (n < 2) return data.map(function() { return null; });
  var denom = n * sxx - sx * sx;
  if (denom === 0) return data.map(function() { return null; });
  var slope = (n * sxy - sx * sy) / denom;
  var intercept = (sy - slope * sx) / n;
  return data.map(function(_, i) { return intercept + slope * i; });
}

function numPak(n, d) {
  d = d !== undefined ? d : 2;
  var x = Number(n);
  return Number.isFinite(x)
    ? x.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d })
    : '-';
}

// A numeric table cell, tagged so CSS can treat it as one. Zeros get a marker
// of their own: across the Data Table's eleven volume columns most cells are 0,
// and at full contrast they crowd out the handful of figures that carry the
// information. Only a true zero counts — a missing value renders as "-" and is
// a different thing entirely, so it keeps normal weight.
function numTdPak(n, d) {
  var x = Number(n);
  var isZero = Number.isFinite(x) && x === 0;
  return '<td class="num' + (isZero ? ' zero' : '') + '">' + numPak(n, d) + '</td>';
}

// Bonus number -> the number of distinct work areas it registered volume in,
// across whatever raw entries are passed.
//
// Scoped to the caller's data on purpose. "Works across several areas" is a
// statement about a period, not a permanent property of a person: the Bonus
// page answers it for its own From/To range, an expanded Data Table row answers
// it for that row's window, and the breakdown for its own range. Sharing one
// global answer would make the marker disagree with the numbers beside it.
// Adds or removes a work-area key in place. Used by both pages' chips so the
// two cannot drift apart in how they read a click.
// ---- Scrolling, without reaching outside the app -----------------------------
// Element.scrollIntoView() scrolls EVERY scrollable ancestor, and the frame
// tree counts: called in here it also scrolls the Google Site the dashboard is
// embedded in. The tour made that obvious - it centres each ringed element in
// turn, so the host page was dragged up and down with it and left parked below
// the embed, showing the Site's own empty space under the iframe as a band of
// white that had nothing to do with the dashboard.
//
// So nothing in the app calls scrollIntoView. This scrolls the app's OWN
// scroll container (a .page, or a scrolling modal body) and stops there. When
// there is nothing scrollable to move, it does nothing at all rather than
// falling back to scrollIntoView - the fallback was the bug.
function scrollableAncestorPak_(el) {
  var node = el && el.parentElement;
  while (node && node !== document.body && node !== document.documentElement) {
    var oy = window.getComputedStyle(node).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && node.scrollHeight > node.clientHeight + 1) {
      return node;
    }
    node = node.parentElement;
  }
  return null;
}

// mode 'center' centres the element; 'nearest' moves only far enough to bring
// it inside, and not at all when it is already there.
function scrollIntoViewPak_(el, mode) {
  if (!el || !el.getBoundingClientRect) return;
  var box = scrollableAncestorPak_(el);
  if (!box) return;

  var e = el.getBoundingClientRect();
  var b = box.getBoundingClientRect();
  var delta;

  if (mode === 'center') {
    delta = (e.top + e.height / 2) - (b.top + b.height / 2);
  } else {
    if (e.top >= b.top && e.bottom <= b.bottom) return;
    delta = (e.top < b.top) ? (e.top - b.top) : (e.bottom - b.bottom);
  }
  if (!delta) return;

  var top = Math.max(0, Math.min(box.scrollHeight - box.clientHeight,
                                 box.scrollTop + delta));
  if (box.scrollTo) { box.scrollTo({ top: top, behavior: 'smooth' }); }
  else { box.scrollTop = top; }
}

function toggleAreaKeyPak_(list, key) {
  var i = list.indexOf(key);
  if (i === -1) list.push(key);
  else list.splice(i, 1);
}

// Show or hide every area currently IN VIEW, leaving anything the list holds
// for the other building untouched. Those entries are kept deliberately -
// switching buildings has to restore what was set up there - so "select none"
// on E3 must not wipe the E1/E2 choices, and "select all" must not resurrect
// them either.
function setAllAreaKeysPak_(list, show) {
  var inScope = volumeTypesActive_();
  for (var i = 0; i < inScope.length; i++) {
    var at = list.indexOf(inScope[i].key);
    if (show) { if (at !== -1) list.splice(at, 1); }
    else if (at === -1) { list.push(inScope[i].key); }
  }
}

// Copies one page's hidden-area list onto the other, when the two are synced.
// Assigning a COPY rather than the same array: sharing one array would make
// the de-sync setting meaningless, since turning it off would leave both
// pages still pointing at the same object.
function mirrorHiddenAreasPak_(from) {
  if (!syncAreaChips) return;
  if (from === 'volume') hiddenBonusAreas = hiddenVolumeAreas.slice();
  else hiddenVolumeAreas = hiddenBonusAreas.slice();
}

// ---- Who manages this operator ---------------------------------------------
// Looked up on the upper-cased code: the directory is keyed that way, and the
// dashboard shows canonicalised codes, so a lookup on the raw string would miss
// anything whose case differs.
function tmForBonusPak_(bonus) {
  var key = String(bonus === null || bonus === undefined ? '' : bonus).trim().toUpperCase();
  return (key && tmDirectory[key]) ? tmDirectory[key] : null;
}

// The hover card shown on a bonus number. The manager comes first because it is
// the reason to hover; the click hint stays last, quieter, as the affordance it
// always was.
function bonusTipHtmlPak_(bonus, isActive) {
  var entry = tmForBonusPak_(bonus);
  var html = '<span class="bonus-tip">';

  if (entry) {
    if (entry.tm) html += bonusTipCopyRowPak_('1st Line Manager:', entry.tm, 'name');
    if (entry.email) html += bonusTipCopyRowPak_('Email:', entry.email, 'email address');
  }

  html += '<span class="bonus-tip-line bonus-tip-hint">' +
          '<i class="fa-solid fa-filter"></i>' +
          (isActive ? 'Click to remove filter' : 'Click to filter main view') +
          '</span></span>';
  return html;
}

// One detail line with its own copy button. Separate buttons per line because
// the two values are wanted for different things — the name to type into a
// message, the address to paste into a mail client — and a single "copy all"
// would mean deleting half of what was pasted every time.
function bonusTipCopyRowPak_(label, value, what) {
  return '<span class="bonus-tip-line bonus-tip-row">' +
    '<b>' + label + '</b>' +
    '<span class="bonus-tip-val">' + safeTextPak(value) + '</span>' +
    '<button type="button" class="bonus-tip-copy" data-copy="' + escapeAttrPak(value) + '"' +
    ' title="Copy ' + what + '" aria-label="Copy ' + what + '"' +
    ' onclick="copyBonusTipValuePak_(event, this)">' +
    '<i class="fa-solid fa-copy"></i></button>' +
    '</span>';
}

// The button sits inside the bonus number, whose own click filters the view, so
// the event has to stop here or copying an address would also change what is on
// screen behind the card.
function copyBonusTipValuePak_(e, btn) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  var value = btn.getAttribute('data-copy') || '';
  if (!value) return;

  // navigator.clipboard is not always granted inside an embedded frame, which
  // is exactly where this dashboard runs, so the old execCommand path stays as
  // the fallback. Same two-step already used for the share link.
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = value;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    // iOS ignores select() on its own; the explicit range is what makes the
    // selection stick there.
    try { ta.setSelectionRange(0, value.length); } catch (err) {}
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
    flashCopyButtonPak_(btn, ok);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value)
      .then(function () { flashCopyButtonPak_(btn, true); })
      .catch(fallback);
  } else {
    fallback();
  }
}

// The card has no room for a message, and there is no other visible change to
// confirm a copy, so the button itself answers: a tick, or a cross if the
// browser refused.
function flashCopyButtonPak_(btn, ok) {
  var icon = btn.querySelector('i');
  if (!icon) return;

  if (btn._copyTimer) clearTimeout(btn._copyTimer);
  else btn._copyIconClass = icon.className;

  icon.className = ok ? 'fa-solid fa-check' : 'fa-solid fa-xmark';
  btn.classList.remove('copied', 'copy-failed');
  btn.classList.add(ok ? 'copied' : 'copy-failed');

  btn._copyTimer = setTimeout(function () {
    icon.className = btn._copyIconClass;
    btn.classList.remove('copied', 'copy-failed');
    btn._copyTimer = null;
  }, 1200);
}

// Plain-text form, for the surfaces that have no room for the card above - the
// breakdown chips, the filter chips and the search suggestions. &#10; is a
// newline inside an attribute, which is what makes a title render on two lines.
function bonusTitleAttrPak_(bonus) {
  var entry = tmForBonusPak_(bonus);
  if (!entry) return '';
  var parts = [];
  if (entry.tm) parts.push('1st Line Manager: ' + entry.tm);
  if (entry.email) parts.push('Email: ' + entry.email);
  if (!parts.length) return '';
  return ' title="' + escapeAttrPak(parts.join('\n')).replace(/\n/g, '&#10;') + '"';
}

function bonusAreaCountMapPak(entries) {
  var counts = {};
  if (!entries || !entries.length) return counts;

  var areas_ = breakdownAreasActive_();
  for (var a = 0; a < areas_.length; a++) {
    var areaKey = areas_[a].key;
    // Gathered per area first, so a bonus number appearing in twenty blocks of
    // the same area still counts as one area.
    var seen = {};
    for (var i = 0; i < entries.length; i++) {
      if (Number(entries[i][areaKey]) > 0) seen[entries[i].bonus] = true;
    }
    var bonuses = Object.keys(seen);
    for (var j = 0; j < bonuses.length; j++) {
      counts[bonuses[j]] = (counts[bonuses[j]] || 0) + 1;
    }
  }
  return counts;
}

// The marker itself. Returns nothing at all below two areas, so callers can
// concatenate it unconditionally.
function multiAreaIconHtmlPak(areaCount) {
  var n = Number(areaCount) || 0;
  if (n < 2) return '';
  return '<i class="fa-solid fa-layer-group multi-area-icon" aria-hidden="true"' +
         ' title="Works across ' + n + ' work areas in this period"></i>';
}

// Which bonus numbers spent any of this period on OS / indirect work. Read off
// the raw rows here rather than recomputed per surface, for the same reason
// bonusAreaCountMapPak lives here: "was on OS" has to mean one thing on the
// Bonus page, in the head breakdown and in the Data Table detail rows.
//
// ANY flagged block in the window counts. Somebody who cleared RSPS for one
// block and picked for the rest genuinely was on OS, and the tag is there to
// explain the dent that leaves in their figure.
function bonusOsMapPak_(entries) {
  var out = {};
  if (!entries || !entries.length) return out;
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].os === true) out[entries[i].bonus] = true;
  }
  return out;
}

// The three states the dashboard speaks. The approval form's Record Status has
// more wordings than that and will grow more, but as far as anybody reading a
// chart is concerned there are exactly three: it was approved, it is still
// being decided, or it was not approved. So anything that is neither of the
// first two is a rejection here - "Cancelled", "Withdrawn", whatever comes
// next - and says Rejected rather than passing its own wording through.
//
// The raw value is untouched upstream: the OS log and Processed Data both
// still hold exactly what the form said, so nothing is lost to anybody
// auditing a specific record. This is the vocabulary of the display only.
//
// YES is not a verdict - it is what the column holds for a spell logged with
// the status cell left empty - so it maps to nothing rather than to Rejected.
// Calling an undecided spell rejected would be an accusation the data does not
// support.
var OS_STATUS_APPROVED_PAK_ = 'Approved';
var OS_STATUS_AWAITING_PAK_ = 'Awaiting Approval';
var OS_STATUS_REJECTED_PAK_ = 'Rejected';

// Both the translated wording and the form's own, because there are now two
// readers on two different sides of that translation. The notebook re-spells
// "OK" as Approved and "authorise or reject" as Awaiting Approval on the way
// into Processed Data - but the OS page reads the log DIRECTLY, and gets what
// the approver actually typed.
//
// Without the raw pair here, every approved spell on that page folded to the
// catch-all and read "Rejected", in red: the worst possible way to be wrong
// about somebody's paperwork, and the fold was doing exactly what it was
// written to do.
function osStatusBandPak_(status) {
  var s = String(status == null ? '' : status).trim().toLowerCase();
  if (!s || s === 'yes') return '';
  if (s === 'approved' || s === 'ok') return OS_STATUS_APPROVED_PAK_;
  if (s === 'awaiting approval' || s === 'authorise or reject') return OS_STATUS_AWAITING_PAK_;
  return OS_STATUS_REJECTED_PAK_;
}

// Short forms, for a band too narrow to fit the word. On a phone that is the
// normal case rather than the exception - the same twelve-hour shift that gets
// 600px of chart on a desktop gets half of it - and the status was simply not
// drawn at all there.
var OS_STATUS_SHORT_PAK_ = {};
OS_STATUS_SHORT_PAK_[OS_STATUS_APPROVED_PAK_] = 'App.';
OS_STATUS_SHORT_PAK_[OS_STATUS_AWAITING_PAK_] = 'Pnd.';
OS_STATUS_SHORT_PAK_[OS_STATUS_REJECTED_PAK_] = 'Rej.';

// One band carries one label, so a bucket spanning two different verdicts must
// not claim either of them. "OS (Approved)" over half an hour that was half
// rejected is worse than saying nothing at all, because the reader has no way
// to see that it is only half true - a plain "OS" is the honest answer there.
//
// Compared as the three display states, not as raw wordings: two blocks
// reading "Rejected" and "Cancelled" are the same answer to the reader, and
// treating them as a disagreement would blank a label that is perfectly true.
//
// A flagged block with no status recorded is not a vote. It says the spell
// happened without saying what was decided about it, so it neither supplies a
// label nor contradicts one; counted as a disagreement, one not-yet-decided
// block at the edge of an hour would strip the status off the whole bucket.
function osStatusOfPak_(statuses) {
  var seen = '';
  for (var i = 0; i < statuses.length; i++) {
    var s = osStatusBandPak_(statuses[i]);
    if (!s) continue;
    if (!seen) seen = s;
    else if (seen !== s) return '';
  }
  return seen;
}

// ── the clipped OS times ───────────────────────────────────────────────────
// Processed Data carries the logged spell clipped to each 15-minute block:
// 07:26-07:30 on the 07:15 row, then two whole blocks, then 08:00-08:06 on the
// 08:00 one. That is what lets a band report when the indirect work really
// started and stopped - its own edges are quarter-hour blocks and can only ever
// be right to fifteen minutes.
//
// Kept as the "HH:MM" strings the notebook wrote rather than parsed into Dates.
// Nothing does arithmetic on them, and building a Date would need the row's
// calendar date, which the aggregated rows no longer carry.

// Minutes past midnight, for comparing two clips that lie INSIDE ONE BLOCK.
// -1 when the value is not a clip time at all.
//
// isEnd exists for exactly one value. A block ending at midnight ends "00:00",
// which is the end of the 23:45 block and not the start of a day: it sorts
// lowest, as a string and as a number, when it is in fact the highest. No other
// wrap is possible, because both clips of a block sit inside the same fifteen
// minutes and so share their hour.
function osClipMinsPak_(hhmm, isEnd) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm == null ? '' : hhmm).trim());
  if (!m) return -1;
  var mins = Number(m[1]) * 60 + Number(m[2]);
  return (isEnd && mins === 0) ? 1440 : mins;
}

// The union of the clips on the OS rows of ONE time block: earliest start,
// latest end, both '' when no row carries a usable pair.
//
// Union rather than first-wins, because with several bonuses selected the band
// means "one or more of these was indirect", and the honest range for that
// claim is the whole of the time any of them was.
function osSpanOfPak_(rows) {
  var from = '', to = '', fromM = -1, toM = -1;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.os !== true || !r.osFrom || !r.osTo) continue;
    var a = osClipMinsPak_(r.osFrom, false);
    var b = osClipMinsPak_(r.osTo, true);
    if (a < 0 || b < 0) continue;
    if (fromM < 0 || a < fromM) { fromM = a; from = r.osFrom; }
    if (toM < 0 || b > toM) { toM = b; to = r.osTo; }
  }
  return { from: from, to: to };
}

// The clock time a given number of minutes into a block, as "HH:MM" - the
// shape of a clip time, derived from the block the row is about.
//
// Demo data only: Processed Data supplies the real ones. Both the tour and
// tools/preview.js need a spell that starts and stops MID-block, because a
// band whose times are exactly its own edges demonstrates nothing.
function osClipAtPak_(timeRange, minsIn) {
  var t = String(timeRange || '').split(' - ')[0].split(' ')[1] || '';
  var m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return '';
  var mins = (Number(m[1]) * 60 + Number(m[2]) + minsIn + 1440) % 1440;
  return ('0' + Math.floor(mins / 60)).slice(-2) + ':' + ('0' + (mins % 60)).slice(-2);
}

// The line the band adds to a chart tooltip. Empty when the band has no times
// behind it, which is every archive cut from before those columns existed - so
// an old day keeps exactly the tooltip it had rather than growing a blank row.
function osBandTimeLabelPak_(from, to) {
  return (from && to) ? ('[ OS : ' + from + ' - ' + to + ' ]') : '';
}

// The tag itself. Returns nothing when they were not on OS, so callers can
// concatenate it unconditionally - same contract as multiAreaIconHtmlPak.
function osTagHtmlPak_(isOs) {
  if (!isOs) return '';
  return '<span class="os-tag" title="On OS / indirect work in this period"' +
         ' aria-label="On OS">OS</span>';
}

// All / single-area only / multi-area only, over rows carrying a `bonus`.
//
// The count comes from bonusAreaCountMapPak - the SAME map multiAreaIconHtmlPak
// reads. If this counted areas its own way, a row could show the multi-area
// marker and still survive "single-area only", which reads as the filter being
// broken rather than as two definitions quietly disagreeing.
//
// An unrecognised mode means "all": a filter nobody asked for hides data, and
// this is reached from three call sites.
function filterByAreaCountPak_(rows, countMap, mode) {
  if (mode !== 'single' && mode !== 'multi') return rows;
  var map = countMap || {};
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var isMulti = (map[rows[i].bonus] || 0) > 1;
    if (mode === 'multi' ? isMulti : !isMulti) out.push(rows[i]);
  }
  return out;
}

// The chip that cycles those three states. Rendered on the Bonus page beside
// Select all / none, and again in the head breakdown's time bar. One builder
// for both so the two cannot drift into different wording or a different cycle
// order.
var AREA_COUNT_FILTER_MODES_ = ['all', 'single', 'multi'];
var AREA_COUNT_FILTER_LABELS_ = {
  all: 'All bonus numbers',
  single: 'Single Task',
  multi: 'Multi Tasks'
};

function nextAreaCountFilterPak_(mode) {
  var i = AREA_COUNT_FILTER_MODES_.indexOf(mode);
  return AREA_COUNT_FILTER_MODES_[(i + 1) % AREA_COUNT_FILTER_MODES_.length];
}

// The same three states as a list of <option>s, for the Bonus page's select.
// Built from the arrays above rather than typed into the markup so the chip in
// the breakdown and the dropdown here cannot end up offering different things
// or calling them different names - which is the whole reason those arrays are
// module-level in the first place.
function areaCountFilterOptionsHtmlPak_(mode) {
  var m = AREA_COUNT_FILTER_MODES_.indexOf(mode) === -1 ? 'all' : mode;
  var out = '';
  for (var i = 0; i < AREA_COUNT_FILTER_MODES_.length; i++) {
    var k = AREA_COUNT_FILTER_MODES_[i];
    out += '<option value="' + k + '"' + (k === m ? ' selected' : '') + '>' +
           safeTextPak(AREA_COUNT_FILTER_LABELS_[k]) + '</option>';
  }
  return out;
}

function areaCountFilterChipHtmlPak_(mode, handler) {
  var m = AREA_COUNT_FILTER_MODES_.indexOf(mode) === -1 ? 'all' : mode;
  // A distinct glyph per state, because the label truncates first on a phone.
  var icon = (m === 'all') ? 'fa-layer-group'
           : (m === 'single') ? 'fa-user' : 'fa-user-group';
  return '<button type="button" class="area-count-chip' +
    (m === 'all' ? '' : ' on') + '" data-count-mode="' + m + '"' +
    ' onclick="' + handler + "('" + nextAreaCountFilterPak_(m) + "')" + '"' +
    ' title="Click to cycle: all areas, single-area only, multi-area only">' +
    '<i class="fa-solid ' + icon + '" aria-hidden="true"></i>' +
    '<span class="area-count-chip-text">' +
    safeTextPak(AREA_COUNT_FILTER_LABELS_[m]) + '</span></button>';
}

function pctPak(n, d) {
  d = d !== undefined ? d : 1;
  if (typeof n === 'string' && n.indexOf('%') !== -1) {
    return n.trim();
  }
  var x = Number(n);
  if (!Number.isFinite(x)) return '-';
  return normalizePerfPak(x).toFixed(d) + '%';
}

function perfClassPak(v) {
  var val = normalizePerfPak(v);
  if (!Number.isFinite(val)) return APP_CONFIG.classes.bad;
  if (val >= APP_CONFIG.thresholds.good) return APP_CONFIG.classes.good;
  if (val >= APP_CONFIG.thresholds.warn) return APP_CONFIG.classes.warn;
  return APP_CONFIG.classes.bad;
}

function safeTextPak(v) {
  return String(v != null ? v : '');
}

// Shared renderer for the work-area show/hide chips. The Bonus Numbers page and
// the Volume page use identical chips and differ only in which container they
// fill, which hidden-key list they read, and which toggle they call — keeping
// one implementation stops the two drifting apart.
function renderAreaToggleChips_(opts) {
  var togglesEl = $(opts.containerId);
  if (!togglesEl) return;
  togglesEl.style.display = opts.visible ? 'flex' : 'none';
  if (!opts.visible) return;

  var hidden = opts.hiddenKeys || [];

  // Overall mode on the Bonus page renders ONE combined table, so there are no
  // per-area panels for the area chips to be a legend for - but the multi-area
  // filter still applies to that table, and a filter whose control is off
  // screen is indistinguishable from missing data. So the strip can be shown
  // carrying the count chip alone.
  var wantAreaChips = opts.areaChips !== false;

  // The chips are a legend for the panels below them, so they follow whatever
  // order the user has arranged those panels into. Falls back to the authored
  // VOLUME_TYPES order when the caller has no arrangement to offer, and appends
  // anything the arrangement does not mention so no area can go missing.
  // Only the chosen building's areas: a chip for an area that cannot appear in
  // the panels below it is a control with nothing to control. Both the Volume
  // page's strip and the Bonus page's come through here.
  var inScope = volumeTypesActive_();
  var ordered = [];
  var byAreaKey = {};
  for (var bk = 0; bk < inScope.length; bk++) { byAreaKey[inScope[bk].key] = inScope[bk]; }
  if (opts.orderKeys && opts.orderKeys.length) {
    for (var o = 0; o < opts.orderKeys.length; o++) {
      var got = byAreaKey[opts.orderKeys[o]];
      if (got && ordered.indexOf(got) === -1) ordered.push(got);
    }
  }
  for (var d = 0; d < inScope.length; d++) {
    if (ordered.indexOf(inScope[d]) === -1) ordered.push(inScope[d]);
  }

  // Show-all / hide-all, at the head of the strip rather than in the control
  // row above it: they belong beside the chips they act on, and they then
  // appear and disappear with the strip for free - the strip is hidden in the
  // chart modes that have their own per-series legend, where these would be
  // controls with nothing to control.
  var html = '';
  if (opts.onSetAll && wantAreaChips) {
    var anyOn = false, anyOff = false;
    for (var s = 0; s < ordered.length; s++) {
      if (hidden.indexOf(ordered[s].key) === -1) anyOn = true; else anyOff = true;
    }
    html += '<span class="area-chip-bulk">' +
            '<button type="button" class="area-chip-bulk-btn" onclick="' + opts.onSetAll + '(true)"' +
            (anyOff ? '' : ' disabled') + '>Select all</button>' +
            '<button type="button" class="area-chip-bulk-btn" onclick="' + opts.onSetAll + '(false)"' +
            (anyOn ? '' : ' disabled') + '>Select none</button>' +
            // Same row, because it filters the same population the chips do -
            // one narrows by area, the other by how many areas. A second
            // control strip for a single button would cost more vertical space
            // than the button is worth, on a phone especially.
            (opts.countFilter
              ? areaCountFilterChipHtmlPak_(opts.countFilter.mode, opts.countFilter.onSet)
              : '') +
            '</span>';
  } else if (opts.countFilter) {
    html += '<span class="area-chip-bulk">' +
            areaCountFilterChipHtmlPak_(opts.countFilter.mode, opts.countFilter.onSet) +
            '</span>';
  }
  if (!wantAreaChips) { togglesEl.innerHTML = html; return; }
  for (var v = 0; v < ordered.length; v++) {
    var t = ordered[v];
    var off = hidden.indexOf(t.key) !== -1;
    html += '<button class="bonus-area-chip' + (off ? ' off' : '') + '" data-area-key="' + escapeAttrPak(t.key) + '" onclick="' + opts.onToggle + '(\'' + t.key + '\')" title="' + (off ? 'Show ' : 'Hide ') + escapeAttrPak(t.label) + '">' +
            '<span class="breakdown-dot" style="background:' + areaColor_(t) + '"></span>' + t.label +
            '<i class="fa-solid ' + (off ? 'fa-eye-slash' : 'fa-eye') + '"></i></button>';
  }
  togglesEl.innerHTML = html;
}

function escapeAttrPak(s) {
  return safeTextPak(s)
    .replace(/&/g, '&amp;')
    .replace(/'/g, '&#39;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// The same five replacements, named for the other job they do.
//
// Free text going into a text NODE needs exactly what one going into an
// attribute needs, and safeTextPak - despite the name - does none of it: it is
// a String() coercion and nothing more. Everything fed to it so far comes from
// a fixed config or from a bonus code, so nothing has ever been exposed by
// that; the OS log is the dashboard's first source of genuinely free-typed
// text - department names, job types, three people per record, all straight
// out of a form - and it goes through this instead.
function escapeTextPak_(s) { return escapeAttrPak(s); }

function trimTimeLabelPak(str) {
  if (!str) return '';
  var parts = str.split(' ');
  if (parts.length >= 5) {
    return parts[1] + ' - ' + parts[4];
  }
  return str;
}

function parseDateTimePartPak(text) {
  var s = String(text || '').trim();
  var match = s.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
  if (!match) return null;
  return new Date(
    Number(match[3]),
    Number(match[2]) - 1,
    Number(match[1]),
    Number(match[4]),
    Number(match[5]),
    0,
    0
  );
}

function extractRangePartsPak(t) {
  var p = String(t || '').trim().split(' - ');
  return p.length >= 2 
    ? { start: p[0].trim(), end: p[1].trim() } 
    : { start: t, end: t };
}

function formatDatePak(d) {
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var yyyy = d.getFullYear();
  var hh = String(d.getHours()).padStart(2, '0');
  var min = String(d.getMinutes()).padStart(2, '0');
  return dd + '/' + mm + '/' + yyyy + ' ' + hh + ':' + min;
}

function hexToRgbaPak(hex, a) {
  return 'rgba(' + 
    parseInt(hex.slice(1, 3), 16) + ', ' + 
    parseInt(hex.slice(3, 5), 16) + ', ' + 
    parseInt(hex.slice(5, 7), 16) + ', ' + 
    a + ')';
}

function addMinutesToLabel(label, mins) {
  var match = label.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
  if (!match) return label;
  
  var d = new Date(
    Number(match[3]),
    Number(match[2]) - 1,
    Number(match[1]),
    Number(match[4]),
    Number(match[5]) + mins,
    0,
    0
  );
  
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var yyyy = d.getFullYear();
  var hh = String(d.getHours()).padStart(2, '0');
  var mi = String(d.getMinutes()).padStart(2, '0');
  
  return dd + '/' + mm + '/' + yyyy + ' ' + hh + ':' + mi;
}

function calculateBonusDisplay(bonusSet, isFilteredView) {
  if (isFilteredView) {
    return String(selectedBonuses.length);
  }
  
  var uniqueCount = 0;
  for (var key in bonusSet) {
    if (bonusSet.hasOwnProperty(key)) {
      uniqueCount++;
    }
  }
  
  var displayCount = uniqueCount === 1 ? 0 : uniqueCount;
  return uniqueCount === 0 ? '' : String(displayCount);
}
</script>
