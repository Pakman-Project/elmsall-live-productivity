<style>
:root {
  --bg: #0b1220;
  --panel: rgba(255, 255, 255, 0.06);
  --border: rgba(255, 255, 255, 0.10);
  --text: #eaf0ff;
  --muted: #97a6c3;
  --accent: #69a7ff;
  --color-good: #32d583;
  --color-warn: #ffcc66;
  --color-bad: #ff7a7a;
  --shadow: 0 18px 55px rgba(0, 0, 0, 0.34);
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: radial-gradient(circle at top left, rgba(105, 167, 255, 0.17), transparent 28%),
              radial-gradient(circle at top right, rgba(50, 213, 131, 0.10), transparent 22%),
              var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#loadingOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  color: var(--text);
}

#loadingOverlay.active {
  opacity: 1;
  pointer-events: all;
}

#loadingOverlay i {
  font-size: 48px;
  color: var(--accent);
}

.wrap {
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.sticky-header {
  position: relative;
  z-index: 1000;
  background: rgba(11, 18, 32, 0);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 15px 22px 10px 22px;
  flex: 0 0 auto;
  overflow: visible;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.title h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -0.03em;
}

.title p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

#archiveSelect {
  min-width: 180px;
  max-width: 220px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.05) !important;
  color: var(--text) !important;
  background-image: none;
  padding: 6px 10px;
  z-index: 1;
  margin-right: 8px;
}

#archiveSelect option {
  background: var(--bg) !important;
  color: var(--text) !important;
}

.bonus-search-container {
  position: relative;
  width: 250px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.search-row {
  display: flex;
  align-items: stretch;
}

.clear-filter-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  min-width: 36px;
  border: 1px solid rgba(255, 122, 122, 0.25);
  border-right: none;
  background: rgba(255, 122, 122, 0.10);
  color: var(--color-bad);
  border-radius: 10px 0 0 10px;
  cursor: pointer;
  font-size: 12px;
}

.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-input-wrap .input {
  width: 100%;
  padding: 6px 30px 6px 10px;
  border-radius: 0 10px 10px 0;
  font-size: 13px;
}

.search-input-wrap.with-clear .input {
  border-radius: 0 10px 10px 0;
}

.search-input-wrap i.fa-search {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 12px;
}

.search-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: rgba(15, 23, 42, 0.98);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 2000;
  display: none;
}

.search-dropdown.active {
  display: block;
}

.search-item {
  padding: 8px 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
}

.search-item:hover {
  background: rgba(255, 255, 255, 0.08);
}

.active-filter-banner {
  display: none;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 8px 14px;
  border-radius: 10px;
  background: rgba(105, 167, 255, 0.14);
  border: 1px solid rgba(105, 167, 255, 0.35);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}

.active-filter-banner.active {
  display: flex;
}

.active-filter-banner > i {
  font-size: 12px;
  flex-shrink: 0;
}

.active-filter-banner-text {
  white-space: nowrap;
  flex-shrink: 0;
}

.active-filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 0;
}

.active-filter-clear-btn {
  background: transparent;
  border: 1px solid rgba(105, 167, 255, 0.45);
  color: var(--accent);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-family: inherit;
  transition: all 0.15s;
}

.active-filter-clear-btn:hover {
  background: rgba(105, 167, 255, 0.22);
}

.chip {
  display: inline-flex;
  align-items: center;
  background: rgba(105, 167, 255, 0.15);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  overflow: visible;
}

.chip .remove-chip {
  margin-left: 6px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}

.input,
.btn,
.row-select {
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  border-radius: 10px;
  padding: 6px 10px;
  outline: none;
  transition: all 0.2s;
  font-size: 13px;
}

.input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.08);
}

.btn {
  cursor: pointer;
  font-weight: 600;
}

.btn:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.10);
}

.btn:active {
  transform: translateY(0);
}

.icon-btn {
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.meta {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.meta-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.note-text {
  color: var(--color-bad);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.3;
}

.nav-dots {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 24px;
  padding: 0;
  background: transparent;
  flex-shrink: 0;
  flex-wrap: nowrap;
}

.dot {
  min-width: auto;
  padding: 6px 2px 8px 2px;
  border-radius: 0;
  background: transparent;
  opacity: 1;
  transition: color 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  text-align: center;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 2px solid transparent;
}

.dot.active {
  opacity: 1;
  transform: none;
  background: transparent;
  color: var(--text);
  border-bottom-color: var(--accent);
}

.dot:hover {
  color: var(--text);
}

.swipe-container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  position: relative;
  width: 100%;
  touch-action: pan-y pinch-zoom;
}

.swipe-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
  min-height: 0;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.page::-webkit-scrollbar {
  width: 6px;
}

.page::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.card {
  background: linear-gradient(180deg, var(--panel), rgba(255, 255, 255, 0.03));
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}

.kpi {
  padding: 14px;
  grid-column: span 3;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.kpi-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.kpi .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.kpi .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
}

.kpi .sub {
  margin-top: auto;
  padding-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.kpi-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 4px;
}

.kpi-tooltip {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: var(--muted);
  font-size: 9px;
  cursor: help;
  flex-shrink: 0;
}

.kpi-tooltip:hover {
  background: rgba(105, 167, 255, 0.2);
  color: var(--accent);
}

.kpi-tooltip-content {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  padding: 12px;
  background: rgba(10, 16, 30, 0.98);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  z-index: 2000;
  font-size: 11px;
  line-height: 1.4;
  text-align: left;
  pointer-events: none;
}

.kpi-tooltip:hover .kpi-tooltip-content,
.kpi-tooltip.open .kpi-tooltip-content {
  display: block;
}

.tt-title {
  font-weight: 700;
  color: var(--text);
  font-size: 11px;
  margin-bottom: 4px;
}

.kpi-tooltip-content ul {
  margin: 4px 0 0;
  padding-left: 15px;
  color: var(--muted);
  list-style: none;
}

.kpi-tooltip-content ul li::before {
  content: '\2022';
  position: absolute;
  left: 5px;
  color: var(--accent);
}

.kpi-tooltip-content ul li {
  position: relative;
  padding-left: 10px;
}

.panel {
  padding: 14px;
}

.span-12 {
  grid-column: span 12;
}

.table-wrap {
  overflow-x: auto;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  max-width: 100%;
  min-height: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 0;
}

#mainTable {
  min-width: 1300px;
}

.side-table {
  min-width: 100%;
  width: 100%;
}

th,
td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}

#mainTable th,
#mainTable td {
  text-align: center;
}

th {
  position: sticky;
  top: 0;
  background: rgba(10, 16, 30, 0.96);
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}

tr:hover td {
  background: rgba(255, 255, 255, 0.03);
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.06);
  min-width: 50px;
}

.good {
  color: var(--color-good);
}

.warn {
  color: var(--color-warn);
}

.bad {
  color: var(--color-bad);
}


.volume-charts {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
  min-height: 0;
}

.volume-charts.combined-mode {
  grid-template-columns: 1fr;
}

.volume-charts.combined-mode .vol-chart-panel:not(.vol-primary-panel) {
  display: none;
}

/* Last volume panel when the panel count is odd (controls div is child 1,
   so an odd panel count puts the last panel at an even child index) */
.volume-charts:not(.combined-mode) > .vol-chart-panel:last-child:nth-child(even) {
  grid-column: 1 / -1;
  width: calc((100% - 14px) / 2);
  margin: 0 auto;
}

.volume-controls {
  grid-column: 1 / -1;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  padding-bottom: 10px;
  flex-wrap: wrap;
}

.volume-controls label {
  color: var(--muted);
  font-size: 12px;
  margin-right: 8px;
}

.volume-charts canvas {
  height: 280px !important;
}

.volume-charts.combined-mode canvas {
  height: 500px !important;
}

.chartjs-legend {
  cursor: default !important;
  user-select: none;
}

.chartjs-legend ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.chartjs-legend li {
  cursor: pointer !important;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background 0.2s ease, opacity 0.2s ease;
}

.chartjs-legend li:hover {
  background: rgba(255, 255, 255, 0.08);
}

.chartjs-legend li.hidden {
  opacity: 0.4;
}

.chartjs-legend li span {
  pointer-events: none;
}

canvas {
  width: 100% !important;
  height: 400px !important;
}

.mini-table-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.mini-table-title h2 {
  flex: 1;
  text-align: left;
  margin: 0;
  font-size: 16px;
}

.tag {
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.row-select {
  padding: 3px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
  font-size: 11px;
  outline: none;
  cursor: pointer;
  transition: border 0.2s;
  padding-right: 15px;
}

.row-select:hover {
  border-color: var(--accent);
}

.two-panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
  min-height: 0;
}

.side-table th,
.side-table td {
  text-align: center;
}

.side-table th:nth-child(1),
.side-table td:nth-child(1) {
  width: 50%;
}

.side-table th:nth-child(2),
.side-table td:nth-child(2) {
  width: 25%;
}

.side-table th:nth-child(3),
.side-table td:nth-child(3) {
  width: 25%;
}

.clickable-bonus {
  position: relative;
  cursor: pointer;
  color: var(--text);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px;
  border-radius: 4px;
  border: 1px solid transparent;
}

.clickable-bonus:hover {
  color: #fff;
  background: rgba(105, 167, 255, 0.1);
}

.clickable-bonus .filter-icon {
  font-size: 9px;
  opacity: 0;
  transition: opacity 0.2s;
}

.clickable-bonus:hover .filter-icon {
  opacity: 0.6;
}

.clickable-bonus.active {
  color: #fff;
  background: rgba(105, 167, 255, 0.2);
  border-color: rgba(105, 167, 255, 0.4);
}

.clickable-bonus.active .filter-icon {
  opacity: 1;
  color: var(--accent);
}

.bonus-tip {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 8px;
  background: rgba(10, 16, 30, 0.98);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  font-size: 10px;
  white-space: nowrap;
  z-index: 500;
  pointer-events: none;
}

.bonus-tip::before {
  content: '';
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-bottom-color: rgba(10, 16, 30, 0.98);
}

.clickable-bonus:hover .bonus-tip {
  display: block;
}

.page-arrows {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 900;
  padding: 0 6px;
}

.page-arrow {
  pointer-events: auto;
  width: 46px;
  height: 110px;
  border: none;
  border-radius: 14px;
  background: rgba(105, 167, 255, 0.5);
  color: rgba(234, 240, 255, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.25s ease, background 0.25s ease, color 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
  opacity: 0.06;
  box-shadow: none;
  backdrop-filter: blur(2px);
}

.page-arrow:hover,
.page-arrow:focus-visible {
  opacity: 0.65;
  color: rgba(234, 240, 255, 0.95);
  background: rgba(105, 167, 255, 0.14);
  transform: scale(1.02);
  outline: none;
}

.page-arrow:active {
  opacity: 0.8;
  transform: scale(0.98);
}

.page-arrow i {
  font-size: 18px;
}

.page-arrow.left {
  margin-left: 8px;
}

.page-arrow.right {
  margin-right: 8px;
}

.page-arrow.disabled {
  opacity: 0;
  pointer-events: none;
  transform: none;
  visibility: hidden;
}

.side-table th {
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.side-table th:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.side-table th.active-sort {
  color: #fff;
  background: rgba(105, 167, 255, 0.25);
  border-bottom: 2px solid var(--accent);
}

.side-table th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 5px;
  font-size: 10px;
  opacity: 0.8;
}

.side-table th.active-sort.asc::after {
  content: ' \25B2';
}

.side-table th.active-sort.desc::after {
  content: ' \25BC';
}

.side-table th.no-sort {
  cursor: default;
  user-select: none;
}

.side-table th.no-sort:hover {
  color: var(--muted);
  background: rgba(10, 16, 30, 0.96);
}

#mainTable th {
  cursor: pointer;
  transition: background 0.2s;
  user-select: none;
  position: relative;
}

#mainTable th:hover {
  background: rgba(255, 255, 255, 0.1);
}

#mainTable th.active-sort {
  color: #fff;
  background: rgba(105, 167, 255, 0.25);
  border-bottom: 2px solid var(--accent);
}

#mainTable th.active-sort::after {
  content: '';
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.8;
}

#mainTable th.active-sort.asc::after {
  content: ' \25B2';
}

#mainTable th.active-sort.desc::after {
  content: ' \25BC';
}

.breakdown-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(10px);
  z-index: 10001;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.breakdown-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.breakdown-modal {
  background: linear-gradient(180deg, rgba(20, 30, 55, 0.98), rgba(11, 18, 32, 0.99));
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
  width: 90%;
  max-width: 1000px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.92) translateY(15px);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  overflow: hidden;
}

.breakdown-overlay.active .breakdown-modal {
  transform: scale(1) translateY(0);
}

.breakdown-header {

.breakdown-header h2 {

}

.breakdown-subtitle {

}

.breakdown-close {

.breakdown-close:hover {

}

.breakdown-body {

.breakdown-summary {

.breakdown-summary-num {

.breakdown-summary-label {

.breakdown-row {

.breakdown-label {

  flex-shrink: 0;

  align-items: center;
  justify-content: flex-end;

}

.breakdown-dot {

  height: 8px;
  border-radius: 50%;

}

.breakdown-bar-wrap {

  height: 30px;

  overflow: hidden;

.breakdown-bar {

}

.breakdown-count {

.breakdown-footer {

.breakdown-empty {

.breakdown-btn {

  gap: 5px;
  padding: 4px 10px;
  border-radius: 7px;
  border: 1px solid rgba(105, 167, 255, 0.25);
  background: rgba(105, 167, 255, 0.08);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;

}

.breakdown-btn:hover {
  background: rgba(105, 167, 255, 0.18);
  border-color: rgba(105, 167, 255, 0.45);
  transform: translateY(-1px);
}

.breakdown-btn:active {
  transform: translateY(0);
}

.breakdown-row.clickable-row {
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s ease;
  padding: 4px 0;
  margin: 0 -6px 0 -6px;
  padding-left: 6px;
  padding-right: 6px;
}

.breakdown-row.clickable-row:hover {
  background: rgba(255, 255, 255, 0.04);
}

.breakdown-row.clickable-row:active {
  background: rgba(255, 255, 255, 0.07);
}

.breakdown-chevron {
  font-size: 10px;
  margin-left: 6px;
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  opacity: 0.5;
  flex-shrink: 0;
}

.breakdown-row.clickable-row:hover .breakdown-chevron {
  opacity: 0.9;
}

.breakdown-row.clickable-row.expanded .breakdown-chevron {
  transform: rotate(180deg);
  opacity: 0.9;
}

.breakdown-detail {
  display: none;
  padding: 6px 0 14px 164px;
  overflow: hidden;
}

.breakdown-detail.open {
  display: block;
  animation: detailSlideIn 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}

@keyframes detailSlideIn {
  from {
    opacity: 0;
    max-height: 0;
  }
  to {
    opacity: 1;
    max-height: 300px;
  }
}

.breakdown-detail-inner {

  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 6px;
  width: 100%;
}

.breakdown-bonus-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.10);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;

  white-space: nowrap;

}

.breakdown-bonus-chip .chip-left {

  align-items: center;
  gap: 5px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.breakdown-bonus-chip .chip-right {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  margin-left: auto;
}

.breakdown-chip-pct {

  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}

.breakdown-bonus-chip.multi-area {

}

.breakdown-bonus-chip.multi-area::before {
  content: '';

  left: 0;
  top: 4px;
  bottom: 4px;
  width: 3px;
  border-radius: 2px;
  background: currentColor;
  opacity: 0.35;
}

.breakdown-multi-icon {
  font-size: 8px;
  opacity: 0.45;
  margin-right: 1px;
}

.breakdown-bonus-chip.multi-area:hover .breakdown-multi-icon {
  opacity: 0.75;
}

.breakdown-bonus-chip:hover {
  background: rgba(105, 167, 255, 0.15);
  border-color: rgba(105, 167, 255, 0.4);
  color: var(--accent);
  transform: translateY(-1px);
}

.breakdown-bonus-chip:active {
  transform: translateY(0);
}

.breakdown-bonus-chip .chip-filter-icon {
  font-size: 9px;
  opacity: 0;
  transition: opacity 0.15s;
}

.breakdown-bonus-chip:hover .chip-filter-icon {
  opacity: 0.7;
}

.breakdown-bonus-chip.good {
  border-color: rgba(50, 213, 131, 0.35);
  background: rgba(50, 213, 131, 0.10);
  color: var(--color-good);
}

.breakdown-bonus-chip.good:hover {
  background: rgba(50, 213, 131, 0.20);
  border-color: rgba(50, 213, 131, 0.55);
  color: var(--color-good);
}

.breakdown-bonus-chip.warn {
  border-color: rgba(255, 204, 102, 0.35);
  background: rgba(255, 204, 102, 0.10);
  color: var(--color-warn);
}

.breakdown-bonus-chip.warn:hover {
  background: rgba(255, 204, 102, 0.20);
  border-color: rgba(255, 204, 102, 0.55);
  color: var(--color-warn);
}

.breakdown-bonus-chip.bad {
  border-color: rgba(255, 122, 122, 0.35);
  background: rgba(255, 122, 122, 0.10);
  color: var(--color-bad);
}

.breakdown-bonus-chip.bad:hover {
  background: rgba(255, 122, 122, 0.20);
  border-color: rgba(255, 122, 122, 0.55);
  color: var(--color-bad);
}

.breakdown-detail-hint {
  width: 100%;
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  opacity: 0.6;
}

.breakdown-time-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  background: rgba(0, 0, 0, 0.10);
  flex-shrink: 0;
}

.breakdown-time-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  flex-shrink: 0;
}

.breakdown-time-select {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  outline: none;
  font-family: inherit;
  flex: 1;
  min-width: 155px;
  max-width: 210px;
  transition: border-color 0.2s;
}

.breakdown-time-select:focus {
  border-color: var(--accent);
}

.breakdown-time-select option {
  background: var(--bg);
  color: var(--text);
}

.breakdown-time-sep {
  color: rgba(255, 255, 255, 0.25);
  font-size: 11px;
  flex-shrink: 0;
}

.breakdown-range-badge {
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.charts {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.charts .card.panel {
  display: flex;
  flex-direction: column;
  height: 450px;
  min-height: 0;
  position: relative;
}

.charts canvas {
  flex: 1 1 0px;
  min-height: 0;
  max-height: 100%;
  width: 100% !important;
}

/* Deployment Trend charts — dynamically populated, 1 to MAX_TREND_CHARTS panels.
   display:contents makes the panels participate directly in the parent
   .charts grid, keeping every chart 2-per-row. */
.trend-charts-wrap {
  display: contents;
}

/* Last chart panel on the page when the total count is odd — span the full
   row but render at half width, centered (same pattern as the volume page). */
.charts .card.panel.chart-center-odd {
  grid-column: 1 / -1;
  width: calc((100% - 14px) / 2);
  margin: 0 auto;
}

.trend-split-cb {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  user-select: none;
}

.trend-split-cb:last-child {
  border-bottom: none;
}

.trend-split-cb input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.trend-split-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.area-group-block {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.02);
}

.area-group-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2px;
}

.area-group-head h3 {
  margin: 0;
  font-size: 14px;
}

.area-group-remove {
  padding: 2px 10px;
  font-size: 11px;
  border-color: rgba(255, 122, 122, 0.35);
  color: var(--color-bad);
}

.area-group-modes {

  align-items: center;
  gap: 16px;
}

.area-group-modes .trend-split-cb {
  border-bottom: none;
  padding: 2px 0;
  font-size: 12px;
}

.area-group-areas {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  gap: 0 10px;
}

.area-group-areas .trend-split-cb {

  padding: 8px 0;
  font-size: 12.5px;
  min-width: 0;

}

.area-cb-text {

  white-space: nowrap;
}

.modal-actions {

  gap: 10px;
  justify-content: flex-end;
}

.bonus-page-controls {

  align-items: center;
  justify-content: space-between;
  gap: 10px 18px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 2px 4px;
}

.bonus-controls {

  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.bonus-controls label {
  color: var(--muted);
  font-size: 12px;
}

.bonus-time-bar {
  border-bottom: none;
  border-top: none;
  background: transparent;
  padding: 0;
  margin: 0;
  flex: 0 1 auto;
}

.bonus-area-toggles {
  width: 100%;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.bonus-area-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;
}

.bonus-area-chip .breakdown-dot {
  width: 8px;
  height: 8px;
}

.bonus-area-chip i {
  font-size: 9px;
  opacity: 0.5;
}

.bonus-area-chip:hover {
  border-color: var(--accent);
  background: rgba(105, 167, 255, 0.10);
}

.bonus-area-chip.off {
  opacity: 0.4;
}

.bonus-area-chip.off:hover {
  opacity: 0.7;
}

.bonus-tables-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}

.bonus-tables-grid.overall {
  grid-template-columns: 1fr;
}

/* Last area panel when the count is odd — half width, centered */
.bonus-tables-grid:not(.overall) > .card.panel:last-child:nth-child(odd) {
  grid-column: 1 / -1;
  width: calc((100% - 14px) / 2);
  margin: 0 auto;
}

.bonus-tables-grid > .card.panel {
  display: flex;
  flex-direction: column;
}

.bonus-two-tables {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  flex: 1;
}

.bonus-two-tables > div {
  display: flex;
  flex-direction: column;
}

.bonus-two-tables > div .table-wrap {
  flex: 1;
}

.bonus-table-caption {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.bonus-table-caption.good {
  color: var(--color-good);
}

.bonus-table-caption.bad {
  color: var(--color-bad);
}

.bonus-table-caption i {
  margin-right: 5px;
  font-size: 10px;
}

.bonus-empty-row td {
  color: var(--muted);
  font-size: 12px;
  font-style: italic;
  text-align: left !important;
}

.bonus-empty-panel {
  text-align: center;
  color: var(--muted);
  padding: 30px 14px;
  font-size: 14px;
}

.bonus-empty-panel i {
  display: block;
  font-size: 26px;
  opacity: 0.3;
  margin-bottom: 8px;
}

@media (max-width: 1100px) {
  .area-group-areas {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
