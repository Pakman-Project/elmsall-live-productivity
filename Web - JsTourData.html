<script>
// Builds a self-contained, plausible-looking demo payload in the exact shape
// getDashboardData() returns, so the guided tour can show a fully populated
// dashboard (KPIs, every volume chart, bonus tables, data table) while the
// real data loads in the background. Deterministic (seeded) so it looks stable.
function buildTourDummyData_() {
  // volKey matches the raw-row volume field; the std field is volKey + 'Std'
  // (mirrors VOLUME_TYPES stdKey naming in JsState).
  var AREAS = [
    'pie', 'topUp', 'forwardTpa', 'tpRetail', 'rtf', 'e3Packing', 'parcelInduct', 'parcelSortation',
    'inboundDecanting', 'osrDecanting', 'bcrInducting', 'e1e2Inducting',
    'sorter6Packing', 'onlinePickingDrive', 'onlinePickingWay', 'onlinePickingE3',
    'e3Bpp', 'e1e2Bpp',
    'rspsTopUp', 'rspsPick', 'ispsTopUp', 'ispsPick',
    'sorter6ItemInduct', 'sorter6ParcelInduct'
  ];

  var seed = 20260722;
  function rnd() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  }

  var NUM_BLOCKS = 48; // 12 hours of 15-minute blocks
  var now = new Date();
  now.setSeconds(0, 0);
  now.setMinutes(now.getMinutes() - (now.getMinutes() % 15)); // floor to 15-min grid

  var timeRanges = [];
  for (var b = NUM_BLOCKS; b >= 1; b--) {
    var start = new Date(now.getTime() - b * 15 * 60000);
    var end = new Date(start.getTime() + 15 * 60000);
    timeRanges.push(formatDatePak(start) + ' - ' + formatDatePak(end));
  }

  // 18 demo bonus numbers, two per work area — each a random 3-char alphanumeric
  // code (letters + digits, e.g. "0X9"), matching the real bonus-number style.
  var CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  function randCode() {
    return CHARSET.charAt(Math.floor(rnd() * CHARSET.length)) +
           CHARSET.charAt(Math.floor(rnd() * CHARSET.length)) +
           CHARSET.charAt(Math.floor(rnd() * CHARSET.length));
  }
  var bonuses = [];
  var bonusArea = {};
  var used = {};
  for (var a = 0; a < AREAS.length; a++) {
    for (var k = 0; k < 2; k++) {
      var bn;
      do { bn = randCode(); } while (used[bn]);
      used[bn] = true;
      bonuses.push(bn);
      bonusArea[bn] = AREAS[a];
    }
  }

  // A second area for one operator in every four, and an OS spell for one in
  // every nine.
  //
  // Every demo operator used to be pinned to exactly one area and no OS at
  // all, which meant four things the tour now explains had nothing to point
  // at: the multi-area marker never rendered, the All / single / multi filter
  // did nothing whichever way it was cycled, the OS tag never appeared, and
  // the work-area groups had no cross-boundary worker to leave out - so a step
  // saying "counts only people working solely in these areas" demonstrated a
  // rule with no visible effect.
  //
  // Deterministic like everything else here: the same seed gives the same
  // operators the same second area on every run.
  var bonusArea2 = {};
  var bonusOs = {};
  for (var m = 0; m < bonuses.length; m++) {
    var other = AREAS[Math.floor(rnd() * AREAS.length)];
    if (rnd() < 0.25 && other !== bonusArea[bonuses[m]]) bonusArea2[bonuses[m]] = other;
    if (rnd() < 0.11) bonusOs[bonuses[m]] = true;
  }

  var rawSideData = [];
  for (var i = 0; i < timeRanges.length; i++) {
    for (var j = 0; j < bonuses.length; j++) {
      if (rnd() < 0.22) continue; // ~78% of operators active per block
      var bn = bonuses[j];
      var area = bonusArea[bn];
      var value = 0.16 + rnd() * 0.085;        // std hours per block: 0.16..0.245
      var volume = Math.round(20 + rnd() * 160); // items/parcels this block
      // Zeroed from AREAS rather than written out by hand. The hand-written
      // list had silently fallen five areas behind - every Online Picking and
      // BPP std field was simply absent - and a missing field here reads as an
      // undefined that every consumer coerces to 0, so it looked like a quiet
      // area rather than a gap in the demo data.
      var row = { timeRange: timeRanges[i], bonus: bn, value: value };
      for (var z = 0; z < AREAS.length; z++) {
        row[AREAS[z]] = 0;
        row[AREAS[z] + 'Std'] = 0;
      }
      row[area] = volume;
      row[area + 'Std'] = value;

      // Their second area, when they have one: the block's work splits across
      // the two rather than being doubled, so the totals stay honest and a
      // multi-area operator really does show one quarter-hour of deployment.
      var area2 = bonusArea2[bn];
      if (area2) {
        var half = value / 2;
        row[area] = Math.round(volume / 2);
        row[area + 'Std'] = half;
        row[area2] = Math.round(volume / 2);
        row[area2 + 'Std'] = half;
      }

      // An OS block: no volume and no standard hours anywhere, which is what
      // the notebook synthesises for somebody with no BonusHub events. Their
      // productive work for the block is replaced rather than annotated - a
      // row with hours on it would still draw a bar, and the tag would be
      // explaining nothing.
      if (bonusOs[bn] && rnd() < 0.3) {
        for (var q = 0; q < AREAS.length; q++) {
          row[AREAS[q]] = 0;
          row[AREAS[q] + 'Std'] = 0;
        }
        row.value = 0;
        row.os = true;
      }
      rawSideData.push(row);
    }
  }

  return {
    timeRanges: timeRanges,
    rawSideData: rawSideData,
    bonusList: bonuses,
    threshold: 0.15,
    lastRefresh: 'Example data (tour)',
    currentTimestamp: null,
    note: ''
  };
}
</script>
